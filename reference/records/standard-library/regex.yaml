documentation:
  status: complete
  title: Regular expressions
  title-style: text
  summary: Compiled Unicode patterns with lookaround, backreferences, typed errors, and source-backed captures.
  tags: [standard-library, regex, string-search]
  sections:
    - id: compiling-and-searching
      title: Compiling and searching
      blocks:
        - type: markdown
          markdown: |-
            Import `compile` from `/core/regex` and reuse the returned `regex-pattern`
            across searches. Invalid or unsupported patterns and patterns that exceed the
            engine's compiled-size limit throw `regex-error`. The error message is
            diagnostic text, not a machine-readable error code.

            A pattern's `matches; text` tests for a match anywhere. Its `match; text`
            returns the first match as `text-range|none`. These are searches, not
            whole-string matches; use `\A` and `\z` to require the entire string. String
            `contains` and `find` remain literal searches.

            All three search methods can throw `regex-match-error` when the engine cannot
            complete the search, including when it reaches the backtracking limit. `false`
            and `none` mean the search finished without a match.

            Regex search is first-match only: there is no match iteration, regex
            replacement, regex split, or search-from-offset operation. Slicing the input
            changes the origin of range offsets and the meaning of anchors and lookbehind;
            it is not equivalent to searching from an offset.

            Bundled facilities are loaded as namespaces, not per imported symbol. Importing
            only a regex error type can still link the regex backend.
        - type: example
          id: core-regex-example
          title: Extracting a named capture
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            from /core/regex import compile

            function main;
              pattern = compile; '(?<number>[0-9]+)'
              found = pattern.captures; 'pid=123'
              if found != none
                number = found.named-group; 'number'
                if number != none
                  print; number.text
          response: null
          diagnostic: null
          markdown: null
    - id: captures
      title: Captures and offsets
      blocks:
        - type: markdown
          markdown: |-
            Use `captures; text` when you need groups from the first match. It returns
            `regex-captures|none`. `group; 0` returns the full match; numbered groups start
            at one in opening-parenthesis order. Use `named-group; name` for a named
            capture. A missing or nonparticipating group returns `none`. A participating
            empty group returns a zero-width range, not `none`.

            Ranges retain the original immutable text and use the same byte, scalar, and
            grapheme views as literal-search ranges. UTF-8 byte offsets are measured from
            the start of the original input and the end is exclusive. Write `text-range` in
            type annotations and function signatures without importing it; `text-range|none`
            expresses an optional result.
    - id: dialect
      title: Pattern syntax and limits
      blocks:
        - type: markdown
          markdown: |-
            Patterns use
            [fancy-regex syntax](https://docs.rs/fancy-regex/0.20.2/fancy_regex/#syntax)
            without enclosing delimiters. The API works on `string`, not `bytes`. Matching
            is Unicode-aware and does not normalize input. Use ASCII classes such as `[0-9]`
            for ASCII protocols. Case-sensitive matching is the default; pass
            `case-insensitive=true` or use the dialect's inline flags.

            Matching compares Unicode scalars, not grapheme clusters. For example, a dot can
            match the base letter of a decomposed accented character without consuming its
            combining mark. Case-insensitive matching uses the engine's simple case folding,
            not Terrane's full `string.case-fold`: `straße` does not case-insensitively
            match `STRASSE`. Regex character classes, word boundaries, and folding follow
            the regex engine's Unicode tables, outside Terrane's ICU4X Unicode profile. The
            workspace lock currently uses `regex-syntax` tables from Unicode 16.0.0;
            generated builds resolve the engine's transitive dependencies in their own Cargo
            locks. Updating ICU4X does not update regex matching; it can change the grapheme
            view of a returned range.

            Lookahead (`(?=...)`, `(?!...)`), lookbehind (`(?<=...)`, `(?<!...)`), and
            numbered (`\1`) and named (`\k<name>`) backreferences use the same `compile`
            function. No flag is needed. The engine delegates regular parts to its automata
            matcher and uses backtracking where the pattern requires it. This is not a
            guarantee of PCRE, Python, or ECMAScript compatibility.

            The engine limits VM program size at compile time and backtracking steps per
            search at run time. Variable-length lookbehind can raise `regex-error` at
            compile time if its reverse DFA needs more than the configured cache capacity. A
            backtracking limit is not a wall-clock deadline, a total memory bound, or a
            budget across multiple searches. Applications accepting caller-supplied patterns
            and text must bound their own workload.
  see-also:
    - lang.text.search

