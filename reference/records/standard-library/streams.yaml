documentation:
  status: complete
  title: "Byte and text streams"
  title-style: text
  summary: >-
    Byte and text streams provide owning asynchronous reader and writer protocols, encoded adapters, and access to process standard streams.
  tags:
    - "async"
    - "streams"
    - "byte-text-streams"
  sections:
    - id: byte-text-streams
      title: "Byte and Text Streams"
      blocks:
        - type: markdown
          markdown: |-
            The `/core/streams` package provides resource-owning `byte-reader`,
            `byte-writer`, `text-reader`, and `text-writer` objects. Its bundled Terrane
            source is included recursively only when imported. Process factories expose
            standard input as a byte reader and standard output and standard error as byte
            writers.

            Stream objects are noncopyable because they store process handles. Assignment
            and by-value calls transfer them automatically. Use after transfer or
            consumption, including use after close, is rejected statically; double release
            is likewise rejected.

            A byte endpoint is adapted to text with `byte-endpoint.text; encoding`.
            Adaptation transfers the byte endpoint into an adapter that carries the explicit
            encoding. Text I/O performs no implicit newline translation. `text-writer.line`
            explicitly appends `\n`, and its completed count includes the encoded newline.
            Malformed input during text decoding throws `decode-error`.

            Byte read results report data, completed byte count, EOF, failure, and message;
            text results report decoded text and the corresponding byte count and status.
            Zero-length reads are not EOF. `read-exact` reports short EOF as failure, while
            bounded read-all accepts EOF and requires an explicit limit.

            Incomplete writes retain the encoded data required for resumption; completed
            writes release it. Results report completed bytes, failure, and message.
            `resume` performs one write and may be partial; `write-all` repeats until
            completion, failure, or no progress. These contracts apply to byte and encoded
            text writes.

            The async byte-reader and byte-writer interfaces are owning protocols, including
            consuming close. Concrete standard-stream, TCP, and TLS endpoints implement the
            protocols; interface erasure transfers the resource rather than cloning it.
            Exact/all operations and `read-into-async(buffer, count, options)` are available
            through the protocol. `read-into-async` returns ownership of the buffer with its
            result: filled data appends, and clear resets contents while preserving the
            allocation. Buffer capacity and current filled-byte count are queried by
            `buffer.capacity;` and `buffer.completed;`. These are host-state queries, not
            assignable metadata fields.

            Shared operation options are defined by `/core/io`, not by a networking
            namespace. Standard blocking stream adapters check these options before
            delegating IO: an already-canceled token or expired deadline fails without
            starting IO. Uncancelled tokens and future deadlines are accepted, but the
            options cannot interrupt an in-progress blocking process-IO operation. The
            deadline policy for these adapters is preflight-only, rather than a promise to
            complete or interrupt the IO by the deadline.

            Parent cancellation waits for a delegated blocking operation to finish before
            returning. No detached worker continues modifying a caller-owned buffer.

            Close is explicit and consuming. Host release is idempotent, and an explicit
            close makes release failure observable. Destruction releases the resource but
            discards any release failure. Byte and text writers distinguish `flush`,
            `sync-data`, and `sync-all`; unsupported or failed operations are reported and
            are not silently weakened to another operation.

            The host boundary consists of the process-I/O handle registry and one partial
            host operation at a time. Exact and all-operation loops, encoding, resumption,
            stream policy, process factories, and asynchronous wrappers remain in the
            Terrane stream layer.
