documentation:
  status: complete
  title: "Process arguments, child processes, and exit"
  title-style: text
  summary: >-
    Arguments and environment are exposed as snapshots using lossless native strings. Command-line handling is schema-driven,
    host-name access is provided, and exit status is explicit. Child processes support direct execution,
    streaming standard I/O, lifecycle observation, and bounded capture.
  tags:
    - "stdlib"
    - "process"
  sections:
    - id: process
      title: "Process Arguments, Environment, and Exit"
      blocks:
        - type: markdown
          markdown: |-
            Process facilities are provided by `/core/process`. Host arguments, environment
            entries, and host names use `native-string` values so that platform data is
            preserved without lossy decoding. Each value represents exactly one host
            component. Its `is-text` state distinguishes lossless Unicode text from lossless
            raw bytes; non-Unicode data is never replacement-decoded.

            Argument and environment access uses explicit snapshots. Arguments are
            represented as native strings, including non-Unicode arguments. Environment
            snapshots return paired native-string names and values, preserving both without
            requiring Unicode conversion.

            Command-line handling is schema-driven. Schemas declare exact `flag:` and
            `value:` long-option spellings. Parsing returns flags, options, positionals, and
            structured diagnostics; each diagnostic includes an argument index and message.
            Parsing never terminates the process.

            The command-line grammar does not support `--option=value`, a `--`
            positional-only separator, or short-option clustering. An undeclared short
            spelling remains positional rather than being interpreted as an option.

            `process-host-name` requires process capability and returns
            `process-host-name-result`, containing `failed`, `available`, and `message`
            fields together with a lossless native-string value. The returned host-name data
            is owned, preserves non-Unicode platform data, and exposes no host handle.

            `current-process-id` and `current-process-group-id` return the numeric Linux
            identities of the caller and its group. They are snapshots for observation, not
            handles for signaling. `current-executable` reports the running binary's native
            path, not the source file or the caller's spelling of argv[0]. It throws
            `process-identity-error` if the host cannot report the path. Check `is-text`
            before using a native path as a Unicode string.

            An `exit-status` is valid only when constructed from an exact integer in the
            inclusive range `0..=255`. An invalid construction does not terminate the
            process; it returns `valid=false` with the sentinel status `255`. Validation and
            termination are separate: `exit` is the only terminating operation.
    - id: child-processes
      title: Launching and watching child processes
      blocks:
        - type: markdown
          markdown: |-
            `/core/process/child` requires the `process` capability. Give `run-process`,
            `run-process-async`, or `spawn-process` an executable and a list of argument
            strings. The list defaults to empty. Each element is one argument, including an
            empty string. Do not add shell quoting or escape spaces and metacharacters:
            Terrane does not split command lines or perform globbing, expansion, pipelines,
            or redirection.

            This does not make arbitrary programs safe to run. Select a trusted executable
            and environment; a bare executable name uses host search rules. The invoked
            program still interprets its own options and inputs. Use its `--` option
            terminator when supported and appropriate. Child execution is supported on
            Linux.

            An optional `process-options` value sets `directory` (empty inherits the
            parent's working directory), `inherit-environment` (default `true`), explicit
            `environment` entries, and `remove-environment` names. Use `environment-pair`
            and `native-text` from `/core/process` for ordinary text values. Removals are
            applied after overrides. Overrides are child-local; starting a child never
            changes the parent's working directory or environment.

            Children inherit the caller's Linux process group by default. Terminal Ctrl+C
            sends SIGINT to all members of the foreground group: do not forward the same
            interrupt again if the child is already in that group. Set `new-process-group`
            on the options to `true` to start the child as leader of a separate group. This
            does not detach the child into a new session or transfer terminal control.
        - type: example
          id: capture-literal-arguments
          title: Pass input as a literal argument
          language: terrane
          mode: illustrative
          source: |-
            from /core/collections import list
            from /core/process/child import process-error, run-process

            function show-status throws process-error; value string
                result = run-process; 'printf', (list; '%s', value)
                code = result.status.exit-code
                if code != none
                    if code == 0 and not result.stdout-truncated
                        print; result.stdout.length
          response: null
          diagnostic: null
          markdown: null
    - id: capture
      title: Bounded capture
      blocks:
        - type: markdown
          markdown: |-
            `run-process` blocks the calling thread and creates a runtime for the capture.
            If called from a running async runtime, it also uses a separate worker thread
            while the caller blocks. Prefer `await run-process-async` in async code.

            Both accept optional input bytes, then close stdin. If the child closes stdin
            before consuming all the input, capture stops writing but still returns the
            child's status and output. Both drain stdout and stderr concurrently, return raw
            bytes, and expose independent truncation flags. The default retained limit is 1
            MiB per stream. Data beyond a limit is discarded, not buffered.

            The default deadline is 30 seconds and covers both the direct child and pipe
            I/O. On timeout, capture terminates the direct child if it is still running; it
            does not manage descendants. `status.timed-out` can be true alongside a normal
            exit code if a descendant keeps an output pipe open after the direct child
            exits. A nonzero exit is a returned observation, not a `process-error`. Launch
            and other I/O failures throw `process-error`. Check the timeout and truncation
            flags before using captured output.
    - id: child-streams
      title: Streaming child I/O
      blocks:
        - type: markdown
          markdown: |-
            `await spawn-process` gives the caller an owning `child-process` with piped
            stdin, stdout, and stderr. `write-input` reports bytes written; retry the
            unwritten suffix if it reports a partial write. `close-input` delivers EOF to
            the child. `read-stdout` and `read-stderr` each return a byte chunk and an `end`
            flag. Read both outputs concurrently when a child can fill either pipe. Waiting
            for exit does not drain the pipes. `input`, `output`, and `errors` on the child
            give separately passable views of the corresponding pipes. They share the same
            underlying lanes as the direct methods and do not transfer ownership of the
            child. Read sizes are upper bounds, not exact counts. A zero-byte read does not
            probe for EOF. The API does not decode chunks; decode text incrementally when a
            code point may span reads.

            An output view may outlive the owning handle. After the owner is dropped, a view
            may still read buffered data and then report EOF. EOF only means the pipe
            closed; use `wait` on the owner to observe the child's exit status.

            `poll` observes the child without waiting. `await child.wait` observes exit or
            returns `timed-out` without terminating the child; its timeout can be set to
            zero. `terminate` requests forced termination; use `wait` to observe completion.
            `exit-code` is absent when the host reports no numeric exit code. Dropping the
            owning handle requests termination of a still-running child. The API does not
            manage descendants.

            For cooperative shutdown, use `await child.send-signal` with a `process-signal`
            from `/core/process-signals`, then wait for the child to exit. This signals the
            owned child only, not its descendants or process group. A child can handle or
            ignore a signal; sending one is not evidence it has exited.
        - type: example
          id: read-child-output
          title: Read bounded chunks from a child
          language: terrane
          mode: illustrative
          source: |-
            from /core/collections import list
            from /core/process/child import process-error, spawn-process

            async function count-output int throws process-error; value string
                child = await spawn-process; 'printf', (list; '%s', value)
                await child.close-input;
                reader = child.output;
                total int = 0
                while true
                    chunk = await reader.read; 4096
                    if chunk.end
                        break
                    total = total + chunk.data.length
                status = await child.wait;
                if status.timed-out
                    child.terminate;
                return total
          response: null
          diagnostic: null
          markdown: This example uses a program that does not produce a large stderr stream.
