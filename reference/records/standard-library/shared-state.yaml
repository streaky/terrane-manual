documentation:
  status: complete
  title: Shared mutable state
  title-style: text
  summary: >-
    Describes checked synchronous shared-reference state, owner-task/channel workflows,
    integer-specialized synchronization and the limits of explicit userspace lock control.
  tags:
    - standard-library
    - concurrency
    - async
    - ownership
  sections:
    - id: synchronous-state
      title: Synchronous shared operations
      blocks:
        - type: markdown
          markdown: |-
            A class-backed `shared ref` can own arbitrary application state. Put an atomic
            read/modify/write operation in one synchronous mutable method; the invocation
            holds its checked exclusive storage guard for that body. Separate method calls
            or field assignments are not one transaction. Copying a handle preserves the
            state identity. See
            [checked shared storage](lang.types.references#shared-deadlocks) for reentry
            errors, guard lifetimes and cross-thread lock-order responsibilities.

            This automatic guard is not a user-accessible mutex guard. There is no explicit
            shared-reference try-lock, timed acquisition, read/write-compatible borrow, or
            ordered multi-object lock operation. Blocking mutex acquisition does not become
            interruptible merely because the surrounding task has a deadline.
    - id: owner-task
      title: One mutation owner
      blocks:
        - type: rule
          id: rule.shared-state.owner-task
          level: must
          since: null
          evidence:
            - shared-state-owner
          markdown: |-
            For asynchronous workflows that need to suspend while coordinating state, use
            one owner task. Other tasks transfer typed commands and receive typed results
            through bounded channels. Mutation, backpressure, shutdown and task ownership
            remain explicit without suspendable lock guards.

            The state itself can be a class or collection owned by that task. Senders
            transfer command values through `channel-sender`; only the owner mutates the
            state and publishes result values through another channel.
    - id: unavailable-cells
      title: Generic cell diagnostics
      blocks:
        - type: rule
          id: rule.shared-state.generic-cells-unavailable
          level: must
          since: null
          evidence:
            - typed-shared-mutex
            - typed-shared-read-write-lock
            - typed-shared-cell
          markdown: |-
            `mutex`, `read-write-lock`, and `shared-cell` are compiler-owned diagnostic
            names. Attempting to construct one emits `T0111` and directs the program toward
            one owner task plus bounded typed channels. They are not generic runtime objects
            or incomplete aliases.

            `int-mutex`, `int-read-write-lock`, `atomic-int64`, and `thread-local-int`
            remain concrete low-level integer facilities. Their presence does not promise
            generic stored values or exposed lock guards.
    - id: advanced-boundaries
      title: Advanced synchronization boundaries
      blocks:
        - type: markdown
          markdown: |-
            The integer facilities provide load/store, mutex-backed increment, and
            `atomic-int64` load/store/increase with explicit memory ordering. They do not
            expose generic guarded payloads or compare-and-swap. Core currently has no
            user-facing generic lock guards, condition variables, semaphores or barriers.

            Typed channels expose one linear sender and one linear receiver, not clonable
            multi-producer senders or broadcast. The owner-task recipe therefore does not by
            itself supply arbitrary many-client fan-in. See the channel ownership boundary
            before designing a worker pool or multi-client state service.

            These are current tooling limitations, not compatibility promises or committed
            additions. Runtime shared-reference checking is independent of any future
            explicit synchronization API; it does not pretend to provide those controls.
