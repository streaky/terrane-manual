format: 1
id: std.networking.operations
kind: topic

surface: /core/networking/io

documentation:
  status: complete
  title: Asynchronous networking operations
  title-style: text
  summary: >-
    Describes asynchronous TCP, UDP, DNS, and TLS operations, transport options, results, and stream protocols.
  tags:
    - standard-library
    - networking
    - async
    - tcp
    - udp
    - dns
    - tls
  sections:
    - id: operations
      title: Operations and results
      blocks:
        - type: rule
          id: rule.networking.async-operations
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
            - networking-udp-loopback
            - networking-values
          markdown: |-
            TCP connect, listener accept, stream reads and writes, UDP send and receive, and
            DNS lookup are asynchronous operations. TLS client handshake, encrypted reads
            and writes, and shutdown use the same task contract. TCP resources retain their
            registered asynchronous transport across operations; a synchronously bound
            listener is registered lazily on its first asynchronous accept.

            Shared `network-operation-options` and cancellation-token types are provided by
            `/core/networking/io`. The options argument is optional and defaults to `none`:
            this installs neither a deadline nor a cancellation token, and does not allocate
            a cancellation token. A supplied deadline is absolute, and cancellation is
            reported through each operation's result contract. TCP creation accepts optional
            `tcp-options` (no-delay defaults to false; TTL `-1` leaves the OS setting
            unchanged). Listener binding accepts optional `tcp-listener-options` (backlog
            defaults to 128, address reuse to false, accepted-socket no-delay to false, and
            TTL `-1` leaves the OS setting unchanged).

            Exact reads fail on short EOF; read-all preserves EOF as an ordinary
            termination. A zero-length read is not EOF. Read-into transfers its owned buffer
            and returns it with the result; filled bytes append, and clear resets the buffer
            while retaining its allocation. Write-all preserves completed progress and
            distinguishes failure, deadline, and cancellation outcomes. Callers inspect the
            operation's established fields, including failure/deadline status, message,
            data, count, and peer address as appropriate. Ordinary TLS connection validates
            the certificate chain and host name.
    - id: cancellation
      title: Deadlines and cancellation
      blocks:
        - type: rule
          id: rule.networking.deadline-cancellation
          level: must
          since: null
          evidence:
            - networking-values
            - cancelled-stream-operation
          markdown: |-
            `network-operation-options` carries an optional typed `/core/time` deadline and
            optional cancellation token. Omitting the options or passing `none` requests no
            cancellation token or timer. Deadlines and cancellation do not detach operations
            or permit scoped resources to be left unjoined.
    - id: scheduling
      title: Executor scheduling
      blocks:
        - type: rule
          id: rule.networking.executor-progress
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
            - networking-readiness-outcomes
          markdown: |-
            Compiler-owned asynchronous socket operations suspend on readiness through the
            runtime selected by the package executor profile. TLS uses the same asynchronous
            transport. Host-name connection delegates DNS resolution, then races socket
            candidates on the selected runtime. Interfaces that remain blocking, including
            standalone resolver operations, are delegated to the runtime's bounded blocking
            pool.

            Pending readiness-based socket operations do not occupy an executor worker.
            Socket deadline and cancellation outcomes retain the operation's explicit source
            contract.
