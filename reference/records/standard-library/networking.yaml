format: 1
id: std.networking.operations
kind: topic

surface: /core/networking

documentation:
  status: complete
  title: Asynchronous networking operations
  title-style: text
  summary: >-
    Describes asynchronous TCP, UDP, DNS, and TLS operations, transport options, results, and stream protocols.
  tags:
    - standard-library
    - networking
    - async
    - tcp
    - udp
    - dns
    - tls
  sections:
    - id: operations
      title: Operations and results
      blocks:
        - type: rule
          id: rule.networking.async-operations
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
            - networking-udp-loopback
            - networking-values
          markdown: |-
            TCP connect, listener accept, stream reads and writes, UDP send and receive, and
            DNS lookup are asynchronous operations. TLS client handshake, encrypted reads
            and writes, and shutdown use the same task contract. TCP resources retain their
            registered asynchronous transport across operations; a synchronously bound
            listener is registered lazily on its first asynchronous accept.

            A retained registration stays attached to the reactor that created it. Native
            callers may poll it from another live runtime while the originating reactor
            remains alive; this does not rebind the socket. After the originating runtime
            shuts down, a pending readiness operation reports an IO failure. Source async
            entrypoints use one selected runtime; native synchronous adapters retain their
            process-lifetime network runtime. Native synchronous networking runs off-runtime
            or uses blocking delegation on a multithread runtime. It rejects calls while a
            current-thread runtime handle is entered: callers must delegate into an
            off-runtime context while allowing the originating reactor to progress, rather
            than block its sole thread. Delegation that still exposes a current-thread
            runtime handle remains rejected. This restriction is specific to native
            synchronous adapters: Terrane core TCP connect, accept, read, and write APIs are
            asynchronous. Synchronous UDP operations wait on retained readiness rather than
            toggling the socket's shared nonblocking mode. Because `O_NONBLOCK` is shared
            across duplicated descriptors for a socket, asynchronous registration may leave
            the underlying socket nonblocking after the registration is dropped; dropping
            the duplicate does not restore the prior mode.

            Shared `io-operation-options` and cancellation-token types are provided by
            `/core/io`. The options argument is optional and defaults to `none`: this
            installs neither a deadline nor a cancellation token, and does not allocate a
            cancellation token. A supplied deadline is absolute, and cancellation is
            reported through each operation's result contract. TCP creation accepts optional
            `tcp-options` (no-delay defaults to false; TTL `-1` leaves the OS setting
            unchanged). Listener binding accepts optional `tcp-listener-options` (backlog
            defaults to `-1`, selecting the automatic policy below; address reuse defaults
            to false, accepted-socket no-delay to false, and TTL `-1` leaves the OS setting
            unchanged).

            These creation defaults intentionally replace the former forced no-delay setting
            and TTL 64. Supply explicit TCP settings to retain that policy; listener
            accepted-socket settings apply before the accepted stream is exposed.

            Exact reads fail on short EOF; read-all preserves EOF as an ordinary
            termination. A zero-length read is not EOF. Read-into transfers its owned buffer
            and returns it with the result; filled bytes append, and clear resets the buffer
            while retaining its allocation. Write-all preserves completed progress and
            distinguishes failure, deadline, and cancellation outcomes. Callers inspect the
            operation's established fields, including failure/deadline status, message,
            data, count, and peer address as appropriate. Ordinary TLS connection validates
            the certificate chain and host name.

            TLS close is consuming; source ownership excludes closing a value while an
            operation still borrows it. The native capability boundary additionally reports
            busy when a retained read or write alias is pending: close does not interrupt
            that operation or discard either TLS half. Native callers must cancel or finish
            and join outstanding IO before retrying close.
    - id: listener-backlog
      title: Listener backlog defaults and overrides
      blocks:
        - type: rule
          id: rule.networking.listener-backlog
          level: must
          since: null
          evidence:
            - networking-listener-backlog
            - networking-tcp-loopback
          markdown: |-
            Omitting listener options, or constructing `tcp-listener-options` without a
            backlog, selects `backlog = -1`. This sentinel remains in the options object;
            its effective capacity is resolved separately for each `bind-tcp` call.

            On Linux, automatic selection reads `net.core.somaxconn` from
            `/proc/sys/net/core/somaxconn` at bind time, without a process-wide cache. Later
            binds therefore pick up administrator changes. A positive decimal value is used,
            clamped to `2147483647` if larger. Missing, inaccessible, empty, malformed,
            nonpositive, or overlong settings (more than 64 bytes) fall back to 128. Other
            targets currently use that same fallback rather than a platform lookup.

            An explicit integer from 0 through `2147483647` bypasses discovery and is passed
            to the operating system. Zero is not automatic; its interpretation is
            platform-dependent. Values below `-1` or above the maximum produce a failed
            listener result. Kernel limits still apply to both automatic and explicit
            capacities.
        - type: markdown
          markdown: |-
            Following the host's configured capacity avoids a small arbitrary admission
            bottleneck and lets an administrator size the queue for connection bursts. A
            queue overflow can trigger TCP retries even after the accept loop catches up.
            This default absorbs a temporary mismatch between arrivals and accepts; it does
            not fix sustained overload or limit active connections.

            The tradeoff is host-dependent behavior. Larger queues can retain more pending
            connections and increase waiting time under overload. Choose a smaller explicit
            backlog to bound pending work or favor earlier refusal/recovery, while accepting
            that overflow can itself cause retry delays. Choose an explicit size for a known
            workload or consistent requested capacity across deployments; a larger request
            cannot exceed the host's cap. Setting the field back to `-1` restores automatic
            selection.

            On Linux, requesting `2147483647` and relying on the kernel's `somaxconn` clamp
            is another possible policy. It avoids procfs access, including in sandboxes
            where procfs is unavailable. Terrane instead discovers a validated host value to
            make the requested capacity explicit, with a defined fallback when discovery
            fails; it does not assume that Linux's maximum-clamping behavior is a portable
            discovery mechanism. This is a policy choice, not a claim that the
            kernel-clamped alternative is incorrect.
        - type: example
          id: listener-backlog-selection
          title: Automatic capacity, explicit override, and reset
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace reference-examples/listener-backlog

            from /core/networking import tcp-listener-options, socket-address-from-string, bind-tcp
            from /core/process import exit, make-exit-status

            function main;
                address = socket-address-from-string; '127.0.0.1:0'
                if address.failed
                    exit; (make-exit-status; 1)
                automatic = bind-tcp; address.value
                if automatic.failed
                    print; automatic.message
                    exit; (make-exit-status; 1)
                automatic-listener = move automatic.value
                automatic-listener.close;

                options = instance tcp-listener-options; 128
                limited = bind-tcp; address.value, options
                if limited.failed
                    print; limited.message
                    exit; (make-exit-status; 1)
                limited-listener = move limited.value
                limited-listener.close;

                options.backlog = -1
                restored = bind-tcp; address.value, options
                if restored.failed
                    print; restored.message
                    exit; (make-exit-status; 1)
                restored-listener = move restored.value
                restored-listener.close;
          response: null
          diagnostic: null
    - id: cancellation
      title: Deadlines and cancellation
      blocks:
        - type: rule
          id: rule.networking.deadline-cancellation
          level: must
          since: null
          evidence:
            - networking-values
            - cancelled-stream-operation
          markdown: |-
            `io-operation-options` carries an optional typed `/core/time` deadline and
            optional cancellation token. Omitting the options or passing `none` requests no
            cancellation token or timer. Deadlines and cancellation do not detach operations
            or permit scoped resources to be left unjoined.

            The neutral `/core/io` surface names these objects `io-operation-options` and
            `cancellation-token`. `cancel-operation; token` requests cancellation and
            returns `io-operation-result` with failure, deadline, and message status. These
            types are shared by networking and ordinary asynchronous byte streams.
    - id: scheduling
      title: Executor scheduling
      blocks:
        - type: rule
          id: rule.networking.executor-progress
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
            - networking-readiness-outcomes
          markdown: |-
            Compiler-owned asynchronous socket operations suspend on readiness through the
            runtime selected by the package executor profile. TLS uses the same asynchronous
            transport. Host-name connection delegates DNS resolution, then races socket
            candidates on the selected runtime. Interfaces that remain blocking, including
            standalone resolver operations, are delegated to the runtime's bounded blocking
            pool.

            Pending readiness-based socket operations do not occupy an executor worker.
            Socket deadline and cancellation outcomes retain the operation's explicit source
            contract.
    - id: connection-reuse-recipe
      title: "Recipe: connection-owned reuse"
      blocks:
        - type: markdown
          markdown: |-
            When the application protocol permits serial connection reuse:

            1. Give each connection task sole ownership of its stream. Frame and validate
               one complete request/response before starting the next exchange on that
               stream; TCP keepalive probes are not application-level connection reuse.
            2. Make logical requests available through an application work coordinator. Each
               established connection owner claims another request after validating its
               previous response. A smaller fixed connection limit is a separate concurrency
               policy, not a prerequisite for reuse.
            3. Count completed requests, not accepted connections. On completion or error,
               stop accepting, cancel unused dials, close owned streams, and drain/join
               every task group and scope before returning.

            This owner-task pattern is not a general idle-connection pool. Resource-owning
            collections are currently unsupported, and built-in channel endpoints remain
            linear single-producer/single-consumer paths, not an implicit shared mailbox.

            Choose listener backlog separately to absorb the expected admission burst; it
            does not limit active connections. When benchmarking, match connection reuse and
            shutdown policies as well as request count and protocol. A pooled client can
            finish requests while unrelated background dials are still pending.
