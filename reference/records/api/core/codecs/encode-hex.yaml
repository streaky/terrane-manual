documentation:
  status: complete
  title: encode-hex
  title-style: code
  summary: Encodes bytes as lowercase hexadecimal text.
  tags: [bytes, encoding, hexadecimal]
  callables:
    default:
      parameters:
        data: The [[lang.text.bytes|bytes]] to encode, in input order. Text is not accepted directly; encode it to bytes first, for example with [[std.text-bytes-codecs#encodings|UTF-8 encoding]].
      returns: Two lowercase hexadecimal digits per byte, including a leading zero digit for bytes below 16. The result has no prefix, separators, or whitespace. Empty input returns an empty string.
      throws: {}
  sections:
    - id: examples
      title: Examples
      blocks:
        - type: example
          id: encode-bytes
          title: Encode a byte literal and an empty input
          language: terrane
          mode: run
          source: |-
            namespace reference-examples/hex

            from /core/codecs import encode-hex

            function main;
              print; (encode-hex; b'TRN')
              print; '[', (encode-hex; b''), ']'
          response:
            kind: stdout
            language: text
            display: shown
            content: |
              54524e
              []
    - id: behavior
      title: Behavior and errors
      blocks:
        - type: markdown
          markdown: |-
            Every byte value has a hexadecimal representation, so encoding does not throw.
            It does not decode, interpret, or validate the character encoding of the input.
            Use `decode-hex` to go in the other direction; decoding can fail if the text is
            not valid hexadecimal.
