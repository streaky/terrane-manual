documentation:
  status: complete
  title: Terrane changelog
  title-style: text
  summary: >-
    Index of Terrane's per-version changelog pages, with Unreleased first and dated
    user-visible changes, migration guidance, and reference links on each page.
  tags: [manual, changelog, versions, compatibility, migration]
  blocks:
    - type: markdown
      markdown: |-
        Each version has its own changelog page. **Unreleased** comes first, followed by
        released versions newest first. Within each version page, dated subsections use
        `YYYY-MM-DD` and run oldest first. Dates identify when changes landed in
        development; a released version's page also records its release date separately.

        This is a user-facing history, not a copy of the commit log. Entries distinguish
        additions, breaking changes, and fixes, explain necessary migration, and link to
        the reference sections that own the current contracts. Historical entries
        describe their change at the time; linked reference pages describe current
        behavior.

        When a release is cut, move its dated entries from Unreleased to a new page for
        that named version, preserving their dates and section IDs. Update references to
        moved sections and add the version page to this index and the reference
        navigation. Keep the Unreleased page for subsequent development changes.
  sections:
    - id: versions
      title: Versions
      blocks:
        - type: markdown
          markdown: |-
            - [[manual.changelog.unreleased]] — changes not yet included in a named release.

            No numbered releases are listed yet.
  see-also:
    - manual.changelog.unreleased
