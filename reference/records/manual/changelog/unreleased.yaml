documentation:
  status: complete
  title: Unreleased
  title-style: text
  summary: >-
    Unreleased user-visible Terrane changes, oldest date first, with migration guidance
    and links to the reference contracts.
  tags: [manual, changelog, unreleased, compatibility, migration]
  blocks:
    - type: markdown
      markdown: |-
        These changes are not yet part of a named release. Dated subsections identify
        when changes landed in development, not a release date or a promise about a
        future release. See [[manual.changelog]] for the version index.

        Changelog maintenance began on 2026-10-28. The earlier dates below are a
        selective backfill verified against compiler history and the reference manual;
        they are not an exhaustive account of development before that date.
  sections:
    # Compiler: 794bf761.
    - id: changes-2026-10-04
      title: "2026-10-04"
      blocks:
        - type: markdown
          markdown: |-
            - **Added — authored generics.** Classes, functions, interfaces, and enums can
              declare lexical type parameters with `of (T, U)` and use closed applications.
              Generic bodies are checked against their declared bounds; unconstrained type
              parameters do not acquire implicit defaults or copying capabilities. See
              [[lang.types.generics#authored-declarations]] and
              [[lang.types.generics#authored-bounds]].
            - **Added — closed enums and exhaustive matching.** Scoped variants may have
              named payloads, are constructed with `instance`, and are decomposed with
              `match`. Borrowed and consuming matching preserve payload ownership. See
              [[lang.types.unions#enums]].
            - **Changed — required-field construction.** A source field without a canonical
              or explicit default can be initialized by its constructor. Every successful
              constructor exit must initialize each required field exactly once before it is
              read or the incomplete receiver escapes. Injected object and interface fields
              no longer need throwaway default instances. Fields with canonical defaults,
              including empty collection fields, retain those defaults. See
              [[lang.classes.fields#initialization]] and
              [[lang.classes.lifecycle#lifecycle]].
    # Compiler: f502e757, bd753557, 731ca2b1.
    - id: changes-2026-10-07
      title: "2026-10-07"
      blocks:
        - type: markdown
          markdown: |-
            - **Added — typed declaration annotations and metadata consumers.**
              Package-defined annotation classes can attach typed metadata to declarations.
              Exported declaration metadata includes annotation and documentation
              information for explicitly configured consumer tools; annotations do not
              activate generators automatically. See
              [[lang.declarations.annotations#model]],
              [[lang.declarations.annotations#docs-and-metadata]], and
              [[tool.build-time-tools#annotation-driven-generation]].
    # Compiler: 62219318.
    - id: changes-2026-10-12
      title: "2026-10-12"
      blocks:
        - type: markdown
          markdown: |-
            - **Added — string composition with `+`.** A string operand selects text
              composition when the other operand supports display. Numeric addition remains
              pairwise and left-associated: parenthesize arithmetic that must complete
              before it is appended to text. Existing `concat` and `join` remain available.
              See [[lang.expressions.operators#operators-precedence]].
            - **Added — structural text display.** Supported scalars expose `.to-string;`,
              and classes can participate through a compatible `to-string` method. Explicit
              conversion, `print`, and string composition share that display contract and
              propagate its failures. See [[lang.text.display#scalar-display]].
            - **Added — list-based string replacement.** `replace` accepts a list of
              searches and either paired replacements or one shared replacement. Matches are
              selected on the original input; inserted text is not searched again. Unequal
              paired-list lengths throw `replace-error`. See
              [[lang.text.transformation#string-transform]].
            - **Added — ordered `switch` statements.** Selector cases may group
              alternatives; predicate cases use ordinary truth conditions. The first
              matching case wins, with no fallthrough. Use `switch` for value or predicate
              dispatch and `match` for closed enum decomposition. See
              [[lang.control-flow.branching-and-loops#if-while-for]].
    # Compiler: 73bda4d3, 8f8866a2, 8d168ea3.
    - id: changes-2026-10-15
      title: "2026-10-15"
      blocks:
        - type: markdown
          markdown: |-
            - **Breaking — canonical Terrane dependency identities.** Native Terrane
              dependency keys identify the actual `owner/package`, not a consumer-chosen
              alias. Use dotted TOML tables such as
              `[terrane-dependencies.example.library]`, and ensure the located manifest
              declares that identity. Rust dependency aliases are unchanged. See
              [[tool.packages.terrane-packages#package-manifest]].
            - **Added — source archive dependencies.** Terrane dependencies can use explicit
              HTTP(S) ZIP or gzip-compressed tar archives alongside relative directories and
              exactly tagged Git sources. Git and archive sources require an extracted-tree
              hash, not a compressed-file checksum or Git object ID. There is no central
              registry or identity-only lookup. See
              [[tool.packages.terrane-packages#package-manifest]].
    # Compiler: e25faa69.
    - id: changes-2026-10-16
      title: "2026-10-16"
      blocks:
        - type: markdown
          markdown: |-
            - **Breaking — projection history is disposable cache state.** Generated
              projection history moved from package-root `terrane-projection.lock` to
              `.trn/projection-cache.json`. Stop tracking the former file and ignore
              `.trn/`; normal package preparation regenerates the cache. Continue committing
              `terrane-dependencies.lock`, which preserves the resolved Rust dependency
              graph. Cache removal discards local history, not dependency pins; investigate
              same-input replay mismatches before resetting the cache. See
              [[tool.packages.rust-dependencies#workflow]] and
              [[tool.packages.rust-dependencies#resolution]].
    # Compiler: a4e898c8.
    - id: changes-2026-10-21
      title: "2026-10-21"
      blocks:
        - type: markdown
          markdown: |-
            - **Added — package-owned build-time tools.** Libraries can export executable
              consumers through `[consumer-tools]`; callers select a dependency's export
              with `tool` in `[consumers.<id>]`. Terrane builds and refreshes the
              executable, including its own consumer prerequisites. Replace caller-managed
              tool bootstrap steps where an exported tool is available. See
              [[tool.build-time-tools#selecting-and-building-tools]].
            - **Changed — generation freshness and editor preparation.** Consumers own
              generated-source freshness and are consulted on every preparation. A fresh
              consumer must still return its complete source inventory; returning no sources
              removes its outputs. Semantic editor preparation executes consumers only with
              explicit permission; in VS Code, trust the workspace to enable it. See
              [[tool.build-time-tools#consumer-owned-freshness]] and
              [[tool.build-time-tools#editor-preparation-and-trust]].
    # Compiler: 3319fa4b; subsequent reference validation fixes retain this syntax.
    - id: changes-2026-10-26
      title: "2026-10-26"
      blocks:
        - type: markdown
          markdown: |-
            - **Breaking — declaration-directed borrowing.** Source and projected callable
              declarations now select argument borrowing. Pass an ordinary expression to a
              `ref T` parameter; remove unary `ref` from call arguments and return
              expressions. Those explicit forms now diagnose with `T0146`. Keep `ref` in
              reference types and in local reference bindings. This does not extend lender
              lifetimes or make temporary values valid source-reference lenders. See
              [[lang.types.references#lowering]].
    - id: changes-2026-10-28
      title: "2026-10-28"
      blocks:
        - type: markdown
          markdown: |-
            - **Fixed — literal-aware expression lowering.** Parentheses inside string and
              character literals no longer corrupt generated Rust when Terrane removes
              redundant expression wrappers. Grouped string-search conditions now compile
              instead of triggering a compiler panic; unit values, tuple grouping, and
              arithmetic precedence are preserved. No syntax migration is required. See
              [[lang.expressions.operators#operators-precedence]].
            - **Fixed — book PDF rendering.** The documentation converter now prints the
              structured HTML directly through Chromium instead of using a PDF backend that
              internally round-tripped it through Markdown. Code blocks and normal prose no
              longer flip formatting or acquire stray fence backticks. PDF publishing now
              requires Chromium/Chrome; set `CHROME` to its executable path when needed.
              HTML, Markdown, and JSON output do not launch a browser.
            - **Added — print pagination.** Book chapters now begin on fresh PDF pages.
              Authored `page-break` IR blocks can also insert boundaries within a chapter;
              continuous screen HTML remains unchanged and machine-readable IR retains the
              blocks. Generated Markdown preserves styled HTML break markers for consumers
              that support print styles.
            - **Documentation — current language idioms.** Tutorial and reference examples
              prefer string `+` for ordinary composition, retaining explicit `concat` API
              demonstrations and byte concatenation. The book now also introduces ordered
              `switch`, list-based replacement, and package-owned build-time tools, and
              distinguishes disposable projection history from the dependency lock. See
              [[lang.expressions.operators#operators-precedence]],
              [[lang.text.transformation#string-transform]], and
              [[tool.build-time-tools#selecting-and-building-tools]].
    - id: changes-2026-10-30
      title: "2026-10-30"
      blocks:
        - type: markdown
          markdown: |-
            - **Changed — borrowed core observations and native inputs.** Read-only
              text/byte builtins and storage-preserving Rust inputs no longer clone an owned
              intermediate merely to borrow it. Native free/static calls, indexed inputs,
              and synchronous provided-interface facades preserve existing storage; COW list
              reads do not separate their backing. Immediate text-view loops traverse lazily
              rather than collecting the complete view first. Required ownership
              conversions, mutation isolation, evaluation-order snapshots, and bounded
              shared-guard lifetimes remain intact. No source syntax migration is required.
              See [[lang.ownership.value-semantics#value-copy-semantics]],
              [[tool.packages.rust-dependencies#crossed-types]], and
              [[internals.optimization.proof-guided-lowering#borrowed-observations]].
    - id: changes-2026-10-31
      title: "2026-10-31"
      blocks:
        - type: markdown
          markdown: |-
            - **Added — explicit mutable borrowing and bounded native access.**
              `mutable ref T` authorizes mutation of the original value, including
              write-through replacement, under exclusive-loan rules. Plain `ref T` remains
              read-only for both source and projected native values: native callers that
              previously relied on inferred mutable reference authority must state
              `mutable ref T`. Shared-reference ownership and its checked access model are
              unchanged. See [[lang.types.references#mutable-references]].
            - **Added — scoped acquisition regions.** General typed, lexically resolved
              `with` machinery supports `with scoped-access` with an explicit acquisition
              binding, deterministic nested cleanup, and dependent-view escape checks.
              Ordinary borrowing and pointer calls do not require a region. Additional
              realization operations remain unsupported. See
              [[lang.namespaces.scopes#scoped-access]].
            - **Changed — native smart-pointer receivers.** Ordinary member calls can reach
              proven native dereference targets while retaining the owning pointer's
              identity and respecting mutable and consuming access. See
              [[internals.projection.resolution#native-receiver-regions]].
    - id: changes-2026-11-01
      title: "2026-11-01"
      blocks:
        - type: markdown
          markdown: |-
            - **Fixed — reference and callable compatibility.** Ordinary observers retain
              their mutation, move, and replacement invalidation checks; shared ownership
              can be established from fresh factory results as well as constructors.
              Borrowed callable storage refinement validates the declared throwable bound
              before retaining inferred escaping identities. Repeated reads of narrowed
              optional or union storage no longer move a payload before its final use. See
              [[lang.types.references]] and [[lang.functions.callable-types#compatibility]].
    - id: changes-2026-11-02
      title: "2026-11-02"
      blocks:
        - type: markdown
          markdown: |-
            - **Added — supplied associated type contracts and native response selection.**
              Authored interfaces declare `associated type` slots, implementing classes bind
              them, and typed dispatch retains the concrete relationship. Explicit
              `owning interface` declarations support resource-owning implementations with
              borrowed methods. Native input selection now closes retained associated
              response equations with exact trait/equality proof, including nested results
              and non-copyable inputs and responses. Implicit native record constructors
              validate canonical source field arguments and preserve optional native/source
              carrier distinctions. See [[lang.classes.interfaces#associated-outputs]] and
              [[lang.types.generics#native-associated-results]].
            - **Added — recursive owned native descriptor conversion.** Mixed configuration
              carriers now compose optional tuples and maps, owned native values, borrowed
              text/slices and vectors of borrowed text or OS-string views. Shared calls
              preserve their configuration; consuming calls transfer owned fields, including
              mixed borrowed/owned container payloads, without an extra payload clone.
              Temporary views retain backing owners through the call and reject escaping
              native references. Chromium launch configuration now crosses the projected
              descriptor API from Terrane source. See
              [[tool.packages.rust-dependencies#foreign-value-ownership]].
            - **Fixed — shared tuple native conversion and descriptor errors.** Reused tuple
              values and tuples inside copied lists now convert without requiring unique
              backing, while linear non-Clone tuples retain consuming transfer. Descriptor
              field conversion failures propagate through source helpers as ordinary
              catchable errors with precise throwable effects. Native tuple mismatch
              diagnostics now distinguish required, known and unknown lengths.
            - **Fixed — plain native record tuple-shape validation.** Fixed-arity tuple
              fields now use the same static length checks as native parameters, including
              nested optional and collection fields. Unknown or mismatched lengths report
              `T0012` instead of reaching a native conversion panic. Contextual tuple
              literals also retain actual arity checking in constructors and native calls.
            - **Fixed — catchable plain native record conversion errors.** Character and
              integer-range failures now preserve their exact throwable identities through
              source helpers, optional and collection fields, direct native methods and
              expression macros instead of aborting or becoming dependency panics.
            - **Fixed — constant native constructor effects.** Plain record and descriptor
              constructors no longer require coercion or overflow error families for
              provably valid scalar constants under an explicit throwable contract. Runtime
              and invalid constant inputs retain their conversion effects.
            - **Fixed — early consumer stdin closure.** A successful consumer may ignore the
              request without a scheduling-dependent broken-pipe failure. Exit status and
              stdout protocol validation still apply.
            - **Added — retained native callback carriers.** Supported owning `Box` and
              `Arc` inputs compose callable blanket adapters, cross-dependency aliases and
              interface listeners while preserving native registration-token identity.
              Mutable and consuming callbacks bind borrowed inputs per invocation; mutable
              events retain original storage and copied mutable callables retain independent
              environments. Capture lifetime, invocation authority and `Send`/`Sync`
              violations report source diagnostics. Native lifecycle and reentrancy remain
              API-defined. See [[tool.packages.rust-dependencies#callbacks]]. Owning
              adapters reject borrowed results and borrowed trait type arguments rather than
              erasing native lifetimes; exact raw higher-ranked callbacks retain their
              existing separate path.
            - **Fixed — retained callback review boundaries.** Optional owning callback
              inputs preserve callable grouping, canonical native identities and
              trait-object coercion through both present and absent branches. Owned callable
              environments enforce their runtime capture bounds at source, including local
              calls. Unsupported blanket candidates no longer mask supported candidates, and
              owning-result validation follows aliases through nested slice/array payloads.
              Ordinary and invocation-borrowed owned mutable bodies share one runtime
              generator without changing copy or locking semantics.
            - **Fixed — collection callback diagnostics.** Unsupported owning callback
              carriers nested in native collections report their actual shape limitation
              instead of an unresolved generic-interface bound. Supported optional callback
              inputs remain unchanged.
    - id: changes-2026-11-03
      title: "2026-11-03"
      blocks:
        - type: markdown
          markdown: |-
            - **Added — generic typed JSON and YAML serialization.** Classes can opt in to
              derived encoding and decoding of supported scalar, optional, collection, and
              nested-class fields using canonical external names. Missing initialized fields
              retain defaults, explicit null clears optionals, unknown fields are rejected
              unless explicitly allowed, and secret/private fields are not serialized. Typed
              JSON encoding streams into bounded output; custom codecs remain available.
              Dynamic documents retain exact mathematical numbers without preserving their
              original spelling. See [[std.documents.typed-decoding]].
            - **Changed — native document interoperability.** Native Serde conversions now
              traverse exact document values directly; `JsonDocument` is the explicit
              JSON-only raw lexical adapter. JSON `Value` conversions report unsupported
              numeric exactness or range instead of silently narrowing. See
              [[std.documents.typed-decoding#native-boundary]].
            - **Fixed — serialization review boundaries.** Dynamic result snapshots no
              longer impose a hidden 16 MiB ceiling. YAML stringify/custom encoding now take
              explicit options and honor output budgets. Strict JSON rejects an initial BOM
              and reports reliable syntax locations; its lexical parser dependency is pinned
              exactly. Custom document maps use UTF-16 key ordering, extreme finite floats
              use compact round-tripping notation, known nested tuple arities are retained
              during decoding, and derived inheritance checks span source units.
            - **Added — grouped selective imports.** End a `from ... import` header
              immediately after `import` to place its comma-separated names and optional
              aliases in an indented group. Inline imports remain single-line; grouped
              imports end at a dedent or end of file and reject a final trailing comma. See
              [[lang.namespaces.imports#imports]].
    - id: changes-2026-11-04
      title: "2026-11-04"
      blocks:
        - type: markdown
          markdown: |-
            - **Added — structured class assignment blocks.** Construction assignments can
              initialize fields after constructor arguments, and update blocks can write
              fields of an existing simple binding in place without replacing it. Ordinary
              member-write checks apply; updates are not transactional. Construction retains
              its mandatory semicolon, and both block forms reject empty blocks. There is no
              `unset` operation. See [[lang.classes.fields#classes]].
            - **Fixed — structured assignment navigation and diagnostics.** Field names
              resolve at their first character, malformed layouts report source diagnostics,
              and ordinary construction expressions execute when used as statements. Mutable
              instance methods may update `this`; ordinary receiver authority still applies.
            - **Fixed — unsupported namespace data storage.** Materialized non-scalar
              program-global and namespace data declarations report `T0226` instead of
              leaking undefined storage symbols into generated Rust. Use local objects or
              parameters; see [[lang.declarations.globals#global-initialization]].
            - **Added — grouped catch descriptors.** A single catch can list several
              comma-separated throwable types and share one body and optional `as` binding.
              Every alternative is validated, duplicates and unreachable alternatives are
              rejected, and all listed types participate in escaping-throwable inference.
              Handler-thrown errors now remain escaping even when a later catch names their
              type, matching runtime behavior for grouped and single-type clauses.
              Previously accepted narrow `throws` contracts that relied on the old unsound
              inference may now be rejected. See [[lang.errors.handling#structured-errors]].
    - id: changes-2026-11-05
      title: "2026-11-05"
      blocks:
        - type: markdown
          markdown: |-
            - **Fixed — lifetime-bearing native fluent calls.** Consuming builder methods
              returning `Self` retain their native family through chained async terminals,
              including executor-selected associated results. This restores ordinary SQLx
              non-persistent query execution without erasing lifetimes or permitting scoped
              values to escape. See
              [[internals.projection.resolution#native-receiver-regions]].
            - **Fixed — projection-cache replay stability.** Recovered native instance and
              static members are ordered canonically before hashing, preventing Rustdoc
              iteration order from causing same-input cache-drift failures. Existing
              projection caches rebuild automatically; replay validation remains enabled.
            - **Fixed — referenced throwable text.** Reading `message` and `descriptor`
              through a borrowed throwable uses the runtime accessors for both borrowed
              observations and owned snapshots. See
              [[lang.errors.handling#structured-errors]].
            - **Fixed — source result demand through applied generics.** Returning a payload
              type from an owning applied argument follows its actual type argument rather
              than the outer container. Remaining higher-order, class-generic and loop-item
              demand limits have explicit typed workarounds, and `T0055` distinguishes an
              undemanded projected instance member from an absent one. See
              [[internals.projection.resolution#projection-gap-census]].
            - **Fixed — native ownership and lender diagnostics.** Loop exits no longer
              fabricate a second consumption; real back edges and post-break reuse retain
              move checks. Field/index loan overlaps report `T0240`, guard-backed borrowed
              native results report `T0119`, and lifetime-bearing native class fields report
              `T0101` before Rust lowering. Non-Clone native enums transfer ownership, while
              proven Copy receiver calls do not make source callables consuming.
            - **Fixed — invalid inferred bindings and generic copies.** Reserved inferred
              targets report `S1095` instead of reaching receiver-only lowering. Indexed
              copies of an unconstrained generic parameter report `T0135` instead of a Rust
              Clone-bound error. See [[lang.lexical-structure.keywords]] and
              [[lang.types.generics]].
            - **Fixed — optional native byte metadata.** Absent byte-extraction recipes are
              omitted again, and projection caches rebuild for the canonical serialization
              change without disabling replay validation.
