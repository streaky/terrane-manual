documentation:
  status: complete
  title: "Deterministic readable Rust lowering"
  title-style: text
  summary: >-
    A single Rust-oriented IR emits readable, deterministic modules, items, expressions, types, and source associations.
  tags:
    - "interop"
    - "rust-output"
    - "rust-lowering"
  sections:
    - id: rust-lowering
      title: "Deterministic Rust Lowering"
      blocks:
        - type: markdown
          markdown: |-
            Terrane uses Rust as a native compilation target rather than as a foreign
            runtime. Lowering passes through a Rust-oriented representation and produces
            deterministic Rust output with stable module and item ordering. Fixed-width
            scalar values and functions lower directly where Rust preserves the Terrane
            contract; operations needing additional semantics use selectively included
            support code.

            Split output places required runtime infrastructure in a sibling `.support.rs`
            file, with a deterministic vendored-support-crate manifest. When no support code
            is needed, lowering emits only the entrypoint, without a support include. Output
            regeneration removes an obsolete generated support sidecar.

            Direct `throw class` and `throw class; arguments` expressions resolve class
            designators after lexical scopes and imports are available, then normalize to
            ordinary construction calls before type inference. Argument validation,
            ownership, and constructor lowering share the `instance` path; the throw emitter
            receives the constructed value rather than a class descriptor. Throwable
            conformance, inferred escaping sets, declared throwable bounds, and runtime
            error registration use the canonical base object identity. Generic arguments
            remain part of construction typing, not a separate runtime error kind. Imported
            aliases preserve that same descriptor. Compiler-owned error kinds retain their
            lazy runtime-message path, and existing throwable values remain value throws.

            Late-bound `self` construction resolves lexical object ownership before
            function-owner contracts exist. When emitting an inherited method body,
            construction value types are rebound to the effective class; descriptor
            registration and polymorphic message-field access use that same class.

            Source throwable envelopes retain the raw message and the class's captured
            render text separately. Equal texts share one owned string. Envelope rendering
            combines the display text with descriptor, causes, and source frames; cloning,
            causal replacement, and rethrows preserve the raw message independently. The
            source object and arbitrary payload fields are not retained by the envelope.

            Nominal interface conformance prefers an exact applied descriptor contract when
            available. Projected interfaces retain specialized inherited interface
            applications there; authored generic applications without an exact contract
            instead use their canonical declaration's nominal conformance. Neither path
            weakens equality between distinct applied types.

            Generated symbol identifiers use an exact, deterministic, injective encoding.
            Punctuation is not normalized away, so distinct Terrane symbol names remain
            distinct. A source name, its generated Rust name, and its native or link symbol
            are separate identities. Lowered output retains source and namespace
            associations, including generated module-association comments.

            Local storage instead favors readable source-name stems. The first physical
            version keeps its plain stem when collision-free; later versions use stable
            ordinals rather than source byte offsets. Allocation reserves authored stems and
            captured outer names and visible callable items, so sanitized-name collisions,
            ordinal-like suffixes, and hoisted locals shadowing native wrappers remain
            distinct. Whitespace edits and unrelated functions do not rename a function's
            locals. Parameters and union carriers share this canonical mapping with
            lowering, ownership, and native debugger metadata.

            Unused authored class type parameters are retained by zero-sized phantom
            markers. Those markers use the same canonical Rust type-parameter names as the
            generic declaration, not local-variable name rendering.

            Signature types recursively preserve a projected value's canonical native Rust
            representation, including nested callable results and async `Future::Output`
            bounds. Source-class collision names do not replace selected native owners.
            Collision detection compares generated CamelCase type names, not only source
            spelling, within and across namespaces. An authored `socket-addr` and a
            projected `SocketAddr`, or authored `foo-bar` and `fooBar`, remain distinct.
            Collisions keep a readable namespace/type stem followed by an exact-byte
            canonical identity suffix, shared by declarations and import aliases. The suffix
            remains authoritative when namespace or type spellings normalize to the same
            readable form. Names that would shadow edition-2024 Rust prelude types,
            including `Future` and `IntoFuture`, or compiler support types are also
            qualified. Ordinary non-colliding names keep their readable spelling. Imports
            retain declaration roots and their Rust binders/defaults, rather than
            synthesizing aliases for each closed application. Anonymous native arguments
            remain inferred at use sites; they cannot appear in item-level type aliases.
            Destination-selected native calls retain Rust method type-parameter positions in
            declaration order, including inferred callback implementation slots; concrete
            UFCS owner arguments stay in the trait path, not the method turbofish. Explicit
            native callable selection also retains the metadata-selected result and async
            effects during initial typing; omitted source binders do not imply a void
            result. Selected callable shapes remain tied to declaration identity. Static
            operation helpers retain the owning inherent implementation's generic bounds
            separately from method-owned parameters. `Self` uses the actual impl owner,
            including defaults in a bare impl, rather than the nominal declaration's open
            parameters. Helper declarations and calls bind only that operation's owner
            parameters and share namespace-qualified symbol identities. Public aliases call
            the canonical source owner's single static wrapper declaration, rather than
            emitting duplicate symbols for the same native operation. Inherent owner-bound
            extraction applies to static helpers, not direct instance operations:
            invocation-scoped methods retain their existing lifetime-aware operation graph
            instead of being rejected by a lifetime-free helper signature.

            Safety does not rename ordinary methods: a safe method always retains its
            canonical generated Rust name. An unsafe method uses a reserved deterministic
            encoding of its complete source name that cannot collide with any safe generated
            method name. This local mapping prevents an unrelated unsafe declaration from
            changing runtime, generated, or projected implementations of a fixed-name safe
            protocol method such as `render`, `log`, or `construct`. Collection contextual
            typing and builder evidence are preserved across function-owned lowering: a
            local collection declaration inside a loop retains its destination element type
            while each iteration constructs a fresh logical value. Field reads likewise
            preserve owned value separation; copying a non-resource class field and mutating
            the local snapshot does not mutate the original object. A direct owned object
            field can move from a temporary call or constructor result rather than copying a
            value whose receiver is immediately discarded. This optimization does not apply
            to borrowed results, required-field slots, native projections, or
            destructor-backed receiver storage; those retain their existing access and
            value-separation rules. When a matching owned field contract is read through a
            non-owning or shared object reference, member lowering materializes that
            snapshot once, while the borrow or shared lock is still live.
            Destination-directed lowering does not clone the resulting snapshot again.
            Required-field slots follow the same rule, and values with destructor-backed
            identity use value separation rather than a redundant clone followed by
            separation. Getter-backed fields of inheritance-wrapped classes return
            references even when their scalar representation implements Rust Copy. Their
            owned reads dereference the getter result inside the receiver's borrow or lock;
            the required-slot path performs that dereference exactly once as well.

            Shared field reads bind the owned result in an inner block, so Rust's
            statement-temporary lifetime cannot retain a lock across sibling reads,
            arithmetic operands, aggregate elements, or call arguments. Write places are a
            distinct lowering path: capture the shared owner or upgrade the weak handle,
            evaluate the value arguments, then acquire the live guard and follow mutable
            getters or required-field slots recursively. Synchronous guarded method calls
            use that same identity-before-arguments, lock-after-arguments ordering,
            including projected native methods. Reading the original named owner of shared
            storage copies only the selected field rather than the entire referent. No
            copied getter receiver is used as a mutation target.

            Source-object exclusions in name-keyed builtin dispatch inspect the unwrapped
            receiver type, including the separate string-family selector. Source methods
            named like builtin families therefore use ordinary authored method calls through
            ordinary/shared references rather than scalar helpers. Semantic
            callable-contract lookup likewise unwraps cached reference types before
            resolving the source method contract. Semantic builtin-family inference defers
            to an effective authored method before applying builtin arity or policy rules,
            including `parse`, `radix`, and `coerce`.

            Explicit shared storage uses `Arc<TerraneSharedCell<T>>`; observers of the same
            identity use `Weak<TerraneSharedCell<T>>`. The demand-emitted `shared-storage`
            runtime fragment wraps a mutex with an atomic owner token. A lazy per-thread
            nonzero scalar token is unique without wrap reuse; acquisition checks for the
            current token before blocking, and normal cross-thread contention still waits.
            Once acquired, both ordinary and poisoned guards register ownership. Guard drop
            clears the owner while still holding the mutex, before the inner guard unlocks;
            clearing afterward could erase a different thread's newly acquired owner.
            Acquisition performs no per-access allocation, referent copy or global-map
            lookup.

            Checked access is exclusive, including read-only source methods. Same-thread
            reacquisition panics with a clear shared-reference borrow-conflict diagnostic,
            rather than recursively exposing overlapping references. Rust mutex poisoning is
            preserved on unwinding. The native guard is not Send and does not survive await.
            Async source methods have a handle-owning associated entry point for shared
            receivers; accesses to `this` acquire bounded guards, without cloning the whole
            referent or holding a guard across suspension. Ordinary receivers retain their
            normal method path. Authored static fields use `LazyLock<TerraneSharedCell<T>>`
            and live guarded mutation as well. Module-global scalar storage and explicit
            native concurrency mutexes retain their separate implementations. Enum-backed
            inheritance projects the owned handle to the selected variant with safe
            read/write accessors, preserving dynamic method dispatch and the original cell's
            borrow-conflict, poison, and unlock behavior without allocating another cell or
            cloning its referent.

            `T0143` remains a small early error for direct receiver/argument aliases and
            local sequential copies/replacements under canonical binding identities.
            Compound writes discard affected facts. Loop-specific proofs,
            pass-through-result identity tracking in this check, and transitive
            source-helper pair summaries are removed. Runtime acquisition detects actual
            same-thread conflicts independently of those proofs. Cross-thread multi-object
            lock cycles remain ordinary synchronization responsibilities; no timeout,
            recursive mutex or general deadlock detector is added. See
            [Checked shared storage](lang.types.references#shared-deadlocks).

            Native/platform-result fields and document-result fields already return an owned
            converted value. Matching destination-directed reads reuse that value rather
            than copying it again. Proven reads of uncertain-binding storage likewise
            produce their owned snapshot at the availability boundary; ordinary destination
            adaptation and adaptive integer arithmetic do not add another clone. Adaptive
            integer conversion still lifts native small-integer storage into the source
            integer representation; owning a snapshot does not remove that representation
            change. Map-entry field extraction, logging argument adapters, and explicit
            rethrows use the same single-snapshot ownership boundary. Destructor-backed
            values still use their existing separation rules. Projected callback adapters
            take ownership of the supplied callable snapshot; borrowed callable inputs are
            copied at the borrow boundary, and shared async callbacks retain the
            per-invocation handle copy needed by each future. These are ownership-specific
            decisions, not rewriting or trimming generated clone suffixes.

            Conformance cases may omit emitted-source snapshots while retaining acceptance,
            runtime-output, warning, and canonical-Rust checks. Projection cache/history is
            disposable local state, not a tracked golden; the deliberate format-3 projection
            history compatibility fixture remains test data. `terrane rust` streams a
            complete standalone Rust translation unit by default. With `--output` or `-o`,
            it writes a split artifact. For a requested entrypoint named
            `<entrypoint-stem>.rs`, Terrane emits `<entrypoint-stem>.support.rs` beside it
            when support code is needed. The entrypoint contains authored lowering,
            user-authored package modules, source and namespace associations, and a relative
            `include!` only when the sidecar exists. The support sidecar contains the
            compiler prelude, runtime, structured-error and source-site infrastructure,
            selected bundled `/core` implementation code, projected `/deps` lowering, and a
            vendored-support-crate manifest. Empty sidecars and their includes are omitted.
            `check`, `build`, and `run` use the same renderer and request `src/main.rs`.

            Each lowered item is parsed into a compiler-owned Rust syntax tree before
            rendering. Structural normalization removes redundant expression parentheses,
            including from macro bodies that parse as comma-separated expression lists;
            required parentheses follow Rust precedence. Canonical-format validation uses
            the same normalization and pinned formatting path. When validation detects a
            mismatch, it reports compiler defect `S9004` and does not repair or replace the
            generated output.

            Generated projects contain Cargo manifests, compiler and source metadata, and
            copied content-addressed support crates referenced by generated-project-relative
            paths. Bundled support does not rely on registry, network, or
            compiler-installation paths. Build identity covers compiler version, source and
            support content, target, profile, and command-relevant environment. Generated
            artifacts are kept in a project-local ignored directory or a user cache unless
            deliberately exposed through requested output or retention options.

            Inline Rust blocks and expressions and maintained `.rs` files are escape hatches
            with explicit safety and source mapping. Generated and handwritten Rust can call
            each other within one Rust crate graph. Ejection tooling can produce
            maintainable Rust and Cargo artifacts.
