documentation:
  status: complete
  title: "Deterministic readable Rust lowering"
  title-style: text
  summary: >-
    A single Rust-oriented IR emits readable, deterministic modules, items, expressions, types, and source associations.
  tags:
    - "interop"
    - "rust-output"
    - "rust-lowering"
  sections:
    - id: rust-lowering
      title: "Deterministic Rust Lowering"
      blocks:
        - type: markdown
          markdown: |-
            Terrane uses Rust as a native compilation target rather than as a foreign
            runtime. Lowering passes through a Rust-oriented representation and produces
            deterministic Rust output with stable module and item ordering. Fixed-width
            scalar values and functions lower directly where Rust preserves the Terrane
            contract; operations needing additional semantics use selectively included
            support code.

            Direct `throw class` and `throw class; arguments` expressions resolve class
            designators after lexical scopes and imports are available, then normalize to
            ordinary construction calls before type inference. Argument validation,
            ownership, and constructor lowering share the `instance` path; the throw emitter
            receives the constructed value rather than a class descriptor. Throwable
            conformance uses canonical object identity, so imported aliases preserve the
            same descriptor. Compiler-owned error kinds retain their lazy runtime-message
            path, and existing throwable values remain value throws.

            Generated symbol identifiers use an exact, deterministic, injective encoding.
            Punctuation is not normalized away, so distinct Terrane symbol names remain
            distinct. A source name, its generated Rust name, and its native or link symbol
            are separate identities. Lowered output retains source and namespace
            associations, including generated module-association comments.

            Local storage instead favors readable source-name stems. The first physical
            version keeps its plain stem when collision-free; later versions use stable
            ordinals rather than source byte offsets. Allocation reserves authored stems and
            captured outer names and visible callable items, so sanitized-name collisions,
            ordinal-like suffixes, and hoisted locals shadowing native wrappers remain
            distinct. Whitespace edits and unrelated functions do not rename a function's
            locals. Parameters and union carriers share this canonical mapping with
            lowering, ownership, and native debugger metadata.

            Unused authored class type parameters are retained by zero-sized phantom
            markers. Those markers use the same canonical Rust type-parameter names as the
            generic declaration, not local-variable name rendering.

            Signature types recursively preserve a projected value's canonical native Rust
            representation, including nested callable results and async `Future::Output`
            bounds. Source-class collision names do not replace selected native owners.
            Collision detection compares generated CamelCase type names, not only source
            spelling, within and across namespaces. An authored `socket-addr` and a
            projected `SocketAddr`, or authored `foo-bar` and `fooBar`, remain distinct.
            Collisions keep a readable namespace/type stem followed by an exact-byte
            canonical identity suffix, shared by declarations and import aliases. The suffix
            remains authoritative when namespace or type spellings normalize to the same
            readable form. Names that would shadow edition-2024 Rust prelude types,
            including `Future` and `IntoFuture`, or compiler support types are also
            qualified. Ordinary non-colliding names keep their readable spelling. Imports
            retain declaration roots and their Rust binders/defaults, rather than
            synthesizing aliases for each closed application. Anonymous native arguments
            remain inferred at use sites; they cannot appear in item-level type aliases.
            Destination-selected native calls retain Rust method type-parameter positions in
            declaration order, including inferred callback implementation slots; concrete
            UFCS owner arguments stay in the trait path, not the method turbofish. Explicit
            native callable selection also retains the metadata-selected result and async
            effects during initial typing; omitted source binders do not imply a void
            result. Selected callable shapes remain tied to declaration identity. Static
            operation helpers retain the owning inherent implementation's generic bounds
            separately from method-owned parameters. `Self` uses the actual impl owner,
            including defaults in a bare impl, rather than the nominal declaration's open
            parameters. Helper declarations and calls bind only that operation's owner
            parameters and share namespace-qualified symbol identities. Public aliases call
            the canonical source owner's single static wrapper declaration, rather than
            emitting duplicate symbols for the same native operation. Inherent owner-bound
            extraction applies to static helpers, not direct instance operations:
            invocation-scoped methods retain their existing lifetime-aware operation graph
            instead of being rejected by a lifetime-free helper signature.

            Safety does not rename ordinary methods: a safe method always retains its
            canonical generated Rust name. An unsafe method uses a reserved deterministic
            encoding of its complete source name that cannot collide with any safe generated
            method name. This local mapping prevents an unrelated unsafe declaration from
            changing runtime, generated, or projected implementations of a fixed-name safe
            protocol method such as `render`, `log`, or `construct`.

            Conformance cases may omit emitted-source snapshots while retaining acceptance,
            runtime-output, warning, and canonical-Rust checks. Filtered golden regeneration
            with `TERRANE_UPDATE_GOLDENS=projection` updates only reviewed projection
            histories, leaving emitted-source snapshots unchanged.

            `terrane rust` streams a complete standalone Rust translation unit by default.
            With `--output` or `-o`, it writes a split artifact. For a requested entrypoint
            named `<entrypoint-stem>.rs`, Terrane also emits `<entrypoint-stem>.support.rs`
            beside it. The entrypoint contains authored lowering, user-authored package
            modules, source and namespace associations, and one relative `include!`. The
            support sidecar contains the compiler prelude, runtime, structured-error and
            source-site infrastructure, selected bundled `/core` implementation code, and
            projected `/deps` lowering. The sidecar is emitted even when empty, preserving a
            uniform two-file layout. `check`, `build`, and `run` use the same renderer and
            request `src/main.rs`, which is paired with `src/main.support.rs`.

            Each lowered item is parsed into a compiler-owned Rust syntax tree before
            rendering. Structural normalization removes redundant expression parentheses,
            including from macro bodies that parse as comma-separated expression lists;
            required parentheses follow Rust precedence. Canonical-format validation uses
            the same normalization and pinned formatting path. When validation detects a
            mismatch, it reports compiler defect `S9004` and does not repair or replace the
            generated output.

            Generated projects contain Cargo manifests, compiler and source metadata, and
            copied content-addressed support crates referenced by generated-project-relative
            paths. Bundled support does not rely on registry, network, or
            compiler-installation paths. Build identity covers compiler version, source and
            support content, target, profile, and command-relevant environment. Generated
            artifacts are kept in a project-local ignored directory or a user cache unless
            deliberately exposed through requested output or retention options.

            Inline Rust blocks and expressions and maintained `.rs` files are escape hatches
            with explicit safety and source mapping. Generated and handwritten Rust can call
            each other within one Rust crate graph. Ejection tooling can produce
            maintainable Rust and Cargo artifacts.
