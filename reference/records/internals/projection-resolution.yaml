documentation:
  status: complete
  title: Dependency projection resolution
  title-style: text
  summary: >-
    Describes the exact identities, ordered resolution sources, artifact validation, and durable history used to turn locked
    Rust dependencies into one reusable compiler projection.
  tags:
    - compiler-internals
    - dependencies
    - projection
    - artifacts
    - caching
    - reproducibility
  sections:
    - id: identity
      title: Exact cache identity
      blocks:
        - type: rule
          id: rule.internals.projection.cache-identity-is-exact
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
            - rust-dependency-reqwest
          markdown: |-
            A projection cache identity covers the package manifest,
            `terrane-dependencies.lock` complete resolved graph, effective compilation
            target, stable build toolchain, nightly rustdoc toolchain, rustdoc JSON format,
            projection schema, and containment tier. Every field is length-delimited before
            entering the SHA-256 digest so different input boundaries cannot produce the
            same encoded sequence.

            The effective target is selected from `CARGO_BUILD_TARGET`, then Cargo's
            `build.target`, then the pinned stable compiler's host. A change to any identity
            input selects a different cache record rather than reusing and conditionally
            repairing an older projection.

            Identity construction lives in `crates/terrane-compiler/src/projection.rs` under
            `cache_identity` and `selected_target`. The identity is deliberately
            environment- specific when the resolved Cargo lock, effective target, toolchain,
            or containment tier differs; it is not part of the reviewed semantic surface
            fixture. `target_identity_reads_effective_cargo_configuration` covers
            target-sensitive construction, while
            `projection_history_migrates_provenance_and_detects_replay_drift` proves that
            one exact identity cannot admit two content hashes.
    - id: resolution
      title: Ordered resolution transaction
      blocks:
        - type: rule
          id: rule.internals.projection.artifacts-never-widen
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
            - rust-dependency-reqwest
          markdown: |-
            Projection resolution is one transaction owned by `resolve`. It checks the exact
            project-local cache first, records bundled distribution as explicitly skipped
            while no release channel exists, attempts a configured published artifact, and
            otherwise generates rustdoc locally with the pinned nightly toolchain. Every
            attempted source records a status and reason, and the final projection records
            its resolution outcome.

            A published artifact is admitted only when its envelope format, cache identity,
            target, stable and rustdoc toolchains, rustdoc format, projection schema, and
            payload identity match. Dependency names, packages, exact versions, and effects
            are checked separately from feature/default-feature metadata and each
            dependency's target condition. The SHA-256 content hash must agree with both the
            envelope and the projection payload.

            Missing or rejected published artifacts fall back to local rustdoc; validation
            never weakens a mismatch into a nearby reusable result. A verified published
            result is written into the same exact local cache used by later offline
            resolution. The focused unit test
            `remote_artifact_requires_exact_projection_inputs` exercises the artifact
            boundary and its distinct mismatch causes.
    - id: public-paths
      title: Canonical public paths
      blocks:
        - type: rule
          id: rule.internals.projection.public-paths-are-canonical
          level: must
          since: null
          evidence:
            - namespace-qualified-projected-object-identity
          markdown: |-
            Projection schema 25 resolves every public item through a substantive reachable
            Rust path before considering paths beneath a `prelude` module, then uses
            shortest depth and lexical ordering as tie-breakers. That selected path supplies
            both the callable Rust path and the Terrane namespace and object identity; the
            item's deeper defining-module or convenience-prelude path cannot override a
            canonical public re-export.

            `public_surface` discovers public definitions, named re-exports, glob
            re-exports, and external owner prefixes in one traversal per rustdoc document.
            Local named-module re-exports recurse under the public alias. The resulting
            public-path map is reused for item projection, while external owner evidence is
            retained separately so a facade alias cannot leak into an unrelated dependency.
            `project_rustdoc` replaces rustdoc's defining paths with the applicable declared
            owner or facade-fragment paths before creating projected items, so compiler
            lookup, generated Rust, editor tooling, and durable projection history expose
            one matching surface. Associated functions are recorded on their owning foreign
            type and emitted as Terrane static members rather than duplicate namespace
            functions. A single admitted concrete generic instantiation keeps the readable
            type name; only multiple admitted instantiations require canonical hash
            suffixes. Projection history records instance members as `Type.member` and
            static members as `Type::member`, so method-level surface loss is visible across
            dependency upgrades.

            Projection schema 63 also follows source-demanded public bindings whose concrete
            definition is owned by another package in the resolved Cargo graph. External
            module and glob re-exports preserve every public prefix long enough to expand
            the owner's items; the final path preference is applied only after that
            expansion. Supplemental owner rustdoc retains documentation-hidden generated
            definitions, but those definitions become candidates only when an explicit
            `/deps` import demands the facade binding. Owner documents are generated and
            parsed at most once per projection run. Declared dependency paths may rewrite a
            signature to another declared owner, while facade aliases are scoped to their
            provider fragment. Unmapped private owner paths remain owner-rooted and are
            declined by ordinary reachability checks; builtin, ambiguous, or unavailable
            owners are skipped or declined rather than guessed. Emitted Rust continues to
            name the declared facade.

            Source demand is part of projection identity and durable lock contents. Adding,
            removing, or renaming a `/deps` import can intentionally change the lock even
            when `package.toml` and `package-lock.toml` are unchanged. The compiler and
            language server derive the same demand set from current authored source; editor
            requests overlay the unsaved document before resolving. Supplemental owner
            rustdoc is cached independently by exact owner package, crate, hidden-item mode,
            target, containment, pinned toolchain, and rustdoc format so distinct
            source-demand projections can reuse the expensive owner document without sharing
            facade aliases. Owner documents and ordinary projection records are pruned as
            independent cache families: ordinary projections retain four records, while
            exact package/version-deduplicated owner documents retain sixteen. A
            successfully parsed owner-cache hit is marked recently used before pruning, and
            a five-owner resolve therefore remains warm across runs. Unrelated
            dependency-workspace files are never cache-pruning candidates.
    - id: callbacks
      title: Concrete callback projection
      blocks:
        - type: rule
          id: rule.internals.projection.callbacks-preserve-bounds
          level: must
          since: null
          evidence:
            - rust-dependency-callbacks
            - projected-callback-open-bound
          markdown: |-
            Projection schema 17 represents a concrete Rust callback with its monomorphic
            inputs and output, `Fn`/`FnMut`/`FnOnce` multiplicity, synchronous or
            future-returning shape, retention, and `Send`/`Sync` bounds. The rendered
            dependency declaration uses the same Terrane function type shown by editor hover
            and signature help.

            The lowering boundary constructs the exact Rust closure and converts callback
            inputs and results at both free-function and projected-method calls. `FnMut`
            records Rust invocation multiplicity but adds no mutable Terrane capture cell.
            Open generic, higher-ranked, and lifetime-dependent callable shapes are
            declined; the compiler does not erase them into a universal callback value.
    - id: destination-results
      title: Destination-result proof
      blocks:
        - type: rule
          id: rule.internals.projection.destination-result-proof
          level: must
          since: null
          evidence:
            - projected-destination-results
            - projected-serde-json-result
            - projected-result-incompatible-template
            - projected-result-unsatisfied-bound
            - projected-result-unknown-bound
          markdown: |-
            Projection schema 25 retains one result-only Rust generic parameter, its
            recursive result template, and the complete rendered bounds, including
            higher-ranked lifetimes and associated constraints. Semantic analysis gathers
            the exact Rust representation selected by each written Terrane destination and
            batches those questions through the projection oracle against the resolved
            dependency workspace. Higher-ranked and nested bound paths are rewritten at
            every Rust path-root occurrence when a dependency uses a manifest alias. A
            public bound owner from a transitive crates.io package is pinned at its
            lock-resolved version and added as a featureless, default-disabled edge to probe
            and generated manifests. Existing transitive edges keep the resolved feature
            set, so the injected edge cannot widen it; ambiguous or non-registry owners
            decline explicitly.

            Projection-history format 3 records those exact bound-owner edges. Their
            deliberate manifest rewrite resolves offline without Cargo's `--locked` flag;
            integrity comes from the pre-injection manifest and lock in the projection
            identity plus the content-hashed exact edge list. Lowering names the concrete
            type argument and applies the existing recursive result conversion without a
            boxed universal value.
    - id: interface-impls
      title: Projected interface implementation proof
      blocks:
        - type: rule
          id: rule.internals.projection.interface-impl-proof
          level: must
          since: null
          evidence:
            - rust-dependency-callbacks
            - rust-dependency-nonclone-field
            - projected-interface-missing-member
            - projected-interface-receiver-mismatch
            - projected-interface-signature-mismatch
            - projected-interface-throwable-mismatch
            - projected-interface-provided-override-borrowed
            - projected-interface-provided-override-result
          markdown: |-
            Projection schema 39 records eligible Rust traits as nominal interfaces with
            canonical identity, receiver mode, required/provided membership, signatures,
            documentation, thread obligations, and foreign-type cloneability. Semantic
            conformance uses that descriptor metadata directly, while lowering emits one
            readable foreign trait implementation per adopted class-interface pair.

            The projection oracle accepts impl-shaped questions in addition to bound and
            call questions. Each complete implementation witness is compiled against the
            exact resolved dependency workspace and cached by its full source shape. A
            candidate interface enters the admitted artifact only after that witness
            succeeds; one failed witness declines only that interface and cannot block
            unrelated proven interfaces. Unsupported public traits and members remain in the
            dependency artifact with stable tooling-visible decline reasons.

            Trait admission accepts only plain `self`, `&self`, and `&mut self` receivers.
            Required borrowed parameters and required `Result` methods decline; equivalent
            provided methods remain callable through Rust defaults but cannot be overridden
            by Terrane classes. Thread obligations are retained in the artifact for later
            class-field enforcement.
    - id: async-sequences
      title: Async-sequence recognition and lowering
      blocks:
        - type: rule
          id: rule.internals.projection.async-sequence-state
          level: must
          since: null
          evidence:
            - rust-dependency-async-sequences
            - projected-async-sequence-borrowed-item
            - projected-async-sequence-open-item
          markdown: |-
            Projection schema 19 recognizes a concrete owned producer only when an async
            borrowed `next` returns `Result<Option<Item>, E>` and the type also supplies a
            consuming `close`. Its transferable step metadata preserves the concrete item
            type while lowering converts Rust `Some` and `None` into explicit item and end
            states.

            The generated native future is constructed before the async containment wrapper.
            The operation must be awaited directly, which keeps the mutable receiver borrow
            local to one suspension rather than storing it in a task. Borrowed results and
            open associated item types are declined before lowering.
    - id: async-sinks
      title: Async-sink recognition and lowering
      blocks:
        - type: rule
          id: rule.internals.projection.async-sink-state
          level: must
          since: null
          evidence:
            - rust-dependency-async-sinks
            - projected-async-sink-suspended-borrow
          markdown: |-
            Projection schema 19 recognizes an asynchronous borrowed `send(Item)` returning
            `Result<bool, E>`. Lowering converts the boolean into the compiler-owned
            `async-sink-outcome` with distinct accepted and remote-closed state while
            retaining Rust failure, cancellation, and deadline boundaries.

            The native future is constructed before containment and the call must be awaited
            directly, so the mutable receiver borrow spans one suspension. Any asynchronous
            or consuming projected receiver makes its opaque foreign type resource-owning;
            consuming `close` and `split` therefore participate in source ownership
            diagnostics.
    - id: chain-only
      title: Chain-only projection and containment
      blocks:
        - type: rule
          id: rule.internals.projection.chain-only
          level: must
          since: null
          evidence:
            - rust-dependency-chain-only
            - projected-chain-binding
            - projected-chain-return
            - projected-chain-capture
            - projected-chain-suspension
          markdown: |-
            Projection schema 20 marks chain roots, continuing members, and owned terminals
            explicitly. Semantic validation permits an intermediate only as the receiver
            subtree of another chain member in the same nested expression and emits one
            source diagnostic for every escape form.

            Lowering emits root and continuation calls without independent wrappers. The
            terminal applies argument conversion, panic and error containment, asynchronous
            awaiting, and result conversion to the complete Rust expression. Projection
            details shown by editor tooling identify the chain-only, non-escaping
            constraint.
    - id: resolved-graph-survey
      title: Resolved-graph survey evidence
      blocks:
        - type: markdown
          markdown: |-
            `terrane-rust-survey` is a compiler-independent consumer of the shared native
            analysis crate. It resolves an offline, frozen, target-filtered Cargo graph and
            reports only the selected package's dependency closure. The report preserves
            exact package versions and resolved features, registry checksums or complete
            path-package content fingerprints, normalized manifest identities, the pinned
            stable build and rustdoc toolchains, the rustdoc format, and the declared
            containment tier. Host-specific absolute paths and probe timings are not part of
            the portable semantic report.

            Compiler projection and surveys share the pinned format-57 JSON arguments and
            public-path index. Projection requests public Rustdoc only. The survey
            additionally retains hidden definitions so an item publicly reexported from a
            hidden module still contributes its full signature. The index excludes direct
            `#[doc(hidden)]` bindings. An ordinary private module that Rustdoc marks
            `is_stripped` remains a valid implementation owner for visible glob reexports
            and does not trigger `definition_hidden`; only a declaration or canonical
            ancestor carrying `#[doc(hidden)]` does. Reports identify this as the
            `public-bindings-with-hidden-definitions` policy. Public and canonical paths
            remain separate. A reexport whose declaration belongs to another crate names
            that closure owner instead of appearing to be malformed Rustdoc. Optional bound,
            call, and implementation questions are compiled against the same resolved graph
            and recorded as compile-only probe outcomes; surveying never executes package
            code.

            Versioned profiles in the native survey corpus materialize their declared Cargo
            inputs before invoking the survey and choose an enforced or explicitly
            unavailable containment tier. Enforced profiles require Linux bubblewrap and
            never silently downgrade to uncontained execution. The external profile runner
            combines native facts with a typed result for the exact named public conformance
            fixture: accepted runtime applications, expected declines, failed applications,
            and unavailable dedicated environments remain distinct. A missing dedicated
            runtime environment skips only that fixture; runnable offline package surveys
            are still retained. Successful Rust discovery or a native probe does not imply
            Terrane admission, generated-application compilation does not imply runtime
            success, and an unavailable runtime lane is never reported as a pass. The Godot
            profiles survey both the facade crate and its core reexport owner while
            retaining separate compile and dedicated-runtime classifications until the
            projection milestone supplies both forms of product evidence.
    - id: projection-gap-census
      title: Compiler-backed projection gap census
      blocks:
        - type: markdown
          markdown: |-
            `terrane projection-census` assesses one exactly pinned Rust package by running
            shared native discovery and the compiler's real projection resolver against the
            same Cargo graph. Its machine-readable report retains canonical and public
            paths, normalized package-relative source locations, native signatures,
            projected and declined operations, compiler explanations, structural-cause
            counts, graph identity, target, features, and exact toolchains. When a public
            declaration belongs to an external crate, the command surveys the one exact
            matching package in the resolved closure and assesses its recovered signature
            through the original facade path. External enum variants use their surveyed
            parent declaration. `core` definitions come from the pinned toolchain's
            `rust-src`; `std` paths retain pinned Rustdoc identity and item-kind evidence
            when a standalone definition is unavailable. None of these evidence paths makes
            a transitive or sysroot owner directly importable. Absent owners, ambiguous
            versions, failed owner surveys, namespace-only reexports, and declarations still
            absent after every evidence path remain distinct evidence. Static declarations
            are classified as projectable, deferred-contextual, unsupported-capability,
            namespace-path, or missing-metadata; the command does not infer package
            usability from successful discovery or import.

            Ordinary package analysis also writes an ignored
            `terrane-projection.generated.trn` beside `package.toml`. Projection remains
            complete over the discovered surface rather than being restricted to current
            imports. The file orders demanded unavailable declarations and a
            required-admitted index first, active compiler-owned Terrane source second, and
            the unreachable unavailable inventory last. Deterministic
            `Generated source unit` markers introduce the active source. Each marker starts
            an ordinary one-namespace virtual source unit, so a single physical artifact may
            contain `/deps/iced`, `/deps/iced/application`, and other namespaces without
            weakening the authored-source `S2002` rule. Package analysis splits and
            syntax-validates every unit before replacing the artifact; namespace dependency
            cycles do not prevent independent unit generation. Admitted nominal classes are
            emitted as active declarations. When Rustdoc provides the nominal shape of a
            demanded unavailable struct, enum, type alias, or trait, projection also emits
            an active class or interface skeleton under its public `/deps/<package>`
            namespace. Native generic and lifetime parameters that Terrane cannot yet
            express are retained as residual obligations in adjacent comments, and such a
            skeleton is not registered for lowering or treated as projection success.

            Each unavailable declaration retains its canonical path and exact decline
            reason. Demanded functions whose native shape can be recovered retain a
            deterministic partial contract: the full function shape, generic constraints,
            callback-bearing parameter contracts, and required callback method signatures.
            Demanded module/function name collisions retain a namespace-container contract
            rather than pretending that the module is callable. Requirement propagation
            follows every native declaration referenced by a required partial contract to a
            fixed point, using Rustdoc item identity before mapping back to public aliases.
            Referenced unavailable declarations move into the required section and identify
            the requiring contract; referenced admitted declarations appear in the
            required-admitted index. Cycles terminate by stable native identity. Current
            source imports and projected member calls annotate unavailable entries with
            file, line, and column demand sites. An unavailable but unreachable entry
            remains inventory evidence only; semantic analysis fails at a source location
            only when that application demands the entry. Rebuilding deterministically
            replaces demand annotations.

            The separate projection-census runner reads a versioned declarative package list
            and preserves each package's priority, target, feature configuration, deadline,
            and representative-workflow status. It classifies graph or tooling failures as
            environment failures and deadlines as resource-limited unproven results rather
            than projection declines. Full reports and reproducible Cargo workspaces remain
            outside ordinary compiler tests. Concise reviewed baselines preserve
            denominators, configuration coverage, ranked structural causes, and the
            distinction between exercised workflows and context-only evidence.

            The application projection-surface IR composes those root reports with the exact
            union dependency graph and a complete rendered public API for every resolved
            library package. One provisional YAML document contains high-plus-mid and full
            high-mid-low profile views while storing each exact package surface only once.
            Each profile retains root-specific feature and edge contexts instead of
            pretending that independently pinned roots necessarily form one Cargo-resolvable
            manifest. Complete public API extraction includes methods, associated items,
            trait and blanket implementations, reexports, constants, statics, macros, types,
            functions, and modules from pinned Rustdoc JSON. Failed surveys and packages
            without library targets remain explicit records. The rendered API is
            completeness evidence, not yet a stable Terrane semantic schema.
    - id: history
      title: Durable origin and replay history
      blocks:
        - type: rule
          id: rule.internals.projection.history-preserves-origin
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
          markdown: |-
            `terrane-dependencies.lock` is the package-level reproducibility input for the
            complete resolved Cargo graph. It includes recursive packages and seeds the
            compiler's generated dependency workspace. Generated private edges may make a
            unique locked recursive owner nameable to Rust lowering, but never add a Terrane
            source import root.

            `terrane-projection.lock` is durable API-surface history rather than a
            dependency graph or cache index. History format 3 records projected dependency
            members, removed members, injected exact private owner dependencies, content
            origin, rustdoc format, projection schema, cache identity, verified content
            hash, and the resolution events that produced that content.

            An exact-cache hit for unchanged content preserves the original local or
            published content-origin history instead of rewriting it as cache provenance. If
            the same format-3 identity, dependency surface, and private owner edge list
            later produce a different content hash, projection fails with a replay-mismatch
            diagnostic. Version changes retain removed member identities so a later missing
            import can be distinguished from a member that never existed.

            Removed-member history participates in every projected lookup tier: top-level
            names use their namespace entry, static members use `Type::member`, and instance
            receivers use `Type.member`. Declared members resolve first; only an absent
            declared member consults matching removal history and emits S2031 with the
            recorded version transition. A member absent from both the declaration and
            history remains the ordinary unknown-member diagnostic.

            History migration, origin preservation, and replay detection live in
            `apply_projection_history`; focused unit coverage includes
            `projection_history_keeps_content_origin_across_cache_hits` and
            `projection_history_migrates_provenance_and_detects_replay_drift`.
