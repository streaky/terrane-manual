documentation:
  status: complete
  title: Dependency projection resolution
  title-style: text
  summary: >-
    Describes the exact identities, ordered resolution sources, artifact validation, and disposable local history used to turn locked
    Rust dependencies into one reusable compiler projection.
  tags:
    - compiler-internals
    - dependencies
    - projection
    - artifacts
    - caching
    - reproducibility
  sections:
    - id: identity
      title: Exact cache identity
      blocks:
        - type: rule
          id: rule.internals.projection.cache-identity-is-exact
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
            - rust-dependency-reqwest
          markdown: |-
            A projection cache identity covers the package manifest,
            `terrane-dependencies.lock` complete resolved graph, effective compilation
            target, stable build toolchain, nightly rustdoc toolchain, rustdoc JSON format,
            projection schema, containment tier, effective Cargo configuration, and content
            identities of transitive local path and patch dependency inputs. Fields are
            length-delimited before hashing; file timestamps do not establish source
            identity. Registry packages retain Cargo's checksum/lock identity.

            The effective target is selected from `CARGO_BUILD_TARGET`, then Cargo's
            `build.target`, then the pinned stable compiler's host. The project-local cache
            uses the stable filename `.trn/dependencies/projection.json`. Its embedded
            identity must match current inputs; a mismatch regenerates the projection and
            atomically replaces the file rather than creating another hash-named record.
            Matching records still require a valid content hash.

            Native bound, call, and implementation probe reports share
            `.trn/dependencies/oracle.json`. Its identity-scoped batch maps preserve useful
            answers for different question batches; changing the identity discards the old
            reports. Malformed or obsolete cache JSON, including a body incompatible with
            the current schema under the same identity, is a cache miss and regenerates
            native proof rather than permanently failing analysis. Actual filesystem I/O
            failures remain errors. Writes replace the complete file atomically; a failed
            write or replacement removes its temporary file without altering the old target.

            Each nonempty oracle operation holds an exclusive workspace file lock across
            cache loading, generated probe replacement, Cargo execution, and cache
            publication. Cargo's own build lock does not protect generated probe inputs: a
            concurrent editor or CLI must not remove another batch's sources while its
            compiler waits, or publish evidence for a different batch.

            Sysroot `core` Rustdoc surveys reuse
            `.trn/dependencies/rust-survey/sysroot/core/<target>/core.json` only when the
            adjacent `.artifact-identity` matches the stable build toolchain, Rustdoc
            nightly, JSON format, and target. A missing or mismatched marker automatically
            removes that owned core cache directory before regeneration. Unrelated `.trn`
            artifacts are preserved. Strict schema validation runs before publishing the
            current marker, so failed generation or decoding cannot bless stale data. Every
            core cache read, invalidation, generation, and marker publication holds an
            exclusive cross-process file lock at `core/<target>.lock`. The lock is outside
            the replaceable directory and is never removed during invalidation, preserving
            one lock identity across processes. A current marker does not authorize
            malformed data: missing or undecodable cached JSON regenerates once under the
            same lock. Fresh generation and decoding failures remain errors; filesystem
            permission and other I/O failures are not treated as cache misses.

            Manifest, lock, target, and toolchain identity construction lives in
            `crates/terrane-compiler/src/rust_interop/projection/cache_identity.rs` under
            `cache_identity` and `selected_target`. The resolution transaction combines that
            identity with local source and effective configuration fingerprints from
            `crates/terrane-compiler/src/cache_identity.rs`. Supplemental owner Rustdoc
            caches use the same local-input fingerprint. The identity is deliberately
            environment-specific when graph, source, configuration, target, toolchain, or
            containment differs; it is not part of the reviewed semantic surface fixture.
            `target_reads_cargo_config` covers target-sensitive construction, while
            `migration_detects_replay_drift` proves that one exact identity cannot admit two
            content hashes.
    - id: resolution
      title: Ordered resolution transaction
      blocks:
        - type: rule
          id: rule.internals.projection.artifacts-never-widen
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
            - rust-dependency-reqwest
          markdown: |-
            Projection resolution is one transaction owned by `resolve`. It checks the exact
            project-local cache first, records bundled distribution as explicitly skipped
            while no release channel exists, attempts a configured published artifact, and
            otherwise generates rustdoc locally with the pinned nightly toolchain. Every
            attempted source records a status and reason, and the final projection records
            its resolution outcome.

            Initial Cargo resolution updates only the private
            `.trn/dependencies/Cargo.lock`. The package's `terrane-dependencies.lock` is
            published after bound-owner dependencies are resolved, on the exact-cache,
            published-artifact, and local-rustdoc paths. Publishing the intermediate
            manifest-only graph would temporarily remove synthetic root dependency edges.
            Failures before this completion point must not replace an existing package lock
            or create an incomplete one. An unchanged complete graph is not rewritten.

            Changed complete locks are written to a temporary file in the package directory
            and atomically renamed over the published lock. Existing readers retain the old
            complete snapshot; new readers see the new complete snapshot. Ordinary write or
            rename failures leave the published target intact and attempt to remove the
            temporary file. This is atomic publication, not an fsync-based power-loss
            durability guarantee.

            Publication replaces the lock's directory entry with a regular file. A changed
            lock replaces a symlink rather than updating its target, and the previous file
            mode is not preserved. The new file uses normal creation permissions
            (`0666 & umask` on POSIX); directory permissions govern replacement, so a
            read-only file can still be replaced when its directory permits it. Keep the
            published package lock as a regular file rather than using symlink or file-mode
            preservation as a publication contract.

            Abrupt termination before rename can leave a sibling named
            `.terrane-dependencies.lock.<pid>.<sequence>.tmp`. It is not a published lock
            and is not used to seed later resolution. After ensuring the writer has exited,
            the leftover file can be deleted. Terrane does not automatically prune these
            files: PID reuse and concurrent publishers make age or PID checks insufficient
            proof that a temporary file is abandoned. Do not commit such residue.

            Complete instance and static member inventories are canonicalized before hashing
            and publication, including operations recovered from external trait
            implementations. Rustdoc map iteration order must not change same-input cache
            content; actual signature changes still participate in the hash and replay
            validation.

            The public `projection.rs` surface owns shared metadata and projection queries.
            Implementations live under `rust_interop/projection/`: `resolution.rs` owns this
            transaction; `artifacts.rs` owns artifact validation and cache writes;
            `cargo_workspace.rs` owns Cargo execution, containment, metadata, and locks;
            `reexports.rs` owns supplemental Rustdoc discovery; `dependency_owners.rs` owns
            reachability, dependency binding, canonical naming, and Cargo-root rewrites;
            `namespace_overlays.rs` owns overlay discovery and relocation. Rustdoc admission
            belongs to `items.rs`, `methods.rs`, `interfaces.rs`, `functions.rs`, and
            `types.rs`; unavailable partial contracts belong to `partial.rs`. Generic
            callable selection remains in `callable.rs`, distinct from complete
            function-signature admission. Add policy to its owning module, not the public
            parent. These boundaries do not alter the serialized projection schema or the
            public `projection::resolve` entry point.

            Owner-local regressions share public-metadata constructors through the test-only
            `test_support.rs` module. Tests import those fixtures directly; the public
            parent does not reexport private implementation helpers to make them testable.

            The initial projection and late explicit-trait recovery use the same named
            normalization transaction: declared and bound Cargo roots are rewritten before
            reachability and canonical naming, with error identities checked afterward. Late
            recovery cannot bypass these consistency checks.

            Associated owners with a Rustdoc resolved-path identity use that exact `Id`. A
            substituted generic owner no longer has a graph-local identity, so the current
            fallback compares canonical path segments without allocating joined paths and
            accepts only a unique candidate. That fallback is still linear in the document's
            path count; a shared reverse index is not implemented or a committed follow-up.
            Revisit its projection-context plumbing if measured generic-associated-owner
            resolution cost warrants it, without changing deterministic ambiguity rejection
            or persisting document-local IDs as global native identities.

            A published artifact is admitted only when its envelope format, cache identity,
            target, stable and rustdoc toolchains, rustdoc format, projection schema, and
            payload identity match. Dependency names, packages, exact versions, and effects
            are checked separately from feature/default-feature metadata and each
            dependency's target condition. The SHA-256 content hash must agree with both the
            envelope and the projection payload.

            Missing or rejected published artifacts fall back to local rustdoc; validation
            never weakens a mismatch into a nearby reusable result. A verified published
            result is written into the same exact local cache used by later offline
            resolution. The focused unit test `remote_requires_exact_inputs` exercises the
            artifact boundary and its distinct mismatch causes.
    - id: public-paths
      title: Canonical public paths
      blocks:
        - type: rule
          id: rule.internals.projection.public-paths-are-canonical
          level: must
          since: null
          evidence:
            - namespace-qualified-projected-object-identity
          markdown: |-
            Projection metadata resolves every public item through a substantive reachable
            Rust path before considering paths beneath a `prelude` module, then uses
            shortest depth and lexical ordering as tie-breakers. That selected path supplies
            both the callable Rust path and the Terrane namespace and object identity; the
            item's deeper defining-module or convenience-prelude path cannot override a
            canonical public re-export.

            `public_surface` discovers public definitions, named re-exports, glob
            re-exports, and external owner prefixes in one traversal per rustdoc document.
            Local named-module re-exports recurse under the public alias. The resulting
            public-path map is reused for item projection, while external owner evidence is
            retained separately so a facade alias cannot leak into an unrelated dependency.
            `project_rustdoc` replaces rustdoc's defining paths with the applicable declared
            owner or facade-fragment paths before creating projected items, so compiler
            lookup, generated Rust, editor tooling, and local projection-cache history
            expose one matching surface. Associated functions are recorded on their owning
            foreign type and emitted as Terrane static members rather than duplicate
            namespace functions. A single admitted concrete generic instantiation keeps the
            readable type name; only multiple admitted instantiations require canonical hash
            suffixes. Cached history records instance members as `Type.member` and static
            members as `Type::member`, so method-level surface loss is visible while the
            local cache remains.

            Projection schema 63 also follows source-demanded public bindings whose concrete
            definition is owned by another package in the resolved Cargo graph. External
            module and glob re-exports preserve every public prefix long enough to expand
            the owner's items; the final path preference is applied only after that
            expansion. Supplemental owner rustdoc retains documentation-hidden generated
            definitions, but those definitions become candidates only when an explicit
            `/deps` import demands the facade binding. Owner documents are generated and
            parsed at most once per projection run. Declared dependency paths may rewrite a
            signature to another declared owner, while facade aliases are scoped to their
            provider fragment. Unmapped private owner paths remain owner-rooted and are
            declined by ordinary reachability checks; builtin, ambiguous, or unavailable
            owners are skipped or declined rather than guessed. Emitted Rust continues to
            name the declared facade.

            Source demand is part of projection identity and durable lock contents. Adding,
            removing, or renaming a `/deps` import can intentionally change the lock even
            when `package.toml` and `package-lock.toml` are unchanged. The compiler and
            language server derive the same demand set from current authored source; editor
            requests overlay the unsaved document before resolving. Supplemental owner
            rustdoc is cached independently by exact owner package, crate, hidden-item mode,
            target, containment, pinned toolchain, and rustdoc format so distinct
            source-demand projections can reuse the expensive owner document without sharing
            facade aliases. Each distinct owner crate has one stable record under
            `.trn/dependencies/owner-rustdoc/<crate-name>.json`. Package/version, target,
            containment, hidden-item mode, toolchain, and format contribute to the identity
            stored inside that record. Mismatches regenerate and atomically replace it;
            distinct owners do not evict each other. Legacy hash-named projection and owner
            records are removed without touching unrelated dependency-workspace files.
    - id: callbacks
      title: Concrete callback projection
      blocks:
        - type: rule
          id: rule.internals.projection.callbacks-preserve-bounds
          level: must
          since: null
          evidence:
            - rust-dependency-callbacks
            - projected-callback-open-bound
            - projected-generic-call-mismatch
          markdown: |-
            Projection metadata represents a concrete Rust callback with its monomorphic or
            correlated generic inputs and output, `Fn`/`FnMut`/`FnOnce` multiplicity,
            synchronous or future-returning shape, retention, and `Send`/`Sync` bounds. The
            rendered dependency declaration uses the same Terrane function type shown by
            editor hover and checked by semantics.

            Projection may retain open callback input and result generics when a blanket
            implementation proves their relationship. Compatible blanket implementations
            that differ only in destination-selected callback parameters become one deferred
            callable contract; the call-site function shape selects the concrete parameters.
            Semantics jointly unifies every callback argument before lowering and rejects
            incompatible correlations as a Terrane diagnostic rather than a Rust backend
            failure.

            The lowering boundary constructs the exact Rust callback adapter and converts
            inputs and results at free-function and projected-method calls. Exact native
            callback parameter spellings retain higher-ranked borrows through
            specialization; a source `ref` parameter is recorded separately and receives a
            temporary converted Terrane value for that invocation. `FnMut` records Rust
            invocation multiplicity but adds no mutable Terrane capture cell.

            Owning callback metadata retains `Box` versus `Arc` separately from invocation
            authority, exact native input spelling, retention and marker bounds. Resolve
            provider aliases after cross-dependency enrichment, and install the canonical
            plan in consumer parameters before rendering declarations. `Arc` admits only
            shared invocation; a carrier is not proof of exclusive access. Returned weak
            registration tokens stay opaque native values with their original identity.
            Publish closed weak handles as real backing-owner declarations, retaining exact
            principal/auto-trait bounds and cloneability rather than reinterpreting them as
            callable adapters. Canonicalize equivalent alias/direct Rust storage at call,
            return and lowering boundaries; open alias binders are not closed owners and
            source-only placeholders cannot carry native identity proofs. Ordinary native
            argument validation, not only callable signature matching, compares canonical
            foreign storage when both sides have a closed native application. Opaque
            chain-only values without such an application retain their existing admission
            and expression-lifetime rules; the check must not invent a closed representation
            for them.

            Stateful callable erasure with borrowed inputs quantifies their lifetimes at
            each invocation. Mutable inputs preserve native scalar widths and object
            identity, never a converted temporary. Runtime carrier discovery covers helper
            signatures as well as source expressions. Borrowed parameters cannot escape into
            captured storage. Owning native callback result conversion is not implemented
            and is rejected recursively at projection. Apply that reverse-conversion
            restriction to callback parameters too: a native callback passed into source
            cannot reuse an input-only owning adapter. Owning blanket selection retains or
            rejects its full requirements; it must not select the callable signature while
            dropping additional implementor constraints such as `Debug` or conditions on
            another type parameter. Unsupported blanket obligations discard that candidate,
            not unrelated supported candidates; preserve a targeted decline when no
            supported candidate remains.

            Check owning-adapter result ownership before source type projection erases
            native references. Follow output aliases and reject borrowed trait type
            arguments rather than substituting their referents as owned results. This
            restriction belongs to owning erasure; do not apply it to the existing raw
            higher-ranked callback graph, which retains the exact native result. Inspect
            aliased payloads recursively through tuple, slice and array shapes. Unnormalized
            associated results need separate ownership proof and decline conservatively.
            Ordinary and borrowed-input owned mutable carriers share one code generator for
            capture bounds, locking and clone-forks-state behavior; borrowed-environment and
            consuming-only carriers retain their distinct ABIs.

            Collection path reconstruction failures involving already-classified owning
            callbacks retain a collection-callback decline reason. Reuse recursive callback
            containment metadata for vectors, maps and sets, including optional payloads; do
            not infer the diagnostic category from an incidental renderer error string or
            change admission for successfully reconstructed collection paths.

            Projection metadata retains lifetime-bearing producer results, projected inputs,
            nested sequence elements, selected terminal-alias defaults, and original native
            generic argument order recursively when a proven external conversion authorizes
            the selected higher-ranked terminal. Current exact-result semantics assign the
            scoped function's identity to a same-producer-type graph, permit same-type
            region-local bindings and homogeneous aggregates, apply ordinary move checking,
            and reject local lenders, unresolved source parameter types, mixed list
            elements, storage, escape, capture, suspension, or incompatible convergence.
            Lowering passes a supported named exact-result callback directly to the proven
            native blanket and therefore preserves the callback's invocation lifetime and
            native producer type without copied bodies, erased storage, a fabricated native
            trait implementation, or `'static` promotion. When one native function combines
            several callbacks over shared generic state, callback parameters retain their
            original Rust generic identities, generated facade wrappers remain generic, and
            call-site callback arguments are left to exact Rust inference rather than
            emitted as unresolved named types. Defaulted native arguments are selected from
            the resolved terminal alias and emitted in native declaration order; they are
            never guessed from a package or operation name.
    - id: expression-macros
      title: Compiler-checked native expression macros
      blocks:
        - type: rule
          id: rule.projection.expression-macros
          level: must
          since: null
          evidence:
            - projected-expression-macros
            - projected-macro-argument-mismatch
            - projected-macro-result-mismatch
            - projected-macro-token-mismatch
            - projected-macro-callable-value
            - projected-macro-reference-conversion
            - projected-macro-supplemental-owner-leak
            - projected-scoped-expression-macros
            - projected-scoped-macro-token-mismatch
          markdown: |-
            ProjectedKind::Macro retains a native macro identity separately from ordinary
            functions. Its generated variadic callable surface describes expression argument
            positions, not a Rust function signature. Public re-export paths remain
            selectable beneath the corresponding macros namespace. Re-export discovery
            traverses the declared crate document, not supplemental owner documents:
            supplemental owners do not implicitly export their unrelated macros through the
            declared facade.

            Semantics selects a concrete native result from the source destination and
            preserves literal tokens and nested native operations. Independently closed
            invocations submit their native boundary types through the shared pinned Rust
            oracle. Lifetime-coupled callbacks retain the complete producer/macro graph for
            final native checking instead: detached higher-ranked assertions would quantify
            unrelated lifetimes, and partially selected renderer generics must remain
            available for Rust's joint inference. No lifetime-bearing graph is admitted
            without successful backend validation.

            The destination-constrained macro proof is authoritative, including generic
            expansions that require that context. Only failed result proofs trigger a
            detached expansion proof for diagnostic classification. Argument and
            token-pattern failures identify the source invocation; destination-result
            failures identify the incompatible result contract. Diagnostic messages do not
            expose generated probe identifiers or forward internal Rust compiler renderings.

            Lowering emits the native macro invocation in the complete expression and closes
            its contextual result through ordinary Into conversion, including a
            lifetime-coupled callback's exact Element destination. Concrete annotations
            erase probe-local lifetime names to inferred lifetimes, never to static storage.
            It must not pre-evaluate arguments into temporaries, replace the invocation with
            a helper function, parse macro matchers, or erase native result identity. Macro
            operations are invocation-only, not first-class function values. Explicit
            reference arguments require identity-preserving native representation;
            conversion through a copied temporary must not replace a native loan.
            Conformance observes repeated and conditional argument evaluation, heterogeneous
            and variadic inputs, zero-argument matching, nested calls, public re-exports,
            same-name function coexistence, and mutation of the original native object
            through a reference. Real pinned Iced conformance additionally observes nested
            text, row, and column macros, ordinary borrowed text inputs, recursive borrowed
            iteration over native sequence fields with identity-preserving elements,
            widget-tree topology, and zero native-state traversal clones. The CLI package
            regression suite verifies that malformed scoped macro tokens fail in the
            complete callback's native backend validation. A scoped callback's consumer
            selects its native destination even when an ordinary widget builder produces a
            different type that closes through Into. Unselected native generic arguments
            remain inferred within the complete graph rather than becoming undeclared Rust
            type names in local annotations.
    - id: borrowed-interior-graphs
      title: Expression-scoped borrowed interior graphs
      blocks:
        - type: rule
          id: rule.projection.borrowed-interior-graphs
          level: must
          since: null
          evidence:
            - projected-borrowed-interior-graphs
            - projected-borrowed-interior-binding
            - projected-borrowed-interior-return
            - projected-borrowed-option-shared-mutation
            - projected-borrowed-option-shared-direct-mutation
            - projected-borrowed-option-shared-chaining-mutation
            - projected-borrowed-option-mutable-mutation
          markdown: |-
            Shared and mutable native interior receivers remain exact Rust borrows inside
            one nested operation graph. Canonical projected owner identity permits method
            and field lookup through each borrowed edge; generic selection propagates from
            callback inputs and owned destinations through the graph. Native optional
            borrows support cloned, map, and and_then terminals. Cloned explicitly creates
            an owned snapshot; traversal itself never clones the native root or referent.
            Mutable optional referents preserve their native callback input mutability.
            Source callbacks that mutate a native referent use the exact mutable borrow ABI,
            while read-only callbacks can observe that same referent without copying. The
            tracked borrowed-interior conformance case exercises real HTTP header values
            through callbacks imported from another source unit: absent edges remain absent,
            mutation updates the original, read-only observation preserves it, and an
            explicit cloned snapshot remains independent of subsequent mutation.

            Callback validation uses the selected operation's concrete parameter metadata,
            not its unspecialized declaration. Specializing source callable arguments
            preserves the native callback's reference shape and borrow authority while
            retaining the source callable's invocation mode. A source callback that mutates
            a borrowed parameter is rejected with T0139 when the native callback supplies a
            shared reference. This applies to map and and_then; a mutable receiver permits
            the same mutation. Mutation analysis follows the defining source function and
            resolves imported helpers and callable aliases to canonical function spans.
            Parameter write requirements reach a finite fixed point across source-call
            chains and cycles before binding mutability and callback checks are finalized.
            Ordinary native reference parameters retain that selected ABI, but mutation
            requires explicit `mutable ref` source authority; plain `ref` remains read-only.
            Inference propagates the implementation requirement without upgrading a written
            contract. Cached imports and local callable aliases preserve the defining
            function's authority and exact native borrowing ABI.

            The selected callback input contract also drives its emitted callable ABI.
            Compatible stored shared-invocation callables are borrowed directly for
            non-retained synchronous native callbacks. They are not first erased into a
            tuple-based consuming carrier, which would fix an input lifetime outside its
            invocation. This adaptation does not add reference variance to ordinary source
            callable slots or copy exclusive authority.

            Lowering evaluates each root once and preserves mutable access to the original
            interior. Owned results and completed side effects may leave an expression. Open
            joint-inference graphs must still terminate within their expression; they cannot
            be bound, captured, stored, or retained across suspension. Independently
            admitted local native loans instead retain their actual lenders and follow the
            lifetime rules below. Exact invocation-scoped callback results keep their
            distinct higher-ranked native boundary.
    - id: supplied-associated-results
      title: Supplied contracts and native associated equations
      blocks:
        - type: markdown
          markdown: |-
            Authored associated declarations retain declaration identity and bindings in
            descriptor contracts and exported metadata. Source interface applications carry
            their complete binding set; ordinary typed implementations connect native calls
            without a second mapping language. Associated slots do not inherit ordinary
            source-generic clone bounds merely because lowering represents them as protocol
            parameters. Owning interface protocols also retain ownership when every method
            borrows its receiver.

            Projection persists symbolic implementation equations with canonical
            trait/member identity, an exact owner pattern, trait arguments, and the
            right-hand-side type. Recipe collection does not recursively resolve an
            incomplete Rustdoc graph. Call-site normalization substitutes the selected
            inputs, retains reference versus value owners, and follows finite equation
            chains with stack-linked recursion guards. Unknown, conflicting, and recursive
            queries remain explicit failures. Conditional recipes are admitted through the
            existing rustc oracle's exact associated equation, retaining native predicate
            selection rather than treating every structural blanket match as applicable.
            Borrowed associated owners keep their reference depth, mutability and static
            lifetime in symbolic templates. Only unconstrained declared impl lifetimes are
            normalized as input binders; restrictive lifetimes are never erased into an
            ordinary local loan.

            Native proof includes the normalized associated equality, not just membership in
            the declaring trait. Obligations remain tied to their original input parameter
            even when more than one binder selects the same concrete type. Native interface
            adapters bind inherited members using the declaring associated slot's trait, not
            a derived facade's trait path. Source protocol identities must not be rewritten
            to their native boxed-trait crossing representation.

            Native chain terminals and operation-owner binders inferred through another
            input's trait equality retain their joint graph-selection question. Their owner
            and output can be selected together with an executor or terminal destination, so
            they are not resolved by a detached input-selected associated query. Ordinary
            input-selected operations retain their exact associated equality obligations.
    - id: native-receiver-regions
      title: Native owners, receiver views, and bounded regions
      blocks:
        - type: markdown
          markdown: |-
            Receiver discovery retains the exact owning native type. Generic arguments and
            canonical Rustdoc `Deref::Target` declarations provide candidate views; rustc
            must prove the exact `Deref` and, separately, `DerefMut` obligations. Moving a
            target or forwarding a boxed consuming receiver additionally requires the
            corresponding native call proof. Pointer names do not grant capabilities. Nested
            receiver discovery preserves direct-owner member precedence. In particular,
            cloning a smart-pointer owner retains that owner's identity rather than
            selecting a pointee's unrelated `Clone` operation.

            Admitted lifetime-bearing nominal results use structured invocation-scoped
            metadata instead of becoming lifetime-erased foreign values. Producer methods
            and free functions use the same owner and result machinery. A borrowed view's
            methods, cloned view, and nested results retain its lenders; a native trait
            proof is not an outlives proof.

            Apply projected method contracts after collecting declarations and before
            initial source-binding inference. Scoped native results retain their nominal
            family at that provisional stage so a consuming `Self` continuation can expose
            its next method, including an async terminal with an associated result. The
            provisional template is not a concrete storage or escape permission; native
            selection and lifetime validation still close the call.

            Provisional families resolve members but do not finalize stored result types. A
            lender-rooted continuation waits for its producer's concrete owner and lifetime
            facts before its own selection is cached. One-stage and multi-stage named chains
            therefore retain the same declared lender contract; chain depth does not create
            an expression-only restriction.

            A family may be shared by lender-rooted views and expression-only producers. The
            actual producer graph determines expression-only continuation, independently of
            which path first published the shared family. Retain the complete fluent graph
            for joint native inference rather than inventing a lender for an open producer
            or weakening the restrictions on independently stored views.

            The compiler records receiver and parameter borrow lifetimes and correlates them
            with result lifetimes. Named lifetimes must match their actual sources, static
            storage is distinct, and elided lifetimes follow the native receiver rule rather
            than an arbitrary argument. Unknown graphs reject instead of choosing a
            convenient region or inventing static storage. For anonymous-lifetime
            implementations returning `Self`, the method owner and returned value retain the
            same nominal binder vocabulary before call-site instantiation. An anonymous impl
            spelling must not leave a declaration lifetime unmatched in an otherwise valid
            consuming builder or awaited continuation.

            Lender provenance distinguishes stable named storage, static literal backing,
            and reference-returning helpers from temporary owned expressions. Computed
            expressions and awaited owned results must be bound before lending them to a
            native result whose lifetime depends on that input. They receive source-level
            T0119 rather than a Rust backend lifetime error. An inline await passed to an
            ordinary synchronous native operation with an owned result remains supported.

            A named field or indexed element is a lender place, not a temporary value:
            follow its stable root through nested fields, indices, grouping, and explicit
            references. A computed owner such as `(make-config;).sql` remains temporary;
            selecting a field or element does not extend that owner's lifetime. The same
            root classification applies when correlating borrowed callback results. Native
            field borrowing must also retain the receiver's physical storage authority.
            Guard-backed fields use the canonical operand-local read plan; direct guard-free
            payload access must not extend aliased receiver guards across sibling formatting
            operands or replace shared-async handles with `self`.

            Live lender checks compare canonical owner-and-projection paths for field/index
            replacement, explicit field moves and mutating member calls. Reaching values and
            backwards liveness follow execution edges, not lexical offsets: mutually
            exclusive branches, terminating paths and observer rebindings do not retain an
            old loan. Dependent aliases and fluent continuations retain the original lender
            paths until their own last reachable use, including through loop back edges.
            Conflicting writes report T0240 even when the next use appears earlier in the
            source. Distinct sibling fields and whole-lender moves, replacements or mutation
            after the last dependent use remain permitted.

            Every loan-carrying reassignment establishes a fresh producer and lender set;
            killing the previous value does not leave the new lender unprotected. Predicate
            switches evaluate their case predicates in order without an implicit selector.

            Current Rust storage still uses one binding across assignments. If that binding
            flows into an alias, the alias conservatively retains lenders from subsequent
            reachable assignments too, including assignments through another local and
            aliases created on branches or through native helper calls. The flow analysis
            retains transitive alias-to-storage dependencies rather than only the current
            producer's roots. Conflicting writes to those newer lenders report T0240 while
            the alias is live. This does not revive a value killed before the alias was
            created, and post-last-use mutation remains valid.

            Current `try` lowering captures its body and catch clauses in one closure.
            Native loans therefore keep captured lenders stable across that whole boundary,
            including a catch whose body is statically unreachable and loans created inside
            the try. Conflicting body/catch accesses report T0240 rather than leaking a Rust
            borrow error. Acquire and consume the loan within one non-conflicting boundary,
            or move the lender mutation outside it. A non-Copy value acquired inside the
            boundary is consumed from its owned availability slot, not by copying a
            reference. Consuming and rebinding an outer non-Copy value cannot restore the
            caller's binding for a later use without an intervening dominating rewrite;
            these forms report T0058. The rule includes consuming source-class receivers and
            Clone-only scoped natives. An unconditional rewrite before every later use,
            including a rewrite within the receiving catch or finally clause, establishes a
            new value; a conditional rewrite does not discharge the other path. A rewrite
            and subsequent read within the same non-repeating body, catch or finally retain
            ordinary local ownership behavior, as do proven Copy values and non-conflicting
            last-use/finally paths. These are current closure-lowering limits, not a claim
            that Rust could never express the operation.

            These checks apply to actual transfers. An ordinary argument whose canonical
            Clone conversion preserves the original binding does not consume it, including
            after a rewrite in a body, catch or finally clause. Explicit moves still require
            restoration before later reads, including when a replacement expression throws.

            Inferred and declared local lists and tuples of native views retain their
            elements' lender provenance, including through aliases, list append and map set
            operations. Copying a Copy view into a collection protects its original lender,
            not the independent local holding that copy. A non-Copy view transfers once;
            reusing that moved local reports `T0058`. Moving or mutating the lender before
            the collection's last use reports `T0240`; using it afterwards remains valid.
            Straight-line rebinding and unread nested stores of an independent Copy-view
            local use separate reaching storage, preserving RHS evaluation without tying an
            earlier snapshot to the replacement lender. Passing a view by value carries its
            lender lifetime but does not borrow the local's address. Captured,
            address-observable and live control-flow-joined storage retains its existing
            stable storage contract. Inferred scoped families and written native types
            compare by canonical native identity and type arguments without weakening
            reference exclusivity or lifetime checks. Declared collection storage also
            retains inferred native lifetime metadata rather than materializing a static
            projection alias. Native method lookup also recognizes the canonical expansion
            of a recorded alias while retaining its selected forwarding target and error
            conversion; normalizing a wrapper alias does not turn its methods into source
            methods. Generic aliases retain their native constructor's methods after
            expansion, while argument compatibility remains checked separately.
            Throwing-effect inference follows the selected callable contract too: a
            forwarded native error remains catchable through a source wrapper around an
            alias.

            Native element demand follows nested value and reference loop bindings, not only
            direct member calls elsewhere. Value iteration copies proven Copy views and
            preserves the collection for later reads or another loop. Stable collection
            storage is borrowed; a value-loop body that changes the collection uses an
            independent snapshot of its elements. Reference iteration preserves the native
            receiver's borrow: mutating its collection reports `T0059`. Mutable-reference
            iteration acquires its loan before the element binding becomes live. Accessing
            the collection independently while that exclusive element loan remains live
            reports `T0149`. Each loop binder has its own declaration identity while live
            function-owned post-loop values retain their reaching joins. A live join of
            incompatible native borrow/storage forms reports `T0119`, rather than generating
            an invalid carrier. Lender mutations remain prohibited while a dependent element
            is live.

            Returning a collection of views borrowed from a local reports `T0240`.
            Constructing a returned collection from a lender parameter is not currently
            supported (`T0119`). This is not a blanket prohibition on source-helper returns:
            passing through an existing view or view collection remains supported, as does
            returning a single view borrowed from a reference parameter. The result retains
            its lender obligations at the call site.

            Completion storage is selected from the same transfer facts as validation. A
            dominating rewrite solely in `finally` establishes the value observed after
            completion, not only rewrites in the try body. Actually transferred by-value
            captures can include strings, collections, tuples and optionals as well as
            source classes; a body-only rewrite does not restore a genuinely consumed value
            for a separate finally closure's read. Clone-preserving conversions and ordinary
            non-consuming observations do not force ownership-slot storage. Completion
            storage also accounts for reads after the whole `try`, not only reads inside a
            handler. Accepted dominating rewrites restore the same slot used for later
            reads, including finally-only rewrites and generic values. Reusable function
            values are not treated as consumed merely by being called. Canonical native Copy
            evidence also applies to inferred scoped-view locals, indexed reads and
            arguments; an indexed Copy read does not consume its containing collection.
            Selected parameters enter the same completion-slot representation as locals.
            Anonymous callable bodies start with independent return and loop-control state
            even when declared inside try/catch/finally. A guaranteed inner finally rewrite
            is visible to an outer catch; a conditional rewrite or a read before restoration
            still reports `T0058`. A throwing replacement expression does not establish a
            restored value on its failing path. Consuming a non-Copy native value directly
            from an indexed collection place reports T0101. Obtain a named view from its
            lender before invoking its consuming operation; indexed observations and proven
            Copy consumption remain supported.

            A shared-reference name or field may be protected by an operand-local receiver
            guard. A lifetime-bearing native result or borrowed native text from such a
            receiver is rejected with T0119 for both stored and inline use: its native
            borrow would outlive that guard. Ordinary `ref` receivers and owned scalar
            results from shared receivers remain valid.

            Lifetime-bearing native values cannot be stored in source class fields,
            including optional or nested field types. This is checked with T0101 even when
            the class is never constructed. Owned projected record storage that lends a
            native view only for an individual call is not itself a stored invocation-scoped
            view.

            Reassigning a native view from a source helper preserves canonical native
            identity and the actual lender origins. A compatible helper result can replace a
            prior view even when its inferred scoped region differs; later lender moves and
            mutations remain subject to the ordinary loan checks. This is not a general
            conversion between distinct native families or native payload arguments.

            Current storage limits remain narrower than direct Rust borrowing. A native
            result borrowing a literal can be consumed inline, but retaining that result in
            a local binding is not supported; first bind the literal to a named string and
            borrow that local instead. Stored native results rooted in the implicit `this`
            receiver or its fields also remain unsupported and receive T0119. These are
            provenance limitations, not a claim that a literal or `this` is a temporary
            owner. An explicit borrowed-parameter helper can supply a supported external
            lender for field access.

            A selected consuming method moves a named non-Copy invocation-scoped native
            receiver, just as a consuming free-function argument does. Grouping the receiver
            does not hide that binding. A later use receives T0058; scoped values do not
            need an ordinary resource-object descriptor for move tracking. Canonical native
            Copy evidence permits Rust's implicit receiver copy, but Clone alone does not.
            Copy duplicates the view, not its lender or lifetime: escape, capture,
            suspension, and conflicting-mutation restrictions still apply.

            `projected-query-chain` exercises stored local-loan continuations.
            `native-query-with-arguments` pins provisional-family inference with a moved
            native argument, an owned producer, and an asynchronously suspended terminal.
            `native-deferred-executor` remains the complementary real-dependency guard for
            open owner and associated-result selection.

            Open native producers without a proven input lender retain the expression-only
            joint-inference path; admitting local native loans does not erase those
            restrictions. Owner discovery follows both free-function and method results,
            preserving generic substitutions when normalizing their lifetime-bearing source
            families. Type compatibility compares native representations independently of
            region provenance; destination and escape validation still enforce each loan.

            Borrowed callable environments retain their existing erased runtime carriers.
            Canonical last-dependent-use metadata selects an explicit release point for a
            local carrier so its captured loans do not remain live merely because the
            carrier has drop glue. Transfers follow binding identity, and release points
            respect enclosing branch and loop boundaries. Abrupt exits use normal lexical
            destruction rather than an unreachable release after the exit. This is a
            lifetime repair, not a new unboxed callable representation; eliminating existing
            callable erasure is a separate optimization, not required to resume access to
            the original owner.

            A concrete invocation-scoped callback result also supplies context for nested
            native expression macros and terminal conversions. Open native families remain
            deferred until that graph is closed; the selected terminal conversion is emitted
            at the callback return. Signature lifetimes retain their named relationship,
            while local storage infers its free lifetimes. Macro input borrowing preserves
            source authority: a plain `ref` operand does not become mutable.

            Native generic callback helpers retain their exact Rust callable bounds,
            including higher-ranked input/output lifetime relationships. Runtime callable
            support is requested only for parameters whose physical helper signature uses an
            erased carrier, not merely because the source contract describes a function.

            An explicit `with scoped-access` acquisition and body form a real lexical
            lifetime boundary. Successful acquisitions unwind in reverse order on normal
            exit, errors, returns, and loop control. Acquisition failure does not
            manufacture a value to destroy. Region validation rejects dependent escape and
            lender invalidation, including through aggregates, captures, or retained tasks.
            Native suspension and transfer remain subject to exact capability and lifetime
            constraints in the complete generated Rust graph.

            General `with` applications carry ordered syntax metadata outside executable
            declaration children. Lexical resolution and the typed compile-time marker
            schema select a semantic operation and payload. Target and repetition checks run
            before region validation and lowering. Only `scoped-access` is currently
            implemented; unsupported operations are errors, not placeholder realizations.
            This machinery is not a package-specific mutex lowering path.
    - id: destination-results
      title: Destination-result proof
      blocks:
        - type: rule
          id: rule.internals.projection.destination-result-proof
          level: must
          since: null
          evidence:
            - projected-destination-results
            - projected-correlated-destination-results
            - projected-native-callable-specialization
            - projected-serde-json-result
            - projected-result-incompatible-template
            - projected-result-unsatisfied-bound
            - projected-result-associated-bound
            - projected-result-unknown-bound
            - projected-constructor-selected-native
            - projected-constructor-selected-bound
            - projected-constructor-selected-conflicting-payload
            - projected-constructor-selected-optional
            - projected-constructor-selected-private
            - projected-constructor-selected-non-exhaustive
            - projected-constructor-selected-wrong-native
            - projected-constructor-selected-wrong-field-write
            - projected-constructor-selected-nonscalar-operation
            - projected-constructor-selected-collection-parameters
          markdown: |-
            Projection metadata retains every correlated result-only Rust generic parameter,
            their one recursive result template, and each parameter's complete rendered
            bounds, including higher-ranked lifetimes and associated constraints. Semantic
            analysis structurally matches that template against each written Terrane
            destination once, requires repeated occurrences to agree, and applies the
            jointly selected substitution set before constructing or proving bounds. It
            batches those exact Rust questions through the projection oracle against the
            resolved dependency workspace. Higher-ranked and nested bound paths are
            rewritten at every Rust path-root occurrence when a dependency uses a manifest
            alias. A public bound owner from a transitive crates.io package is pinned at its
            lock-resolved version and added as a featureless, default-disabled edge to probe
            and generated manifests. Existing transitive edges keep the resolved feature
            set, so the injected edge cannot widen it; ambiguous or non-registry owners
            decline explicitly.

            Projection-history format 4 records those exact bound-owner edges. Their
            deliberate manifest rewrite resolves offline without Cargo's `--locked` flag;
            integrity comes from the pre-injection manifest and lock in the projection
            identity plus the content-hashed exact edge list. Generated wrappers declare and
            pass every destination-selected generic in native parameter order. Lowering
            applies the complete concrete substitution and the existing recursive result
            conversion without a boxed universal value.

            Explicit native result arguments and written destinations agree when their
            concrete Rust representations agree, including `int` and `int64` selecting
            native `i64`. A selected native method merges its exact owner arguments with
            callable substitutions for parameters, results, bounds, and direct native paths.
            Owner and qualified-path binders are instantiated independently of the method
            turbofish, whose arguments retain the native method's binder order. Selected
            type graphs retain generic nominal root imports independently of support-wrapper
            emission; concrete applications belong at use sites, not in binder-free root
            aliases.

            Authored generic binders are lexical semantic contracts with invariant closed
            language arguments. Shared callable selection supplies substituted parameters,
            results, bounds, and effects to validation, lowering, and language tooling.
            Lowering emits Rust type parameters and ordinary Rust specialization, not a
            dynamic generic-value runtime or an additional object box. Legacy native
            associated-slot applications remain distinct from ordered authored arguments: an
            unapplied projected interface can accept an associated application while its
            native operation's associated constraints remain enforced.

            Required authored fields use non-allocating `Option` initialization slots;
            incomplete objects do not run the successful object's destructor. The current
            single storage representation retains those slots after construction, so field
            access checks initialization and a non-niche payload can enlarge the layout.
            Eliding completed-object checks safely requires a separate construction-stage
            representation and transition into plain initialized fields, not unchecked
            access to storage that may still be absent on a failing construction path.
            Projected native fields retain native storage and construction recipes instead.
            Cached construction types may specialize only the same nominal owner selected in
            the current lowering context. An inherited static body that constructs self must
            retain the derived owner, not the original body's cached base owner.

            Runtime dependency features and crate spelling are separate obligations. When
            the resolved Tokio package is available under a Cargo alias, shared Rust IR
            binds that exact alias to the runtime's crate name for both applications and
            tests. It must not add a separately pinned Tokio package or rely on feature
            merging to make an undeclared crate name resolve. Shared Rust IR records
            blocking-task and synchronization demand explicitly, independently of an
            asynchronous entrypoint. Stream, filesystem, and networking fragments can
            require blocking-task support in an otherwise synchronous application. Cargo
            features and alias binding consume those facts, not scans of generated Rust
            source.

            Constructible generic native records retain one canonical constructor template,
            ordered public fields, and native bounds. Ordinary constructor payloads select
            its concrete representation through the existing generic substitution and oracle
            machinery. The semantic object identity retains both its ordinary source class
            and concrete native arguments; concrete aliases normalize to that same identity.
            Public opaque generic nominals retain the same ordered binder/default/bound
            metadata without acquiring a field constructor. Written type and callable
            selections use that metadata through recursive signatures, factory results, and
            borrowed operation graphs. Native capability queries prove the exact closed
            representation, rather than copying optimistic generic-declaration flags.
            Standard-library types reachable from a declared provider's public signatures
            load their defining Rustdoc surface into that provider namespace while
            preserving canonical native ownership. Field and method inference, destination
            compatibility, lowering, and language tooling consume this shared selection.
            Supplemental facade aliases rewrite native payload paths structurally while
            preserving type arguments. Canonical native function parameters and results
            supply concrete selections even when their generated signatures use the same
            bare source class name. Constructor arguments cross the native ABI exactly once.
            Nongeneric projected object and enum contracts keep their source representation,
            rather than acquiring opaque native selections. Public aliases normalize to the
            canonical source declaration owner so constructor results and written types
            agree without changing their payload ABI. Projected interfaces preserve their
            single associated application slot, including bindings carried by native
            parameter metadata and nested projected payloads. Copyable field snapshots
            borrow their native storage and convert into the source representation without
            partially moving the parent or allocating a redundant intermediate native
            vector. Borrowed scoped families retain the selected owner's namespace and name
            together. Owner selection prefers the exact advertised Rust path before
            canonical-equivalent public observations, then the projected nominal name. A
            facade namespace must not be paired with another alias's owner name. Method
            lookup canonicalizes both item paths and native receiver-owner paths; public
            facade spellings and provider-internal paths can denote the same type. Real
            public reexports take precedence over signature-derived synthetic names, and
            distinct demanded public spellings remain addressable even when they share a
            native owner. Native callable owner and path metadata, alias targets, and alias
            defaults undergo the same Cargo dependency-root rewriting as parameters,
            results, and bounds. Native nominal type arguments and defaults preserve exact
            scalar representations: a native `u8` selection remains `uint8`, independently
            of an ordinary value parameter's adaptive `int` ABI.

            Sysroot defining paths normalize to the selected stable compiler's public
            spelling before native ownership decisions. In particular, `core::io` error
            definitions retain the public `std::io::Error` and `std::io::ErrorKind`
            identities. IO error signature references retain their existing standard-library
            boundary policy instead of creating supplemental facade exports that can collide
            with unrelated package-owned declarations. Other core nominal families, such as
            network addresses, still require supplemental declarations. Actual public
            reexports remain subject to ordinary public-path discovery.

            Native reference metadata retains its inner projected type, mutability, and
            lifetime as separate fields. Recursive traversal, owner lookup, alias rewriting,
            and substitution preserve that structure. Rust syntax trees distinguish bare
            generic binders from qualified names; a qualified identifier cannot be
            substituted merely because its final segment has the same spelling as a binder.
            Rust-bound name qualification likewise distinguishes associated-binding labels
            inside generic argument lists from type subjects in where predicates. Labels
            remain unchanged while their type values and concrete predicate subjects use
            canonical native paths, including after nested generic arguments.
            Borrowed-option callbacks specialize their shared or mutable native payload
            contract from the selected receiver, including the corresponding native callable
            bound.

            Call specialization preserves an answered native reference ABI independently of
            generic-name retention. A source reference is only an input candidate: without a
            successful bound question it does not establish mutable native access. Pure
            outlives predicates are region constraints, not isolated type proofs. The common
            input/result specialization plan leaves them to the final emitted Rust borrow
            graph while retaining the original native signature. They are not oracle `yes`
            answers and cannot establish mutable input access by themselves.
            Source-interface associated-type and transfer obligations remain declaration
            constraints even when the specialized ABI clears generic bounds. Reference
            policy, mutation inference, and argument emission share one decision; computed
            arguments remain expressions rather than synthesized storage names. A native
            facade must not add another borrow when the source parameter contract is already
            a reference. Rebinding that reference's scoped lifetime preserves its depth and
            identity; it does not turn a native shared input into a double borrow.

            When a native generic's constraints require a borrowed argument, bind an
            owner-proven local reference first (for example, `observer = ref value`) and
            pass that binding; do not expect a generic source parameter to select the
            borrowed native ABI without matching bound evidence. If an owned value is
            captured by an `Fn` closure, passing it by value may also be unavailable because
            the closure cannot move it; a local observer is the supported route when the
            native call accepts a borrow.

            Synchronous native panic boundaries evaluate materializable fallible or awaited
            receivers and argument expressions in the caller's context before catching the
            native call. Expression-scoped borrowed native graphs remain intact through
            their terminal call so temporary owners stay alive.

            Direct native reference parameters requiring a static lifetime, including
            reference type aliases and receivers, are declined before source admission.
            Ordinary Terrane strings cannot guarantee static storage, even when the written
            argument is a literal: the owned-string support ABI must not promise a lifetime
            it cannot preserve. Use an admitted ordinary borrowed-input operation instead.

            Borrowed native string and byte inputs do not necessarily imply a borrowed
            generated wrapper signature. Direct native calls may borrow source storage
            without a copy; an owned support-wrapper input follows ordinary value-reuse
            analysis and preserves any source value read again, including in a catch path.

            Bootstrap binding inference preserves unresolved generic scalar placeholders
            until constructor result selection and binding reconstruction can validate the
            concrete operands. Native field reads apply the ordinary recursive result ABI
            conversion, and writes apply argument conversion with source failure translation
            and exact escaping conversion errors. Fresh converted field values are not
            cloned a second time. Private and non-exhaustive record construction remains
            unavailable; absent or conflicting selecting payloads fail before Rust lowering.
            Generated declarations group complete applied and nullable types so an `of`
            argument cannot consume an enclosing optional marker or the next parameter.
            Grouped field types are recognized as declarations even without an initializer.
            Public records containing optional owned collections retain their fields and
            constructor recipes. Constructor inputs use the source field type, cross the
            recursive native ABI once, and retain required optional lifting. Optional
            numeric destinations convert each present payload through the same checked
            numeric conversion as a scalar destination, preserving absence and leaving the
            destination unchanged if conversion fails. An explicitly typed inline Rust
            optional result supplies its complete `Option` carrier; lowering must not wrap
            that opaque result in another `Some`.

            Object comparisons borrow stable canonical operand places without consuming
            owned operands or adding representation copies for borrowed observations. Reads
            through checked shared storage instead use bounded value snapshots: each access
            guard is released before the next operand is evaluated, including when distinct
            handles alias the same owner. Retaining two field guards from one owner would
            either outlive a temporary guard or deadlock on reacquisition.

            Native alias canonicalization does not create new shared storage. An existing
            shared-reference argument retains its carrier when its canonical referent
            matches the destination, including native types reached through a re-export.

            Implicit native record constructors share a synthesized source callable contract
            with argument validation, ownership analysis and lowering. Arguments use
            projected source field names, including renamed keyword fields; unknown names,
            duplicates, missing required fields and incompatible values follow ordinary call
            diagnostics. Native enum-payload constructor helpers consume native field
            storage even though their records use generated carriers. Borrowed descriptor
            constructors instead consume source carrier storage; omitted optional fields
            preserve that distinction. Optional source arguments receive their declared
            carrier type before recursive native payload conversion.

            Plain native record parameters retain fixed native tuple arity recursively
            through optional and collection fields. Like ordinary native call parameters,
            they reject unknown or mismatched source lengths with `T0012`, before native
            conversion. Contextual tuple literals must match that arity too; contextual
            element inference does not replace checking the actual number of elements.

            Other plain-record conversion failures use the canonical fallible constructor
            contract: a `char` conversion reports `coercion-error`, and an adaptive integer
            outside the native range reports `integer-conversion-overflow`. These exact
            effects propagate through source helpers, including recursive optional and
            collection conversions; absent optional inputs do not manufacture an effect.
            Constructor effects omit scalar failures proven impossible for the exact
            argument: integer constant expressions that fit the native destination and
            string literals decoding to exactly one Unicode scalar. Grouping and a direct
            optional payload preserve these proofs; runtime values and collection element
            types alone do not establish them. Explicit throwable contracts therefore need
            not include impossible literal-field conversion failures. Direct native methods
            and expression macros preserve conversion error identity separately from native
            panics. Source input evaluation stays in the caller's completion region before
            conversion, while borrowing futures are constructed in their existing loan
            region.

            Owned configuration carriers for borrowed native descriptors retain recursive
            field-conversion recipes, rather than treating every field as a scalar.
            Supported combinations include optional homogeneous tuples, owned path and
            duration values, optional owned maps, borrowed text and slices of owned
            elements, and vectors of borrowed text or native OS-string views. Borrowed
            OS-string fields and elements use owned Terrane strings as UTF-8 backing. The
            concrete opaque native owners referenced by these fields are importable nominal
            projection declarations, not source-only placeholders.

            Construction converts source collection carriers to owned backing once. A call
            then builds its temporary native view while the backing configuration remains
            alive. Shared calls reconstruct independent owned fields using proven copy or
            clone contracts; consuming calls transfer those fields without an extra payload
            clone. Borrowed leaves continue to lend the original backing through the
            invocation. Free, static and instance calls use the same view reconstruction.
            Native failures unwind the view and its owners normally. Mutable descriptor
            views without write-back, static-lender fabrication and native references
            escaping the temporary view are rejected. Independent owned outputs, including
            text snapshots, may outlive the configuration.

            Cloneable tuple conversion consumes uniquely owned backing directly and clones
            elements only when another source value shares that storage. A linear, non-Clone
            tuple still transfers without acquiring a Clone requirement; the canonical
            semantic capability query selects its unique-storage path. Sharing a cloneable
            tuple, including one inside a copied list, is not a conversion error. Descriptor
            constructors use the ordinary fallible call ABI, and implicit constructor
            effects participate in source caller inference. Effect selection binds actual
            arguments through the ordinary parameter resolver, preserves exact error
            families, and omits unreachable optional conversion errors for `none`.
            Descriptor runtime tuple-shape errors are catchable dependency errors; other
            field conversion errors preserve their original throwable identity.

            This conversion does not introduce source-level borrowed aggregate values.
            Heterogeneous tuples, indistinguishable nested optional carriers and native
            borrowed shapes without stable owned backing remain explicit projection declines
            rather than erased lifetime promises.

            Concrete trait operations retain an explicit qualified native path in projection
            metadata. Projection binds blanket `Self` generics to the concrete owner,
            preserves unresolved implementation generics in the rendered trait path, and
            canonicalizes private `core` or `std` trait spellings to public Rust paths.
            Generated Terrane instance-operation declarations render destination-selected
            generic results as semantic placeholders rather than `none`. Lowering
            substitutes generics inside the qualified trait path, emits remaining method
            generics only as method arguments, and passes an instance receiver explicitly
            for qualified trait calls.

            Explicit non-blanket foreign-owner implementations are collected from the
            defining trait's declared dependency document, not only the nominal owner's
            implementation list. Canonical owner identities include projected reexport
            facades; candidates enter the existing collision and qualified-call machinery.
            Blanket, synthetic, and negative implementations are outside this discovery
            pass's candidate set. Blanket operations admitted by other proven recipes retain
            those recipes' inventory; the pass does not enumerate every omitted blanket
            method as an owner failure. Explicit admitted candidates that cannot resolve an
            owner or project a method retain stable declines rather than disappearing. Alias
            expansion binds written arguments first and omitted arguments through
            declaration defaults. Associated-constant result owners propagate subsequent
            member demand, and constant native paths follow dependency-root alias rewriting.
    - id: interface-impls
      title: Projected interface implementation proof
      blocks:
        - type: rule
          id: rule.internals.projection.interface-impl-proof
          level: must
          since: null
          evidence:
            - rust-dependency-callbacks
            - rust-dependency-nonclone-field
            - projected-interface-missing-member
            - projected-interface-receiver-mismatch
            - projected-interface-signature-mismatch
            - projected-interface-throwable-mismatch
            - projected-interface-provided-override-borrowed
            - projected-interface-provided-override-result
          markdown: |-
            Projection schema 39 records eligible Rust traits as nominal interfaces with
            canonical identity, receiver mode, required/provided membership, signatures,
            documentation, thread obligations, and foreign-type cloneability. Semantic
            conformance uses that descriptor metadata directly, while lowering emits one
            readable foreign trait implementation per adopted class-interface pair.

            The projection oracle accepts impl-shaped questions in addition to bound and
            call questions. Each complete implementation witness is compiled against the
            exact resolved dependency workspace and cached by its full source shape. A
            candidate interface enters the admitted artifact only after that witness
            succeeds; one failed witness declines only that interface and cannot block
            unrelated proven interfaces. Unsupported public traits and members remain in the
            dependency artifact with stable tooling-visible decline reasons.

            Trait admission accepts only plain `self`, `&self`, and `&mut self` receivers.
            Required borrowed parameters, borrowed results, and required `Result` methods
            decline: an owned source result cannot implement a native return loan. Admitted
            provided methods retain their native defaults and cannot be overridden when
            their parameter or result borrowing requires that default implementation. Thread
            obligations remain available for class-field enforcement.
    - id: async-sequences
      title: Async-sequence recognition and lowering
      blocks:
        - type: rule
          id: rule.internals.projection.async-sequence-state
          level: must
          since: null
          evidence:
            - rust-dependency-async-sequences
            - projected-async-sequence-borrowed-item
            - projected-async-sequence-open-item
          markdown: |-
            Projection schema 19 recognizes a concrete owned producer only when an async
            borrowed `next` returns `Result<Option<Item>, E>` and the type also supplies a
            consuming `close`. Its transferable step metadata preserves the concrete item
            type while lowering converts Rust `Some` and `None` into explicit item and end
            states.

            The generated native future is constructed before the async containment wrapper.
            The operation must be awaited directly, which keeps the mutable receiver borrow
            local to one suspension rather than storing it in a task. Borrowed results and
            open associated item types are declined before lowering.
    - id: async-sinks
      title: Async-sink recognition and lowering
      blocks:
        - type: rule
          id: rule.internals.projection.async-sink-state
          level: must
          since: null
          evidence:
            - rust-dependency-async-sinks
            - projected-async-sink-suspended-borrow
          markdown: |-
            Projection schema 19 recognizes an asynchronous borrowed `send(Item)` returning
            `Result<bool, E>`. Lowering converts the boolean into the compiler-owned
            `async-sink-outcome` with distinct accepted and remote-closed state while
            retaining Rust failure, cancellation, and deadline boundaries.

            The native future is constructed before containment and the call must be awaited
            directly, so the mutable receiver borrow spans one suspension. Any asynchronous
            or consuming projected receiver makes its opaque foreign type resource-owning;
            consuming `close` and `split` therefore participate in source ownership
            diagnostics.
    - id: chain-only
      title: Chain-only projection and containment
      blocks:
        - type: rule
          id: rule.internals.projection.chain-only
          level: must
          since: null
          evidence:
            - rust-dependency-chain-only
            - projected-chain-binding
            - projected-chain-return
            - projected-chain-capture
            - projected-chain-suspension
            - projected-owned-opaque-result
          markdown: |-
            Projection metadata marks chain roots, continuing members, and owned terminals
            explicitly. Semantic validation permits an intermediate only as the receiver
            subtree of another chain member or as an argument subtree consumed by another
            projected operation in the same nested expression. Generic inference recursively
            correlates the producer's exact projected native result with the consumer's
            parameter shape. If a producer's hidden concrete type still contains existential
            generic variables chosen by the destination operation, semantic validation
            retains that exact nested origin and defers the inseparable native obligation to
            the complete generated expression instead of trying to name those variables in
            an independent type probe. Retained producer bounds count as independent proof
            only when they exactly match the consumer obligation. Every escape form receives
            one source diagnostic.

            Lowering emits the complete producer-to-consumer expression once, without naming
            or storing the native intermediate. Rust therefore jointly selects hidden
            closure, extractor-tuple, service, renderer, and similar existential parameters
            from the producer call and destination obligation. The terminal applies argument
            conversion, panic and error containment, asynchronous awaiting, and result
            conversion. Projection details shown by editor tooling identify the chain-only,
            non-escaping constraint.
    - id: resolved-graph-survey
      title: Resolved-graph survey evidence
      blocks:
        - type: markdown
          markdown: |-
            `terrane-rust-survey` is a compiler-independent consumer of the shared native
            analysis crate. It resolves an offline, frozen, target-filtered Cargo graph and
            reports only the selected package's dependency closure. The report preserves
            exact package versions and resolved features, registry checksums or complete
            path-package content fingerprints, normalized manifest identities, the pinned
            stable build and rustdoc toolchains, the rustdoc format, and the declared
            containment tier. Host-specific absolute paths and probe timings are not part of
            the portable semantic report.

            Compiler projection and surveys share the pinned format-61 JSON arguments and
            public-path index. Projection requests public Rustdoc only. The survey
            additionally retains hidden definitions so an item publicly reexported from a
            hidden module still contributes its full signature. The index excludes direct
            `#[doc(hidden)]` bindings. An ordinary private module that Rustdoc marks
            `is_stripped` remains a valid implementation owner for visible glob reexports
            and does not trigger `definition_hidden`; only a declaration or canonical
            ancestor carrying `#[doc(hidden)]` does. Reports identify this as the
            `public-bindings-with-hidden-definitions` policy. Public and canonical paths
            remain separate. A reexport whose declaration belongs to another crate names
            that closure owner instead of appearing to be malformed Rustdoc. Optional bound,
            call, and implementation questions are compiled against the same resolved graph
            and recorded as compile-only probe outcomes; surveying never executes package
            code.

            Optional `--complete-surface true` rendering additionally uses pinned
            `public-api` 0.52.2, whose internal decoder is `rustdoc-types` 0.59.0. The
            artifact is first validated by Terrane's strict format-61 decoder. No published
            format-61-compatible `public-api` release is currently available: its separate
            renderer decodes leniently, can omit newer metadata, and reports extraction
            errors for unsupported shapes. This auxiliary rendering is not compiler
            admission or a lossless format-61 schema representation.

            Versioned profiles in the native survey corpus materialize their declared Cargo
            inputs before invoking the survey and choose an enforced or explicitly
            unavailable containment tier. Enforced profiles require Linux bubblewrap and
            never silently downgrade to uncontained execution. The external profile runner
            combines native facts with a typed result for the exact named public conformance
            fixture: accepted runtime applications, expected declines, failed applications,
            and unavailable dedicated environments remain distinct. A missing dedicated
            runtime environment skips only that fixture; runnable offline package surveys
            are still retained. Successful Rust discovery or a native probe does not imply
            Terrane admission, generated-application compilation does not imply runtime
            success, and an unavailable runtime lane is never reported as a pass. The Godot
            profiles survey both the facade crate and its core reexport owner while
            retaining separate compile and dedicated-runtime classifications until the
            projection milestone supplies both forms of product evidence.
    - id: projection-gap-census
      title: Compiler-backed projection gap census
      blocks:
        - type: markdown
          markdown: |-
            `terrane projection-census` assesses one exactly pinned Rust package by running
            shared native discovery and the compiler's real projection resolver against the
            same Cargo graph. Its machine-readable report retains canonical and public
            paths, normalized package-relative source locations, native signatures,
            projected and declined operations, compiler explanations, structural-cause
            counts, graph identity, target, features, and exact toolchains. When a public
            declaration belongs to an external crate, the command surveys the one exact
            matching package in the resolved closure and assesses its recovered signature
            through the original facade path. External enum variants use their surveyed
            parent declaration. Demanded `core` definitions come from the pinned toolchain's
            `rust-src` and enter ordinary package projection through the same declaration,
            method, constant, enum, naming, and reachability machinery as package-owned
            declarations. Their canonical native identities remain `core` or public `std`
            paths while their Terrane declarations remain available only through the
            explicitly declared facade that exposed them. `std`-only paths retain pinned
            Rustdoc identity and item-kind evidence when a standalone definition is
            unavailable. None of these evidence paths makes a transitive or sysroot owner a
            new import root. Absent owners, ambiguous versions, failed owner surveys,
            namespace-only reexports, and declarations still absent after every evidence
            path remain distinct evidence. Static declarations are classified as
            projectable, deferred-contextual, unsupported-capability, namespace-path, or
            missing-metadata; the command does not infer package usability from successful
            discovery or import.

            Ordinary package analysis also writes an ignored
            `.trn/terrane-projection.generated.trn` rooted at the package; `package.toml`
            and `terrane-dependencies.lock` remain at package root, and ignored
            `.trn/projection-cache.json` stores disposable local projection cache/history.
            It remains restricted to current imports. The file orders demanded unavailable
            declarations and a required-admitted index first, active compiler-owned Terrane
            source second, and the unreachable unavailable inventory last. Deterministic
            `Generated source unit` markers introduce the active source. Each marker starts
            an ordinary one-namespace virtual source unit, so a single physical artifact may
            contain `/deps/iced`, `/deps/iced/application`, and other namespaces without
            weakening the authored-source `S2002` rule. Package analysis splits and
            syntax-validates every unit before replacing the artifact; namespace dependency
            cycles do not prevent independent unit generation. Native identity and Terrane
            source naming are separate. Canonical public re-exports and repeated
            observations of one exact Rust type share one readable nominal declaration. A
            unique closed generic uses its constructor name; actual collisions first gain
            deterministic path-derived qualifiers and use a short digest only if those
            qualifiers still collide. Closed numeric specializations of one Rust type
            constructor likewise share one public declaration: for example, `Point<f32>` and
            `Point<u32>` both appear as `Point`. Exact native type arguments and provider
            paths remain compiler-owned semantic metadata, select only methods admitted for
            that specialization, and lower to the corresponding generic Rust type. Admitted
            nominal classes emit the union of already-projectable instance methods, static
            methods, associated constants, and enum constructors whose rendered declarations
            are syntax-valid Terrane source, independently of current imports. A projected
            associated constant is exposed as `constant` and selected with `Type::CONSTANT`.
            Rustdoc remains authoritative for item visibility and declared type. When its
            value is absent, projection recovers the exact expression from the
            Cargo-resolved source file and parses that file once per projection pass. A
            conservatively translated scalar, tuple, array, or arithmetic expression becomes
            a Terrane initializer; every other constant remains compiler-backed and lowers
            directly to its canonical native associated-constant path. Universal panic
            translation is implicit for projected calls and is not repeated as
            `throws dependency-panic` on every generated declaration. Projected Rust
            `Result` declarations retain a generic `throws dependency-error` inventory
            marker; native admission metadata selects the actual admitted typed error
            identity or supported standard-library fallback at the boundary. Projection
            parses each candidate declaration before admitting it to the generated unit.
            Admitted members whose rendered declaration is not yet syntax-valid remain
            adjacent inert comments with the exact parser rejection. Public native members
            that remain unavailable are likewise retained immediately inside the owning
            class as inert comments with their native path, recoverable signature, and exact
            projection gap; the complete unavailable records still appear in the report
            section. This preserves class structure without making an omitted or declined
            member callable. When Rustdoc provides the nominal shape of a demanded
            unavailable struct, enum, type alias, or trait, projection also emits an active
            class or interface skeleton under its public `/deps/<package>` namespace. Native
            generic and lifetime parameters that Terrane cannot yet express are retained as
            residual obligations in adjacent comments, and such a skeleton is not registered
            for lowering or treated as projection success.

            Each unavailable declaration retains its canonical path and exact decline
            reason. Demanded functions whose native shape can be recovered retain a
            deterministic partial contract: the full function shape, generic constraints,
            callback-bearing parameter contracts, and required callback method signatures.
            Demanded module/function name collisions retain a namespace-container contract
            rather than pretending that the module is callable. Requirement propagation
            follows every native declaration referenced by a required partial contract to a
            fixed point, using Rustdoc item identity before mapping back to public aliases.
            Referenced unavailable declarations move into the required section and identify
            the requiring contract; referenced admitted declarations appear in the
            required-admitted index. Cycles terminate by stable native identity. Current
            source imports and projected member calls annotate unavailable entries with
            file, line, and column demand sites. An unavailable but unreachable entry
            remains inventory evidence only; semantic analysis fails at a source location
            only when that application demands the entry. Rebuilding deterministically
            replaces demand annotations.

            Member demand for an inferred call result follows its callee's result owner,
            through grouping and awaiting, rather than collecting the owners of its
            arguments. An executor or other argument still contributes demands for its own
            expression, not the result binding's subsequent members. Where an expression has
            supported alternative result owners, retain those alternatives instead of
            choosing the first sorted identity.

            Authored source callees contribute result demand through their parsed headers,
            including declared method returns, imported aliases, and async helpers.
            Projected types do not yet exist in semantic declaration tables at this stage,
            so discovery must not require a successfully analyzed callable contract. A
            generic-parameter return follows arguments bound to that parameter, including
            reference and optional wrappers, using canonical named/positional argument
            mapping. Unrelated parameters cannot add result owners. Semantic
            header/default/body validation remains in the normal phase after projected
            members exist. The isolated `projected-source-result-*` cases each demand their
            own native member: a working generic call in one program must not mask missing
            demand from another call in the same program.

            When a generic appears inside an applied parameter, demand matches the
            corresponding actual type argument rather than forwarding the enclosing
            argument's owner. Header-only type substitution follows owning aliases, declared
            fields and generic factory returns, including bound and inline calls. An owning
            `Box<T>` input that returns `T` therefore follows the payload type, not `Box`.
            Constructor names are resolved in their source namespaces, and unrelated type
            arguments do not become result owners. The isolated `projected-applied-*` cases
            keep these shapes separate so one demanded member cannot hide another's failure.
            Inferred plain-class receivers and grouped constructor designators preserve the
            same headers as explicitly typed receivers. Source methods on closed generic
            classes substitute the receiver's class arguments as well as the method's own
            parameters, including direct method-result demand.

            Indexing a local collection follows its element header, including an inferred
            list or tuple constructor, an inferred local bound to that indexed result and
            each layer of nested indexing. Lists and homogeneous tuples select their element
            argument; maps and unordered maps select their value argument, not the key.
            Transparent argument and grouping nodes do not introduce distinct recursion
            identities. An isolated indexed call does not require a second call elsewhere to
            demand its native member.

            Early demand discovery is not yet a complete higher-order type inference system.
            Results selected through function-typed parameters, interface-bounded generic
            receivers, and implicit loop-item bindings can still need a concrete destination
            annotation or a helper with a concrete parameter type. The isolated
            `projected-source-demand-*` cases preserve those current limits and their
            supported annotation or typed-adapter alternatives. T0055 distinguishes an
            admitted projected instance member that was not demanded from a genuinely
            missing member, using the full canonical owner/member inventory. This inventory
            is shared across semantic units; static and declined operations are not
            presented as undemanded instance members.

            Separately, copying an indexed or field-projected unbounded type parameter is
            not a permission supplied by a convenient concrete caller. This applies to owned
            call arguments and source field returns as well as binding and return snapshots:
            unsupported copies report T0135 before Rust emission. Borrowing an indexed value
            for a reference parameter or a bounded shared receiver does not copy its
            payload. Use a concrete typed getter when a value copy is intended, an
            explicitly moved field through a consuming receiver when transfer is intended,
            or a declared shared handle element type when only the handle should be copied.
            No hidden bound or payload copy is introduced.

            The separate projection-census runner reads a versioned declarative package list
            and preserves each package's priority, target, feature configuration, deadline,
            and representative-workflow status. It classifies graph or tooling failures as
            environment failures and deadlines as resource-limited unproven results rather
            than projection declines. Full reports and reproducible Cargo workspaces remain
            outside ordinary compiler tests. Concise reviewed baselines preserve
            denominators, configuration coverage, ranked structural causes, and the
            distinction between exercised workflows and context-only evidence.

            The application projection-surface IR composes those root reports with the exact
            union dependency graph and a complete rendered public API for every resolved
            library package. One provisional YAML document contains high-plus-mid and full
            high-mid-low profile views while storing each exact package surface only once.
            Each profile retains root-specific feature and edge contexts instead of
            pretending that independently pinned roots necessarily form one Cargo-resolvable
            manifest. Complete public API extraction includes methods, associated items,
            trait and blanket implementations, reexports, constants, statics, macros, types,
            functions, and modules from pinned Rustdoc JSON. Failed surveys and packages
            without library targets remain explicit records. The rendered API is
            completeness evidence, not yet a stable Terrane semantic schema.
    - id: history
      title: Local cache history and replay evidence
      blocks:
        - type: rule
          id: rule.internals.projection.history-preserves-origin
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
          markdown: |-
            `terrane-dependencies.lock` is the package-level reproducibility input for the
            complete resolved Cargo graph. It includes recursive packages and seeds the
            compiler's generated dependency workspace. Generated private edges may make a
            unique locked recursive owner nameable to Rust lowering, but never add a Terrane
            source import root.

            The ignored `.trn/projection-cache.json` is disposable local projection
            cache/history, distinct from `terrane-dependencies.lock` and the separate
            `.trn/dependencies/projection.json` cache. Cache format 4 groups projected
            member names by namespace and records removals, injected exact private owner
            dependencies, content origin, rustdoc format, projection schema, cache identity,
            verified content hash, and resolution events.

            An exact-cache hit for unchanged content preserves its original local or
            published content origin rather than rewriting it as cache provenance. If the
            same format-4 identity, dependency surface, and private owner edge list later
            produce a different content hash, projection fails with a replay-mismatch
            diagnostic. Removed member identities remain available to diagnose S2031 only
            while this local cache is present; clearing it or using a fresh checkout
            regenerates current projection and loses that historical context, not dependency
            identity. `terrane-dependencies.lock` remains the tracked exact graph.

            Before serializing, the shared writer compares the complete parsed cache-history
            contract with prospective history. Equality leaves the existing file untouched,
            preserving key order, whitespace, and trailing newline spelling. Semantic
            changes and migrations persist normally; replay checks run before this equality
            decision.

            Removed-member history participates in every projected lookup tier: top-level
            names use their namespace entry, static members use `Type::member`, and instance
            receivers use `Type.member`. Declared members resolve first; only an absent
            declared member consults matching removal history and emits S2031 with the
            recorded previous/current dependency versions. Those versions can be equal: the
            diagnostic describes a projection transition, not necessarily a package upgrade.
            A member absent from both declaration and history keeps the ordinary
            unknown-member diagnostic. Reintroducing a member clears its removal.

            History migration, origin preservation, and replay detection live in
            `apply_projection_history`; focused unit coverage includes
            `cache_hits_keep_content_origin` and `migration_detects_replay_drift`.
    - id: subsystem-ownership
      title: Rust-interop subsystem ownership
      blocks:
        - type: rule
          id: rule.internals.projection.rust-interop-has-one-discoverable-owner
          level: must
          since: null
          evidence:
            - projected-correlated-destination-results
            - projected-invocation-scoped-callback
            - rust-dependency-chain-only
          markdown: |-
            `terrane_compiler::rust_interop` is the discoverable compiler owner of Rustdoc
            and canonical-path ingestion, projected metadata, correlated native
            substitutions, callback recipes, projection census reporting, and projected
            dependency wrapper planning. Shared Rustdoc indexing, exact oracle questions and
            evidence, and Cargo toolchain process policy are consumed directly from
            `terrane-rust-analysis` rather than duplicated behind compiler compatibility
            facades. The subsystem module documentation records the phase map, ownership
            boundaries, supported value lifetimes, terminal paths, and their conformance
            evidence.

            General Terrane parsing, value and ownership semantics, control-flow analysis,
            diagnostics, and generic Rust emission remain compiler-wide responsibilities.
            They consume canonical projected metadata or validated semantic plans rather
            than defining parallel Rust-interop representations. The projected dependency
            lowering planner is physically owned by the subsystem but mounted privately
            beneath the lowering module so it can share emitter internals without exposing
            those internals across compiler phases.

            New Rust-interop behavior belongs in this subsystem. Existing adjacent
            responsibilities discovered while changing it must be moved here or retain a
            documented language-wide ownership reason and a narrow interface. Compatibility
            aliases and forwarding facades are not a substitute for migrating callers.
