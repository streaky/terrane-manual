documentation:
  status: complete
  title: Dependency projection resolution
  title-style: text
  summary: >-
    Describes the exact identities, ordered resolution sources, artifact
    validation, and durable history used to turn locked Rust dependencies into
    one reusable compiler projection.
  tags:
    - compiler-internals
    - dependencies
    - projection
    - artifacts
    - caching
    - reproducibility
  sections:
    - id: identity
      title: Exact cache identity
      blocks:
        - type: rule
          id: rule.internals.projection.cache-identity-is-exact
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
            - rust-dependency-reqwest
          markdown: |-
            A projection cache identity covers the package manifest, resolved
            Cargo lock, complete dependency inputs, effective compilation
            target, stable build toolchain, nightly rustdoc toolchain, rustdoc
            JSON format, projection schema, and containment tier. Every field is
            length-delimited before entering the SHA-256 digest so different
            input boundaries cannot produce the same encoded sequence.

            The effective target is selected from `CARGO_BUILD_TARGET`, then
            Cargo's `build.target`, then the pinned stable compiler's host. A
            change to any identity input selects a different cache record rather
            than reusing and conditionally repairing an older projection.

            Identity construction lives in
            `crates/terrane-compiler/src/projection.rs` under `cache_identity`
            and `selected_target`.

    - id: resolution
      title: Ordered resolution transaction
      blocks:
        - type: rule
          id: rule.internals.projection.artifacts-never-widen
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
            - rust-dependency-reqwest
          markdown: |-
            Projection resolution is one transaction owned by `resolve`. It
            checks the exact project-local cache first, records bundled
            distribution as explicitly skipped while no release channel exists,
            attempts a configured published artifact, and otherwise generates
            rustdoc locally with the pinned nightly toolchain. Every attempted
            source records a status and reason, and the final projection records
            its resolution outcome.

            A published artifact is admitted only when its envelope format,
            cache identity, target, stable and rustdoc toolchains, rustdoc
            format, projection schema, and payload identity match. Dependency
            names, packages, exact versions, and effects are checked separately
            from feature/default-feature metadata and each dependency's target
            condition. The SHA-256 content hash must agree with both the
            envelope and the projection payload.

            Missing or rejected published artifacts fall back to local rustdoc;
            validation never weakens a mismatch into a nearby reusable result.
            A verified published result is written into the same exact local
            cache used by later offline resolution. The focused unit test
            `remote_artifact_requires_exact_projection_inputs` exercises the
            artifact boundary and its distinct mismatch causes.
    - id: callbacks
      title: Concrete callback projection
      blocks:
        - type: rule
          id: rule.internals.projection.callbacks-preserve-bounds
          level: must
          since: null
          evidence:
            - rust-dependency-callbacks
            - projected-callback-open-bound
          markdown: |-
            Projection schema 17 represents a concrete Rust callback with its
            monomorphic inputs and output, `Fn`/`FnMut`/`FnOnce` multiplicity,
            synchronous or future-returning shape, retention, and `Send`/`Sync`
            bounds. The rendered dependency declaration uses the same Terrane
            function type shown by editor hover and signature help.

            The lowering boundary constructs the exact Rust closure and
            converts callback inputs and results at both free-function and
            projected-method calls. `FnMut` records Rust invocation multiplicity
            but adds no mutable Terrane capture cell. Open generic,
            higher-ranked, and lifetime-dependent callable shapes are declined;
            the compiler does not erase them into a universal callback value.


    - id: async-sequences
      title: Async-sequence recognition and lowering
      blocks:
        - type: rule
          id: rule.internals.projection.async-sequence-state
          level: must
          since: null
          evidence:
            - rust-dependency-async-sequences
            - projected-async-sequence-borrowed-item
            - projected-async-sequence-open-item
          markdown: |-
            Projection schema 19 recognizes a concrete owned producer only
            when an async borrowed `next` returns `Result<Option<Item>, E>` and
            the type also supplies a consuming `close`. Its transferable step
            metadata preserves the concrete item type while lowering converts
            Rust `Some` and `None` into explicit item and end states.

            The generated native future is constructed before the async
            containment wrapper. The operation must be awaited directly, which
            keeps the mutable receiver borrow local to one suspension rather
            than storing it in a task. Borrowed results and open associated item
            types are declined before lowering.
    - id: async-sinks
      title: Async-sink recognition and lowering
      blocks:
        - type: rule
          id: rule.internals.projection.async-sink-state
          level: must
          since: null
          evidence:
            - rust-dependency-async-sinks
            - projected-async-sink-suspended-borrow
          markdown: |-
            Projection schema 19 recognizes an asynchronous borrowed
            `send(Item)` returning `Result<bool, E>`. Lowering converts the
            boolean into the compiler-owned `async-sink-outcome` with distinct
            accepted and remote-closed state while retaining Rust failure,
            cancellation, and deadline boundaries.

            The native future is constructed before containment and the call
            must be awaited directly, so the mutable receiver borrow spans one
            suspension. Any asynchronous or consuming projected receiver makes
            its opaque foreign type resource-owning; consuming `close` and
            `split` therefore participate in source ownership diagnostics.

    - id: chain-only
      title: Chain-only projection and containment
      blocks:
        - type: rule
          id: rule.internals.projection.chain-only
          level: must
          since: null
          evidence:
            - rust-dependency-chain-only
            - projected-chain-binding
            - projected-chain-return
            - projected-chain-capture
            - projected-chain-suspension
          markdown: |-
            Projection schema 20 marks chain roots, continuing members, and
            owned terminals explicitly. Semantic validation permits an
            intermediate only as the receiver subtree of another chain member
            in the same nested expression and emits one source diagnostic for
            every escape form.

            Lowering emits root and continuation calls without independent
            wrappers. The terminal applies argument conversion, panic and error
            containment, asynchronous awaiting, and result conversion to the
            complete Rust expression. Projection details shown by editor
            tooling identify the chain-only, non-escaping constraint.
    - id: history
      title: Durable origin and replay history
      blocks:
        - type: rule
          id: rule.internals.projection.history-preserves-origin
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
          markdown: |-
            `terrane-projection.lock` is durable project history rather than a
            cache index. History format 2 records projected dependency members,
            removed members, content origin, rustdoc format, projection schema,
            cache identity, verified content hash, and the resolution events
            that produced that content.

            An exact-cache hit for unchanged content preserves the original
            local or published content-origin history instead of rewriting it as
            cache provenance. If the same format-2 identity and dependency
            surface later produce a different content hash, projection fails
            with a replay-mismatch diagnostic. Version changes retain removed
            member identities so a later missing import can be distinguished
            from a member that never existed.

            History migration, origin preservation, and replay detection live in
            `apply_projection_history`; focused unit coverage includes
            `projection_history_keeps_content_origin_across_cache_hits` and
            `projection_history_migrates_provenance_and_detects_replay_drift`.
  see-also:
    - tool.packages.rust-dependencies

provenance:
  specification:
    - document: language-spec
      section: "23.8"
  conformance:
