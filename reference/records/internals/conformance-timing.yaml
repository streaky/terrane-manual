documentation:
  status: complete
  title: Nested conformance timing
  title-style: text
  summary: >-
    Describes how the full-suite timing collector records individual conformance manifests instead
    of attributing the whole corpus to one Rust test.
  sections:
    - title: Collection protocol
      body: >-
        `docs/measure-test-times.py` creates a temporary file and exports its path as
        `TERRANE_TEST_TIMING_FILE` to the serial Cargo test process. The conformance driver tracks
        each manifest's setup, checking, and execution work, then appends a versioned tab-separated
        record containing the relative case path, status, and elapsed seconds. Dependency-free
        accepted cases share one generated-crate build, which receives its own synthetic timing
        record instead of being estimated per case. A deferred case that never reaches that build
        is recorded as ignored rather than falsely failed; a drop guard still records a real active
        case failure. Normal test runs without the environment variable perform no timing-file I/O.
    - title: Scoreboard identity
      body: >-
        Nested records use the `conformance cases [terrane_compiler]` target and the manifest's
        corpus-relative directory as the stable test name. If at least one nested record is
        present, the collector omits and removes the enclosing
        `every_manifest_drives_a_conformance_case` entry. The shared dependency-free build uses the
        stable name `generated-rust/batched-dependency-free-build`. Ordinary libtest timings,
        manifest timings, and that build timing otherwise share the same bounded history and run
        summary.
    - title: Generated-crate isolation
      body: >-
        Every sorted accepted manifest receives its own deterministic binary name and source path.
        Dependency-free binaries are declared in one generated Cargo manifest and built together,
        allowing Cargo to schedule their independent rustc and linker work in parallel. Cases with
        projected Rust dependencies retain separate manifests and builds because their dependency
        graphs may conflict. The driver removes fixture-specific Cargo configuration before the
        shared dependency-free build, while all builds retain one Cargo target directory for
        dependency reuse. The driver executes each exact case-specific artifact; no case can reuse
        another case's executable when Cargo decides that a target is fresh. Package fixtures are
        staged outside the corpus. When a package carries a reviewed `terrane-projection.lock`, the
        driver compares the staged post-compilation history with the source fixture after excluding
        only machine-derived cache identity and content hash fields. A format migration or any
        semantic projection change fails the case instead of silently rewriting the reviewed
        fixture.
    - title: Focused execution and cache locality
      body: >-
        Set `TERRANE_CONFORMANCE_FILTER` to one case-name or to comma-separated
        corpus-path fragments when running
        `every_manifest_drives_a_conformance_case`. Filtering happens before
        staging, so only matching manifests are compiled and executed while the
        harness retains its shared generated-Cargo target. An empty match fails
        rather than reporting a vacuous pass.

        Do not invoke `terrane run` directly inside a tracked conformance case
        directory for focused checking. The ordinary CLI correctly creates its
        project-local `.trn/cache/target`, but doing that across many fixtures
        duplicates the same dependency graph under every case. CLI integration
        tests that exercise this project-local behavior stage the source in a
        temporary directory; the tracked corpus must remain free of `.trn`
        build caches.
    - title: Measurement boundary
      body: >-
        A case measurement includes manifest and source loading, semantic analysis, lowering, and
        program execution for run cases. The synthetic dependency-free generated-crate row reports
        its complete shared build wall time; isolated dependency builds remain attributed to their
        cases. Build-cache warmup can make an early compiling case slower, so timings are
        comparative development evidence rather than benchmark results. Do not run competing Cargo
        work while collecting the full workspace.
  examples: []
  errors: []
  notes:
    - The timing file is a private compiler-test protocol, not a Terrane language or runtime API.
    - The collector deletes its temporary timing file after every run.
  see-also:
