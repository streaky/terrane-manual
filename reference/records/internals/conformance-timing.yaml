documentation:
  status: complete
  title: Nested conformance timing
  title-style: text
  summary: >-
    Describes how the full-suite timing collector records individual conformance manifests instead
    of attributing the whole corpus to one Rust test.
  sections:
    - title: Collection protocol
      body: >-
        `docs/measure-test-times.py` creates a temporary file and exports its path as
        `TERRANE_TEST_TIMING_FILE` to the serial Cargo test process. The conformance driver times
        each manifest from case setup through checking, compilation, and execution, then appends a
        versioned tab-separated record containing the relative case path, status, and elapsed
        seconds. A drop guard records a failed status if a case unwinds. Normal test runs without
        the environment variable perform no timing-file I/O.
    - title: Scoreboard identity
      body: >-
        Nested records use the `conformance cases [terrane_compiler]` target and the manifest's
        corpus-relative directory as the stable test name. If at least one nested record is
        present, the collector omits and removes the enclosing
        `every_manifest_drives_a_conformance_case` entry. Ordinary libtest timings and nested case
        timings otherwise share the same bounded history and run summary.
    - title: Generated-crate isolation
      body: >-
        Compiling cases share one Cargo target directory for dependency reuse, but each sorted
        manifest receives its own deterministic binary name and source path. The driver executes
        that exact case-specific artifact; no case can reuse the preceding case's executable when
        Cargo decides that another target is fresh. Package fixtures are staged outside the corpus.
        When a package carries a reviewed `terrane-projection.lock`, the driver compares the staged
        post-compilation history with the source fixture after excluding only machine-derived cache
        identity and content hash fields. A format migration or any semantic projection change
        fails the case instead of silently rewriting the reviewed fixture.
    - title: Measurement boundary
      body: >-
        A case measurement includes manifest and source loading, semantic analysis, lowering,
        generated-crate compilation where required, and program execution for run cases. Shared
        build-cache warmup can make the first compiling case slower, so timings are comparative
        development evidence rather than benchmark results. Do not run competing Cargo work while
        collecting the full workspace.
  examples: []
  errors: []
  notes:
    - The timing file is a private compiler-test protocol, not a Terrane language or runtime API.
    - The collector deletes its temporary timing file after every run.
  see-also:
