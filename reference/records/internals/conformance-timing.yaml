documentation:
  status: complete
  title: Nested conformance timing
  title-style: text
  summary: >-
    Describes how the full-suite timing collector records individual conformance manifests instead of attributing the whole
    corpus to one Rust test.
  sections:
    - id: collection-protocol
      title: Collection protocol
      blocks:
        - type: markdown
          markdown: >-
            `docs/measure-test-times.py` creates a temporary file and exports its path as
            `TERRANE_TEST_TIMING_FILE` to a Cargo test process. Each outer libtest binary
            uses deterministic bounded parallelism, defaulting to available parallelism
            capped at eight workers and reducible with `TERRANE_SCORECARD_JOBS`. The
            collector reconstructs active per-test durations from libtest's alphabetical
            queue and timestamped completion events. Within the corpus test, the driver
            measures concurrent per-manifest setup, checking, and lowering work. Each
            completed case appends a locked, versioned tab-separated record containing its
            relative path, status, and active elapsed seconds; scoreboard identity does not
            depend on completion order. Dependency-free accepted cases share one
            generated-crate build, which receives its own synthetic timing record instead of
            being estimated per case. A deferred case that never reaches that build is
            recorded as ignored rather than falsely failed; a drop guard still records a
            real active case failure. Normal test runs without the environment variable
            perform no timing-file I/O.
    - id: scoreboard-identity
      title: Scoreboard identity
      blocks:
        - type: markdown
          markdown: >-
            Nested records use the `conformance cases [terrane_compiler]` target and the
            manifest's corpus-relative directory as the stable test name. If at least one
            nested record is present, the collector omits and removes the enclosing
            `every_manifest_drives_a_conformance_case` entry. The shared dependency-free
            build uses the stable name `generated-rust/batched-dependency-free-build`.
            Ordinary libtest timings, manifest timings, and that build timing otherwise
            share the same bounded history and run summary. Changing the collector's timing
            mode retains aggregate run records but begins a fresh per-test comparison
            history so serial and parallel durations are not compared as regressions.
    - id: generated-crate-isolation
      title: Generated-crate isolation
      blocks:
        - type: markdown
          markdown: >-
            Accepted manifests receive deterministic binary names derived from their
            corpus-relative identities, independent of filtering and execution order.
            Compiler-only preparation uses a bounded worker pool and returns results to
            corpus order before backend builds. Dependency-free binaries retain a shared
            generated Cargo workspace under the corpus's `.trn/conformance` directory and
            build together, allowing Cargo to schedule independent rustc and linker work.
            Dependency-bearing cases and shared suites retain separate fixture-local
            `.trn/conformance` workspaces and manifests because their graphs may conflict.
            Byte-identical native fixture libraries have shared maintained sources;
            deliberately different APIs with the same package name and version remain
            distinct variants. Staging publishes immutable, content-identified registry
            graphs under the shared target directory. Case-local Cargo configurations remain
            independent, while equivalent native path dependencies resolve to the same
            shared source rather than repeatedly copied package identities. Sharing is
            graph-scoped: an identical package present in different registry graphs can
            retain distinct compiled identities. This preserves sibling path dependencies
            and graph-local build inputs rather than assuming package bytes alone establish
            equivalence. Staged Cargo patches refer directly to the immutable graph paths.
            Merely linking a replaceable case-local registry is insufficient: Cargo package
            identities retain logical path aliases, which can reuse the wrong
            same-name/version API after a workspace changes graphs. Local registry staging
            still uses links on Unix and portable copies elsewhere; both use the explicit
            shared patch paths. Builds retain one Cargo target directory and one stable
            support-crate source tree for dependency reuse, rather than duplicating
            dependency targets beneath every fixture. Generated sources, support sources and
            manifests are written only when their contents change. Cargo freshness and
            incremental compilation therefore survive successive test invocations and
            compiler edits; the Terrane front end still checks and lowers the selected cases
            on every run. The driver executes each exact case-specific artifact. Ordinary
            package fixtures are compiled in place, retaining their `.trn` state. Root
            dependency lockfiles remain fixture inputs: the driver restores their original
            contents or absence after compilation while retaining resolved Cargo locks under
            `.trn`. Fixtures that explicitly seed projection history still use disposable
            package copies so each invocation exercises the specified history. Projection
            history is local cache data, not a reviewed package lock; the deliberate
            format-3 compatibility fixture remains data under the projection-history fixture
            path.

            There is deliberately no corpus-wide reviewed baseline for admitted or declined
            projection inventories. Used surface is checked by actual conformance consumers,
            generated lowering diffs, and native execution; unused surface drift may escape
            those checks. This is an accepted coverage tradeoff of disposable inventory
            state, not a claim that existing behavior tests replace full inventory
            comparison.
    - id: consolidation-boundaries
      title: Compilation sharing without coverage loss
      blocks:
        - type: markdown
          markdown: >-
            A coverage case is not necessarily a compilation unit. Compatible positive
            scenarios can share an explicitly authored Terrane test package, while retaining
            separate corpus identities, expected output, exit behavior, and fresh process
            execution. Use cohesive semantic families rather than one monolithic corpus
            program. Shared source must not turn a failing shape into a passing shape by
            supplying declarations, projected member demand, generic constraints, runtime
            support, or imports from another scenario.

            When adding a compatible positive scenario, first extend an existing cohesive
            suite rather than creating another standalone program. The current families
            include `value-protocols`, `object-protocols`, and `control-flow`. Retain a
            separate scenario source file and named corpus manifest; neither requires
            another compilation unit. Create a new suite only when no existing family fits.
            A new standalone positive witness needs a concrete isolation, compiler
            configuration, or runner requirement; explain that requirement in the fixture or
            its associated contract documentation.

            Unsafe scenarios belong in a separate suite marked `unsafe-tests = true` at the
            package root. `unsafe-protocols` is the explicit current category; ordinary
            suites reject unsafe declarations instead of silently removing their unsafe-code
            prohibition. The driver validates the complete suite inventory before filtering:
            every discovered test must have exactly one run manifest, and every selection
            must resolve to an existing scenario.

            Likewise, inspect `tests/fixtures/native-conformance` and existing linked
            registries before creating a native Rust witness crate. Reuse compatible
            maintained libraries rather than copying them, but preserve deliberately
            different API and dependency-graph variants. Review dependent rejection cases
            when changing a shared library.

            Rejection cases remain independent programs so each expected diagnostic is
            actually reached. Keep demand-sensitive positive witnesses independent too:
            another use of the same native owner/member can mask a missing-demand regression
            even when the calls live in different functions or source files. Likewise,
            absence-of-support, unused-declaration, standalone entrypoint, and
            package-resolution boundaries require their own compiler inputs. Sharing an
            unchanged native dependency library does not imply sharing Terrane semantic
            analysis.

            Program-global declarations also require independent inputs: a global name from
            one scenario can change another namespace's assignment resolution. Uncaught
            errors that pin entrypoint names, source frames, or process exit behavior must
            not be wrapped as native test functions.

            Native test builds own their controlled clock independently of process support.
            Temporal scenarios can share a suite without an unrelated process import or
            extra clock call. `shared-object-field-comparisons` and
            `static-call-throw-inference` now live in the object and control-flow suites;
            their original outputs and case identities remain unchanged. Compatible native
            loan-flow scenarios share the `native-lifetimes` suite and its existing native
            fixture graph, while demand-sensitive and rejection programs remain isolated.

            Consolidation must retain every original observable check and filterable case
            identity. Audit the migration by mapping original sources and expectations to
            their suite scenarios, not by comparing the aggregate number of binaries or
            passing tests. A shared compilation failure should identify the suite and its
            selected cases; an execution failure should still name the individual case.
        - type: markdown
          markdown: >-
            Accepted run cases opt in with `suite` and the canonical `test` identity,
            including its leading namespace slash. The suite is a native test package under
            `tests/fixtures/conformance-suites/<suite>` with exactly one test tier. The
            driver compiles that package once, always enables canonical-Rust validation,
            rejects unexpected warnings, and persists one lowering artifact set beside the
            suite package. Per-case compiler configuration is not mixed into a shared unit;
            such cases remain standalone.

            Independent suite front ends are prepared in parallel under the normal
            conformance job limit. Backend staging and execution retain their existing
            per-suite order and per-case process boundaries.

            Existing case directories retain their runtime expectations and filters. The
            driver dispatches the selected native test in a fresh process with its test
            identity, tier, deterministic seed, result path, and temporary directory.
            Filtering one case still compiles its suite, but executes only that case.
            Compilation time has its own `conformance/shared-suite/<suite>/compile` row;
            each original case keeps its own execution row. A shared compilation failure
            fails that compilation row and leaves unexecuted cases ignored, rather than
            falsely reporting them as individually failed.

            Fewer compilation units do not by themselves prove lower elapsed time. Sharing
            can trade parallel front-end preparation for a larger serial compile, and native
            test-runner setup has a cost. Measure the affected workload with comparable
            compiler, dependency-cache, and backend-cache conditions; report compilation
            reuse separately from any wall-time improvement.

            The primary rebuild workload is warm dependencies with cold generated programs
            after a lowering change. Verify that measured generated targets are non-fresh,
            hold dependency versions fixed, and disable compiler-wrapper cache hits. Measure
            aggregate compilation CPU as well as elapsed time: reducing repeated Rust work
            leaves CPU available to other applications even when parallel independent builds
            have similar wall time.
        - type: example
          language: toml
          mode: illustrative
          source: |
            phase = "run"
            status = "accept"
            suite = "value-protocols"
            test = "/string-display-generic::test-generic"
    - id: bounded-expected-runtime-failures
      title: Bounded expected runtime failures
      blocks:
        - type: markdown
          markdown: >-
            A run manifest may specify `runtime-error` with a stable expected diagnostic
            substring. Such a case must compile successfully, produce its exact
            `stdout.txt`, terminate with a nonzero status and include that diagnostic on
            stderr. Its native execution is bounded to five seconds; the harness drains
            output concurrently and kills/reaps a stalled child. This exercises runtime
            failures such as shared-reference borrow conflicts without pinning Rust panic
            locations or allowing a deadlock regression to hang the suite. A successful run
            case may specify `bounded-runtime = true` to use the same five-second execution
            bound and concurrent output draining while requiring a successful exit and exact
            stdout. Use this for suspension/coordination controls where a regression could
            otherwise hang; it does not turn a timeout into an expected outcome.
    - id: focused-execution-and-cache-locality
      title: Focused execution and cache locality
      blocks:
        - type: markdown
          markdown: >-
            Set `TERRANE_CONFORMANCE_FILTER` to one case-name or to comma-separated
            corpus-path fragments when running `every_manifest_drives_a_conformance_case`.
            Filtering happens before corpus staging, so only matching manifests are compiled
            and executed while the harness retains its shared generated-Cargo target. An
            empty match fails rather than reporting a vacuous pass. The preparation pool
            defaults to available parallelism capped at eight workers; set
            `TERRANE_CONFORMANCE_JOBS=1..8` to lower the bound for a constrained machine or
            a focused diagnostic run. The harness compiles ordinary packages in place and
            retains fixture-local `.trn` state. Use this harness for focused checking: it
            preserves shared dependency targets, manifest options, lowering artifacts and
            runtime expectations. Running the ordinary CLI separately uses its project-local
            target instead. The generated conformance workspaces define line-table-only
            `dev` and `test` profiles with incremental compilation enabled.

            A filesystem lock serializes corpus invocations before they prepare inputs or
            replace shared executables. Retained workspaces also hold role-specific build
            locks. Runtime working directories and native-test temporary files remain
            disposable; no passing verdict is cached, and selected assertions execute again
            even when Cargo reuses every compiled artifact. Tests whose purpose requires a
            fresh package or mutates authored fixture inputs must keep explicit disposable
            copies rather than adopting in-place execution.
    - id: reviewed-lowering-artifacts
      title: Reviewed lowering artifacts
      blocks:
        - type: markdown
          markdown: >-
            Every accepted conformance case regenerates tracked `lower.rs` and, when support
            is needed, sibling `lower.support.rs` review artifacts from compiler split
            output (`Compilation::rust_files_for`). Ordinary focused and corpus runs do this
            without golden mode. Git's diff against these files is the review surface; there
            is no lowered-source snapshot-equality gate. Retain these artifacts as a
            user-valued generated-code review surface rather than retiring them to avoid
            churn.

            The harness compiles the split program, including its support file, and executes
            run cases. Cases with authored Rust modules also regenerate the referenced
            module files beneath `lower.authored/`. Persisted review artifacts normalize the
            compiler version; generated binaries use actual compiler output and
            dependencies. Never hand-edit these files. The support sidecar lists vendored
            support crates used by the generated program. Empty support produces neither a
            sidecar nor an include in `lower.rs`; regeneration removes a stale sidecar from
            an earlier run. Inspect meaningful changes alongside acceptance, runtime output,
            and canonical-Rust validation. A focused regeneration uses
            `TERRANE_CONFORMANCE_FILTER=<case-name-or-comma-separated-fragments> cargo test -p terrane-compiler --test conformance every_manifest_drives_a_conformance_case`;
            the same command without a filter runs the corpus.
            `docs/summarize-golden-churn.py <git range>` summarizes changed-line hunks.
    - id: measurement-boundary
      title: Measurement boundary
      blocks:
        - type: markdown
          markdown: >-
            A case measurement includes manifest and source loading, semantic analysis,
            lowering, and program execution for run cases. The synthetic dependency-free
            generated-crate row reports its complete shared build wall time; isolated
            dependency builds remain attributed to their cases. Build-cache warmup can make
            an early compiling case slower, so timings are comparative development evidence
            rather than benchmark results. Do not run competing Cargo work while collecting
            the full workspace.
  examples: []
  errors: []
  notes:
    - The timing file is a private compiler-test protocol, not a Terrane language or runtime API.
    - The collector deletes its temporary timing file after every run.
