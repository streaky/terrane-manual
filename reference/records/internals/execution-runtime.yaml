documentation:
  status: complete
  title: Execution requirements and runtime selection
  title-style: text
  summary: >-
    Describes how semantic analysis records runtime-neutral execution needs and how lowering selects only the generated async
    support required to satisfy them.
  tags:
    - compiler-internals
    - semantics
    - lowering
    - async
    - runtime
  sections:
    - id: requirements
      title: Runtime-neutral execution requirements
      blocks:
        - type: rule
          id: rule.internals.execution.requirements-remain-runtime-neutral
          level: must
          since: null
          evidence:
            - rust-dependency-async-function
            - projected-async-local-task-threaded
          markdown: |-
            Semantic analysis represents execution needs as compiler-owned requirements for
            runtime context, wake support, blocking delegation, local tasks, and
            transferable tasks. These requirements do not name Tokio or another concrete
            executor.

            Function-level requirements propagate through callable contracts. The package
            aggregate merges the requirements of its asynchronous entrypoint and referenced
            asynchronous functions. An asynchronous entrypoint requires runtime context and
            wake support; scoped tasks require wake support; asynchronous host operations
            that cannot be implemented directly as non-blocking polling also request
            blocking delegation.

            The model rejects incoherent combinations: runtime context or task execution
            requires wake support, and blocking delegation requires a runtime context. The
            representation and consistency checks live in
            `crates/terrane-compiler/src/execution.rs`; semantic aggregation lives in
            `crates/terrane-compiler/src/semantics/bindings.rs`.
    - id: strategy
      title: Runtime selection boundary
      blocks:
        - type: rule
          id: rule.internals.execution.strategy-selection-is-centralized
          level: must
          since: null
          evidence:
            - rust-dependency-async-function
            - projected-async-local-task-threaded
            - try-loop-completion
            - projected-local-cleanup
          markdown: |-
            The package manifest's `cooperative` and `threaded` executor profiles map to the
            compiler-owned `Local` and `Parallel` execution strategies. Semantic analysis
            and source diagnostics use those strategies and generic requirements; concrete
            runtime support is selected later at the lowering boundary.

            Lowering chooses the local or parallel executor template in
            `crates/terrane-compiler/src/lowering/emitter/pipeline.rs`. Keeping this
            selection at one boundary prevents runtime-library types from leaking into
            semantic contracts and gives a replacement executor a single integration seam.

            Asynchronous finalization demand includes source class methods and methods
            imported from dependency packages, not only root-level functions. A loop nested
            inside a protected try body keeps its local break/continue targets; exits
            targeting an enclosing loop cross the completion boundary only after its
            finalizer. Catches and nested protected loops obey the same distinction.

            Executor entry pins its owned child before polling. Cancellation-operation
            helpers pin the native child before constructing their async wrapper. Moving an
            unboxed child into that wrapper first can create multi-megabyte debug polling
            frames even without recursion. Both boundaries preserve cancellation and
            destructor draining without carrying the complete inline child through the
            runtime wrapper.
    - id: generated-support
      title: Demand-driven generated support
      blocks:
        - type: rule
          id: rule.internals.execution.support-is-demand-driven
          level: must
          since: null
          evidence:
            - async-await
            - cooperative-task-scope
            - networking-tcp-loopback
            - rust-dependency-async-function
            - native_test_command_reports_isolated_cases_deterministically_from_relative_paths
            - sync_filesystem_streams_do_not_require_async_runtime
          markdown: |-
            Lowering emits async runtime support only for a package that uses asynchronous
            functions. It adds a selected entrypoint executor only for an asynchronous
            `main`, projected-future support only when a referenced projected async function
            exists, and task-scope support only when the semantic package uses a scope.

            An asynchronous entrypoint is wrapped in exactly one selected wake-driven
            runtime. The generated Cargo dependency and support modules follow the same
            semantic decision so synchronous packages do not acquire an unused runtime. The
            optional advanced-stream bundle uses a conservative emitted-unit demand test,
            not general call-graph reachability or dead-code elimination. Any authored
            asynchronous function activates the bundle, even if it does not call an advanced
            stream operation. Retained bundled consumers participate only through canonical
            IO/time bindings, because the fast path omits those units. This retains the
            duration type needed by testing helpers without treating filesystem capability
            intrinsics or raw host types as demand for asynchronous streams. The stream, IO,
            and time units themselves are excluded from that scan. This remains
            conservative: an unused bundled IO/time import can activate the bundle; this is
            not general declaration reachability or a promise to eliminate every helper. The
            decision is made by `package_uses_advanced_streams` in
            `crates/terrane-compiler/src/lowering/helpers.rs`.

            Simple and cancellation-aware async support share awaited-destructor execution
            through `runtime/async_destructor.rs`. Each parallel executor owns one shared
            admission state, installed on its root and worker threads with the runtime's
            identity. Reuse checks that identity and acquires an atomic in-flight permit; it
            does not allocate a runtime per destructor or lock a global runtime map. Before
            normal or unwinding shutdown, an ownership guard closes admission and drains
            existing permits while drivers remain live. Later destructors use the
            synchronous scoped fallback. A current handle alone is not evidence of liveness:
            Tokio also enters it while dropping a runtime.

            Shutdown draining uses a standard condition variable, with the mutex acquired
            only by the shutdown waiter and the final closing permit. Ordinary destructor
            reuse remains atomic and thread-local. This coordination does not require
            Tokio's `sync` feature, which basic async artifacts do not otherwise request.

            Projected async entry cancellation retains the task's join handle. Cleanup waits
            for finalizers, requests abort, then joins the task before decrementing the
            outstanding-cleanup count. The executor's cleanup wait therefore includes
            destruction of the aborted future rather than just the abort request.
    - id: stream-adapters
      title: Concrete stream adapters and shared completion policy
      blocks:
        - type: rule
          id: rule.internals.execution.stream-adapter-progress
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
          markdown: |-
            Exact-read and write-all completion use shared progress state and policy while
            TCP and TLS adapters retain their transport-specific host calls and ownership.
            These are short adapter-specific loops, rather than one erased-interface
            implementation: keeping each concrete call path avoids boxing through an erased
            stream interface and avoids copying buffers merely to share loop structure. The
            shared `exact-read-progress` and `write-progress` policy is implemented in
            `crates/terrane-compiler/src/core/streams.trn`; concrete async adapters are in
            `networking.trn` and `tls.trn`.
    - id: async-analysis-boundaries
      title: Separate async liveness and ownership analyses
      blocks:
        - type: rule
          id: rule.internals.execution.async-analyses-share-throwable-query
          level: must
          since: null
          evidence:
            - structured-task-group
            - task-group-failure-finally
          markdown: |-
            Scoped-group liveness uses a set of source spans rather than the ownership
            analysis `FlowEnv`, so its transfer walk remains separate instead of forcing
            both analyses into one state representation. It deliberately shares the
            canonical fixed-point escaping-throwable query, along with the language's
            branch/finally structure and exit validation; this avoids duplicating effect
            inference while retaining distinct liveness and ownership state. The rationale
            is recorded beside the walker in
            `crates/terrane-compiler/src/semantics/task_groups.rs`; throwable inference is
            in `semantics/contracts.rs`.
    - id: host-intrinsic-abi-names
      title: Private host intrinsic argument mapping
      blocks:
        - type: rule
          id: rule.internals.execution.intrinsic-abi-names-explicit
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
          markdown: |-
            Private host intrinsics have no source `FunctionContract`. The byte-buffer and
            TCP/TLS bridge adaptations therefore record ABI parameter names alongside
            resolved intrinsic identities and use parameter roles for argument conversion,
            rather than deriving names from a nonexistent source contract or scattering
            positional-index rules. The mapping and its rationale are in
            `crates/terrane-compiler/src/lowering/emitter/calls.rs`; when adding a bridge
            operation, update those names and semantic return inference as well as Rust
            emission.
    - id: callback-snapshot-ownership
      title: Async callback snapshots and erased ownership
      blocks:
        - type: rule
          id: rule.internals.execution.callback-snapshots-preserve-erased-ownership
          level: must
          since: null
          evidence:
            - rust-dependency-callbacks
          markdown: |-
            Foreign cancellation shielding can require an owned receiver snapshot for a
            private async callback. For a resource-owning erased interface, that internal
            snapshot operation does not restore public cloneability or separation on the
            owning erased interface: cloning an owning stream value would conflict with
            transfer-based ownership. The compiler emits a private callback-snapshot hook
            only for that boundary; the source comment is in
            `crates/terrane-compiler/src/lowering/emitter/items/objects.rs`, with its use in
            `items/projected_interfaces.rs`. The broader owning byte-I/O contract is in
            `crates/terrane-compiler/src/core/streams.trn`.
    - id: heterogeneous-selection
      title: Selection state and cancellation runtime
      blocks:
        - type: rule
          id: rule.internals.execution.selection-is-activation-local
          level: must
          since: null
          evidence:
            - heterogeneous-select
            - select-pending-wakeup
            - select-concurrent-activations
            - select-task-outcomes
            - select-async-closure
            - select-cleanup-shield
            - rust-dependency-async-function
          markdown: |-
            Lowering emits one fairness cursor in the actual async callable activation that
            owns each static `select`, including anonymous async functions. Each case
            retains a distinct pinned future and typed result slot; no helper task or
            universal result box is used.

            Source-only selection uses the cooperative poll-future support. Task scopes,
            asynchronous finalization, or projected async cases select native cancellation
            support through ordinary execution requirements. Once a winner is fixed, one
            finalization guard shields the complete reverse-order loser drain. Native
            cancellation continues polling the suspended selection while cleanup depth is
            nonzero rather than dropping it before nested cleanup can finish.
    - id: mutable-async-callables
      title: Mutable async callable serialization
      blocks:
        - type: rule
          id: rule.internals.execution.mutable-async-callables-serialize
          level: must
          since: null
          evidence:
            - mutable-async-overlap-serialization
          markdown: |-
            Generated mutable async callable values own one invocation gate. Bound-method
            adapters acquire it through `TerraneAsyncMutableState::with_receiver`; anonymous
            functions acquire the same kind of gate around their complete generated body.
            The gate spans suspension, while committed capture and receiver values use only
            short synchronous snapshot and commit locks.

            Separating a callable clones its committed environment and creates an
            independent gate. Per-call handles share the original gate. This distinction
            permits separation while a call is suspended without allowing overlapping calls
            through one callable value to lose updates.
    - id: readiness-io
      title: Readiness-native network I/O
      blocks:
        - type: rule
          id: rule.internals.execution.network-io-uses-readiness
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
            - networking-readiness-outcomes
          markdown: |-
            Generated TCP connect, listener accept, TCP read/write, UDP send/receive, and
            TLS handshake/read/write/shutdown futures poll nonblocking descriptors through
            the package's selected Tokio runtime. Cancellation wakes pending operations
            through the same compiler-owned signal used by task scopes, and deadlines race
            the readiness future without consuming an executor worker.

            Host-name connection delegates only DNS resolution to Tokio's blocking pool,
            then races resolved socket candidates asynchronously. Standalone DNS lookup and
            standard-stream reads remain explicit blocking-delegation requirements because
            their current host interfaces do not expose portable readiness.

            The platform-support saturation test fixes both executor-worker and
            blocking-pool capacity at one while completing substantially more concurrent
            socket operations. This guards the architectural boundary: readiness-capable
            network operations must not regress to universal `spawn_blocking` offload.

            Native TCP handoff detaches the stored transport through
            `terrane-platform-support/src/networking_native.rs`; it does not duplicate or
            register a socket for each subsequent read/write. Already registered transports
            retain their reactor identity. TLS upgrades and native handoff share one
            detach/register implementation: busy registrations are restored, and an
            unregistered socket remains retained until registration of a duplicate succeeds.
            Listener accepted settings are installed before listening; inheritance by
            already-queued native accepts is verified on Linux, not on every target.

            Core native type metadata binds the actual resolved Tokio dependency owner
            before the projection oracle checks ecosystem generic bounds. This private
            dependency participates in both the oracle workspace and emitted Cargo
            inventory; source applications need not redeclare Tokio. CLI, conformance, and
            oracle builds publish the same platform sources through
            `terrane_compiler::write_platform_support`, preventing divergent embedded
            transport implementations.

            Runtime-owner preparation is requested by authored native TCP type imports or
            `into-native` calls, not ordinary `/core/networking` or TLS imports. The call
            gate runs before receiver typing, so an authored method with the same
            `into-native` spelling conservatively requests preparation as well.

            Core native metadata supplies type equivalence, not ownership of a projected
            public API. Projected-source rendering excludes bundled core carriers from
            declaration selection so opaque aliases cannot replace a projected type's
            constructors or methods.
    - id: cancellation
      title: Wake-driven cancellation and cleanup
      blocks:
        - type: rule
          id: rule.internals.execution.cancellation-preserves-finally
          level: must
          since: null
          evidence:
            - cancelled-foreign-await-runs-finally
            - cancelled-nested-finally-order
            - cancelled-finally-error-wins
            - borrow-parameter-in-async-finally
          markdown: |-
            Native task scopes share a compiler-owned cancellation state that registers and
            wakes suspended task wakers. Cancellation requests and effective deadlines
            therefore wake blocked tasks directly; native scope execution does not poll
            cancellation with a periodic timer.

            Lowered asynchronous `try` regions with `finally` install nested finalization
            guards. Only the innermost active guard may observe the request; it drops the
            pending Rust future, including operation-only foreign owners, before generated
            `finally` dispatch runs. The guard then exposes cancellation to its parent.
            Cleanup runs exactly once in innermost-first order, and cleanup containing
            `await` remains protected until the outermost guard releases the request to the
            scoped-task result boundary. Guard state is compiler-internal, cannot be caught
            as a Terrane throwable, uses no Rust panic or unwind control flow, and does not
            alter dependency panic policy.

            A cleanup failure replaces pending cancellation only while shaping that child's
            result: the child reports an error rather than cancellation. It does not clear
            the compiler-owned scope cancellation signal, which remains visible to other
            child guards and join outcomes.

            The native cancellation support is assembled from
            `crates/terrane-compiler/src/runtime/async_native.rs`; scope state and join
            outcome shaping live in the selected `tasks_native_local.rs` or
            `tasks_native_parallel.rs` template; finalization guards and cleanup dispatch
            are emitted by `crates/terrane-compiler/src/lowering/emitter/statements.rs`.
    - id: task-ownership-lowering
      title: Task ownership across the lowering boundary
      blocks:
        - type: rule
          id: rule.internals.execution.task-transfer-is-source-semantic
          level: must
          since: null
          evidence:
            - rejoined-task-scope-child
            - structured-task-scope
            - throwing-scoped-task
          markdown: |-
            Terrane task and scoped-task values are statically non-copyable. Passing an
            unpolled task into `scope.spawn`, passing a child into `scope.join`, and
            awaiting a task consume their source bindings automatically. Semantic ownership
            analysis records those transfers, rejects a later use with `T0058`, and
            separately rejects a task that reaches the end of its scope unconsumed.

            Lowering does not need a source `move` node to realize this contract. The
            generated Rust task or child value is passed by value into the selected runtime
            helper, so Rust performs the concrete ownership move required by its
            representation. Source transfer recognition lives in
            `crates/terrane-compiler/src/semantics/ownership.rs`; task consumption
            obligations live in `crates/terrane-compiler/src/semantics/bindings.rs`; Rust
            call emission lives in `crates/terrane-compiler/src/lowering/emitter/calls.rs`.

            When spawning a freshly constructed asynchronous invocation, lowering selects
            its throwing ABI through the same contract lookup used for an ordinary await. A
            failed invocation becomes a failed task outcome with an error, not a completed
            outcome whose value is a native Result. Callable spawning retains the callable's
            own throwing ABI.
    - id: task-groups
      title: Structured task groups
      blocks:
        - type: rule
          id: rule.internals.execution.task-groups-join-all
          level: must
          since: null
          evidence:
            - structured-task-group
            - task-group-failure-finally
            - task-group-parent-cancellation
          markdown: |-
            The public `task-group` provides a flat structured workflow: create a group,
            call `group.spawn;(work; args)`, then consume it with
            `outcomes = await group.drain;`. Outcomes preserve spawn order and are
            `TaskOutcome` values with the canonical `completed`, `cancelled`, `value`, and
            `error` fields. A child failure promptly cancels siblings, while every child is
            still joined and its finalizers run. Parent cancellation likewise waits for
            child cleanup.

            Draining is consuming and awaited on every exit path: groups cannot be aliased
            or allowed to escape undrained. Group-aware function frames establish cleanup
            context even when called by foreign callers. This structured API does not expose
            Tokio or require a public Tokio dependency.

            As a defensive native boundary, dropping an undrained group requests child
            cancellation immediately. With an enclosing async cancellation context, its join
            state is retained until boundary cleanup, which still joins children and their
            finalizers. The group and unfinished cleanup can therefore remain retained until
            that boundary is reached; dropping does not synchronously finish cleanup before
            a surrounding catch. Rust `Drop` cannot await finalizers, so this fallback does
            not replace the source requirement to drain before leaving the owning scope.

            Generated group-aware frames establish this context for foreign invocation too.
            Raw native callers that bypass those frames and drop an undrained group without
            a cancellation context receive only last-resort cancellation and handle abort,
            not an awaited-finalizer guarantee. This defensive path is not a supported
            source-level scope-exit strategy. The native implementation is in
            `crates/terrane-compiler/src/runtime/task_groups_native.rs`.
