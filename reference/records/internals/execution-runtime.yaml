documentation:
  status: complete
  title: Execution requirements and runtime selection
  title-style: text
  summary: >-
    Describes how semantic analysis records runtime-neutral execution needs and
    how lowering selects only the generated async support required to satisfy
    them.
  tags:
    - compiler-internals
    - semantics
    - lowering
    - async
    - runtime
  sections:
    - id: requirements
      title: Runtime-neutral execution requirements
      blocks:
        - type: rule
          id: rule.internals.execution.requirements-remain-runtime-neutral
          level: must
          since: null
          evidence:
            - rust-dependency-async-function
            - projected-async-local-task-threaded
          markdown: |-
            Semantic analysis represents execution needs as compiler-owned
            requirements for runtime context, wake support, blocking
            delegation, local tasks, and transferable tasks. These requirements
            do not name Tokio or another concrete executor.

            Function-level requirements propagate through callable contracts.
            The package aggregate merges the requirements of its asynchronous
            entrypoint and referenced asynchronous functions. An asynchronous
            entrypoint requires runtime context and wake support; scoped tasks
            require wake support; asynchronous host operations that cannot be
            implemented directly as non-blocking polling also request blocking
            delegation.

            The model rejects incoherent combinations: runtime context or task
            execution requires wake support, and blocking delegation requires a
            runtime context. The representation and consistency checks live in
            `crates/terrane-compiler/src/execution.rs`; semantic aggregation
            lives in `crates/terrane-compiler/src/semantics/bindings.rs`.

    - id: strategy
      title: Runtime selection boundary
      blocks:
        - type: rule
          id: rule.internals.execution.strategy-selection-is-centralized
          level: must
          since: null
          evidence:
            - rust-dependency-async-function
            - projected-async-local-task-threaded
          markdown: |-
            The package manifest's `cooperative` and `threaded` executor
            profiles map to the compiler-owned `Local` and `Parallel`
            execution strategies. Semantic analysis and source diagnostics use
            those strategies and generic requirements; concrete runtime support
            is selected later at the lowering boundary.

            Lowering chooses the local or parallel executor template in
            `crates/terrane-compiler/src/lowering/emitter/pipeline.rs`. Keeping
            this selection at one boundary prevents runtime-library types from
            leaking into semantic contracts and gives a replacement executor a
            single integration seam.

    - id: generated-support
      title: Demand-driven generated support
      blocks:
        - type: rule
          id: rule.internals.execution.support-is-demand-driven
          level: must
          since: null
          evidence:
            - async-await
            - cooperative-task-scope
            - networking-tcp-loopback
            - rust-dependency-async-function
          markdown: |-
            Lowering emits async runtime support only for a package that uses
            asynchronous functions. It adds a selected entrypoint executor only
            for an asynchronous `main`, projected-future support only when a
            referenced projected async function exists, and task-scope support
            only when the semantic package uses a scope.

            An asynchronous entrypoint is wrapped in exactly one selected
            wake-driven runtime. The generated Cargo dependency and support
            modules follow the same semantic decision so synchronous packages
            do not acquire an unused runtime. Generated module assembly remains
            deterministic for identical semantic input.
    - id: task-ownership-lowering
      title: Task ownership across the lowering boundary
      blocks:
        - type: rule
          id: rule.internals.execution.task-transfer-is-source-semantic
          level: must
          since: null
          evidence:
            - rejoined-task-scope-child
            - structured-task-scope
          markdown: |-
            Terrane task and scoped-task values are statically non-copyable.
            Passing an unpolled task into `scope.spawn`, passing a child into
            `scope.join`, and awaiting a task consume their source bindings
            automatically. Semantic ownership analysis records those
            transfers, rejects a later use with `T0058`, and separately rejects
            a task that reaches the end of its scope unconsumed.

            Lowering does not need a source `move` node to realize this
            contract. The generated Rust task or child value is passed by value
            into the selected runtime helper, so Rust performs the concrete
            ownership move required by its representation. Source transfer
            recognition lives in
            `crates/terrane-compiler/src/semantics/ownership.rs`; task
            consumption obligations live in
            `crates/terrane-compiler/src/semantics/bindings.rs`; Rust call
            emission lives in
            `crates/terrane-compiler/src/lowering/emitter/calls.rs`.

  see-also:
    - lang.functions.asynchronous
    - std.networking.operations

provenance:
