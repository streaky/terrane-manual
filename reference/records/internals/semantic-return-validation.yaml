documentation:
  status: complete
  title: Semantic return validation
  title-style: text
  summary: >-
    Explains how concrete function and method returns are checked before Rust
    lowering and how one conservative static-member post-condition is proved.
  tags:
    - compiler-internals
    - semantics
    - control-flow
    - diagnostics
  sections:
    - id: concrete-return-contracts
      title: Concrete return contracts
      blocks:
        - type: rule
          id: rule.internals.semantics.concrete-return-contracts
          level: must
          since: null
          evidence:
            - ordinary-method-wrong-return
            - method-fallthrough
          markdown: |-
            Every concrete top-level function and class method body enters the
            same control-flow validator. Each reachable `return` is checked
            against the semantic result type before lowering; incompatible
            values receive T0015 at the source return rather than reaching
            rustc. Empty projected or declaration-only bodies remain outside
            concrete-body validation.

    - id: initialized-static-optional
      title: Initialized static optional
      blocks:
        - type: rule
          id: rule.internals.semantics.initialized-static-optional
          level: must
          since: null
          evidence:
            - optional-member-post-if-return
            - static-class-singleton
          markdown: |-
            Return validation proves a static `T|none` member present after one
            preceding sibling `if member == none` with no `else` directly
            assigns exactly one compatible `T` value to that same textual
            member. Any other write in the branch or between the guard and
            return invalidates the proof. This is deliberately not general
            member-expression dataflow; unsupported shapes retain their
            optional type and are rejected at the source boundary.

