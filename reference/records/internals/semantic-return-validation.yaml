documentation:
  status: complete
  title: Semantic return validation
  title-style: text
  summary: >-
    Explains how concrete function and method returns are checked before Rust lowering and how one conservative static-member
    post-condition is proved.
  tags:
    - compiler-internals
    - semantics
    - control-flow
    - diagnostics
  sections:
    - id: concrete-return-contracts
      title: Concrete return contracts
      blocks:
        - type: rule
          id: rule.internals.semantics.concrete-return-contracts
          level: must
          since: null
          evidence:
            - ordinary-method-wrong-return
            - method-fallthrough
            - closure-return-contracts
            - closure-void-rust-return
            - closure-void-value-return
            - closure-return-fallthrough
            - closure-bare-return
            - closure-return-type-mismatch
            - closure-nested-return-mismatch
            - closure-loop-boundary
            - closure-async-return-mismatch
          markdown: |-
            Every concrete named or anonymous function and class method body enters the same
            control-flow validator with its own semantic contract and a fresh loop depth.
            Discovery recurses through callable bodies to find nested declarations; the
            per-body flow walk does not descend into nested callables using the outer
            contract. Each reachable `return` is checked against the result type before
            lowering; incompatible or missing values and value-returning bodies that may
            fall through receive T0015 rather than reaching rustc. Empty projected or
            declaration-only bodies remain outside concrete-body validation.
    - id: initialized-static-optional
      title: Initialized static optional
      blocks:
        - type: rule
          id: rule.internals.semantics.initialized-static-optional
          level: must
          since: null
          evidence:
            - optional-member-post-if-return
            - static-class-singleton
          markdown: |-
            Return validation proves an exact static `T|none` member present only when a
            preceding sibling `if member == none` or `if none == member` has no `else`,
            directly assigns exactly one compatible `T` value to that same textual target,
            has no other target write, and no intervening sibling rewrites it before the
            return. This return-only postcondition is deliberately not general in-block
            member-expression narrowing and never applies to instance members; unsupported
            shapes retain their optional type and are rejected at the source boundary.
  see-also:
    - lang.functions.declarations
    - lang.types.optional-refinement
implementation:
  compiler:
    - crates/terrane-compiler/src/semantics/scope_validation.rs
