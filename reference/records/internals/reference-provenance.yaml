documentation:
  status: complete
  title: Reference provenance and native lowering
  title-style: text
  summary: >-
    Records the compiler-owned reference path proof and representation selection.
  tags: [compiler, semantics, references, provenance, lowering]
  sections:
    - id: representation
      title: Semantic representation
      blocks:
        - type: markdown
          markdown: |-
            `ReferenceProvenance` records the owner span, selected external-lender parameter
            span, ordered `Field`, `Element`, and `CallResult` projections, and the first
            lifetime-ending source span. Analysis copies this record through parentheses,
            reference bindings, captures, borrowed iteration, and selected-lender calls; it
            adds projections for member access, supported list/map/unordered-map indexing,
            returned call results, and borrowed iteration targets. Reference-return lender
            contracts are inferred from return flow to a fixed point through calls rather
            than from arity.
    - id: rejection
      title: Escape and invalidation
      blocks:
        - type: markdown
          markdown: |-
            Local-owner and by-value-parameter return, ambiguous lender calls, unsupported
            index owners, shared-owner promotion, and any observer use after invalidating
            mutation, movement, or replacement are rejected before lowering. Async liveness
            and capture checks consume the same provenance and require the selected lender
            proof to remain valid at those boundaries.
    - id: lowering
      title: Native representation
      blocks:
        - type: markdown
          markdown: |-
            A proven bounded `ref T` is emitted as a Rust `&T`; selected return lenders
            produce explicit function/result lifetimes, field and supported
            collection-element derivation borrows the stored value directly, captured refs
            remain borrows, and borrowed list iteration yields `&T`. Only explicit
            `shared ref T` storage uses `Arc<TerraneSharedCell<T>>`, whose checked mutex
            rejects same-thread reacquisition before waiting. When an ordinary ref observes
            that same explicitly shared owner, it remains non-owning through a `Weak`
            handle. No ordinary reference is silently promoted to ownership.
            Reference-address lowering records an internal `S9005` diagnostic and aborts
            compilation if a semantically admitted provenance shape has no native lowering
            arm. The compiler does not panic or pass a partial generated program to Cargo
            when semantic and lowering support drift apart.

            Inside a proven present optional branch, taking a reference borrows the payload,
            not the optional storage and not a cloned snapshot. Native mutable-reference
            inference selects a mutable payload borrow when a called helper writes through
            that reference; subsequent reads observe the mutation in the original optional.

            Comparing an optional binding or stored field with `none` inspects its physical
            optional storage without cloning or moving the payload. This also applies after
            local flow refinement and through a shared owner's checked guard. Stored object
            fields, inherited field getters and task-outcome fields use a read borrow; the
            receiver is evaluated once and the Boolean query completes before its guard is
            released. The presence query does not borrow an already-unwrapped payload.
            Computed properties retain their ordinary value-producing semantics.

            A narrowed shared-local read projects the payload under its checked guard,
            rather than matching the shared handle. Owned reads copy or snapshot that
            payload without transferring the shared carrier; display uses the payload borrow
            inside its own operand scope. Presence and display results release their guard
            before the next function or format argument is evaluated. For a potentially
            unassigned local, handle capture and payload access first check the outer
            availability wrapper, which is distinct from the inner optional payload.

            Mutable calls, field/index writes and nested collection updates reuse the same
            refinement selection as value reads, projecting the live guarded payload rather
            than a snapshot or the optional carrier. The selected owner is staged before
            arguments or the right-hand side; the guard and payload projection are evaluated
            only when that live receiver is used. Read-only field-presence queries use the
            corresponding immutable projection inside their operand scope.

            Assignment destinations still read their receiver and index expressions.
            Point-specific flow facts for those reads are recorded alongside right-hand-side
            facts, while assignment to a whole binding remains a write that can invalidate
            its previous refinement.

            Shared-async source dispatch selects a handle-taking helper only when receiver
            lowering actually produces that helper's handle binding. An outer receiver's
            shared handle does not independently own an inline child object. Shared and
            mutable async calls on such a field of async `this` receive `T0135` before
            lowering; they do not emit an unbound helper argument or silently snapshot a
            child to change invocation identity. Explicit owned snapshots and fields that
            already contain an owning shared handle retain their separate supported paths.
