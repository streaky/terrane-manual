documentation:
  status: complete
  title: Future open decorative modifiers
  title-style: text
  summary: >-
    Preserves the planned package-defined `with` modifier protocol for declaration realization outside the selected Terrane
    source surface.
  tags: [future, compiler-internals, syntax, modifiers, declaration-realization]
  sections:
    - id: status
      title: Planned status
      blocks:
        - type: admonition
          kind: important
          title: Additional modifier operations remain planned
          markdown: >-
            General lexical `with` resolution, typed modifier contracts, and the structural
            `scoped-access` region are implemented. The realization operations illustrated
            on this page and package-defined type constructors remain future work. An
            unsupported operation is rejected, not accepted as a no-op.
    - id: structural-boundary
      title: Structural and decorative boundary
      blocks:
        - type: markdown
          markdown: |-
            The protocol distinguishes compiler-defined structural operations from
            package-supplied realization properties. Structural operations have explicit
            compiler-owned semantics: `scoped-access`, for example, bounds acquisition,
            borrowing, name visibility, and destruction. Arbitrary package modifiers cannot
            redefine those guarantees or replace structural keywords such as `global`,
            `constant`, visibility qualifiers, or callable qualifiers.

            Decorative modifiers instead describe how an already-understood declaration is
            realized: storage, layout, linkage, ABI, section placement, or alignment. This
            makes the modifier vocabulary open to packages without making Terrane's
            structural declaration grammar or semantic guarantees replaceable.
    - id: syntax
      title: Planned clause syntax
      blocks:
        - type: markdown
          markdown: |-
            A `with` clause precedes structural declaration keywords. It begins with
            `with`, contains comma-separated modifier expressions, and applies them from
            left to right through ordinary lexical resolution. A modifier with arguments
            uses a parenthesized call form; the clause itself has no wrapping parentheses.
        - type: example
          id: planned-with-modifiers
          title: Planned declaration realization modifiers
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            with per-cpu, aligned global counts unsigned-long = 0
            with per-cpu, (aligned; 64) global x int = 0
          response: null
          diagnostic: null
          markdown: >-
            These realization operations are planned, not currently supported modifier
            operations. Their syntax uses the general clause machinery.
        - type: markdown
          markdown: |-
            A comma requires another modifier. The declaration begins after the first
            modifier expression not followed by a comma, so a trailing comma is invalid. In
            `with per-cpu, global x = 0`, `global` is read as the next modifier and rejected
            because it is a structural word rather than a modifier.
    - id: semantic-boundary
      title: Planned semantic boundary
      blocks:
        - type: markdown
          markdown: |-
            A `with` clause may decorate any declaration, including an untyped local
            binding. Its use must remain independently answerable: which package supplied
            the modifier, what declaration forms it accepts, what realization it requests,
            how it composes, and what lowering it requires. `with global` is invalid because
            `global` remains a compiler-owned declaration form.

            The general machinery is closed in its semantic operations, not hard-coded to
            one source spelling. Modifier identities and typed payloads resolve through
            their package declarations. Future realization operations must define their
            lowering and composition contracts before admission; they cannot introduce
            hidden visibility, ownership, or callable-contract changes.
  see-also: []

