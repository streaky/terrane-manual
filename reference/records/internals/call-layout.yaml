documentation:
  status: complete
  title: Lexer and parser contract for call layout
  title-style: text
  summary: >-
    Records how physical-line indentation activates call arguments and member-chain parsing without changing normalized expression semantics.
  tags:
    - compiler-internals
    - lexer
    - parser
    - layout
    - calls
  sections:
    - id: lexer-activation
      title: Lexer activation and delimiter scope
      blocks:
        - type: rule
          id: rule.internals.parser.call-layout-lexer
          level: must
          since: null
          evidence: []
          markdown: |-
            The lexer preserves its ordinary layout-free behavior inside parentheses until a
            continuation form activates layout in that parenthesis scope. For each ordinary
            parenthesis scope it records the opener line's indentation-prefix byte count,
            current indentation-stack depth, previous substantive line's indentation, and
            whether the opening `(` is immediately after the header semicolon of a function
            declaration or anonymous-function header. Only that parameter-header parenthesis
            cannot activate call layout; a function type earlier in an annotation does not
            make unrelated parentheses parameter headers. The scope also tracks its active
            state, the latest call-marker line indentation, and whether it has an implicit
            indentation baseline.

            A substantive line can activate layout only when it is deeper than the opener
            baseline. A leading-dot continuation additionally must be deeper than the
            previous substantive line in that scope; comments before the dot are skipped
            when identifying its first code character. An argument continuation follows a
            bare semicolon at the end of the preceding substantive line and is deeper than
            that line. A callable header retains its body marker through its parameter list,
            including grouped/default parameters; function types are not body headers.
            Parentheses with ordinary inline arguments retain free-form wrapping. The state
            is scoped to its parenthesis. Previous-line indentation advances on substantive
            lines, so an equal-indent dot is not a continuation.

            At activation, the previous substantive line's indentation becomes the scoped
            layout baseline. When it is deeper than the existing indentation stack, the
            lexer tracks it as an implicit baseline without emitting an `INDENT`; only an
            actual deeper child line emits the structural `INDENT`. Activation emits the
            deferred logical newline before that transition. Once active, layout tokens are
            emitted for physical layout boundaries. A parallel block-kind stack
            distinguishes statement bodies, argument blocks, chain blocks, and
            operand-wrapping indentation. In argument blocks, expression-start
            classification ignores layout trivia: commas and call markers permit negative
            values and text markers, while an operand followed by `>` remains a comparison.
            Dedent ending a nested argument or chain block establishes a fresh outer
            argument boundary; a wrapping dedent does not. Blank/comment-only lines do not
            change nesting. Text markers and their literal contents remain opaque to layout
            recognition. The matching `)` drains levels introduced in its scope and removes
            any implicit baseline without emitting a spurious outer `DEDENT`. Existing
            prefix consistency and dedent rules continue to apply: indentation counts
            leading bytes, mixed or file-style-switched tabs and spaces are rejected, and a
            dedent must match an established level.
    - id: parser-normalization
      title: Parser block recognition and normalization
      blocks:
        - type: rule
          id: rule.internals.parser.call-layout-normalization
          level: must
          since: null
          evidence: []
          markdown: |-
            The parser recognizes a layout block only after the completed expression's
            newline(s) and `INDENT`. A first substantive `.` selects the chain-block parser;
            otherwise a layout block following a call marker is an argument block. Each
            argument layout records the parser's grouping depth when it opens. Column
            sealing applies at that depth; grouping opened inside this layout suppresses
            sealing only for its contents. Enclosing parentheses therefore preserve
            statement-layout ownership. This grouping depth is distinct from the lexer's
            indentation baseline. Commas separate sibling arguments in every call form; line
            breaks and indentation within an active block are whitespace. Dedent closing
            layout opened within an argument implicitly ends that argument. A comma belongs
            to the block where it appears; if its next argument would begin after dedent or
            a closing/end boundary, report `S1122` at the comma. Dedent already ends the
            list, so remove a comma before a deeper inline continuation dedents. Trailing
            commas are rejected in inline, layout, and grouped calls, but parameter lists
            are unaffected. A nested inline call at an argument-line root owns same-line
            arguments and deeper continuation lines, but its inline extent ends before the
            first following substantive line whose indentation is less than or equal to the
            nested call's own line. An end-of-line comma on that call line belongs to the
            outer call when the next line is not deeper. Thus `opt; 'a',` followed by an
            aligned `'b'` is `wrap(opt('a'), 'b')`; same-line `opt; 'a', 'b'` keeps both
            arguments in `opt`, as does a deeper `b` after `opt; 'a',`. Outer parentheses
            around active layout preserve its column ownership. Only parentheses opened
            within that layout, around nested calls/lists or operands, suppress the rule
            within their grouping. Structural nested argument blocks retain their dedent
            boundaries; a comma inside such a block cannot cross its closing dedent.

            This rule intentionally makes reindentation meaningful and preserves mixed
            layout/parenthesized syntax; there is no strict alternative syntax. An inline
            nested call followed by another outer argument on the same line remains
            ambiguous and reports `S1016`; parenthesize that inline form. A dangling binary
            operator after an inline nested call cannot take an operand from the same or a
            shallower column: report one `S1122`, with help to indent the continuation or
            parenthesize its operand, and do not emit a secondary separator diagnostic.
            Missing separators and trailing or cross-dedent commas continue to report
            `S1122`.

            Chain parsing requires each sibling continuation to begin with `.` and builds
            ordinary `MemberExpression` nodes, followed by ordinary postfix/call parsing.
            Argument blocks attach to the call that introduced them. Parsing a chain creates
            no intermediate bindings or special chain node; the result is the same nested
            member/call expression shape as its explicitly grouped equivalent. Prefix
            `await` continues to own its full parsed operand, including its layout chain.

            Block-bearing statement headers suppress unparenthesized expression layout,
            preserving the following indentation for their statement bodies. The parser's
            `layout_header` context covers `if`, `while`, `for`, `switch`, `match`, and
            `select`; explicit expression/argument parentheses reopen expression layout.
            Each nested body statement establishes its own context so a header cannot
            suppress layout in its body.

            In parentheses, the lexer activates layout only under the contextual rules
            above; a parenthesis close bounds recursive argument and chain parsing.
            Parentheses without an activated continuation retain free-form expression
            wrapping. Operator continuations within one argument remain non-structural
            whether the call is parenthesized or not; this is not general operator
            continuation.
    - id: malformed-boundaries
      title: Malformed layout recovery
      blocks:
        - type: markdown
          markdown: |-
            `S1122` reports an invalid argument boundary: a missing comma between arguments,
            a comma without a following argument, a trailing comma, or a comma whose next
            argument would begin after dedent, `)`, end of statement, or end of input. For
            block-boundary commas, the diagnostic points at the comma. Dedent closing layout
            opened within an argument implicitly ends that argument and is not itself an
            error. `S1123` reports a sibling in a chain block that does not begin with `.`
            or a missing chain-block terminator. Recovery advances to a line boundary and
            resumes within the owning block where possible. Existing member diagnostics
            still apply, including `S1014` when `.` is not followed by a member name and
            `S1013` when whitespace separates `.` from that name. The parser does not
            reinterpret malformed layout as implicit invocation or operator continuation.

            The trailing-comma ban intentionally tightens the previously accepted inline and
            grouped call syntax as well as new layout calls. It is chosen before release:
            relaxing an error later preserves accepted programs, whereas adding a
            restriction after callers adopt it would break them. Parameter-list trailing
            commas are a separate permission and remain unchanged. Argument newlines no
            longer decide whether a leading minus or text marker starts another argument;
            only a comma or a completed nested layout boundary can establish that argument
            position.
