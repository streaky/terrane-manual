kind: topic

surface: null

lifecycle:
  status: current
  stability: experimental
  since: "0.1"
  deprecated-since: null
  removed-in: null
  replacement: null

documentation:
  status: complete
  title: Diagnostic catalog
  title-style: text
  summary: >-
    Explains diagnostic families, classification, and correction, with a generated compiler-backed code inventory for exact
    lookup.
  tags: [tooling, diagnostics, errors, limitations, search]
  sections:
    - id: generated-index
      title: Generated code inventory
      blocks:
        - type: markdown
          markdown: |-
            `generated/diagnostics.yaml` is the machine-readable index of stable diagnostic
            codes found in production compiler sources. Each entry records the code,
            candidate emitted message templates, and compiler source locations.
            `tools/generate_manual_catalog.py --check` verifies that it matches the selected
            compiler checkout.

            The generated inventory answers whether a code exists and where its invariant is
            enforced. Authored sections on this page add rejected and corrected examples and
            classify a diagnostic as settled semantics or a temporary implementation
            limitation. If a generated entry has no authored guide yet, treat its message
            and source location as lookup data—not as a new language rule.

            Extraction excludes `tests.rs`, `tests/` directories beneath the compiler source
            root, and conventional `#[cfg(test)]` modules. It is a static lookup, not a Rust
            macro expander or a general conditional-compilation evaluator. Message
            extraction uses a nearby-string heuristic, so it can miss alternate message
            branches; source locations remain the authority for exact behavior.
    - id: opt-in-checks
      title: Opt-in compilation checks
      blocks:
        - type: markdown
          markdown: |-
            Ordinary compilation does not enable the optional name-style or unused-function
            inventories. Enable them explicitly when reviewing authored source. These
            advisories are warnings, not compilation failures, and do not rewrite source.
        - type: table
          id: optional-check-flags
          title: Optional checks
          show-header: true
          columns:
            - id: flag
              title: Flag
              cell: code
            - id: effect
              title: Effect
              cell: markdown
          rows:
            - flag: --lint-name-style
              effect: Emit `S2018` warnings for authored declaration names that are not kebab-case.
            - flag: --lint-unused-functions
              effect: Emit `W4005` warnings for authored top-level functions with no resolved references.
            - flag: --require-canonical-rust
              effect: Require generated Rust to match the bundled Rust formatter's canonical output; failure is an `S9004` error, not an advisory.
        - type: example
          id: optional-check-commands
          title: Check a source file
          language: sh
          mode: illustrative
          source: |-
            terrane check --lint-name-style app.trn
            terrane check --lint-unused-functions app.trn
            terrane check --require-canonical-rust app.trn
        - type: markdown
          markdown: |-
            The flags can be combined. Canonical-Rust validation checks compiler output,
            including the generated artifacts selected for the compilation; it is not the
            Terrane source formatter. Use `terrane fmt` to format authored Terrane.
    - id: s2018
      title: S2018 — declaration name style
      blocks:
        - type: markdown
          markdown: |-
            With `--lint-name-style`, authored binding, function, and type declaration names
            are checked for kebab-case. Each declaration is checked in its defining source
            file, so an imported declaration is not reported again in dependent files.
            Projected dependency names remain verbatim, and synthesized anonymous-function
            labels are excluded. Intentionally unused bindings whose names start with `_`
            are excluded from this style inventory.

            An authored style warning does not make otherwise valid source invalid.
            Compiler-owned bundled declarations are checked separately and can produce an
            `S2018` error without enabling this optional authored-source lint. Invalid
            namespace segments can also produce `S2018` during normal compilation.
        - type: example
          id: s2018-warning
          title: Valid source with a name-style warning
          language: terrane
          mode: illustrative
          source: |-
            namespace app
            function main;
                Answer = 42
                print; Answer
          response:
            kind: diagnostic
            language: text
            display: shown
            content: S2018
        - type: example
          id: s2018-corrected
          title: Use a kebab-case name
          language: terrane
          mode: illustrative
          source: |-
            namespace app
            function main;
                answer = 42
                print; answer
    - id: unread-bindings
      title: W4001 and W4002 — unread bindings and stores
      blocks:
        - type: markdown
          markdown: |-
            `W4001` reports an unread binding. `W4002` reports an unread initial or
            subsequently assigned value. Reading a later value does not make an earlier
            overwritten value used.

            Reusing a local name within the same function is permitted, including in
            different control-flow branches. Declaration writes and reads follow the
            canonical flow storage identity; separate declaration spans do not make a later,
            read value an unused binding. Warning locations still identify the source store
            whose value is unread.

            Reads inside `rust` and `unsafe rust` blocks follow the same storage identity as
            ordinary source reads.

            An unused iteration target remains quiet when another loop reuses its name. A
            later iteration-target initialization is not treated as an explicit overwrite
            for this advisory. An ordinary assignment that replaces an unread iteration
            value can still receive `W4002`.
        - type: example
          id: read-redeclarations
          title: Both declared values are read
          language: terrane
          mode: illustrative
          source: |-
            namespace app
            function main;
                value int64 = 7
                print; value
                value int64 = 8
                print; value

    - id: w4005
      title: W4005 — unreferenced top-level function
      blocks:
        - type: markdown
          markdown: |-
            With `--lint-unused-functions`, an authored top-level function with no resolved
            references receives `W4005`. Calling, passing, or otherwise referencing the
            function counts as use. The entrypoint `main`, methods (instance or static), and
            nested or anonymous functions are not candidates for this top-level inventory.
            Bundled and projected dependency declarations are excluded.

            This is an opt-in inventory advisory, not proof that a function is safe to
            remove from a public API. Library exports and downstream consumers may need
            functions that the current compilation does not call.
        - type: example
          id: w4005-warning
          title: An unreferenced helper
          language: terrane
          mode: illustrative
          source: |-
            namespace app
            function helper;
                print; 'helper'
            function main;
                print; 'main'
          response:
            kind: diagnostic
            language: text
            display: shown
            content: W4005

    - id: families
      title: Diagnostic families
      blocks:
        - type: table
          id: diagnostic-families
          title: Stable code families
          show-header: true
          columns:
            - id: prefix
              title: Prefix
              cell: code
            - id: area
              title: Area
              cell: text
            - id: interpretation
              title: Interpretation
              cell: text
          rows:
            - prefix: L
              area: Lexing
              interpretation: Source character, indentation, literal, or trivia invariant.
            - prefix: S
              area: Syntax and package structure
              interpretation: Parsing, name resolution, manifest, import, or source-layout invariant.
            - prefix: T
              area: Types and semantics
              interpretation: Type, ownership, call, member, control-flow, or projection-use invariant.
            - prefix: W
              area: Advisories
              interpretation: Non-blocking source guidance.

    - id: t0105
      title: T0105 — invalid or unavailable static member
      blocks:
        - type: table
          id: diagnostic-t0105
          title: T0105 contract
          show-header: true
          columns:
            - id: field
              title: Field
              cell: text
            - id: value
              title: Value
              cell: markdown
          rows:
            - field: Invariant
              value:
                A static member must exist on the selected class and, for projected Rust, must have an admitted representation
                and contract.
            - field: Classification
              value: Source or temporary implementation error, depending on the declined member reason.
            - field: Related references
              value: "[[tool.packages.rust-dependencies#integration-boundaries]]"

        - type: example
          id: t0105-rejected
          title: Rejected projected enum variant
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace reference-examples/projected-enum-member-rejected

            from /deps/terrane-payload-enum-witness import Event

            function event Event;
              return Event::Pair; 1, 2
          response:
            kind: diagnostic
            language: text
            display: shown
            content: T0105
          diagnostic: null
          markdown: null

        - type: example
          id: t0105-corrected
          title: Use an admitted projected variant
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace reference-examples/projected-enum-member

            from /deps/terrane-payload-enum-witness import Event

            function event Event;
              return Event::Text; 'message'
          response: null
          diagnostic: null
          markdown: |-
            The projected Rust enum exposes its public unit and supported single-payload
            variants on the projected owner. A named, multi-field, borrowed, open-generic,
            or unrepresentable variant remains an explicit declined member rather than
            silently acquiring lossy adaptation.
  see-also:
    - tool.current-limitations
    - tool.packages.rust-dependencies

