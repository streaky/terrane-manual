documentation:
  status: complete
  title: Native CPU profiling
  title-style: text
  summary: >-
    Records optimized Linux CPU samples into a versioned exact-build artifact and
    presents source-first cost accounting with generated and native evidence available.
  tags:
    - tooling
    - profiling
    - performance
    - provenance
    - perf
  sections:
    - id: commands
      title: Record and show profiles
      blocks:
        - type: rule
          id: rule.profiling.commands
          level: must
          since: null
          evidence: []
          markdown: |-
            `terrane profile record --cpu [--embed-sources]
            [--retain-arguments] [-o|--output FILE] <file-or-manifest>
            [-- arguments]` builds the exact workload with the named
            `terrane-profile-cpu-v1` profile and records the launched process tree.
            The default output is `profile.trnprof`. The workload keeps inherited
            standard input, output, and error. Its exit code remains the command exit
            code. Interrupt and termination signals are forwarded to the collector
            process group; usable partial evidence is finalized before exit.

            `terrane profile show FILE [--focus SOURCE:LINE] [--generated]
            [--native] [--format text|json] [--limit COUNT]
            [--source-root PATH] [--build-root PATH]` re-runs attribution from the
            captured evidence. The default text view reports capture conditions,
            complete accounting, hottest source groups, a source-first call tree, and
            folded flame-graph stacks. JSON is a bounded machine-readable view.
            `--generated` and `--native` expose the lower-level constituents of each
            source cost group. `--limit` bounds each expansion; rows retain pre-limit
            totals in JSON and text reports print omitted counts so clipping is never
            silent. Explicit roots relocate copied-but-identical source and build
            trees; they never change identity.

        - type: note
          id: note.profiling.platform
          style: warning
          markdown: |-
            CPU capture currently supports Linux x86-64 with the host `perf` tool and
            permission to collect user-space `cpu-clock` samples. Unsupported hosts,
            targets, missing tools, permission failures, collector failures, and
            unusable captures fail explicitly. A `.trnprof` file is compiler data and
            may contain source paths, symbol names, timing, and workload structure;
            treat it as diagnostic material rather than an anonymous report.

    - id: optimized-build
      title: Optimized exact-build evidence
      blocks:
        - type: rule
          id: rule.profiling.optimized-build
          level: must
          since: null
          evidence: []
          markdown: |-
            Profiling does not measure the debugger artifact. The
            `terrane-profile-cpu-v1` profile uses optimization level 3, line-table
            debug information, no stripping, compiler-default optimized inlining,
            ThinLTO, and one code-generation unit. This deliberately differs from the
            ordinary release profile's fat LTO so the selected sampler retains useful
            location information. Compiler lowering and Cargo emission
            consume that same profile identity. The artifact binds compiler version,
            exact Rust release and sysroot, target, toolchain-bound ABI recipe, named
            profile properties, package inputs, executable hash, generated/source
            maps, loaded module identities, and source/build relocation roots.

            The schema `1.1` evidence unit is CPU sample count. Normalized frames name
            a captured module plus load-relative offset and may carry symbol,
            generated location, and inline evidence. Collector identity and raw
            configuration, frequency and period, included processes and threads,
            elapsed and active intervals, process exit or signal state, and captured,
            lost-event, dropped-sample, and dropped-frame counts remain explicit.
            Collector loss and locally dropped samples or frames are reported and never
            redistributed into source totals.

    - id: attribution
      title: Source attribution and accounting
      blocks:
        - type: rule
          id: rule.profiling.attribution
          level: must
          since: null
          evidence: []
          markdown: |-
            Attribution schema `1.0` validates source files, generated files, the exact
            executable, and captured module identities before assigning authored cost.
            Every captured sample enters exactly one exclusive bucket: exact authored,
            shared or ambiguous, runtime-associated, generated-only, native-only, or
            unavailable. Inclusive accounting counts one semantic source group at most
            once per sample stack. Overlapping generated ranges retain every related
            source cause rather than assigning the whole event to one convenient span.
            Inlined and optimized frames remain compiler-evidence-driven; symbols are
            supplementary and are not parsed to invent source identity.

            Missing or changed files/modules and stale or unsupported identities retain
            normalized native evidence in an explicit reduced-native view. They never
            receive guessed source attribution. A CPU sample count is statistical
            evidence: the command does not relabel it as deterministic wall time,
            CPU duration, invocation count, or percentage of unobserved events.

    - id: privacy-limitations
      title: Privacy and current limits
      blocks:
        - type: rule
          id: rule.profiling.privacy
          level: must
          since: null
          evidence: []
          markdown: |-
            Authored source snapshots are excluded unless `--embed-sources` is given.
            Workload arguments are excluded from both conditions and raw collector
            configuration unless `--retain-arguments` is given. Generated Rust and
            compiler-bundled source are embedded so exact source attribution remains
            verifiable after relocation. Source paths, symbol names, and timing are
            present and declared in the artifact privacy record.

        - type: note
          id: note.profiling.deferred
          style: information
          markdown: |-
            Allocation/event profiling, live-set and retained-graph analysis, process
            memory timelines, thresholds, comparison commands, continuous-service
            capture, remote collectors, and non-Linux backends are future work. The
            typed artifact envelope is designed to admit later evidence kinds without
            weakening the CPU sample-count contract, but the current CLI does not
            advertise those modes.

  see-also:
