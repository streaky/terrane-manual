documentation:
  status: complete
  title: Native CPU and process-memory profiling
  title-style: text
  summary: >-
    Records optimized Linux CPU samples and bounded process-memory timelines into versioned exact-build artifacts, with source-first CPU cost accounting and native evidence available.
  tags:
    - tooling
    - profiling
    - performance
    - provenance
    - perf
  sections:
    - id: commands
      title: Record and show profiles
      blocks:
        - type: rule
          id: rule.profiling.commands
          level: must
          since: null
          evidence: []
          markdown: |-
            `terrane profile record --cpu [--memory-timeline] [--embed-sources] [--retain-arguments] [-o|--output FILE] <file-or-manifest> [-- arguments]`
            builds the exact workload with the named `terrane-profile-cpu-v1` profile and
            records CPU samples for the launched process tree.

            `terrane profile record --allocations [--memory-timeline] [--embed-sources] [--retain-arguments] [-o|--output FILE] <file-or-manifest> [-- arguments]`
            uses Heaptrack to interpose allocation/free operations and records normalized
            capture-local identities, sizes, collector timestamps, trace identities, matched
            frees, traffic, retained-at-exit, and peak-live accounting.

            `terrane profile record --memory-timeline [--embed-sources] [--retain-arguments] [-o|--output FILE] <file-or-manifest> [-- arguments]`
            records bounded process RSS observations. `--memory-timeline` may accompany
            `--cpu` or `--allocations`; the selected primary evidence keeps its own unit and
            the timeline remains auxiliary. CPU and allocation evidence cannot be primary in
            one capture. The default output is `profile.trnprof`. Standard streams and
            workload exit status remain observable.

            `terrane profile show FILE [--focus SOURCE:LINE] [--generated] [--native] [--format text|json] [--limit COUNT] [--compare BASELINE] [--max-allocated-bytes N] [--max-retained-bytes N] [--source-root PATH] [--build-root PATH]`
            re-runs attribution from captured evidence. The default text view reports
            capture conditions, complete accounting, hottest source groups, a source-first
            call tree, and folded stacks. JSON is bounded and machine-readable.
            `--generated` and `--native` expose lower-level constituents. `--limit` bounds
            each expansion while preserving pre-limit totals. For allocation evidence,
            `--compare` reports aggregate count, traffic, retention, and peak-live deltas
            that do not depend on inlining; allocated/retained byte thresholds render the
            report and return status 1 when exceeded. Explicit roots relocate
            copied-but-identical source and build trees; they never change identity.
        - type: admonition
          id: note.profiling.platform
          kind: warning
          markdown: |-
            CPU capture supports Linux x86-64 with host `perf` permission. The collector
            requests user-space CPU events and user-space-only DWARF callchains; it does not
            request kernel callchains. `perf_event_paranoid = 2` does not by itself require
            a weaker host setting for this capture. Other security restrictions may still
            deny access. Allocation capture requires Heaptrack and zstd; Heaptrack
            interposes allocation functions, so this is an instrumented optimized run rather
            than production-identical execution. Process-memory timelines use Linux procfs
            and report unavailable fields rather than substituting a nearby counter.
            Unsupported hosts, targets, missing tools, permission failures, collector
            failures, and unusable captures fail explicitly. A `.trnprof` file can contain
            source paths, symbols, allocation stacks, timings, and workload structure; treat
            it as diagnostic material rather than an anonymous report.
    - id: optimized-build
      title: Optimized exact-build evidence
      blocks:
        - type: rule
          id: rule.profiling.optimized-build
          level: must
          since: null
          evidence: []
          markdown: |-
            Profiling does not measure the debugger artifact. The `terrane-profile-cpu-v1`
            profile uses optimization level 3, line-table debug information, no stripping,
            compiler-default optimized inlining, ThinLTO, and one code-generation unit. This
            deliberately differs from the ordinary release profile's fat LTO so the selected
            sampler retains useful location information. Compiler lowering and Cargo
            emission consume that same profile identity. The artifact binds compiler
            version, exact Rust release and sysroot, target, toolchain-bound ABI recipe,
            named profile properties, package inputs, executable hash, generated/source
            maps, loaded module identities, and source/build relocation roots.

            Schema `1.2` uses CPU sample count for CPU captures and bytes plus independent
            event counts for allocation or process-memory evidence. Allocation events
            preserve a capture-local identity, size, collector timestamp and trace identity,
            with explicit unavailable alignment/process/thread fields and a matched free
            timestamp. Complete captures reconcile allocated bytes into freed and
            retained-at-exit bytes; unmatched, truncated, or inconsistent transitions mark
            the evidence partial. Heaptrack folded stacks retain distinct allocation-count,
            retained-byte, and peak-live-byte widths. A process timeline records its
            interval, missed intervals, timestamped RSS, and available procfs counters;
            unavailable PSS, fault, or accounting fields stay absent. Collector identity,
            raw configuration, elapsed interval, process exit state, and capture loss remain
            explicit.
    - id: attribution
      title: Source attribution and accounting
      blocks:
        - type: rule
          id: rule.profiling.attribution
          level: must
          since: null
          evidence: []
          markdown: |-
            Attribution schema `1.0` validates source files, generated files, the exact
            executable, and captured module identities before assigning authored cost. Every
            captured sample enters exactly one exclusive bucket: exact authored, shared or
            ambiguous, runtime-associated, generated-only, native-only, or unavailable.
            Inclusive accounting counts one semantic source group at most once per sample
            stack. Overlapping generated ranges retain every related source cause rather
            than assigning the whole event to one convenient span. Inlined and optimized
            frames remain compiler-evidence-driven; symbols are supplementary and are not
            parsed to invent source identity.

            Missing or changed files/modules and stale or unsupported identities retain
            normalized native evidence in an explicit reduced-native view. They never
            receive guessed source attribution. A CPU sample count is statistical evidence:
            the command does not relabel it as deterministic wall time, CPU duration,
            invocation count, or percentage of unobserved events.

            Debugger and profiler source markers use the stable
            `.trn/build/application-debug` workspace, separate from ordinary application
            builds. Profiling has its own `terrane-profile` artifact slot and does not evict
            ordinary development or release executables. Updating the inspected source and
            rebuilding that role can replace the executable referenced by an older capture;
            that capture may then report reduced native fidelity rather than finding an
            archived binary. Embedded generated source, and authored source selected with
            `--embed-sources`, remain verifiable independently; replacing the executable
            does not discard captured samples or their embedded source evidence.
    - id: sample-profile-feedback
      title: Sample-profile optimization feedback
      blocks:
        - type: admonition
          id: note.profiling.sample-profile-feedback
          kind: note
          markdown: |-
            Stable Rust sample-profile use is opt-in and adds no Terrane CLI flags or
            language changes. Repository helper `tools/sample-profile.py` exposes prepare,
            record and use operations. It prepares either a compiler Cargo release build or
            a generated application built with the normal `terrane build --release` command,
            records representative executions, then consumes the resulting LLVM profile in
            an explicit optimized build. Run `python -m unittest tools.test_sample_profile`
            to test the helper. `terrane profile record` and `terrane profile show` use
            `.trnprof` diagnostic artifacts; they do not create or consume LLVM optimization
            profiles.

            Prepare and use require the caller to explicitly set `RUSTFLAGS` or
            `CARGO_ENCODED_RUSTFLAGS`; the helper does not silently replace unresolved Cargo
            configuration flags. Supply the effective baseline flags that the build needs.
            An empty `RUSTFLAGS` is an explicit choice only when no baseline flags are
            needed. Keep this environment identical across ordinary, training and optimized
            builds. Cargo builds without explicit `--target` also apply environment
            rustflags to host-side build scripts and proc macros, so instrumentation can
            leak into them. For direct compiler Cargo builds, `--target <host>` can exclude
            those host-side units from target rustflags. Declaration-consumer tool builds
            still inherit application flags; no consumer-tool filtering is currently
            provided.

            Stable Rust function-and-line debug information (`debuginfo=limited`) is
            retained; the helper explicitly disables stripping. Line-table-only information
            can omit declaration locations needed by converters and yield unusable location
            counts. Nightly `-Zdebuginfo-for-profiling` is not required or used. Consumed
            profiles use immutable digest-named paths because cache identity hashes encoded
            rustflag text, not profile bytes. Recording requires a fresh raw capture and a
            valid converted profile. By default nonzero perf status is rejected. A negative
            perf subprocess status (signal termination) is rejected even with
            `--allow-workload-failure`; permitting positive nonzero status records perf's
            status in `capture.exit_status`, not an independently verified workload status.
            The opt-in does not waive capture freshness or profile validation. Provenance is
            staged and atomically replaced with hashes identifying the profile and raw
            capture. Old metadata is removed before those artifacts are replaced and new
            metadata is published last. Interruption can leave metadata missing; this is not
            an atomic two-file transaction. Keep profiles private to each trained program
            and workload; compiler profiles are not application profiles, and different
            applications' profiles are not interchangeable. Provenance JSON omits workload
            arguments, but raw perf data may retain command lines. Captures and profiles can
            reveal symbols, paths and workload structure; treat them as sensitive.

            Standard `llvm-profgen` conversion requires perf branch-stack/LBR data. The
            default LBR route has no end-to-end evidence on the tested non-LBR host; the
            AutoFDO route was exercised there. Install Rust's matching validator with
            `rustup component add llvm-tools`; the helper prefers the sysroot tool, but a
            `PATH` fallback may be a different version. The host's `PATH` validator and
            private AutoFDO build used LLVM 23.1.4 while rustc consumed the text feedback
            with LLVM 23.1.5; that is not a universal compatibility promise. AutoFDO
            `create_llvm_prof` writes LLVM text profiles directly. GCC feedback encodings
            are not interchangeable with LLVM sample profiles. User-space `cycles:u`
            sampling alone does not establish LBR support. Hardware, perf permissions, and
            converter availability constrain which route works. This remains an opt-in
            experimental workflow; neither host conversion nor a performance improvement is
            claimed without actual training and held-out validation.

            A parseable profile with real counts does not establish practical compiler build
            cost. Feedback can trigger pathological optimization time in Rust/LLVM
            dependency code generation. Verify the entire optimized build as well as
            held-out behavior; a successful generated-application trial does not establish
            compiler-wide readiness.
    - id: sample-profile-application-example
      title: "Worked example: optimize a generated application"
      blocks:
        - type: markdown
          markdown: |-
            This fictional command-line application counts Collatz steps. It is a small
            workflow example, not a representative application benchmark or a promised
            speedup. Only its generated executable receives feedback; the installed Terrane
            compiler is not rebuilt or optimized.

            Run these Bash commands from a Terrane repository checkout, with a current
            `terrane` on `PATH`, Python 3, stable Rust 1.100, Linux perf recording
            permission, and a compatible LLVM profile validator/converter. Set the same
            effective baseline `RUSTFLAGS` (or `CARGO_ENCODED_RUSTFLAGS`) explicitly for
            every command below; ordinary, training and optimized builds must inherit the
            identical environment. The helper will not replace unresolved Cargo flags:
            supply all effective flags your build requires. Empty `RUSTFLAGS` is appropriate
            only if no baseline flags are needed. Store source and sensitive capture data in
            a private scratch directory excluded from source hashing. Prepare, use, and any
            ordinary build used as a baseline require the explicit flags described above;
            training runs the prepared executable directly and does not build with Cargo
            rustflags.
        - type: example
          id: sample-app-setup
          title: Create private scratch space
          language: bash
          mode: illustrative
          source: |-
            set -euo pipefail
            umask 077
            # This toy uses no extra baseline flags. Replace this value if your
            # Cargo configuration or build requires flags; preserve them in full.
            export RUSTFLAGS=""
            helper="$PWD/tools/sample-profile.py"
            mkdir -p "$PWD/.trn"
            demo="$(mktemp -d "$PWD/.trn/sample-profile-demo.XXXXXX")"
        - type: markdown
          markdown: |-
            Save the following source as `$demo/main.trn`; it accepts one positive integer
            and prints a deterministic checksum.
        - type: example
          id: sample-app-source
          title: main.trn
          language: terrane
          mode: illustrative
          source: |-
            namespace sample-profile-demo
            from /core/process import native-string, arguments, exit, make-exit-status

            function main;
                supplied = (arguments;)
                if supplied.length != 1
                    exit; (make-exit-status; 2)
                limit int64 = (supplied[0].text.radix; 10)
                if limit <= 0
                    exit; (make-exit-status; 2)
                total int64 = 0
                start int64 = 1
                while start <= limit
                    value int64 = start
                    while value != 1
                        if value % 2 == 0
                            value = value / 2
                        else
                            value = 3 * value + 1
                        total++
                    start++
                print; total
        - type: markdown
          markdown: |-
            First prepare a release executable with retained function/line metadata and
            freeze a baseline copy. `terrane build` prints the executable path on stdout;
            the helper forwards it. Do not assume a Cargo-internal output path. A later
            build replaces the role's public artifact, so train the frozen executable.
        - type: example
          id: sample-app-prepare
          title: Prepare and preserve the baseline
          language: bash
          mode: illustrative
          source: |-
            prepared="$(python "$helper" prepare -- terrane build --release "$demo/main.trn")"
            cp "$prepared" "$demo/baseline"
        - type: markdown
          markdown: |-
            Choose one conversion route. The default needs working branch-stack/LBR sampling
            and `llvm-profgen` on `PATH`. On a non-LBR host, instead select the alternative
            below, which needs a compatible AutoFDO `create_llvm_prof` on `PATH`. Neither
            route uses GCC feedback files or `.trnprof` diagnostics.
        - type: example
          id: sample-app-lbr
          title: Default LBR route
          language: bash
          mode: illustrative
          source: |-
            converter_args=()
        - type: example
          id: sample-app-no-lbr
          title: Alternative for a non-LBR host
          language: bash
          mode: illustrative
          source: |-
            converter_args=(--converter autofdo --no-lbr)
        - type: markdown
          markdown: |-
            Train on limit 5,000,000. Recording runs the application, saves raw perf data
            and provenance beside the converted profile, and rejects failed conversion or
            profiles without positive source-location counts. Investigate mapping loss and
            converter diagnostics; a parseable profile alone is not evidence of useful
            feedback. Stop if recording fails rather than consuming a stale profile. Nonzero
            perf/workload status is rejected by default. For an expected nonzero result, add
            `--allow-workload-failure`; `capture.exit_status` retains perf's status, which
            is not independent proof of the workload's exit status. This permission still
            requires fresh raw data and a valid converted profile.
        - type: example
          id: sample-app-record
          title: Record training feedback
          language: bash
          mode: illustrative
          source: |-
            python "$helper" record --binary "$demo/baseline" \
              --output "$demo/training.prof" "${converter_args[@]}" -- 5000000
        - type: markdown
          markdown: |-
            Rebuild the same source with that profile and freeze the optimized executable.
            The helper validates and snapshots the profile under an immutable digest-named
            path. New profile bytes select a new build input even when `training.prof` is
            overwritten. This opt-in applies only to the wrapped build.
        - type: example
          id: sample-app-use
          title: Consume the profile
          language: bash
          mode: illustrative
          source: |-
            optimized="$(python "$helper" use --profile "$demo/training.prof" \
              --cache-dir "$demo/snapshots" -- terrane build --release "$demo/main.trn")"
            cp "$optimized" "$demo/optimized"
        - type: markdown
          markdown: |-
            Validate behavior before measuring speed. These inputs are distinct from the
            training limit and compare exact stdout; failed commands also stop this shell.
            For a real application, run its normal correctness tests, including errors and
            less frequent paths. A checksum comparison is only sufficient for this toy.
        - type: example
          id: sample-app-correctness
          title: Compare held-out results
          language: bash
          mode: illustrative
          source: |-
            for limit in 1 2 27 1000 3000000; do
              "$demo/baseline" "$limit" > "$demo/baseline.out"
              "$demo/optimized" "$limit" > "$demo/optimized.out"
              cmp "$demo/baseline.out" "$demo/optimized.out"
            done
        - type: markdown
          markdown: |-
            Time frozen executables directly, not `terrane run` or a rebuild. The following
            comparison pins execution to one allowed logical CPU, warms both executables,
            alternates execution order, checks the held-out checksum, and prints median
            elapsed milliseconds. Stop other builds and competing CPU-heavy work first.
            Elapsed time is not a direct CPU-counter measurement.
        - type: example
          id: sample-app-timing
          title: Measure a held-out workload
          language: bash
          mode: illustrative
          source: |-
            python - "$demo" <<'PY'
            from pathlib import Path
            import os, statistics, subprocess, sys, time

            root = Path(sys.argv[1])
            os.sched_setaffinity(0, {min(os.sched_getaffinity(0))})
            samples = {"baseline": [], "optimized": []}
            for iteration in range(18):
                order = list(samples)
                if iteration % 2:
                    order.reverse()
                for name in order:
                    start = time.perf_counter_ns()
                    result = subprocess.run(
                        [str(root / name), "3000000"],
                        check=True, capture_output=True,
                    )
                    elapsed_ms = (time.perf_counter_ns() - start) / 1_000_000
                    assert result.stdout == b"428343467\n" and not result.stderr
                    if iteration >= 3:
                        samples[name].append(elapsed_ms)
            for name, values in samples.items():
                print(f"{name}: {statistics.median(values):.3f} ms median")
            PY
        - type: markdown
          markdown: |-
            Repeat the comparison to assess variability. For a noise control, repeat with
            both measured paths containing the same baseline binary. Retain feedback only if
            correctness and representative held-out gains justify it; retrain when code,
            dependencies or workload materially change. Keep the baseline and capture
            provenance with any reported result, without publishing sensitive raw data.

            To return to the ordinary untrained release artifact, rebuild without the helper
            or profile-use flags. Merely stopping recording does not undo feedback already
            compiled into an executable. The frozen comparison copies are not overwritten by
            this ordinary build.
        - type: example
          id: sample-app-reset
          title: Return to an ordinary release build
          language: bash
          mode: illustrative
          source: |-
            terrane build --release "$demo/main.trn"
    - id: privacy-limitations
      title: Privacy and current limits
      blocks:
        - type: rule
          id: rule.profiling.privacy
          level: must
          since: null
          evidence: []
          markdown: |-
            Authored source snapshots are excluded unless `--embed-sources` is given.
            Workload arguments are excluded from both conditions and raw collector
            configuration unless `--retain-arguments` is given. Generated Rust and
            compiler-bundled source are embedded so exact source attribution remains
            verifiable after relocation. Source paths, symbol names, and timing are present
            and declared in the artifact privacy record.
        - type: admonition
          id: note.profiling.deferred
          kind: note
          markdown: |-
            Allocation retention means allocations still live at normal exit; it is not
            garbage-collector reachability and is not automatically a leak claim. Heaptrack
            interposition changes workload overhead and allocator call paths. Process-memory
            timelines remain separate from allocation ownership: RSS observations include
            code, mappings, arenas, fragmentation, stacks, and collector overhead and do not
            identify allocation sites. Garbage-collector reachability, heap dumps,
            memory-access attribution, continuous-service capture, remote collectors, and
            non-Linux backends remain future work.
  see-also:
    - tool.debugging
    - tool.source-intelligence
    - tool.packages.command-line

