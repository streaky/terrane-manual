documentation:
  status: complete
  title: "Language server and editor integration"
  title-style: text
  summary: >-
    Completion, signature help, hover, definitions, projection declines, semantic highlighting, and diagnostics reuse compiler
    data.
  tags:
    - "interop"
    - "editor-support"
  sections:
    - id: editor-support
      title: "Language Server and Editor Integration"
      blocks:
        - type: markdown
          markdown: |-
            Terrane editor support is provided through the language server. Completion,
            signature help, hover, go-to-definition, semantic highlighting, and diagnostics
            reuse compiler data rather than relying on a separate editor-only language
            model.

            The VS Code extension starts one `terrane-language-server` child process. By
            default it resolves that executable inside the installed extension at
            `server/terrane-language-server` (`server/terrane-language-server.exe` on
            Windows). The executable is bundled into the extension rather than discovered
            from the repository build directory, so rebuilding
            `target/release/terrane-language-server` alone does not update an installed
            extension or an already-running server process.

            The extension's `npm run package-server` command builds the
            `terrane-language-server` package in release mode and copies that executable
            into `editors/vscode/server/`, preserving executable permissions on Unix. This
            repository-local copy is the staging input for extension packaging. Installing
            the resulting VSIX creates another independent copy below the active VS Code
            extension directory. Consequently, changing the staged repository copy does not
            mutate an extension that is already installed; package and reinstall the VSIX to
            update that installation.

            For compiler development, `terrane.server.path` can override the bundled
            executable. In a single-folder workspace, the folder's setting takes precedence
            and relative paths such as `target/release/terrane-language-server` resolve from
            that folder. Otherwise, use an absolute path. An empty setting selects the
            bundled executable. Untrusted workspace configuration cannot choose the
            executable. Reload the VS Code window after changing the selected executable or
            replacing its binary; an existing language-server process keeps its original
            binary image.

            When diagnosing an apparently stale language-server result, first identify which
            executable the extension selected. Distinguish the Cargo build output, the
            repository-staged extension binary, and the binary copied into the installed
            extension. Comparing their hashes is a direct way to establish whether VS Code
            is executing the build under investigation.

            The extension also supplies TextMate highlighting before semantic analysis is
            available. It recognizes current declaration qualifiers, enum and annotation
            syntax, modifier headers, and Terrane's indentation-delimited text forms. Inline
            `rust` and `unsafe rust` bodies use VS Code's Rust grammar, including typed
            binding initializers and `return rust` / `return unsafe rust`. Dedentation
            restores Terrane highlighting. These bodies are registered as embedded Rust for
            basic editor behavior such as bracket matching and comments; this does not
            provide rust-analyzer completion or diagnostics inside Terrane. Rust marker
            headers recognize inline block comments and quoted annotation arguments.
            Unterminated single-quoted Terrane text ends at the physical line boundary so a
            typing error does not hide later native sections. Contextual declaration words
            are highlighted in their declaration roles, while booleans and `none` use
            literal scopes. TextMate highlighting is recovery-oriented, not syntax
            validation; compiler diagnostics remain authoritative.

            Tail- and block-text highlighting follow lexer expression-start boundaries,
            including operators and opening brackets/braces but excluding pipe and colon
            delimiters. Inline comments in marker headers stop at their first closing
            delimiter, avoiding ambiguous matching across repeated comments while retaining
            quoted arguments and ordinary expression prefixes. Tail text can immediately
            follow a separate operator (`a +>tail`), while a joined identifier such as
            `a+>tail` remains an identifier rather than text.

            In Terrane editors, embedded Rust headers and bodies have a subtle full-line
            background and left border. The regions follow the same TextMate grammar as
            highlighting, update while editing, and remain attached when folded. Disable
            them with `terrane.rustBlocks.decorate`. Themes and
            `workbench.colorCustomizations` can set `terrane.rustBlockBackground` and
            `terrane.rustBlockBorder`; high-contrast themes use a transparent background and
            the theme's contrast border.

            Decoration setup runs independently of language-server startup. Missing or
            broken decoration assets are reported in the Terrane output channel without
            disabling language-server features; a missing server still reports its error
            without preventing independently available decorations.

            Region scans cache per-line grammar states per document. After an edit,
            unchanged prefixes are reused and tokenization stops when the unchanged tail has
            the same incoming grammar state, including after line insertions and deletions.
            Comparing text and assembling section ranges still requires a linear pass; the
            expensive grammar tokenization is incremental.

            **Terrane: Show Lowered Rust** opens a read-only view beside the saved Terrane
            editor and follows the selected source line. Outside a debug session it reuses
            the current artifact when a query validates the selected source against that
            build. Switching to an uncovered or changed source builds it in its own context;
            an unrelated query error, such as a missing disassembler, is shown without a
            rebuild. After a build fails, cursor moves and assembly toggles keep showing the
            error. Save a Terrane file or run **Show Lowered Rust** again to retry. During a
            Terrane debug session the view uses the session's artifact; select a mapped
            frame in the Call Stack to inspect the paused location. When the session ends,
            the view builds on demand again. Save source edits before comparing, and restart
            the debug session if the source no longer matches the running build. **Show
            Assembly** adds either build instructions or the paused frame's live
            disassembly. Rust-only mode hides and skips disassembly, but still inspects the
            exact native build, not the language server's generated snapshot of editor
            buffers. The view requires a trusted workspace and uses `terrane.debugger.path`
            or `terrane` on `PATH`. See [[tool.debugging#commands]] for artifact and
            disassembly requirements.

            In a writable Terrane or Rust editor, select one non-empty region and run
            **Terrane: Wrap Selection in Security Region** from the command palette or
            editor context menu. Enter the security contract ID once; the command inserts
            `//# SECURITY-BEGIN [id]` and `//# SECURITY-END [id]` on separate lines around
            the selected lines. The extension activates for Rust documents as well as
            Terrane documents and warns about malformed, unmatched, and marker-like
            comments. These warnings do not validate that a contract exists. Paired regions
            get a tint and right border. The per-resource setting
            `terrane.securityRegions.decorate` turns off that decoration without suppressing
            warnings. Set `terrane.securityRegions.rust` to `false` to disable background
            marker scanning, warnings, and decoration for Rust documents; the wrapping
            command remains available.

            Extension verification runs `npm run check` from `editors/vscode`; it includes
            `npm test` for real TextMate token scopes, region boundaries, and incremental
            updates. Cargo-only workspace verification does not cover these checks.

            For manifest-declared Rust dependencies, completion, signature help, and hover
            use the same lock-resolved projection as compilation. The projection is derived
            from the resolved package, selected features, target, and rustdoc data. It
            represents projected functions, inherent methods, receiver ownership, static
            associated members, receiver-first trait namespaces, enums, aliases, primitives,
            and opaque foreign values. Dependency information can show an item's verbatim
            Rust path. If an item is not projected, the language server can show the
            recorded reason for declining it instead of presenting it as usable Terrane API.

            Dependency information in the editor is advisory; Cargo and rustc remain
            authoritative about whether the resolved Rust package compiles. Compiler
            diagnostics report dependency-boundary problems in Terrane terms. These include
            relevant move and drop errors, `Send` and `Sync` requirements at task
            boundaries, and escaping borrows. If a crossed member is missing, the error is
            reported at its Terrane import or use site rather than only against generated
            Rust.

            Semantic highlighting, definition navigation, and editor diagnostics use
            compiler-derived source information. The diagnostics displayed by the editor are
            therefore the compiler's diagnostics. Parameter inlay hints qualify each
            parameter label with its owning callee (for example `opt.value:`), including
            nested calls. Signature help maps named arguments by name and positional
            arguments by position; after a separator, it follows the call that owns that
            separator rather than assuming the innermost syntactic call. Optional document
            highlight is not implemented and is not required for these editor capabilities.

            Workspace trust controls execution of package-defined build-time tools during
            editor preparation. Generated-source navigation and the separation between
            editor snapshots and build outputs follow
            [[tool.build-time-tools#editor-preparation-and-trust]].

            The compiler-owned `.trn/terrane-projection.generated.trn` is a generated report
            and multi-unit source container, not one authored namespace source.
            `Generated source unit` markers delimit ordinary one-namespace Terrane units.
            When the physical container is opened for inspection, the language server
            suppresses both whole-file namespace-count and duplicate-namespace diagnostics
            caused solely by viewing those virtual units as one document. Package analysis
            separately syntax-validates each generated unit. Ordinary namespace-less,
            duplicate-namespace, or multi-namespace authored files continue to receive their
            diagnostics.

            Dependency-import lookup has one advisory limitation. If the same local name is
            imported from two `/deps` namespaces in one file, hover and signature help use
            the first matching import line and can consequently show the wrong dependency
            namespace. Completion does not use this first-match lookup, and compilation is
            unaffected.
