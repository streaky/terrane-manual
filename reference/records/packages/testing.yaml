documentation:
  status: complete
  title: Native testing
  title-style: text
  summary: >-
    Discovers ordinary Terrane test functions, compiles a native registry, and
    executes every selected case in an isolated process.
  tags:
    - packages
    - testing
    - command-line
    - isolation
  sections:
    - id: discovery
      title: Discovering tests
      blocks:
        - type: rule
          id: rule.testing.discovery
          level: must
          since: null
          evidence:
            - native_test_command_reports_isolated_cases_deterministically
          markdown: |-
            `terrane test <package>` discovers top-level, parameterless
            `test-*` functions returning `none` below `tests/unit`,
            `tests/integration`, and `tests/end-to-end`. Functions remain
            ordinary Terrane declarations and may be synchronous, asynchronous,
            or throwing. Discovery order is tier, package-relative source path,
            source order, and function name.

            `[testing]` may override each relative root. `[testing.profile]`
            explicitly selects a test profile name, capability allowlist, and
            panic policy; omitted settings inherit the ordinary package profile.
            Tests acquire no capability absent from those declarations.

    - id: execution
      title: Running isolated cases
      blocks:
        - type: rule
          id: rule.testing.isolation
          level: must
          since: null
          evidence:
            - native_test_timeout_terminates_the_isolated_process
            - end_to_end_tests_receive_the_built_application_artifact
          markdown: |-
            The compiler lowers one native dispatch registry per populated tier.
            The CLI runs each selected case in a fresh working directory and
            process with a deterministic seed, controlled environment and
            arguments, bounded stdout/stderr, and an enforced typed deadline.
            A crash, exit, or timeout is confined to that case. End-to-end cases
            receive the actual built application as `string|none` through
            `application-artifact`. Capability-gated `/core/testing/process`
            provides clonable value-style `process-fixture` builders whose
            independent snapshots carry arguments, environment, standard input,
            and deadline into `run-process`.

    - id: framework
      title: Assertions and reports
      blocks:
        - type: rule
          id: rule.testing.framework
          level: must
          since: null
          evidence:
            - native_test_command_reports_isolated_cases_deterministically
          markdown: |-
            `/core/testing` provides boolean assertions, concrete scalar and
            byte equality/inequality, matching optional presence checks,
            floating near-equality, expected-descriptor throwable assertions,
            explicit failure and skip, typed deadline and controlled-argument
            accessors, source-framed structured causes, and bounded useful value
            rendering. `fail-values` lets custom assertions keep comparisons in
            their concrete types while rendering operands through `test-value`.
            `--list`, repeatable `--tier`, and one mutually exclusive
            substring `--filter`, exact `--exact`, `--glob`, or `--regex` selector
            do not change compilation; `--jobs`, `--timeout`, repeatable
            `--argument`, `--fail-fast`, and `--show-output` control execution.
            Bare timeout values are seconds; `ms` and `s` suffixes are accepted.
            `--report <path>` writes schema `1.1.0` JSON with run metadata,
            stable case identities, structured outcomes, causes, assertion details,
            source spans, durations, and byte-exact captured output plus truncation
            flags.
  see-also:
    - tool.packages.command-line

