documentation:
  status: complete
  title: Native testing
  title-style: text
  summary: >-
    Discovers ordinary Terrane test functions, compiles a native registry, and
    executes every selected case in an isolated process.
  tags:
    - packages
    - testing
    - command-line
    - isolation
  sections:
    - id: discovery
      title: Discovering tests
      blocks:
        - type: rule
          id: rule.testing.discovery
          level: must
          since: null
          evidence:
            - native_test_command_reports_isolated_cases_deterministically
          markdown: |-
            `terrane test <package>` discovers top-level, parameterless
            `test-*` functions returning `none` below `tests/unit`,
            `tests/integration`, and `tests/end-to-end`. Functions remain
            ordinary Terrane declarations and may be synchronous, asynchronous,
            or throwing. Discovery order is tier, package-relative source path,
            source order, and function name.

            `[testing]` may override each relative root. `[testing.profile]`
            selects a test profile name, capability allowlist, and panic policy;
            omitted settings inherit the ordinary package profile and never
            grant capabilities implicitly.

    - id: execution
      title: Running isolated cases
      blocks:
        - type: rule
          id: rule.testing.isolation
          level: must
          since: null
          evidence:
            - native_test_timeout_terminates_the_isolated_process
            - end_to_end_tests_receive_the_built_application_artifact
          markdown: |-
            The compiler lowers one native dispatch registry. The CLI runs each
            selected case in a fresh working directory and process with a
            deterministic seed, controlled environment, bounded stdout/stderr,
            and an enforced deadline. A crash, exit, or timeout is confined to
            that case. End-to-end cases receive the actual built application
            through `application-artifact` and can drive it with
            `process-fixture` using explicit arguments, environment, standard
            input, and deadline.

    - id: framework
      title: Assertions and reports
      blocks:
        - type: rule
          id: rule.testing.framework
          level: must
          since: null
          evidence:
            - native_test_command_reports_isolated_cases_deterministically
          markdown: |-
            `/core/testing` provides boolean, equality, inequality, optional,
            near-equality, throwing-callback, failure, and skip assertions. Test
            failures retain ordinary Terrane source call frames. `--list`,
            repeatable `--tier`, and substring `--filter` selection do not
            change compilation; `--jobs`, `--timeout`, `--fail-fast`, and
            `--show-output` control execution. `--report <path>` writes schema
            `1.0.0` JSON with stable
            case identities, outcomes, causes, source spans, durations, and
            byte-exact captured output plus truncation flags.
  see-also:
    - tool.packages.command-line

