  title: "Inline and maintained Rust escape hatches"
  title-style: text
  summary: >-
    Inline Rust blocks and Rust expressions are capability-gated. Manifest-declared maintained Rust source files provide an
    additional Rust escape hatch. These surfaces retain an…
  tags:
    - "interop"
    - "rust-interop"
    - "inline-rust"
  sections:
    - id: inline-rust
      title: "Rust Escape Hatches"
      blocks:
        - type: markdown
          markdown: |-
            Rust is Terrane's native lowering and extension language, not a foreign-runtime
            boundary. Terrane provides capability-gated inline Rust blocks and expressions,
            including concrete `unsafe rust` forms. A bare `rust` or `unsafe` qualifier is
            invalid; Rust access must use a defined block or expression boundary.
            `unsafe rust` relaxes Rust-operation safety only within that boundary. It does
            not bypass Terrane's definite-assignment, cleanup, lifetime, capability,
            ownership, or effect rules.

            A value-producing inline Rust block needs a declared destination type. Inferred
            binding declarations and untyped `_` discards diagnose `T0006`; bind the result
            with an explicit type before discarding it. Standalone Rust statement blocks and
            declared return destinations retain their existing behavior. Reassigning an
            existing scalar binding from inline Rust diagnoses `T0002`, even if that binding
            was originally declared with a type; declare a new typed binding instead.

            Both standalone `rust` and `unsafe rust` statement blocks are supported. A
            function with a declared result type can return a native expression through
            `return rust` or `return unsafe rust`. All these headers, like typed native
            binding initializers, introduce raw Rust bodies: string literals, raw strings,
            macros, and native operator spacing are not interpreted as Terrane syntax.

            An inline Rust boundary observes a Terrane `ref` binding as the existing native
            borrow. Lowering does not clone the referent into the boundary: a native result
            may therefore retain the admitted relationship to that lender, subject to the
            surrounding Terrane lifetime and escape checks. An owned last-use input moves
            into the Rust boundary without a snapshot; an input read again afterward or
            retained by a repeatable callback keeps its ordinary value-separation behavior.

            An outer value read only inside an anonymous function's native Rust body is
            still a closure capture. Its ordinary value snapshot is established before
            constructing the closure, so later outer reads and reassignment remain
            independent. Snapshots inside a repeatable native body do not replace that
            creation-time capture; those conservative per-invocation snapshots can still be
            needed because syntactic free-value analysis does not prove the ownership
            effects of arbitrary Rust operations.

            Named local functions cannot capture enclosing Terrane bindings through inline
            `rust` or `unsafe rust` any more than through ordinary Terrane expressions:
            these reads diagnose `S2062`. Pass the value as a parameter or use an anonymous
            closure. A named local function may read its own parameters and local bindings
            within a Rust boundary.

            Capture checks, ownership read events, and boundary snapshots use the same
            syntactic free-value analysis. Qualified Rust path segments, field and method
            labels, and Rust-local bindings are not enclosing Terrane reads. A local
            initializer is analyzed before its pattern becomes bound; closure parameters,
            block scopes, loop patterns, match arms, and conditional patterns retain their
            Rust lexical scope.

            Free native value references select the innermost visible Terrane binding. An
            anonymous function's reference parameter can therefore shadow an enclosing owned
            native value without capturing or cloning that outer value. Direct inline-Rust
            access to a genuinely selected non-copyable owned binding still diagnoses
            `T0134`; shadowing does not relax the ownership check.

            This analysis does not perform Rust name resolution or expand macros. Opaque
            macro tokens and fragments that cannot be parsed retain conservative identifier
            matching, so these boundaries can still report a potential capture or preserve
            an unnecessary snapshot. Wildcard imports are not resolved, and references
            introduced only by macro expansion are not inferred from string literals.

            For core TCP transports, prefer the supported consuming `into-native` boundary
            over extracting private resource handles. `/core/networking/native` provides
            native listener, stream, and socket-address types usable in ordinary typed
            adapters and projected generic calls. The compiler supplies the runtime
            dependency owner; the receiving integration owns transport cleanup. See
            [[std.networking.operations#native-transport]].

            Packages can also include maintained Rust source files declared in the manifest.
            A Rust module declaration maps a module name to an authored `.rs` file:
        - type: example
          id: legacy-fence-001
          title: null
          language: toml
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            [rust-modules]
            adapters = "rust/adapters.rs"
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The declared file participates in the package's locked Rust crate graph.
            Generated and authored Rust can call each other through explicit typed adapters.
            For example, with the module declaration above, generated Rust can call
            `crate::adapters::answer()`. These boundaries participate in ownership and
            effect declarations and in panic and error translation.

            Inline Rust and maintained Rust modules are subject to build-capability and
            profile checks. They also participate in deterministic artifact identity and
            source association. Lowering emits canonical Rust, and generated identifiers use
            an exact, deterministic, injective encoding: punctuation is not normalized away.
            A Terrane source name, its generated Rust name, and any native or link symbol
            are separate identities.

            Rust diagnostics map back to the originating Terrane spans without suppressing
            the original Rust diagnostics. Generated artifacts retain source-site
            infrastructure so both the Terrane location and the native compiler report
            remain available.

            Streamed Rust output is one complete standalone unit. Named-file output and
            Cargo builds use a split layout: the requested entrypoint contains authored
            lowering and includes `<entrypoint-stem>.support.rs` when support is needed.
            That sidecar contains the compiler prelude, runtime, structured-error and
            source-site infrastructure, selectively included `/core` implementation code,
            projected `/deps` lowering, and the generated program's vendored-support-crate
            list. User-authored package modules remain in the entrypoint. Empty support
            means no sidecar or include.

            Ejection tooling can produce maintainable Rust and Cargo artifacts. Lowering
            itself remains canonical. A bundled pinned formatter may validate an untouched
            generated artifact, but its formatted copy is discarded. A mismatch is a
            compiler defect, not permission to silently rewrite the generated artifact.
