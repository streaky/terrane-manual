documentation:
  status: complete
  title: Projected Rust dependencies
  title-style: text
  summary: >-
    Declares exact Rust crate dependencies, imports their admitted API through
    /deps namespaces, and explains projection identity, collection crossings,
    transitive owners, caching, and explicit declines.
  tags:
    - packages
    - dependencies
    - rust
    - projection
    - imports
  sections:
    - id: manifest
      title: Declaring a Rust crate
      blocks:
        - type: markdown
          markdown: |-
            A projected Rust crate is declared in `package.toml`. The dependency
            key is its Terrane alias; `package` names the crates.io package when
            the alias differs. Versions and feature sets are part of projection
            identity, so applications should state the exact contract they have
            reviewed.

        - type: example
          id: projected-rust-manifest
          title: Declare an exact dependency surface
          language: toml
          mode: illustrative
          target: package.toml
          timeout-ms: null
          source: |-
            [rust-dependencies.codec]
            package = "base64"
            version = "=0.22.1"
            default-features = false
            features = ["alloc"]
            effects = ["build"]
          response: null
          diagnostic: null
          markdown: null

    - id: imports
      title: Importing admitted members
      blocks:
        - type: rule
          id: rule.dependencies.explicit-import
          level: must
          since: null
          evidence:
            - rust-dependency-deferred-surface
          markdown: |-
            Declaring a crate does not flood a source namespace. Import an
            admitted member explicitly from `/deps/<alias>/...`. Projection
            prefers a substantive public path over one beneath a `prelude`
            module, then chooses the shortest path and lexical order at equal
            depth. Re-exports of one item are therefore one type while
            unrelated same-named items remain distinct.

            Rust associated functions remain static members of their projected
            class and use `Class::function`; they are not imported as
            independent namespace functions.

            A generic declaration with one admitted concrete instantiation
            keeps its readable Rust type name. Hash-suffixed names are reserved
            for multiple admitted instantiations whose canonical Rust
            identities must remain distinct.

    - id: crossed-types
      title: Values crossing the generated shim
      blocks:
        - type: markdown
          markdown: |-
            `Option<T>` crosses as `T|none`. Rust sequences, ordered and
            unordered maps, sets, and homogeneous tuples cross recursively as
            the matching Terrane collections when every component is
            representable. Map keys and set items must be Terrane scalars;
            optionals, collections, tuples, and foreign objects are rejected in
            those positions. Shims reuse the vector backing for identity
            element conversions and move uniquely owned tuple elements rather
            than cloning them. Shared tuple storage fails at the dependency
            boundary instead of panicking. `Vec<u8>` remains `bytes`.

            Heterogeneous tuples and aggregates containing an unsupported
            component are declined rather than partially reinterpreted.

    - id: transitive-owners
      title: Types owned by another crate
      blocks:
        - type: rule
          id: rule.dependencies.transitive-owner-declaration
          level: must
          since: null
          evidence:
            - transitive-type-owner-must-be-declared-at-one-version
          markdown: |-
            A member whose signature exposes a type owned by an undeclared
            transitive crate is unavailable. The diagnostic names the owner and
            its lock-resolved version. Declare that crate directly with a
            unifying version to make its canonical identity and members
            reachable. Merely receiving the type through another dependency
            does not declare its owner. If the crossed owner resolves to
            multiple versions, projection validation fails after Cargo lock
            resolution and before semantic import resolution or Rust lowering,
            and reports every conflicting version.

    - id: async-members
      title: Awaiting asynchronous members
      blocks:
        - type: rule
          id: rule.dependencies.async-member-task
          level: must
          since: null
          evidence:
            - rust-dependency-async-function
          markdown: |-
            A projected Rust `async fn` is an asynchronous Terrane callable.
            Calling it constructs a linear task, and `await` consumes that task
            inside an async callable. Argument and result conversion, returned
            Rust errors, receiver ownership, and dependency panic handling use
            the same boundary contract as synchronous projected members.

    - id: callbacks
      title: Passing Terrane callables to Rust
      blocks:
        - type: rule
          id: rule.dependencies.callback-projection
          level: must
          since: null
          evidence:
            - rust-dependency-callbacks
            - projected-callback-borrowed-capture
            - projected-callback-nontransferable-capture
            - projected-callback-throwable
          markdown: |-
            A concrete monomorphic Rust `Fn`, `FnMut`, or `FnOnce` bound
            projects as a shared, mutable, or consuming Terrane function
            contract respectively at either a free-function or method call. A
            callback whose result is a bounded future adds the orthogonal
            `async` contract. The generated boundary closure converts each
            argument and result without introducing a foreign callback runtime.

            Mutable callbacks retain repeatable owned state, and separating the
            Terrane callable copies its current environment instead of aliasing
            it. A consuming callback transfers that environment into one
            one-shot Rust closure. Rust `'static`, `Send`, and `Sync`
            requirements remain independent ownership requirements in Terrane.
            A retained callback cannot capture a borrowed reference or object
            receiver. A transferable callback cannot capture a local-only value,
            and an escaping throwable is rejected when the Rust callback result
            has no matching failure representation. Open generic, higher-ranked,
            and lifetime-dependent callback shapes remain unavailable.

            Rust traits and Terrane traits only share a word. Rust traits are
            named conformance contracts, so admissible trait projection targets
            Terrane interfaces. Terrane traits compose source fields and methods
            through `uses`; they do not represent foreign implementations.
    - id: async-sequences
      title: Consuming projected asynchronous sequences
      blocks:
        - type: rule
          id: rule.dependencies.async-sequence-lifecycle
          level: must
          since: null
          evidence:
            - rust-dependency-async-sequences
            - projected-async-sequence-use-after-close
            - projected-async-sequence-transfer
            - projected-async-sequence-double-owner
            - projected-async-sequence-unconsumed-task
          markdown: |-
            A concrete owned Rust producer with an asynchronous borrowed `next`
            returning `Result<Option<Item>, E>` and a consuming `close`
            projects as a resource-owning linear endpoint. Awaiting `next`
            returns `async-iteration-step of Item`: `item`, `end`, and `value`
            distinguish an item from exhaustion. A Rust error enters the
            `dependency-error` path, while cancellation remains the enclosing
            task outcome.

            Each borrowed operation must be awaited directly and reborrows the
            producer for one suspension. `close` consumes the producer, so
            later use is a source ownership error. Dropping an endpoint releases
            its Rust value but does not promise a graceful protocol close.
            Borrowed items and open associated item types remain unavailable.
    - id: async-sinks
      title: Sending through projected asynchronous sinks
      blocks:
        - type: rule
          id: rule.dependencies.async-sink-lifecycle
          level: must
          since: null
          evidence:
            - rust-dependency-async-sinks
            - projected-async-sink-use-after-split
            - projected-async-sink-use-after-close
            - projected-async-sink-double-owner
            - projected-async-sink-suspended-borrow
          markdown: |-
            A concrete owned Rust endpoint with an asynchronous borrowed
            `send(Item)` returning `Result<bool, E>` projects as a
            resource-owning linear sink. Awaiting `send` returns
            `async-sink-outcome`: `accepted` reports successful acceptance and
            `closed` reports remote closure. Dependency failure, task
            cancellation, and deadline expiry remain separate outcomes.

            A borrowed send must be awaited directly so its mutable borrow spans
            one suspension. `flush` preserves its projected failure contract,
            while `close` consumes the endpoint and performs graceful protocol
            close. A consuming `split` transfers the whole duplex object into
            independently owned halves. Drop releases an endpoint but does not
            claim graceful close.

    - id: chain-only-values
      title: Completing non-escaping dependency chains
      blocks:
        - type: rule
          id: rule.dependencies.chain-only-values
          level: must
          since: null
          evidence:
            - rust-dependency-chain-only
            - projected-chain-binding
            - projected-chain-return
            - projected-chain-capture
            - projected-chain-suspension
          markdown: |-
            A projected root may return a chain-only intermediate when its
            receiver methods can continue that same concrete chain or terminate
            in an owned projected value. The intermediate may retain a borrow
            from a named input that outlives the expression. It must remain
            inside one nested expression as the receiver of the next member.

            A chain-only value cannot be bound, returned, captured, passed to
            Terrane code, or held across `await`. Complete the chain at once.
            The generated Rust keeps the intermediate inside one expression and
            applies conversion, dependency failure, panic, and asynchronous
            boundaries at the terminal operation. A concrete adapter may run an
            open generic API internally; that does not make the open generic
            directly projectable.

        - type: rule
          id: rule.dependencies.destination-directed-results
          level: must
          since: null
          evidence:
            - projected-destination-results
            - projected-serde-json-result
            - projected-result-without-destination
            - projected-result-conflicting-destinations
            - projected-result-incompatible-template
            - projected-result-unsatisfied-bound
            - projected-result-unknown-bound
            - projected-result-borrowed
            - projected-result-source-object
          markdown: |-
            A projected dependency function or method may leave one result-only
            Rust type parameter for the caller. Terrane selects that parameter
            from exactly one written binding, argument, class-field, or return
            destination. The projection oracle must prove every rendered Rust
            bound for the exact concrete representation; `no`, `unknown`,
            absent, incompatible, or conflicting destinations are compile-time
            failures. Higher-ranked lifetimes and associated constraints remain
            part of the proof rather than being approximated from rustdoc
            implementation lists. Higher-ranked and nested bound paths use the
            dependency's manifest alias at every Rust path-root occurrence.

            When rustdoc names a public bound through a transitive crates.io
            package, that owner is pinned at its lock-resolved version, recorded
            in projection-history format 3, and added to the generated manifest
            with no explicit or default features. Existing transitive edges keep
            the resolved feature set, so this direct edge makes the bound
            nameable without widening it; ambiguous or non-registry owners
            decline.

            Closed scalar, string, bytes, optional, sequence, mapping, set,
            homogeneous tuple, and projected foreign-object shapes recurse
            through the result template. Source-declared object destinations
            remain unavailable because dependencies have no authored conversion
            contract for their generated Rust representation. Borrowed results
            are declined; accepted values cross the boundary owned. Calls name
            the selected Rust type explicitly in generated Rust. Terrane does
            not expose Rust angle-bracket generic arguments in source.
    - id: resolution
      title: Projection resolution and cache behavior
      blocks:
        - type: markdown
          markdown: |-
            Terrane first checks its exact project-local projection cache. A
            configured trusted HTTPS artifact may satisfy a miss only when its
            dependency, feature, target, build-toolchain, rustdoc-toolchain,
            rustdoc-format, projection-schema, and SHA-256 content identity all
            match. Otherwise Terrane generates rustdoc locally with its pinned
            nightly toolchain. Every cache, published, bundled, and local
            attempt records its outcome and fallback reason. A verified
            published projection enters the local cache for offline reuse.
            Bundled artifacts are explicitly deferred until Terrane has a
            release artifact channel rather than being silently attempted.

            Injecting an exact bound-owner edge deliberately rewrites only the
            generated projection manifest, so its offline fetch cannot use
            Cargo's `--locked` mode. The pre-injection manifest and lock already
            participate in projection identity, and the injected edge list is
            exact, content-hashed, and reviewable in `terrane-projection.lock`;
            these invariants replace Cargo lock enforcement for that step.

            Unsupported members remain explicit declines in the transferable
            projection artifact. The compiler does not replace one Rust API
            shape with a nearby Terrane operation or silently admit unknown
            metadata.
  see-also:
    - lang.functions.declarations

