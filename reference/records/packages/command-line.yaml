documentation:
  status: complete
  title: Command-line execution
  title-style: text
  summary: >-
    Runs package-backed programs and source files, and manages deterministic hashes and manifest entries for native Terrane
    library packages.
  tags:
    - packages
    - command-line
    - scripts
    - shebang
    - execution
    - dependencies
  sections:
    - id: commands
      title: Running a source file
      blocks:
        - type: rule
          id: rule.command-line.implicit-run
          level: must
          since: null
          evidence:
            - executable-shebang-script
          markdown: |-
            `terrane run <path>` runs a manifest or individual `.trn` source through the
            ordinary semantic, lowering, generated-Cargo, cache, and native execution
            pipeline. When the first CLI argument is an existing file or ends in `.trn`,
            `terrane <path>` is the same run operation. Remaining arguments are forwarded to
            the program; the implicit form accepts but does not require a leading `--`.
    - id: build-progress
      title: Build progress and timing
      blocks:
        - type: markdown
          markdown: |-
            `terrane build` reports each stage as it starts on stderr: loading the package,
            compiling Terrane sources, preparing the native build, and compiling the native
            artifact. Each successfully completed stage reports its elapsed wall-clock time
            in seconds; a successful build also reports the total. These timings include
            work performed by dependencies and external tools within the corresponding
            stage.

            Every top-level progress and completion line identifies the absolute input path.
            Once loading succeeds, it also includes the package identity, distinguishing
            builds invoked from different directories or by nested tools. The Terrane
            compilation stage translates package source into Rust; it does not rebuild the
            Terrane compiler itself.

            During Terrane compilation, indented messages report internal phases live:
            parsing individual authored and generated sources, preparing declaration
            consumers, resolving Rust dependencies and projection caches, generating Rustdoc
            metadata per dependency when needed, resolving imports, preparing type
            declarations, inferring types, checking ownership and effects, final semantic
            validation, and lowering and rendering Rust. Each message identifies its
            package, source, dependency, consumer executable, or working directory. Exact
            projection-cache reuse is reported explicitly.

            Packages with declaration consumers first analyze declaration metadata, run the
            configured consumers, then analyze the expanded sources. Progress labels
            distinguish these passes. Internal timings are nested wall-clock measurements:
            an enclosing phase includes its child phases, so they must not be summed. An
            internal phase reports completion only after its work succeeds.

            Progress is reported for both debug and `--release` builds, including cached
            builds. A failed build retains the active-stage message and normal diagnostics
            without claiming completion. Stdout remains only the artifact path, so scripts
            can continue capturing it. Other commands are unchanged.
    - id: compilation-reuse
      title: Compilation reuse and invalidation
      blocks:
        - type: markdown
          markdown: |-
            CLI compilation explicitly enables persistent caches; ordinary library, editor,
            determinism-test, and conformance calls do not read or write these snapshots.
            Library clients may opt in with `with_compilation_cache`. Successful CLI outputs
            persist in `.trn/cache/compilation.json`. An exact content-input match reuses
            semantic analysis and Rust generation, including diagnostics, source
            associations, debug information, runtime requirements, and authored Rust
            modules. Keys cover the compiler content identity, source contents and
            membership, source roles and IDs, package configuration, compilation options,
            native dependency inputs, Cargo configuration, and environment inputs. Same-size
            edits are changes; timestamps alone never authorize reuse.

            Without Rust dependencies, environment inputs are `CARGO_*`, `RUST*`,
            `TERRANE_*`, `PATH`, `HOME`, `CARGO_HOME`, `RUSTUP_HOME`, `RUSTUP_TOOLCHAIN`,
            `CC`, `CXX`, `AR`, `TARGET`, `HOST`, `PKG_CONFIG_PATH`, and `LIBRARY_PATH`.
            Consumer executables always rerun, so their environment-driven generated output
            is observed rather than inferred. With Rust dependencies, arbitrary build
            scripts can inspect any environment variable; the whole environment is
            conservatively keyed. Terminal changes can therefore miss in that case.

            External disk/environment inputs are captured before work and rechecked before
            publishing. A change during analysis or consumer execution suppresses
            reuse/publication rather than storing old results under new inputs.

            Declaration consumers have a separate successful metadata snapshot in
            `.trn/cache/declarations.json`. Consumers themselves still execute on every
            invocation, and generated output is reconciled before the final
            compilation-cache lookup. Identical generated output may reuse compilation;
            changed or removed output cannot retain an obsolete compiled result.

            An edited source invalidates the exact compilation snapshot, but unchanged
            native semantic queries can reuse `.trn/cache/native-reconciliation.json`. This
            cache is keyed by the compiler, the full projected semantic graph, and each
            query's concrete type and signature inputs, including generic argument metadata
            and associated-type context. Both successful and unavailable native selections
            are reusable. Invocation-region-bearing inputs are excluded: source spans are
            not portable across edited or reordered source units. Bound validation,
            canonical contract propagation, and other semantic passes still run after an
            edit; this is query reuse, not a dirty-file skip. When rewriting the native
            query snapshot, only queries used in the current pass are retained, preventing
            accumulation across source-edit histories.

            Local Cargo path and patch dependencies are content-fingerprinted, including
            transitive local packages and effective Cargo configuration. Registry
            dependencies retain Cargo's immutable package checksum and lock identity.
            Dependency-source changes invalidate projection and supplemental Rustdoc caches
            as well as compilation and native artifact caches, even if a package version and
            generated Rust remain unchanged. Local package trees are walked conservatively,
            excluding `target`, `.git`, and `.trn` bookkeeping. Cargo package
            include/exclude rules do not enumerate every build-script input. Other large
            directories increase fingerprint cost; files outside these trees and
            generated/bookkeeping inputs are not inferred.

            Cache format, compiler identity, input identity, and payload integrity must
            match. Missing, incompatible, or malformed compiler snapshots recompute
            normally; compiler snapshot persistence is best-effort. This does not suppress
            errors reading actual inputs or executing consumers or native tools. Removing
            `.trn/cache` discards the compiler snapshots. Build progress reports exact
            compilation reuse, declaration-metadata reuse, and aggregate native query hits
            on stderr.

            Each snapshot kind keeps one entry per package. Switching debug/profile or other
            compiler options replaces the compilation entry; alternating modes may
            recompute. Native artifact profiles retain their separate artifact slots.
    - id: generated-package-state
      title: Generated package state and version control
      blocks:
        - type: note
          id: note.command-line.ignore-generated-state
          style: information
          markdown: |-
            Terrane stores generated source, native build artifacts, and reusable package
            state in `.trn/` directories. This state is derived from the package and should
            not be committed to version control.

            Add this pattern to the repository's root `.gitignore` before the first `check`,
            `build`, `run`, or `test`:
        - type: example
          id: legacy-fence-003
          title: null
          language: gitignore
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            **/.trn/
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The recursive pattern also covers Terrane packages nested inside a larger
            repository or workspace. Generated files may still be inspected locally when
            investigating a build; ignoring them prevents editors and Git clients from
            treating the cache as authored work.
    - id: declaration-interface
      title: Exporting declaration metadata
      blocks:
        - type: markdown
          markdown: |-
            `terrane declaration-interface` exports a format 1 source-independent public
            declaration interface from a package manifest, package directory, or `.trn`
            source. The output retains public documentation, annotation payloads, signature
            and field snapshots, and validated source origins without function bodies.
            Declaration preparation does not execute configured consumer programs. Use the
            resulting file in a consumer's `interfaces` list; consumers can inspect metadata
            even when the original library source is unavailable.
        - type: example
          id: export-declaration-interface
          title: Export public library metadata
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            terrane declaration-interface library/package.toml --output library.interface.json
          response: null
          diagnostic: null
          markdown: null
        - type: example
          id: regenerate-source-free-interface
          title: Regenerate the source-free conformance interface
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            target/debug/terrane declaration-interface tests/conformance/run/declaration-annotations/case.trn --output tests/conformance/run/annotation-source-free/library.interface.json
          response: null
          diagnostic: null
          markdown: >-
            Run from the compiler repository after building `terrane`. The consumer fixture
            loads only this exported interface; it does not load the tracked producer
            source.
    - id: package-management
      title: Hashing and installing Terrane libraries
      blocks:
        - type: markdown
          markdown: |-
            `terrane package hash` calculates the complete deterministic source hash
            accepted by `[terrane-dependencies]`:
        - type: example
          id: legacy-fence-001
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane package hash ../document-model
            terrane package hash --git https://example.invalid/document-model.git --tag v1.2.3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The remote form clones and verifies an exact Git tag before hashing its source
            tree. It does not accept a branch or abbreviate the resulting 64-digit SHA-256
            value.

            Run `package install` from an application directory containing `package.toml`:
        - type: example
          id: legacy-fence-002
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane package install ../document-model
            terrane package install --git https://example.invalid/document-model.git --tag v1.2.3
            terrane package install ../document-model --name model
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Installation validates `artifact = "library"`, obtains the library package
            identity, and adds one `[terrane-dependencies.<name>]` table. The package
            identity is the default name; `--name` selects another table key. Existing keys
            are rejected rather than replaced.

            A local install records only its relative `path`, leaving development edits
            immediately visible. A remote install records `git`, `tag`, and the required
            full hash. Installation fails when the current directory has no `package.toml`;
            it never searches parent directories for a different application manifest.
    - id: scripts
      title: Executing a shebang script
      blocks:
        - type: rule
          id: rule.command-line.shebang
          level: must
          since: null
          evidence:
            - executable-shebang-script
            - manifest-shebang-missing-namespace
            - shebang-script-without-main
          markdown: |-
            A direct single-file source beginning at byte zero with `#!` is an executable
            script. The shebang is ordinary comment trivia. The source may omit `namespace`,
            in which case the compiler supplies an implementation-owned identity outside the
            authored namespace grammar, making source collision impossible. A
            manifest-discovered source receives no such exemption and must declare its
            mapped namespace.

            Script execution does not remove Terrane's entrypoint contract. An executable
            script must declare one parameterless top-level `main`.
        - type: example
          id: executable-terrane-script
          title: Run a source file directly
          language: terrane
          mode: run
          target: thing.trn
          timeout-ms: null
          source: |-
            #!/usr/bin/env terrane
            function main;
              print; >hello
          response:
            kind: stdout
            language: text
            display: on-run
            content: |-
              hello
          diagnostic: null
          markdown: |-
            With `terrane` on `PATH`, run `chmod +x thing.trn` once and then execute
            `./thing.trn`.
