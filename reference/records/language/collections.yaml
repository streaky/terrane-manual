documentation:
  status: complete
  title: Collections, identity, and iteration
  title-style: text
  summary: >-
    Defines bytes indexing, collection lifetime and identity behavior, and the structural protocol used by built-in and source-defined
    iterators.
  tags:
    - collections
    - bytes
    - ranges
    - iteration
    - identity
    - lifetime
  sections:
    - id: byte-indexing
      title: Byte indexing and slicing
      blocks:
        - type: rule
          id: rule.collections.byte-indexing
          level: must
          since: null
          evidence:
            - byte-index-and-slice
            - byte-index-type
          markdown: |-
            An integer index selects one `uint8` from `bytes`. A range index selects a new
            `bytes` value by visiting the range's indices in order, including its authored
            step and half-open or inclusive end.

            A negative, unrepresentable, or out-of-bounds selected index throws
            `index-error`; its message retains the authored adaptive integer, including a
            negative index. An empty range at a valid boundary returns empty bytes. Neither
            operation decodes or validates the selected octets as text.
    - id: source-iteration
      title: Source-defined iteration
      blocks:
        - type: rule
          id: rule.collections.source-iteration
          level: must
          since: null
          evidence:
            - source-defined-iterator
            - package-source-iterator
            - source-iterator-next-contract
            - source-iterator-missing-next
            - source-iterator-next-parameters
            - source-iterator-mutating-constructor
            - source-iterator-item-type
            - source-iterator-reuse
            - source-iterator-none-item-type
            - builtin-iterator-reuse
            - iteration-end-is-not-none
            - iterator-protocol
          markdown: |-
            An object is structurally iterable when it has a non-throwing, non-async,
            zero-argument `iterator` method that does not mutate its receiver. The result is
            either `iterator of Item` or an object whose non-throwing, non-async,
            zero-argument `next` method returns `iteration-step of Item`.

            Construct an item step with `iteration-step; value` and exhaustion with
            `iteration-step.end;`. End is a dedicated semantic state, not a typed `none`
            step, and is compatible only where an `iteration-step of Item` destination
            supplies the item type. `none` therefore remains a valid yielded item. After
            returning `end`, an iterator must return `end` again without consulting its
            source. Iterator objects are linear state machines: transferring either a
            built-in or source-defined named iterator into `for` makes that binding
            unavailable. `for` invokes authored protocol methods directly, including across
            package namespaces. Missing, effectful, parameterized, or wrongly typed protocol
            methods produce targeted source diagnostics.
    - id: sequential-pipelines
      title: Ordered sequential pipelines
      blocks:
        - type: rule
          id: rule.collections.sequential-pipelines
          level: must
          since: null
          evidence:
            - sequential-pipeline
            - sequential-pipeline-unsupported-stage
            - sequential-pipeline-missing-collect
            - sequential-pipeline-non-list-source
            - sequential-pipeline-filter-result
            - sequential-pipeline-callback-argument
            - sequential-pipeline-native-copy
          markdown: |-
            Import `pipeline-sequential` from `/core/modifiers` and apply it with `with` to
            a local binding or assignment whose initializer ends in `.collect;`. The
            modifier selects compiler-owned streaming operations, not ordinary methods on a
            list. Lexical aliases of the modifier retain the same operation.

            The source is evaluated once, followed by every stage's callback or count
            expression once in written order. Traversal then visits list elements in source
            order, applying stages on demand without intermediate collections. `filter`
            retains elements whose callback returns `bool`; `map` replaces each element with
            its callback result and may change the element type. `take` counts elements
            reaching its position, not source elements or final collected elements. Stages
            may repeat. `collect` takes no arguments and produces an ordinary list.

            A nonpositive `take` count produces an empty result without invoking callbacks,
            even callbacks preceding that stage. Source and stage-argument evaluation still
            occurs. Reaching any positive limit stops traversal after that element's
            downstream processing, including when a later filter rejects it. Counts beyond
            the host index range do not overflow or truncate the requested prefix.

            Sources are currently lists and references to lists, not arbitrary structural
            iterables. Stable sources are borrowed; guard-backed or potentially mutated
            sources retain a value snapshot under the ordinary copy-on-write rules.
            Read-only reference callback parameters borrow individual elements. By-value
            callbacks copy elements when necessary to preserve the source or a filtered
            element; those copies require the ordinary cloneability proof. Mapped owned
            values transfer to subsequent mapping stages or the final list.

            Native `Copy` elements use their canonical copy capability, without invoking
            `Clone`. Callback values retain ordinary value semantics: copying a mutable
            callable forks its captured state rather than sharing it. A callable's dead
            final use may transfer its carrier; stable shared-callable places may be
            borrowed. Reused mutable callables, repeated loop uses and reusable captures
            retain the required independent copies. Integer take counts are observed without
            copying adaptive integer storage when a place can be borrowed. All stage
            operands stay live until traversal ends. Repeating a shared callable in several
            stages therefore cannot move a carrier borrowed by an earlier stage. Repeating a
            mutable callable gives each stage an independent captured-state snapshot;
            explicitly shared captures retain their shared referents.

            Callbacks are synchronous, repeatable, single-argument callables with an exact
            current-element parameter type or `ref` to that type. Shared and mutable
            callables are supported; consuming, variadic and mutable-reference inputs are
            not. Filter results must be `bool`. Mapper results cannot be borrowed or
            invocation-scoped values; owning shared-reference results remain values.
            Callback errors participate in ordinary inferred effects, `throws` bounds,
            `catch` and cleanup. Errors beyond a satisfied limit are not evaluated. Callback
            types must already be concrete: the pipeline does not infer type arguments for
            an unapplied generic function value from its element type.

            Generic modifier admission reports `S2120` for non-binding targets or repeated
            non-repeatable modifiers. Pipeline-specific invalid non-local or non-name
            binding/assignment targets, unsupported stages, arities and terminals report
            `S2121`. Incompatible source-stage types, callbacks, counts and required copies
            report `S2122`, except that a non-list source reports `S2121`. Unsupported
            pipelines never silently fall back to eager intermediate lists. Parallel and
            vectorized pipeline operations are not implemented.
        - type: example
          id: sequential-server-prefix
          title: Borrow servers and collect the first available capacities
          language: terrane
          mode: illustrative
          source: |-
            with pipeline-sequential result = servers; values
                .filter; is-available
                .map; calculate-capacity
                .take; 2
                .collect;
          markdown: |-
            Here `servers` returns `ref list of server`, `is-available` accepts `ref server`
            and returns `bool`, and `calculate-capacity` accepts `ref server` and returns
            `int`. Only the first two available servers are mapped; the source list remains
            usable afterward.
    - id: contextual-collection-initializers
      title: Contextual collection initializers
      blocks:
        - type: rule
          id: rule.collections.contextual-initializers
          level: must
          since: null
          evidence:
            - function-owned-contextual-collections
          markdown: |-
            A collection initializer is analyzed and emitted using the same destination type
            in every valid declaration context, including declarations inside loops and
            nested control-flow bodies. Contextual element types and collection builder
            prefixes remain local to the owning function; reusing one mutable Rust
            accumulator across loop iterations must not reuse the prior iteration's logical
            collection.
    - id: compiler-produced-read-only-lists
      title: Compiler-produced read-only lists
      blocks:
        - type: rule
          id: rule.collections.compiler-produced-read-only-lists
          level: must
          since: null
          evidence:
            - string-result-list-iteration
          markdown: |-
            Compiler-produced `list of string` and `list of text-range` results are ordered,
            read-only collections. Both expose `length` and may be consumed by `for`:
            `string.split` yields strings and `string.find.all` yields text ranges in source
            order. Split results additionally support indexing.
    - id: lifetime-and-identity
      title: Lifetime and identity
      blocks:
        - type: rule
          id: rule.collections.lifetime-and-identity
          level: must
          since: null
          evidence:
            - collection-identity-lifetime
            - map-key-removal
          markdown: |-
            Replacement releases a displaced logical item before returning once no remaining
            owner retains it. Copy-on-write separation preserves the unmutated collection
            and a read of each logical value observes its own contents without creating
            source identity. List and map removal transfer the removed item to the caller,
            so the item's lifetime ends when that returned value is released. A failed
            checked or default map removal does not separate shared backing storage.
            Successful mutation separates once, while unique storage mutates directly.
            `.clear` is intentionally a list-only member; list clearing and ordered
            collection destruction release remaining items in iteration order.

            Collections have no identity of their own, including when their backing storage
            is shared or their elements are references. Reference values retain their
            referent identities through collection storage: weak and shared references
            compare true with `is` exactly when they denote the same referent.

            A value's `type` descriptor exposes `inherently-identity-bearing`. It reports
            the language contract, not backing representation: reference types report true;
            ordinary class values and collections report false.
  see-also:
    - std.collections
    - internals.collections.lifetime
