documentation:
  status: complete
  title: "Lexical scopes and shadowing"
  title-style: text
  summary: >-
    Declarations resolve by identity across namespace, function, and lexical scopes, including through shadowing. Duplicate
    names and unresolved names produce diagnostics.
  tags:
    - "names"
    - "scopes"
  sections:
    - id: scopes
      title: "Lexical Scopes and Shadowing"
      blocks:
        - type: markdown
          markdown: |-
            Terrane resolves declarations by identity through an ordered view of the
            program. Plain-name lookup proceeds from the nearest lexical scope through
            namespace scope, program-global scope, and finally the selected prelude.
            Namespace lookup includes the current namespace and its parents. The nearest
            matching binding shadows farther bindings; shadowing changes which identity a
            spelling resolves to rather than merging declarations. Named and anonymous
            function bodies create lexical scopes; explicit `with scoped-access` regions
            additionally bound their acquisition and body-local declarations. Ordinary
            conditional, selection, and loop bodies share the surrounding function's
            declarations. Their variables remain visible afterward. Control flow determines
            availability separately from the union of reaching value types; uncertain uses
            check availability using uncertainty represented only for variables that need
            it. Proven uses need no source-level availability check, though native lowering
            may safely assert the compiler invariant when the variable needs uncertainty
            storage elsewhere.

            A reachable loop back-edge can bring a later body declaration into lookup at an
            earlier body use. This does not make the value available on the first iteration,
            and declarations with no assignment path to a use do not authorize forward
            reads.

            Ordinary names and object-form names occupy separate symbol tables, and
            object-form lookup is lexical. Lexical scope information covers function
            parameters, local bindings, assignments, and function-local imports. A selective
            import binds its object in the containing function or namespace scope; a
            control-flow body does not create a separate import scope. An `as` alias changes
            the local name without changing the imported object's identity. Reimporting the
            same exported identity is idempotent; importing a distinct identity under an
            occupied same-scope import name produces `S2011`.

            Namespace variables have a deliberately narrow boundary. A plain top-level
            assignment creates a namespace-local variable, including in the root namespace.
            That variable is readable and writable only by other namespace-level
            declarations in the same namespace. It is unavailable to that namespace’s
            function bodies, descendant namespaces, and importers.

            From a function body, namespace tiers may provide constants, constructs,
            imports, functions, and types, but never namespace variables. Mutable state
            crosses a function boundary only as a `global`, a parameter, or a returned
            value. Marking a namespace variable `public` is rejected with `S2025`; violating
            namespace-variable confinement produces `S2026`.

            `global` explicitly creates or replaces a program-global identity and does not
            erase lexical provenance or visibility. A namespace-local declaration may
            legally shadow a program global. A value that must leave the namespace tier must
            instead be a constant, a global, or a function result. Reassigning a constant
            produces `S2022`; initializer self-reference produces `S2023`; and a namespace
            initialization cycle produces `S2024`.

            A duplicate lexical binding produces `S2012`, while an unresolved source name
            produces `S2013`. A duplicate namespace declaration produces `S2005`. Import
            failures remain distinct: `S2009` identifies an unresolved imported name,
            `S2010` an inaccessible imported name, and `S2011` an import collision.

            Namespace-wide imports check a broader visible chain: lexical scopes, the
            current and parent namespaces, program globals, implicit `/core/types`
            constructs, and the prelude. Shadowing, replacing, or skipping a different
            visible object emits non-blocking `W4004`. An authored top-level declaration in
            the importing namespace retains its name, so a conflicting namespace-wide object
            is skipped. Identical reimports remain silent. Other namespace-wide imports
            replace one another in source order; across files, normalized relative
            source-path order determines the resulting identity and the earlier import
            binding identified by the warning.
    - id: scoped-access
      title: Explicit bounded access
      blocks:
        - type: markdown
          markdown: |-
            `with scoped-access` bounds an explicitly acquired value and the operations
            depending on it. The initializer must be grouped separately from the
            parenthesized statement body, so call arguments cannot be mistaken for the
            region. The acquisition binding and body-local declarations do not escape.
            Assignments to already visible outer variables still target those variables.
        - type: example
          id: bounded-resource
          title: A deliberate release boundary
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            with scoped-access guard = (mutex.lock;) (
                inspect; guard
            )
          response: null
          diagnostic: null
          markdown: >-
            The acquisition and inspection APIs are illustrative. The grouped initializer
            and body show the language's region syntax.
        - type: markdown
          markdown: |-
            Acquisition executes once. A successfully acquired value is released on every
            exit, including errors, returns, and loop exits. Nested acquisitions unwind in
            reverse order; if an inner acquisition fails, no nonexistent inner value is
            released. Independently owned results may leave through an outer assignment, but
            the acquired value and dependent borrowed views may not escape through returns,
            aggregates, captures, or retained tasks.

            Native borrowed results retain their actual lenders and lifetime relationships.
            A region does not extend those lenders, make an invalid acquisition valid, or
            turn a non-transferable guard into a transferable value. Suspension additionally
            requires the native transfer and lifetime contracts to hold. Nested acquisition
            of the same resource follows that resource's locking and reentrancy contract;
            this construct is not a deadlock detector. In particular, acquiring the same
            non-reentrant mutex again while its guard is live can deadlock. Region nesting
            guarantees cleanup, not acquisition progress; callers must follow the resource
            API's reentrancy contract.

            Ordinary references, smart-pointer method calls, and temporary native argument
            conversions do not require explicit regions merely because they borrow. Use this
            construct when choosing a deliberate release boundary matters.

            `with` applications resolve lexically to typed compile-time modifier contracts.
            Arguments, declaration targets, ordering, and repetition are validated before
            lowering. `scoped-access` is the supported compiler-defined structural
            operation; package-defined realization operations are not implemented and are
            rejected, rather than accepted as inert modifiers.
