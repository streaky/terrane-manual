documentation:
  status: complete
  title: "Nominal interfaces and typed dispatch"
  title-style: text
  summary: >-
    Declared interface identity is nominal. For interface-typed calls, the dispatch contract is checked and lowered statically.
  tags:
    - "objects"
    - "interfaces"
  sections:
    - id: interfaces
      title: "Nominal Interfaces and Typed Dispatch"
      blocks:
        - type: markdown
          markdown: |-
            An interface is a named, nominal contract and type. A class adopts an interface
            explicitly with `implements`; merely exposing members with a compatible shape
            does not give the class that interface identity.

            Interfaces differ from unnamed structural protocols, which describe operation
            shapes without introducing declarations, nominal types, or dispatch objects.
            Traits are different as well: a trait contributes source fields and method
            implementations through `uses`, but is not itself a type or a subtyping
            relation.

            A declared interface may be prefixed with `unsafe` when implementing that
            interface asserts a contract beyond Terrane's static model. Safety is part of
            nominal interface identity: safe and unsafe same-name interfaces may coexist,
            and `implements Interface` versus `implements unsafe Interface` selects exactly
            one safety class. Conformance never falls back to the opposite class.

            Interface safety and method-call safety are independent. Either kind of
            interface may contain safe and unsafe methods. Calling a method requires
            `unsafe` only when that method declaration is unsafe; implementing an unsafe
            interface requires `implements unsafe Interface` even when all of its methods
            are safe. Thus declaration syntax preserves both Rust's unsafe-trait obligation
            and each method's own caller obligation without turning an interface into a
            general unchecked region.

            Ordinary copyable interface values are safe to capture in shared function
            values: their dispatch protocols require thread-safe transfer and sharing. An
            interface-typed field therefore satisfies those obligations by contract, so
            transferable classes may compose interface values directly and through nested
            classes without inspecting an unknowable concrete implementer. For every class
            that implements an interface, including interfaces inherited from a base class,
            the compiler instead proves `Send` and `Sync` from the class's complete
            effective instance-field set and rejects conformance at the declaration of the
            field that cannot satisfy an obligation, including when that declaration is in
            another source file. The same declaration-site diagnostic applies when a class
            inherits a field that violates a projected Rust interface's required `Send` or
            `Sync` capability. Projected Rust interfaces retain the dependency trait's
            separately proven capabilities.

            Interface conformance and calls through interface-typed values are checked
            statically against the declared interface contract. The interface is the
            dispatch boundary: calls are lowered as interface dispatch rather than as
            runtime probing for a coincidentally shaped member. A call must conform to the
            operation declared by the interface; a contract mismatch is a type error.

            Member selection and invocation remain separate. `value.name` selects an
            instance member but does not invoke it. Invocation uses the explicit semicolon
            form, including for a zero-argument method. Likewise, an ordinary name denotes
            its bound object rather than invoking it implicitly. Functions, classes,
            namespaces, and type objects are reflectable semantic objects.

            Interfaces do not introduce implicit same-name signature overloading. Terrane
            does not select an interface operation by searching same-named alternatives
            according to argument types. Each declared operation provides the statically
            checked contract used at its call sites, and the conforming receiver provides
            the implementation reached through the interface dispatch boundary.

            An interface declared with `owning interface`, or containing any consuming
            instance method, is an owning interface protocol even when its other operations
            are shared or mutable. A resource-owning class can implement it and be erased to
            that interface. Erasing the value transfers ownership; it does not clone the
            concrete resource. Assignment and passing the owning interface by value transfer
            it; shared and mutable method calls borrow it. Reuse after transfer or a
            consuming invocation is rejected. Owning erasure provides no general copy or
            clone operation. This does not relax nominal conformance or the compiler's
            `Send` and `Sync` requirements for interface implementations.
    - id: associated-outputs
      title: Supplied associated type contracts
      blocks:
        - type: markdown
          markdown: |-
            An authored interface declares a supplied type with `associated type Name`. An
            implementing class supplies it with `associated type Name = Type`. These are
            type members, not runtime fields or calls. Bare `type` remains an ordinary field
            name; the `associated type` prefix distinguishes the declaration.

            Method parameters and results may refer to the declared name. Conformance checks
            the substituted contract, including parameter types, return types, invocation
            mode, and throwable allowance. Missing or duplicate bindings and incompatible
            implementations are source errors. Interfaces declare slots without defaults;
            classes must bind their associated declarations. When multiple implemented
            interfaces declare an associated slot with the same name, one class binding
            satisfies every such slot; the class does not supply separate bindings by
            interface identity.

            Associated names are supported in interface method signatures and in local
            bindings within method bodies. They are not currently available as class field
            types; a field annotation using an associated name does not resolve to a type
            descriptor. This limit does not reduce the method-signature or local-binding
            support described here.

            A closed interface application retains its supplied types through dispatch,
            fields, inheritance, imports, and exported declaration metadata. Its bindings
            are not erased into unknown concrete result types. Associated slots do not
            introduce a blanket clone requirement: native non-copyable inputs and results
            keep their own transfer rules. An explicitly owning interface permits an owning
            implementation even if all its methods borrow the receiver.

            Explicit generic arguments precede associated slots in declaration order. An
            imported interface keeps both parts of its closed application. Associated names
            cannot duplicate explicit generic parameter names. An open interface cannot be
            used as a runtime value type, including inside a field, parameter, result, local
            binding, reference, callable or collection; supply its complete binding set
            rather than erasing the response relationship.
        - type: example
          id: supplied-response
          title: Distinct response families on one nominal interface
          language: terrane
          mode: illustrative
          source: |-
            interface request
                associated type response
                function dispatch response; input string

            class numeric-request implements request
                associated type response = int
                function dispatch int; input string
                    return 40

            class text-request implements request
                associated type response = string
                function dispatch string; input string
                    return input

            numeric request of int = instance numeric-request;
            textual request of string = instance text-request;
            count = numeric.dispatch; 'ignored'
            message = textual.dispatch; 'distinct'
        - type: markdown
          markdown: |-
            Ordinary typed method bodies provide native bindings: a class can bind its
            response slot to a projected native type and return a projected call directly.
            No separate native-mapping declaration or per-request wrapper object is needed.
            The compiler must still establish the exact native input/result relationship
            described in [[lang.types.generics#native-associated-results]].
