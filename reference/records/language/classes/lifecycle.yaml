documentation:
  status: complete
  title: "Construct destruct and value lineage"
  title-style: text
  summary: >-
    Construction and destruction methods compose across inheritance. Copies create fresh lifecycle lineages, while moves preserve
    a single lineage.
  tags:
    - "objects"
    - "lifecycle"
  sections:
    - id: lifecycle
      title: "Construction, Destruction, and Value Lineage"
      blocks:
        - type: markdown
          markdown: |-
            Construct an object only with `instance class; arguments`. The class designator
            is a simple visible class name, including an imported local name, or the
            late-bound `self` available inside a class method. Calls use the explicit `;`
            form, including construction without arguments. Calling a class as an ordinary
            callable does not construct an instance. `instance` specifies semantic
            instantiation and does not require a particular allocation strategy.

            Instantiation invokes the conventional `construct` method. Lifecycle methods
            compose across the class’s single-inheritance chain, including `construct` and
            `destruct` behavior for inherited state.

            Each independently owned value has its own lifecycle lineage. Copying creates a
            fresh lineage, so the copy and original have independent lifecycles. Moving a
            value preserves its existing lineage rather than creating another one.
  see-also: []

