documentation:
  status: complete
  title: "Construct destruct and value lineage"
  title-style: text
  summary: >-
    Construction and destruction methods compose across inheritance. Copies create fresh lifecycle lineages, while moves preserve
    a single lineage.
  tags:
    - "objects"
    - "lifecycle"
  sections:
    - id: lifecycle
      title: "Construction, Destruction, and Value Lineage"
      blocks:
        - type: markdown
          markdown: |-
            Construct an object only with `instance class; arguments`. The class designator
            is a simple visible class name, including an imported local name, or the
            late-bound `self` available inside a class method. Calls use the explicit `;`
            form, including construction without arguments. Calling a class as an ordinary
            callable does not construct an instance. `instance` specifies semantic
            instantiation and does not require a particular allocation strategy.

            Instantiation invokes the conventional `construct` method. Lifecycle methods
            compose across the class’s single-inheritance chain, including `construct` and
            `destruct` behavior for inherited state.

            An authored class with no declared or inherited `construct` method has an
            implicit zero-argument constructor when its fields have defaults. Passing
            positional or named arguments to that implicit constructor is a source error.
            Field names do not become constructor parameters automatically. Fields without
            defaults still require a constructor that initializes them.

            Ordinary class-value construction uses `instance class; arguments`. A
            specialized `throw class; arguments` form invokes the same constructor and
            throws its result; `throw class` and `throw class;` supply no arguments. The
            class must implement `throwable`, and the same constructor checks apply. These
            throw forms do not make class names generally callable.

            Construction has no independent unsafe call syntax: neither `instance` nor
            direct throwable construction provides a separate unsafe acknowledgement. A
            class therefore cannot declare `unsafe function construct`; initialization that
            requires a caller-visible external obligation must use an explicitly named
            unsafe factory operation instead.

            Declare a destructor as `function destruct`; it is always consuming. Writing
            `consuming` is accepted as an explicit equivalent. `mutable`, `shared`,
            `static`, and `async` are invalid destructor qualifiers and produce a compiler
            error. A destructor may await required finalization without itself being
            declared as an ordinary async callable. Destruction completes only after each
            such await completes; it is never deferred as background cleanup. Inside a
            running multithreaded runtime, finalization reuses that runtime through a
            blocking handoff rather than creating a runtime per drop. Destruction outside a
            running runtime, or on a current-thread runtime, retains a temporary scoped
            thread and runtime to preserve immediate completion. Awaited destructors
            currently require the threaded executor; the cooperative executor rejects them
            with a source diagnostic because it permits non-transferable values. Finalizers
            must not wait for another operation that needs the same held shared-object
            guard. A destructor cannot report a normal failure result, so resource APIs
            should also expose an explicit async close operation when callers need to
            observe close failures.

            Each independently owned value has its own lifecycle lineage. Copying creates a
            fresh lineage, so the copy and original have independent lifecycles. Moving a
            value preserves its existing lineage rather than creating another one.

            Calling a consuming method on an owned source-object binding transfers the
            existing value into the call, even when its class is otherwise copyable. It does
            not implicitly separate a copy with a new lifecycle lineage or retain an extra
            original for scope-exit destruction. Parenthesizing the receiver and storing the
            binding across a `try`/`finally` boundary do not change this rule.

            Projected Rust value receivers retain their separately proven clone-conversion
            contract: a copyable projected value may be reused after a native consuming call
            when that conversion is available. This does not create an extra authored-class
            lifecycle lineage.
  see-also: []

