documentation:
  status: complete
  title: Class fields and metadata
  title-style: text
  summary: >-
    Defines class field initialization, external names, secrecy policy, and
    descriptor reflection over one coherent field metadata model.
  tags:
    - classes
    - fields
    - metadata
    - reflection
  sections:
    - id: declaration
      title: Declaring field metadata
      blocks:
        - type: rule
          id: rule.classes.field-metadata
          level: must
          since: null
          evidence:
            - class-field-metadata
            - duplicate-class-field-metadata
            - conflicting-external-field-name
            - malformed-class-field-metadata
          markdown: |-
            An instance field may carry one trailing `metadata (...)` clause.
            Version one defines string `external-name` and boolean `secret`.
            A metadata name cannot repeat, static and non-field declarations
            cannot carry field metadata, and effective external names must be
            unique within a class.

            The ordinary initializer remains the field default, and `T|none`
            remains the source spelling for optionality. The resolved field
            descriptor derives `defaulted` and `optional`; facilities must not
            introduce parallel default or optional metadata.

    - id: reflection
      title: Reflecting resolved fields
      blocks:
        - type: rule
          id: rule.classes.field-metadata-reflection
          level: must
          since: null
          evidence:
            - class-field-metadata
          markdown: |-
            A class descriptor exposes `field-count` and parallel,
            declaration-ordered `field-names`, `field-external-names`,
            `field-defaulted`, `field-optional`, and `field-secret` lists.
            Inherited replacement is resolved before observation. Names are
            Terrane semantic names rather than generated Rust identifiers.

