documentation:
  status: complete
  title: Class fields and metadata
  title-style: text
  summary: >-
    Defines class field initialization, external names, secrecy policy, and
    descriptor reflection over one coherent field metadata model.
  tags:
    - classes
    - fields
    - metadata
    - reflection
  sections:
    - id: initialization
      title: Initializing fields
      blocks:
        - type: rule
          id: rule.classes.field-defaults
          level: must
          since: null
          evidence:
            - implicit-class-field-defaults
            - trait-field-defaults
            - cross-unit-inherited-initializer
            - nondefaultable-class-field
            - nondefaultable-trait-field
            - nondefaultable-tuple-field
          markdown: |-
            A typed class or trait field may omit its initializer when its
            declared type has a canonical default. Boolean fields receive
            `false`, numeric fields receive typed zero, strings and bytes
            receive empty values, `T|none` receives `none`, and list, map, set,
            unordered-map, and unordered-set fields receive empty collections.

            Plain `none`, tuples, source objects, references, callables,
            resources, and other runtime contracts are nondefaultable. Every
            effective class field must have a canonical or explicit default.
            A trait may provide an initializer, or the using class may override
            the field with one. Inherited initializers retain their declaring
            source and object context. Omission never infers a type, invokes an
            arbitrary constructor, or puts hidden `none` into `T`.

    - id: declaration
      title: Declaring field metadata
      blocks:
        - type: rule
          id: rule.classes.field-metadata
          level: must
          since: null
          evidence:
            - class-field-metadata
            - duplicate-class-field-metadata
            - conflicting-external-field-name
            - malformed-class-field-metadata
          markdown: |-
            An instance field may carry one trailing `metadata (...)` clause.
            Version one defines string `external-name` and boolean `secret`.
            A metadata name cannot repeat, static and non-field declarations
            cannot carry field metadata, and effective external names must be
            unique within a class.

            A canonical type default or ordinary initializer is the effective
            field default, including when contributed by a trait or inherited
            from a base. `T|none` remains the source spelling for optionality.
            The resolved field descriptor derives `defaulted` and `optional`;
            facilities must not introduce parallel default or optional metadata.

    - id: reflection
      title: Reflecting resolved fields
      blocks:
        - type: rule
          id: rule.classes.field-metadata-reflection
          level: must
          since: null
          evidence:
            - class-field-metadata
            - implicit-class-field-defaults
          markdown: |-
            A class descriptor exposes `field-count` and parallel,
            declaration-ordered `field-names`, `field-external-names`,
            `field-defaulted`, `field-optional`, and `field-secret` lists.
            Inherited replacement is resolved before observation. Names are
            Terrane semantic names rather than generated Rust identifiers.

