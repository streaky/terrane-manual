notes:
  implementation: >-
    The compiler retains metadata on ObjectField and materializes immutable
    metadata slices only when descriptor reflection is required.
  compatibility: null
  security: >-
    Secret metadata is policy input. Logging redacts the value before every
    sink rather than asking each sink to remember the policy.
  performance: >-
    Static metadata is emitted once; field reflection allocates only the
    requested observed list.

