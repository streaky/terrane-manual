documentation:
  status: complete
  title: "Method receiver authority"
  title-style: text
  summary: >-
    Distinguishes shared, mutable, and consuming method receivers, their implementation
    contracts, and value-returning fluent API design.
  tags:
    - "objects"
    - "methods"
    - "receiver-mutability"
  sections:
    - id: receiver-mutability
      title: "Shared, mutable, and consuming receivers"
      blocks:
        - type: markdown
          markdown: |-
            Plain `function` declares shared receiver authority. Use `mutable function` when
            a method updates the existing receiver, or `consuming function` when it takes
            ownership of the receiver. A method body may use less authority than its
            declaration, never more. Constructors have their own initialization authority.

            A method declaration and its implementation must have compatible receiver
            contracts. In particular, an implementation cannot require mutable or consuming
            receiver access when its declared contract permits only shared access. A mutable
            contract exposes possible mutation even when one invocation does not change the
            receiver.

            Source methods retain their declared identity on plain objects and through `ref`
            or `shared ref` receivers, including inherited methods. Names such as `add`,
            `multiply`, `encode`, `parse`, `radix`, and `coerce` do not select builtin
            scalar, collection, or text operations on a source object with that method. The
            authored signature, not a builtin family's arity or policy rules, controls the
            call. Normal receiver-authority rules still apply; a method name does not grant
            additional mutation authority.

            `this` denotes the current instance and is available only in instance methods.
            `self` denotes the effective, late-bound class receiver and is available in
            instance and static methods. Class-level `self::member` access is also available
            within a named local function declared in a method; it does not capture instance
            state. `self` does not replace the instance receiver used to access or mutate
            instance state. Select authored-class static fields with `::`, never
            instance-selection `.`. Builtin descriptor constants retain their documented
            property syntax.

            Returning the receiver's class type can make an API fluent, but the return
            remains an ordinary value contract rather than an implicit reference to the
            receiver. See [[lang.functions.fluent-apis]] for complete examples of
            value-transforming builders, consuming builders, mutable alternatives, and
            asynchronous terminals.
  see-also:
    - lang.functions.fluent-apis
    - lang.functions.callable-types
    - lang.types.authority-in-practice

