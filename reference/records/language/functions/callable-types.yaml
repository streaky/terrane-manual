documentation:
  status: complete
  title: Callable types and throwable bounds
  title-style: text
  summary: >-
    Defines synchronous and asynchronous callable type syntax, throwable upper
    bounds, exact escaping metadata, compatibility, invocation, and reflection.
  tags:
    - functions
    - types
    - errors
    - async
    - reflection
  sections:
    - id: syntax
      title: Callable type syntax
      blocks:
        - type: rule
          id: rule.functions.callable-throwable-syntax
          level: must
          since: null
          evidence:
            - callable-throwable-contracts
            - callable-throws-missing-bound
            - callable-throws-nonthrowable
          markdown: |-
            A synchronous callable type is written `function from A, B to R`.
            An asynchronous callable type adds the leading `async`. Either form
            accepts a postfix throwable upper bound:

            ```terrane
            function from int to string throws coercion-error
            async function from int to string throws throwable
            ```

            `throws` requires one object type conforming to `throwable`. Callable
            results associate right, and a postfix clause binds to the callable
            introduced by the nearest `function`. Thus
            `function from A to function from B to R throws Inner throws Outer`
            constrains the result callable with `Inner` and the outer callable
            with `Outer`.

    - id: compatibility
      title: Throwable compatibility
      blocks:
        - type: rule
          id: rule.functions.callable-throwable-compatibility
          level: must
          since: null
          evidence:
            - callable-throwable-contracts
            - callable-throwable-broad-to-narrow
            - callable-throwable-argument-broad-to-narrow
            - callable-throwable-return-broad-to-narrow
            - callable-throwable-field-broad-to-narrow
            - callable-throwable-to-unbounded
          markdown: |-
            A written `throws T` clause is an upper bound, not a claim that every
            invocation throws. An infallible or narrower implementation satisfies
            a broader destination. An implementation with a broader or unrelated
            escaping set is rejected at the binding, argument, return, or class
            field initializer that attempts the conversion.

            Omitting `throws` declares an infallible callable type. Every source
            callable has either exact inferred metadata or an explicit written
            storage contract; the compiler does not introduce a broad fallback.

    - id: exact-metadata
      title: Exact values, invocation, and reflection
      blocks:
        - type: rule
          id: rule.functions.callable-exact-throwables
          level: must
          since: null
          evidence:
            - callable-throwable-contracts
            - throwable-function-value
          markdown: |-
            Named functions, anonymous closures, stored bound methods, and
            inferred callable bindings retain their exact inferred escaping set.
            A callable binding or field with a written type retains that written
            contract as its storage ABI, so invocation through it uses the bound.

            A callable proven to have an empty escaping set lowers to an
            infallible callable ABI. Its invocation has no error propagation and
            registers no semantic error site. Widening that value into a broader
            written callable destination inserts a result-bearing adapter at the
            conversion boundary. The same rules apply to synchronous and
            asynchronous callable values.

            Reflection exposes the stored written promise as
            `throwable-contract`, the effective set as `escaping-throwables`, and
            the aggregate marker through `contracts`.
  see-also:
    - lang.functions.declarations
    - lang.functions.asynchronous

