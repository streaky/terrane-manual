documentation:
  status: complete
  title: Callable invocation modes, types, and throwable bounds
  title-style: text
  summary: >-
    Defines shared, mutable, and consuming callable syntax, synchronous and
    asynchronous forms, throwable upper bounds, exact metadata, compatibility,
    invocation, and reflection.
  tags:
    - functions
    - types
    - errors
    - async
    - reflection
  sections:
    - id: syntax
      title: Callable type syntax
      blocks:
        - type: rule
          id: rule.functions.callable-throwable-syntax
          level: must
          since: null
          evidence:
            - callable-throwable-contracts
            - callable-throws-missing-bound
            - callable-throws-nonthrowable
          markdown: |-
            A synchronous callable type is written `function from A, B to R`. Prefix
            `mutable` permits repeatable updates to receiver or captured state; `consuming`
            permits transfer and one invocation. An asynchronous callable adds `async` after
            that invocation prefix. Every form accepts a postfix throwable upper bound:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function from int to string
            mutable async function from int to string throws coercion-error
            consuming function to connection
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `throws` requires one object type conforming to `throwable`. Callable results
            associate right, and a postfix clause binds to the callable introduced by the
            nearest `function`. Thus
            `function from A to function from B to R throws Inner throws Outer` constrains
            the result callable with `Inner` and the outer callable with `Outer`.
    - id: invocation-modes
      title: Invocation authority and compatibility
      blocks:
        - type: rule
          id: rule.functions.callable-invocation-modes
          level: must
          since: null
          evidence:
            - callable-invocation-modes
            - consuming-callable-reuse
          markdown: |-
            Plain `function` is shared and may observe its receiver or captured environment
            repeatedly. `mutable function` may update repeatable state. `consuming function`
            may transfer from that environment and is callable once.

            The compiler retains the written mode separately from the exact authority used
            by the implementation. A body may use less authority than written, never more.
            Shared implementations satisfy shared, mutable, or consuming destinations;
            mutable implementations satisfy mutable or consuming destinations; consuming
            implementations satisfy only consuming destinations. One mutable invocation owns
            its receiver and captures exclusively for the full call, including suspension;
            overlapping invocations of the same callable value execute serially. Mutable
            value separation copies the current environment into an independent invocation
            boundary rather than aliasing it.

            Invocation mode, `async`, and `throws` are orthogonal contracts. Their canonical
            order is invocation prefix, `async`, `function`, signature, then `throws`.
    - id: compatibility
      title: Throwable compatibility
      blocks:
        - type: rule
          id: rule.functions.callable-throwable-compatibility
          level: must
          since: null
          evidence:
            - callable-throwable-contracts
            - callable-throwable-broad-to-narrow
            - callable-throwable-argument-broad-to-narrow
            - callable-throwable-return-broad-to-narrow
            - callable-throwable-field-broad-to-narrow
            - callable-throwable-to-unbounded
          markdown: |-
            A written `throws T` clause is an upper bound, not a claim that every invocation
            throws. An infallible or narrower implementation satisfies a broader
            destination. An implementation with a broader or unrelated escaping set is
            rejected at the binding, argument, return, or class field initializer that
            attempts the conversion.

            Omitting `throws` declares an infallible callable type. Every source callable
            has either exact inferred metadata or an explicit written storage contract; the
            compiler does not introduce a broad fallback.

            Callable parameter and result storage must match; ordinary source-class upcasts
            do not adapt a callable returning a subclass into one returning its base. Such a
            conversion reports a source type diagnostic. Use an explicit wrapper function
            that performs the result conversion. This restriction does not remove
            invocation-mode or throwable-bound compatibility.
    - id: exact-metadata
      title: Exact values, invocation, and reflection
      blocks:
        - type: rule
          id: rule.functions.callable-exact-throwables
          level: must
          since: null
          evidence:
            - callable-throwable-contracts
            - throwable-function-value
          markdown: |-
            Named functions, anonymous closures, stored bound methods, and inferred callable
            bindings retain exact invocation and throwable metadata. A callable binding or
            field with a written type retains both exact initializer summaries for
            reflection and the written contracts as its storage ABI and invocation bounds.

            ABI selection follows written contracts independently. A proven-empty
            implementation widened into a throwing destination therefore receives
            result-bearing storage without falsifying its empty exact escaping set. Its
            invocation through that storage observes the written bound. The same rules apply
            to synchronous and asynchronous callable values.

            Compatibility is checked against the written throwable bound before exact
            initializer metadata is retained. Refining borrowed environment storage or
            recording an inferred escaping identity cannot widen that bound or grant
            permission to throw an unrelated native error.

            A callable environment that owns an exclusive borrowed capture is noncopyable,
            including a repeatable mutable callable. Transferring that callable to another
            binding moves the environment; the original binding cannot be invoked afterward.

            Typed callable parameters currently do not accept environments that retain
            ordinary borrowed references, for either shared or mutable invocation. This
            limitation applies to named callables and inline anonymous arguments even when
            their visible signatures match. Mismatch diagnostics annotate the actual
            callable with `captures borrowed references` to expose the distinction. Invoke
            such a callable locally, or capture owning values instead; an inferred local
            callable may retain its loans subject to ordinary last-dependent-use rules.

            A bodyless interface signature is abstract, not an empty implementation. Its
            written throwable bound supplies the dispatch ABI and possible effects for
            interface and generic-bound callers. Concrete implementations retain their own
            narrower exact summaries; an infallible implementation is widened into the
            interface's result-bearing ABI at the forwarding boundary.

            A written shared-reference function type cannot accept a named or anonymous
            callable that requires mutation through a native reference. Terrane rejects such
            arguments, initializers, assignments, and returns with T0140 before Rust
            lowering. Collection elements use shared-reference function storage even when
            their types are inferred, so inferred collection literals, collection method
            storage arguments, and indexed assignments reject these mutators as well. Direct
            calls, inferred aliases, shared observers (including collection elements), and
            callbacks whose mutable borrow authority is selected by a native API remain
            supported.

            Native captures retain their ownership and snapshot constraints. T0144 rejects
            mutable lending from a captured non-`Clone` native value, or a non-`Clone`
            native capture whose repeatable asynchronous invocation or mutable-environment
            separation requires cloning. This is a current native-capture implementation
            boundary, not permission to silently clone resources or generate a Rust-only
            failure. Pass the native value as a reference parameter, use a cloneable or
            shared-owned representation, or use an explicit consuming callable where
            ownership permits. Supported shared read-only captures and mutations through
            callback parameters remain valid.

            Owned callable environments currently require transferable (`Send`) captured
            values, and shared callable environments additionally require shareable (`Sync`)
            captures, even for local invocation or a native destination without those
            markers. Non-transferable or non-shareable captures report T0084 or T0085 rather
            than a native backend error. Lexically borrowed local environments use a
            separate runtime and do not acquire these owned-environment requirements. This
            includes generic captures and payloads nested in owned collections or class
            fields when no declared bound proves the required capability. An interface bound
            whose protocol implies `Send` or `Sync` supplies that proof; a bound lacking the
            obligation does not. A consuming callable does not waive these requirements: all
            executor modes use the same owned carrier. The compiler reports the missing
            capability rather than adding an implicit generic bound. A callable's own
            generic parameter is not a capture, and a captured callable carrier's
            argument/result types do not themselves define its transferability.

            Transferability is separate from environment lifetime. Consuming, mutable and
            asynchronous owned carriers, returned shared callables and other escaping
            callable destinations require a proven `'static` environment. An interface bound
            proving `Send` or `Sync` does not prove `'static`; capturing such an otherwise
            unconstrained generic in an escaping carrier reports `T0084`. The compiler does
            not add an implicit lifetime bound to the enclosing generic function. Local
            shared callables can retain a shorter inferred lifetime, including local aliases
            and collections.

            Storing a callable through a collection reference parameter, including a
            reference alias or nested collection destination, is an escape. Collection
            parameter and class-field declarations also fix their callable payloads to the
            declared owned ABI, so stores there require the same lifetime proof. An
            independent local collection copy may still infer a shorter lifetime; copying it
            does not change the caller's collection.

            Creating an owned closure transfers a captured non-Clone binding when no Clone
            conversion is available. A later closure cannot capture that same moved binding
            again (`T0058`). One shared closure may still be invoked repeatedly; concrete
            Clone captures can be preserved for multiple closures.

            An anonymous callable cannot return an ordinary reference borrowed from its
            captured environment. The current native callable ABI has no result lifetime
            lent by that environment, so Terrane reports T0145 before Rust lowering. This
            includes returning a captured reference alias or borrowing a captured owned
            value. Pass the owner as an explicit reference parameter, or return an owned
            result instead. A callable may still return a reference selected from its
            declared reference parameters, subject to the ordinary single-lender rule;
            capturing other values does not by itself prohibit that result.

            Reflection exposes `invocation-mode` and `exact-invocation-mode` alongside
            `throwable-contract`, `escaping-throwables`, and the aggregate `contracts`
            marker.

            Reflection is ordinary value access. Invoking a consuming callable consumes that
            value, so inspect its contract metadata before the invocation or through a
            separate owning value.
