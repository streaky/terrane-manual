documentation:
  status: complete
  title: Parentheses and indentation grouping
  title-style: text
  summary: >-
    Defines indentation-based argument and fluent-chain continuation, its interaction with parentheses, and its unchanged call semantics.
  tags:
    - syntax
    - functions
    - calls
    - layout
  blocks:
    - type: markdown
      markdown: >-
        Layout is an alternate way to write ordinary calls and member chains. It
        normalizes to the same call and member expressions as semicolon calls; it does
        not change ownership, evaluation, invocation, or lowering. A semicolon remains
        the call marker. This page is authoritative for choosing and mixing layout and
        parenthesized forms.
  sections:
    - id: activation-and-boundaries
      title: Activating call layout
      blocks:
        - type: rule
          id: rule.calls.layout-activation
          level: must
          since: null
          markdown: |-
            A deeper sibling line after a call marker starts an argument block. Arguments
            are comma-separated throughout that block; newlines and indentation within it
            are whitespace, so multiple complete arguments may share a line or span lines. A
            dedent closing a nested call's argument block or a chain opened beneath an
            argument implicitly ends that argument, allowing the next outer sibling argument
            without a comma.

            A comma belongs to the argument block where it appears. The next argument must
            begin in that same block; a comma followed by dedent, `)`, end of statement, or
            end of input is invalid and reports `S1122` at the comma. Trailing commas are
            invalid in every call form, including inline, layout, and grouped calls. These
            rules do not change comma-separated parameter lists. Named arguments retain
            `name = value` spelling. A nested call at the root of an indented argument line
            may have its own deeper argument block. An inline argument list on that line
            owns same-line arguments and deeper continuation lines, but is sealed before the
            first following substantive line whose indentation is less than or equal to the
            call's own line. An end-of-line comma there belongs to the outer call:
            `opt; 'a',` followed by an aligned `'b'` means `wrap(opt('a'), 'b')`. Same-line
            `opt; 'a', 'b'` keeps both arguments inside `opt`, as does a deeper `b` after
            `opt; 'a',`. Outer parentheses around an active layout call preserve that call's
            column ownership. Only parentheses opened inside the active layout—around a
            nested call/list or an operand—suppress column sealing for their own contents.
            Existing structural argument blocks still end by dedent; a comma inside such a
            block may not cross that dedent. Ordinary inline nested calls remain `S1016`;
            use parentheses in that form. Missing separators and trailing/cross-dedent
            commas remain `S1122`. A dangling binary operator whose operand starts at the
            same or a shallower column after an inline nested call is rejected with `S1122`;
            indent the operand more deeply or parenthesize it.

            This deliberately makes reindentation meaningful while retaining mixed layout
            and parenthesized syntax; there is no strict alternative.

            A deeper sibling line beginning with `.` continues a receiver chain from the
            completed preceding result. The receiver may occupy its own first line. Inside
            otherwise layout-free parentheses, the first leading-dot line must be deeper
            than the preceding receiver line to activate layout; later sibling stages align
            at the active chain level after their argument blocks dedent. Each stage is an
            ordinary member selection or semicolon call; the dot does not invoke a method. A
            call stage still requires `;`, including a zero-argument call.

            Parentheses bound active layout at their matching `)`. Neither adding nor
            removing call parentheses makes a line break an argument separator. Operator
            expressions may wrap within an argument block, including at extra indentation,
            with the same precedence in both spellings. Ordinary parenthesized expressions
            outside an argument block retain their existing free-form wrapping.

            A chain after inline arguments continues from the completed call result, while a
            chain indented beneath an argument-line root continues from that argument. Thus
            `print; '  x  '` followed by an indented `.trim;` applies the stage to `print`'s
            result; `deferred;` followed by an indented `'  ready  '` and a more-indented
            `.trim;` applies it to the argument.

            An anonymous function's indented body remains an ordinary callable block scope,
            including when the function expression is parenthesized in an activated argument
            layout. For example, `print; (apply; (function string;` followed by an indented
            `return 'ready'))` passes the anonymous function as the argument.

            In a function declaration or anonymous-function header, only the opening `(`
            immediately after its header semicolon is a parameter-header delimiter.
            Parentheses elsewhere on the line, including those in a function-type
            annotation, retain ordinary contextual layout behavior.

            A block-bearing statement header keeps its following indentation for the
            statement body. In `if`, `while`, `for`, `switch`, `match`, and `select`
            headers, put layout calls or chains inside parentheses to distinguish their
            argument/chain blocks from the statement body. An ordinary inline condition such
            as `while progress.pending;` retains its existing meaning.
        - type: example
          id: layout-chain-and-arguments
          title: Read a fluent chain and its arguments by stage
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            layout-result = message
                .with-text;
                    'ready'
                .after;
                    (duration::milliseconds; 1)
                .wait;

            grouped-result = ((other-message.with-text; 'ready').after; (duration::milliseconds; 1)).wait;
            layout-arguments = outer;
                inner;
                    'first', label = 'second'
                final = 3
            grouped-arguments = outer; (inner; 'first', label = 'second'), final = 3
            comma-arguments = outer;
                'first',
                'second'
            grouped-comma-arguments = outer; ('first', 'second')
            # Inline nested calls need grouping before another outer argument.
            nested-arguments = outer; (inner; 1), 2
          response: null
          diagnostic: null
          markdown: null
        - type: example
          id: inline-result-versus-argument-chain
          title: Distinguish the call result from an argument
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            # Finish the result returned by configure.
            result = configure; '  ready  '
                .finish;

            # Trim the argument before passing it to configure.
            result = configure;
                '  ready  '
                    .trim;
          response: null
          diagnostic: null
          markdown: null
        - type: example
          id: parenthesized-anonymous-body
          title: Pass anonymous functions with indented bodies
          language: terrane
          mode: run
          target: null
          timeout-ms: null
          source: |-
            namespace grouping/callable-body
            function apply string; operation function to string
                return operation;
            function main;
                print; (apply; (function string;
                    return 'ready'))
                print; (apply; function string;
                    return 'ready')
          response:
            kind: stdout
            language: text
            display: on-run
            content: |-
              ready
              ready
          diagnostic: null
          markdown: null
    - id: column-ownership
      title: Seeing which call owns an argument
      blocks:
        - type: markdown
          markdown: |-
            The first call below gives `opt` one argument and `wrap` two. Keeping both
            values on `opt`'s line, or indenting the second more deeply, instead gives `opt`
            both values. Outer parentheses around the active `wrap` layout preserve its
            column ownership; parentheses opened inside that layout around `opt` suppress
            sealing for `opt`'s contents. The paired C05 examples distinguish those cases.
            Editor parameter hints expose the distinction: the aligned form's second string
            is labelled `wrap.b:`, while internally grouped values belong to `opt.w:`.
        - type: example
          id: nested-inline-column-ownership
          title: Compare aligned, same-line, deeper and grouped arguments
          language: terrane
          mode: run
          target: null
          timeout-ms: null
          source: |-
            namespace grouping/column-ownership
            function wrap string; a string, b string = '-'
                return '[' + a + '|' + b + ']'
            function opt string; v string, w string = ''
                return v + w
            function main;
                aligned = wrap;
                    opt; 'a',
                    'b'
                print; aligned
                # Grouping the active call does not disable its column ownership.
                outer-grouped = (wrap;
                    opt; 'a',
                    'b')
                print; outer-grouped
                same-line = wrap;
                    opt; 'a', 'b'
                print; same-line
                deeper = wrap;
                    opt; 'a',
                        'b'
                print; deeper
                # Grouping opened inside the active layout suppresses sealing.
                inner-grouped = wrap;
                    (opt; 'a', 'b'),
                    'c'
                print; inner-grouped
          response:
            kind: stdout
            language: text
            display: on-run
            content: |-
              [a|b]
              [a|b]
              [ab|-]
              [ab|-]
              [ab|c]
          diagnostic: null
          markdown: null
    - id: parenthesized-mixing
      title: Mixing layout and explicit grouping
      blocks:
        - type: markdown
          markdown: |-
            Use parentheses to delimit a nested inline call before another outer argument.
            Commas separate arguments in all call forms; newlines and indentation are
            whitespace within an argument block. The dedent closing a nested argument or
            chain block implicitly ends that argument. A comma belongs to the block where it
            appears and cannot cross the dedent because the dedent already ends the list;
            remove a comma before a deeper inline continuation dedents. Parameter-list rules
            are unchanged.

            A negative value and a text marker start arguments after a call marker or a
            comma, in both spellings. Without a comma, a following `-` continues subtraction
            and `>` is a comparison rather than a text marker. Two complete expressions
            without a comma are invalid; line breaks do not disambiguate them. A closing
            parenthesis after tail text must be on a later line, outside the literal.

            Operator wrapping inside an argument block works with and without parentheses. A
            dangling binary operator after an inline nested call cannot take an operand from
            a same-column or shallower line: it is rejected with `S1122`, without a
            secondary separator diagnostic. Put the operand on a deeper line or parenthesize
            it. Outside an argument block, use ordinary parentheses for a multiline
            expression. A parenthesized call can be a receiver, and a chain stage can have
            its own indented arguments.

            Operators keep their ordinary precedence and association. Layout continuation is
            expression structure, not implicit Boolean conjunction, a pipeline operator, or
            an ORM/query convention. It does not change how `and`, `or`, or any other
            operator combines expressions.
        - type: example
          id: commas-and-wrapped-arguments
          title: Keep negative values, text, and wrapped operands equivalent
          language: terrane
          mode: run
          target: null
          timeout-ms: null
          source: |-
            namespace grouping/comma-layout
            function subtract int; left int, right int
                return left - right
            function join string; left string, right string
                return left + ':' + right
            function number int; value int
                return value
            function main;
                plain = subtract;
                    5,
                    -2
                grouped = (subtract;
                    5,
                    -2)
                print; plain
                print; grouped
                first = join;
                    'a' +
                        'b',
                    >b text
                second = (join;
                    'a' +
                        'b',
                    >b text
                )
                print; first
                print; second
                print;
                    number;
                        5
                        -2
          response:
            kind: stdout
            language: text
            display: on-run
            content: |-
              7
              7
              ab:b text
              ab:b text
              3
          diagnostic: null
          markdown: null
        - type: example
          id: parenthesized-chain
          title: Continue a chain inside a parenthesized expression
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            wrapped = (message
                .with-text;
                    ('ready')
                .wait;)
          response: null
          diagnostic: null
          markdown: null
    - id: await-comments-and-markers
      title: Await, comments, and text markers
      blocks:
        - type: markdown
          markdown: |-
            `await` applies to the completed chain expression, not merely its first physical
            line. Blank and comment-only lines are neutral: they neither start nor close an
            argument block or chain continuation. Existing `>` and `>>` text-marker forms
            retain their lexical meaning and contents; layout interpretation does not scan
            or rewrite literal text.

            Indentation uses the lexer's established consistent-file policy. Prefix
            indentation is measured by its byte count rather than editor tab stops; tabs and
            spaces may not be mixed in one prefix or switched between code-bearing lines.
            Ordinary parenthesized wrapping remains layout-free.
        - type: example
          id: awaited-layout-chain
          title: Await the terminal result of a layout chain
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            text string = await message
                .with-text;
                    'ready'
                .after;
                    (duration::milliseconds; 1)
                .wait;
            other-text string = await ((other-message.with-text; 'ready').after; (duration::milliseconds; 1)).wait;
          response: null
          diagnostic: null
          markdown: null
    - id: indentation-levels
      title: Tabs and indentation levels
      blocks:
        - type: markdown
          markdown: |-
            One tab is one prefix byte, not a jump to a display column. In the following
            example the function statements have one tab and the chain stages have two. A
            space-indented file may use four and eight spaces for the same structure;
            neither spelling may mix indentation styles within the file. A deeper prefix
            establishes a level, and sibling stages return to that exact prefix length.
        - type: example
          id: tab-indented-chain
          title: Use tabs consistently for both blocks and chains
          language: terrane
          mode: run
          target: null
          timeout-ms: null
          source: |-
            namespace grouping/tab-layout
            function main;
            	text = '  ready  '
            	result = text
            		.trim;
            		.upper;
            	print; result
          response:
            kind: stdout
            language: text
            display: on-run
            content: READY
          diagnostic: null
          markdown: null
    - id: malformed-boundaries
      title: Malformed and ambiguous boundaries
      blocks:
        - type: markdown
          markdown: |-
            Every argument block uses commas between sibling arguments; physical lines and
            indentation do not separate arguments. A dedent closing layout opened within one
            argument implicitly ends it, so the next outer sibling may follow without a
            comma. A comma is owned by its current block and cannot be followed by dedent,
            `)`, end of statement, or end of input; `S1122` points at that comma. Trailing
            commas are invalid in inline, layout, and grouped calls, but parameter lists are
            unchanged. Missing separators, incomplete arguments, invalid continuations, or
            malformed parentheses are syntax errors; the parser must not silently
            reinterpret them as a different call, operator expression, or invocation. A
            parenthesis close bounds its block sooner. Chain continuation belongs to the
            preceding receiver/result. Existing semicolon-call grouping and newline rules
            continue to apply outside activated contexts.
  see-also:
    - lang.functions.fluent-apis
    - lang.functions.asynchronous
    - lang.expressions.operators
    - lang.lexical-structure.source-layout
    - internals.parser.call-layout
