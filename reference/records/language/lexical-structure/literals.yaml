documentation:
  status: complete
  title: "Comments and scalar literals"
  title-style: text
  summary: >-
    The syntax supports comments and scalar literals comprising strings, bytes, booleans, `none`, and numeric forms. These
    constructs are preserved through the lossless syntax…
  tags:
    - "syntax"
    - "literals"
    - "comments-literals"
  sections:
    - id: comments-literals
      title: "Comments and Scalar Literals"
      blocks:
        - type: markdown
          markdown: |-
            Terrane recognizes three ordinary comment forms:

            - `#` begins a line comment.
            - `//` begins a line comment.
            - `/*` begins a block comment; the first following `*/` closes it.

            Comments and surrounding whitespace are retained as trivia in the lossless
            syntax representation. Comment-only lines do not affect indentation, and a line
            containing only the terminator of a multiline comment does not open or close a
            block. An unclosed block comment produces `L0002 unterminated block comment` at
            its source span.

            `///` line comments (but not `////`) and `/** ... */` block comments (but not
            `/*** ... */` or `/**/`) are declaration documentation. Decorative banners
            remain ordinary comments. Documentation is retained byte-for-byte in trivia and
            also extracted as semantic documentation. Consecutive documentation lines form
            one block; blank documentation lines preserve paragraphs. Documentation attaches
            to the following declaration across its annotation applications, but a blank
            source line or ordinary intervening comment breaks attachment and produces
            `S1101` for the dangling block. Extraction removes delimiters, surrounding blank
            lines, common source indentation, and optional common leading `*` decoration
            without removing meaningful content indentation. Formatting preserves the
            original documentation comment bytes.

            Quoted strings have two forms. Single-quoted strings are raw Unicode text,
            except `\'` for an apostrophe and `\\` for a backslash; every other backslash
            sequence remains literal (including `\n`), and no compatibility warning is
            emitted for this intentional change. Use double quotes for control-character
            escapes. Double-quoted strings support interpolation and the escapes `\\`, `\'`,
            `\"`, `\n`, `\r`, `\t`, `\0`, and `\u{1F600}` (a Unicode scalar escape). Unknown
            double-quoted escapes are errors. Only double-quoted strings interpret doubled
            braces: `{{` and `}}` produce literal `{` and `}`; single-quoted braces remain
            literal as written. A lone `}` in a double-quoted string is rejected.

            In a double-quoted string, `{ expression }` evaluates an ordinary Terrane
            expression; inline calls and their inner quoted strings follow normal expression
            rules. For example, `"Outer: {format; "Hello {name}"}"` permits one nested
            interpolating string. `"Hello {{name}}"` yields `Hello {name}`. A single-quoted
            string inside interpolation remains raw. At most two interpolating string levels
            may be active (the outer string and one nested string); a third is rejected with
            `L0015`. A string with no interpolation does not consume a level, and ordinary
            parenthesized expression nesting is unrestricted.

            Selectors follow the expression, separated by whitespace: `expr !: key`. The
            selector is available only at the interpolation expression's top level; `!:`
            inside nested expressions is rejected as a parse error.
        - type: example
          language: terrane
          mode: illustrative
          source: |-
            function render; value string
                return "Outer: {format; "Hello {name}"}"
            greeting = "Hello {{name}}"
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The `>` form treats the rest of its physical line as literal text. The `>>` form
            introduces indentation-delimited multiline text and removes common structural
            indentation. These markers introduce text only in expression-start position.
            That position includes immediately after a value-bearing `return` whose keyword
            begins a logical statement. A `.return` member name and `throw` do not establish
            text-literal context.

            Tail and block text cannot be used as a non-final, ungrouped subexpression. A
            block-string token spans its marker and body. A malformed string produces
            `L0007 malformed string literal`, while a block-string marker that is not final
            produces `L0008 block string marker not final`.

            Numeric literals have either decimal form—with digits and at most one fractional
            part—or hexadecimal form beginning with `0x`. An underscore may separate digits,
            but it cannot be leading, trailing, doubled, or adjacent to `.`. A dot belongs
            to a number only when followed by a digit, so `1.type` is member access rather
            than a decimal literal.

            Exponent notation, radix prefixes other than `0x`, and type suffixes are not
            part of the version-one numeric grammar. Runs such as `1e9`, `0b101`, `123abc`,
            and incomplete `0x` are each reported as one `L0009 invalid numeric literal`
            rather than split into unrelated tokens.

            The scalar-literal set also includes byte, Boolean, and `none` literals. The
            syntax tree retains literal structure together with byte spans, token ranges,
            the complete token stream, and trivia. Quoted, tail, and block text, numeric
            literals, bytes, Booleans, and `none` therefore pass through parsing without
            reconstructing their source spelling. Literal typing occurs during semantic
            analysis, including destination-range checks for compile-time numeric constant
            expressions.
