documentation:
  status: complete
  title: "Open decorative with-modifiers"
  title-style: text
  summary: >-
    The open `with` modifier protocol provides decorative modifiers. It is separate from compiler-owned structural declaration
    keywords.
  tags:
    - "syntax"
    - "modifiers"
    - "decorative-modifiers"
  sections:
    - id: decorative-modifiers
      title: "Decorative `with` Modifiers"
      blocks:
        - type: markdown
          markdown: |-
            Terrane separates compiler-owned **structural declaration keywords** from an
            open set of package-supplied **decorative modifiers**. Structural keywords
            define language semantics such as name resolution, visibility, mutability,
            ownership, or a callable’s type contract. They include `global`, `constant`,
            visibility qualifiers such as `public`, `private`, and `protected`, and callable
            qualifiers such as `static`, `async`, and `throws`. Structural keywords are
            never applied through `with`.

            Package modifiers use a `with` clause before structural keywords:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            with per-cpu, aligned global counts unsigned-long = 0
            with per-cpu, (aligned; 64) global x int = 0
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The clause consists of `with` followed by comma-separated modifier expressions.
            Modifiers resolve through ordinary lexical scope and apply from left to right. A
            modifier that takes arguments uses a parenthesized form, as in `(aligned; 64)`;
            the clause itself does not use wrapping parentheses.

            A comma means that another modifier follows. The list ends when a modifier is
            not followed by a comma, and the declaration begins at the next element. A
            trailing comma is therefore invalid. In `with per-cpu, global x = 0`, `global`
            is read as the next modifier and rejected because it is a reserved structural
            word.

            A `with` clause may decorate any declaration, including an untyped local
            binding; no typed binding is required. Decorative modifiers control how an
            already-understood declaration is realized, including storage, layout, linkage,
            ABI, section placement, or alignment. They may not alter visibility, ownership,
            name resolution, mutability, or a callable’s type contract. A property that
            changes those compiler-owned semantics requires a structural keyword instead.

            The modifier vocabulary is open to first- and third-party packages, but every
            modifier is subject to the same semantic boundary. New realization properties
            can therefore be introduced without extending the declaration grammar.
            `with global` is invalid because `global` remains a compiler-owned declaration
            form. Modifier composition is the outer package-supplied layer around the
            declaration’s structural semantics.
