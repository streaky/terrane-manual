documentation:
  status: complete
  title: General declaration annotations
  title-style: text
  summary: >-
    Defines typed declaration annotations, documentation metadata, source-free declaration interfaces, and reflection contracts.
  tags: [annotations, metadata, reflection, declarations]
  sections:
    - id: status
      title: Implementation status
      blocks:
        - type: admonition
          kind: important
          title: Implemented and verified
          markdown: >-
            General declaration annotations, documentation metadata, and source-free
            declaration interfaces are implemented and verified through compiler unit and
            end-to-end conformance tests. This capability is distinct from the deferred
            package-defined `with` declaration-realization protocol, which is not part of
            the published compiler surface.
    - id: model
      title: Annotation types and application
      blocks:
        - type: markdown
          markdown: |-
            An annotation is a package-defined type whose declaration opts into an
            annotation marker supplied by `/core/annotations`. Its `targets` and
            `repeatable` fields declare eligible declaration kinds and whether repeated
            applications are admitted. Annotation schema data fields must be public. The
            package owns the annotation's schema and documented meaning; fields are
            immutable metadata, not executable callbacks. Annotation names and arguments
            resolve through ordinary imports, with no special compiler registry of names.

            The application form is `@[name; positional, named = value]`. The semicolon is
            mandatory even with no arguments. Positional arguments bind in declaration
            order; named arguments bind by annotation payload field name. Ordinary type
            checking validates the application. Applications attach metadata; they do not
            transform, wrap, replace, or synthesize the annotated declaration.
        - type: example
          id: annotation-type-example
          title: Package-defined annotation type
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            from /core/annotations import annotation, annotation-target
            from /core/collections import list

            @[annotation; targets = (list; (instance annotation-target::parameter;))]
            class command-option
                long-name string
                help string|none = none
          response: null
          diagnostic: null
          markdown: >-
            Annotation types declare accepted payload fields; an application supplies an
            immutable compile-time value of that shape.
        - type: markdown
          markdown: |-
            The `/core/annotations` marker supplies `targets` and `repeatable`;
            `annotation-target` enumerates class, callable, parameter, and field. The
            explicit `descriptor` schema slot admits canonical compile-time descriptors,
            including builtin type names such as `int`, the `none` descriptor, and named
            function declarations. It does not admit unrestricted runtime function or type
            values. A class using the descriptor slot records metadata, not a runtime
            descriptor object.
    - id: grammar-and-targets
      title: Placement, targets, and repetition
      blocks:
        - type: markdown
          markdown: |-
            Annotation applications may attach to classes, functions or methods, parameters,
            and fields. Parameter annotations precede their parameter inside the ordinary
            parameter list, including parenthesized multiline headers. Applications are
            checked against their annotation's declared target set. Unknown annotation
            names, malformed arguments, invalid values, inappropriate targets, and
            disallowed duplicates are source-level errors. General evaluation errors use
            `S2110`, duplicate non-repeatable annotations use `S2111`, constant cycles use
            `S2112`, payload type mismatches use `S2113`, and invalid attachment targets use
            `S2114`. Duplicate map keys and set members are rejected rather than silently
            merged during annotation construction.

            Repeatability is declared per annotation type. A non-repeatable annotation may
            appear once per declaration; repeatable applications retain source order. The
            mechanism does not imply annotation inheritance: subclasses, aliases, and
            re-exports do not silently acquire or copy another declaration's metadata.
        - type: example
          id: annotation-application-example
          title: Callable, parameter, and field annotations
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            from /annotation-cli import command, command-option
            from /annotation-codec import external-name

            /// Options for running the report command.
            @[command; name = 'report', summary = 'Run the report command']
            function run int; (
                @[command-option; long-name = '--output', help = 'Write results to this path']
                output-path string,
            )
                return 0

            class export-record
                /**
                 * Stable exported record identifier.
                 */
                @[external-name; 'record_id']
                id int
          response: null
          diagnostic: null
          markdown: >-
            The CLI payloads use the tracked `command` (`name`, optional `summary`) and
            `command-option` (`long-name`, optional `help`) metadata schemas. The codec
            example uses a package-defined external field name. The text and package names
            illustrate use of those schemas; the compiler does not standardize domain
            meanings for package-defined annotation types.
    - id: docs-and-metadata
      title: Documentation and retained metadata
      blocks:
        - type: markdown
          markdown: |-
            A `///` line documentation block or `/** ... */` block documentation comment
            attached to an annotation block documents the declaration that follows; it does
            not document or alter the annotation value. Ordinary `#` (including `##`), `//`,
            and `/* ... */` comments remain non-exported. Documentation and annotations are
            separate declaration metadata, each exposed through declaration descriptors.

            Consecutive `///` lines form one documentation block. The canonical block
            documentation examples use leading `*` decoration; undecorated `/** ... */`
            blocks are equally accepted and require no warning. Extraction removes the
            delimiters and surrounding blank lines, strips common source-layout indentation,
            then removes each decorative leading `*` and at most one following space.
            Paragraph breaks and meaningful indentation after the decoration are retained.
            Empty `///` lines likewise retain paragraph boundaries. Normalization affects
            extracted documentation only, not the original lossless syntax-tree comment. The
            illustrated field comment returns exactly `Stable exported record identifier.`;
            its undecorated spelling returns the same text.

            A contiguous documentation block attaches to the next declaration across its
            annotation block. A plain blank source line outside the comment, ordinary
            comment, or unrelated declaration ends the attachment opportunity. A dangling
            documentation block is diagnosed. Documentation retains the originating
            declaration and source span rather than transferring to aliases or overrides.

            Named local callables retain their enclosing callable identity, and interface
            and trait methods retain their declaring owner identity. For example, a local
            `helper` inside `/example::run` is `/example::run::helper`; a method of
            `/example::shape` is `/example::shape::area`. Same-spelled declarations in
            different lexical owners do not share metadata.

            The compiler constructs and type-checks annotation values without executing
            arbitrary user constructors, decorators, or callbacks. Admitted values are
            compile-time data, including supported immutable scalar and collection values
            and explicitly typed descriptor/kind slots. They cannot perform I/O, read
            mutable state, or run arbitrary code.

            Declaration descriptors expose canonical identity, source and origin spans,
            documentation, ordered typed annotations, callable parameter
            names/types/defaults, field visibility and metadata, declared results, and
            existing callable contracts. `DeclarationInterface` format 1 provides `to_json`
            and `from_json`, a package identity, metadata fingerprint, file-ID-to-path
            `sources` map, and declaration records. It carries no source bodies: public
            metadata can be consumed with paths for origin mapping even when dependency
            source is unavailable. Export interfaces omit bundled roots and private
            declarations/fields; defaults for non-public or secret fields are redacted.
            Annotation schema data fields must be public. Runtime embedding is optional;
            compile-time inspection requires no dynamic reflection runtime or global
            registration. Fingerprints include relevant metadata and docs, including source
            byte spans: whitespace edits that move origins invalidate the interface as well.
            The `sources` map contains only files referenced by exported records, not the
            entire bundled standard-library inventory. A parameter or field default that
            requires runtime evaluation has its tagged `kind` set to `unsupported`, distinct
            from a missing default; consumers must not silently replace it with a new
            default. For explicit tool selection and declaration-interface export, see
            [[tool.build-time-tools#declaration-inputs]].
    - id: using-metadata
      title: Using metadata in build-time tools
      blocks:
        - type: markdown
          markdown: |-
            Tool selection, generation rules, execution, and freshness belong to
            [[tool.build-time-tools]], not annotation application. Its
            [[tool.build-time-tools#annotation-driven-generation]] section covers
            metadata-driven validation and the CLI and codec reference consumers.
            Annotations are one possible input to that separate tooling capability.
    - id: identity-and-boundaries
      title: Declaration identity and language boundaries
      blocks:
        - type: markdown
          markdown: |-
            An annotation does not alter the semantic identity of a callable or type, change
            its signature, or wrap its execution. There is no implicit inheritance or alias
            propagation. Retained annotations and documentation are semantic inputs to
            exported declaration interfaces; their fingerprints prevent consumers from
            reusing stale metadata.

            Annotation construction, target checking, repeatability, descriptor reflection,
            and declaration-interface retention belong to compiler infrastructure.
            Domain-specific interpretation, additional validation, and generated command or
            schema code belong to explicit consumers. Consumers preserve ordinary
            declaration effects, ownership, and type contracts rather than using metadata as
            authority to rewrite them.

            Compile-time metadata consumption does not require runtime reflection storage.
            Annotation blocks are not realization modifiers and cannot request storage
            layout, linkage, ABI, or alignment; those remain the separate concern of the
            deferred decorative-modifier design.
  see-also:
    - tool.build-time-tools

