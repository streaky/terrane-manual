documentation:
  status: complete
  title: "Bindings and declaration modifiers"
  title-style: text
  summary: >-
    Declarations support typed and inferred bindings, constants, globals, visibility, and compiler-owned structural modifiers.
  tags:
    - "syntax"
    - "bindings"
    - "declarations"
  sections:
    - id: declarations
      title: "Bindings and Declaration Modifiers"
      blocks:
        - type: markdown
          markdown: |-
            A binding places its type expression after its name. The principal forms are:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            name = value
            name int = 42
            name string
            constant max-size int = 1024
            private cache = map;
            global service = service;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `name = value` infers a type from the initializer. `name T = value` supplies an
            explicit destination type, while `name T` declares an uninitialized typed
            binding. A local variable belongs to its function; control flow determines its
            availability at each read, reference, member access, argument pass, or capture.
            Only uncertain variables retain a runtime representation of uncertainty, checked
            at an uncertain use. Proven availability needs no source-level availability
            check; when the variable needs uncertainty storage elsewhere, native lowering
            may retain a safe assertion of the compiler's invariant. A provably unavailable
            use is a source error. Assignment compatibility does not introduce implicit
            cross-type coercions.

            A later declaration in a loop body may reach an earlier use through a reachable
            back-edge. The use is uncertain until an iteration assigns the value, so an
            executed read before that assignment reports the same source-located
            availability error as other uncertain reads. A later declaration with no path
            back to the use does not make a provably unavailable forward read valid.

            `constant` is the immutability qualifier; `const` is not its spelling. `global`
            is a compiler-owned structural qualifier. Visibility is public by default, and
            the structural visibility qualifiers are `public`, `private`, and `protected`.
            Strict visibility mode may require an explicit qualifier. Misplaced declaration
            prefixes produce declaration syntax diagnostics, including
            `S1029 invalid declaration prefix`.

            The bare discard forms are:
        - type: example
          id: legacy-fence-002
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            _ = expression
            _ T = expression
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A discard requires an initializer, accepts no declaration qualifiers, and
            creates no readable binding. Its initializer is evaluated exactly once,
            optionally with destination type `T`, and the result is released at the end of
            the statement. Discards suppress binding and store warnings.

            A longer name beginning with `_` remains an ordinary binding. It retains its
            value until the normal scope endpoint and suppresses the unused-binding warning,
            but its first read produces a warning.

            An initializer resolves names against the scope as it exists immediately before
            the declaration, so the new binding is not visible in its own initializer. If no
            earlier binding supplies the name, a direct read—or a read through a called
            function—is an error naming the absent binding.

            Within the same lexical scope, a later declaration may replace an earlier
            binding. Its initializer can read the earlier binding; after the initializer has
            been evaluated, the old owned value is released and a new binding identity is
            installed. Replacement may change the binding’s type. A non-owning `ref` to the
            released value becomes unusable, while a `shared ref` continues to own the old
            identity and is not retargeted. An identical type annotation makes the
            declaration equivalent to assignment for type purposes but does not preserve
            identity. Named function declarations are function-visible declarations, not
            replaceable mutable bindings: a same-function binding cannot replace their
            names.

            Namespace-level declarations cannot replace one another. Namespace
            initialization dependencies, including dependencies introduced by
            namespace-level assignments folded into initialization, must be acyclic.

            Only named and anonymous function bodies create lexical scopes. `if`/`else`,
            `select`, `while`, and `for` bodies share their enclosing function's scope.
            Declaration, redeclaration, and type replacement behave exactly as the same
            executed lines written straight through. An identical annotation assigns the
            existing variable; a new type replaces it. A `for` target is an ordinary
            variable in that function, added if absent and visible after the loop. Thus
            `x int = 3` followed by `x string = 'cat'` leaves a `string`, `x int = 3` alone
            leaves an `int`, and `x string = 'cat'` alone leaves a `string`. Wrapping any
            sequence in a branch or loop changes none of those per-path results. Plain
            assignment retains its destination type, including nullable and fixed-width
            numeric types; narrowing does not replace the variable's storage type.

            Owned values are released on replacement or function exit, not when a
            control-flow body ends. Nested functions have independent scopes and may shadow
            an enclosing declaration; indentation alone never introduces shadowing.

            At a control-flow join, a variable has the ordinary finite union of every type
            reaching that point, including loop-entry and back-edge types. Joining distinct
            types is not an error: each subsequent use must accept every alternative unless
            narrowing removes the others. A value assigned on only some paths, including a
            loop that may execute zero times, has uncertain availability. Its existence is
            checked at uses not proven available, without imposing checks on proven uses.

            Source-declared type parameters are unsupported. Angle-bracket generic intent
            produces `S1092 unsupported angle generic`; use the canonical constructor form,
            such as `list of string`, where applicable.
