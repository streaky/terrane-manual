documentation:
  status: complete
  title: "Compile-time when build selection"
  title-style: text
  summary: >-
    `when build` selects branches deterministically from the available capabilities. The selected branch participates in build-cache
    identity.
  tags:
    - "names"
    - "conditional-selection"
    - "build-selection"
  sections:
    - id: build-selection
      title: "Compile-Time Build Selection"
      blocks:
        - type: markdown
          markdown: |-
            `when build` performs deterministic compile-time branch selection. Conditions
            may use literals; immutable manifest, target, and capability descriptors;
            Boolean and comparison operators; and compiler-provided pure queries. Runtime
            state is not part of this selection model.

            Capability information can therefore select source according to what the build
            provides without creating a runtime capability test. Only the selected branch is
            included in the current build; inactive branches are excluded.

            Every input used by `when build` participates in the build-cache key. Builds
            that differ in relevant manifest, target, capability, or other permitted
            condition inputs therefore have distinct cache identities.
