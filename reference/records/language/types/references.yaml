documentation:
  status: complete
  title: References, provenance, and shared ownership
  title-style: text
  summary: >-
    Defines non-owning ref paths, explicit shared ownership, lifetime ends, and reference lowering.
  tags: [types, references, ownership, provenance, lowering]
  sections:
    - id: forms
      title: Ownership forms
      blocks:
        - type: markdown
          markdown: |-
            `ref T` is a non-owning reference to an identity and does not extend the
            lender's lifetime. `shared ref T` is an explicit shared owner. `move` transfers
            an owned value. Assignment and calls do not silently convert among these
            contracts, and a `ref T` cannot be promoted to `shared ref T`.

            Copying `shared ref T` copies its owning handle, not `T`. A resource-shaped or
            non-Clone native referent therefore does not by itself make a containing class
            or enum noncopyable. Collection indexing and iteration likewise copy shared
            handles without consuming or cloning their referents. Other directly owned
            linear fields retain their normal transfer rules. In type expressions, `ref`
            binds more tightly than the union operator `|`. Thus `ref holder|none` means
            `(ref holder)|none`, not `ref (holder|none)`. To borrow the union as a whole,
            write `ref (holder|none)`. Argument mismatch diagnostics preserve the complete
            optional types and show the grouping of an optional reference, rather than
            dropping the `|none` arms while comparing their non-optional payloads.
    - id: provenance
      title: Whole-path provenance
      blocks:
        - type: markdown
          markdown: |-
            Every ordinary reference records its originating owner, selected external-lender
            parameter, and an ordered path of field, element, and call-result projections.
            Parentheses, binding, calls, returned references, captures, and borrowed
            iteration preserve or narrow that path; they never widen its lifetime. A
            function returning non-owning `ref T` is accepted only when return flow selects
            exactly one reference parameter, including through another call. Parameter count
            never chooses the lender, and a by-value parameter or local value cannot lend a
            returned ordinary reference. Returning an explicit `shared ref T` transfers or
            copies shared ownership instead; it does not require an external reference
            lender.

            Anonymous callables returning an ordinary reference into their captured
            environment are currently unsupported and receive `T0145` before native
            lowering. Return a reference lent by an explicit reference parameter, or an
            owned value, instead. A reference to a callable-local owner and an ambiguous
            choice among declared parameter lenders still receive `T0068`; they are not
            treated as supported captured-environment returns.
    - id: lifetime
      title: Lifetime-ending operations
      blocks:
        - type: markdown
          markdown: |-
            Mutation that may invalidate the projected path, including ordinary-owner
            collection mutation, owner replacement, movement, release, and scope exit ends
            the relevant lifetime. A later observer use is a source error at the ending
            operation rather than a run-time expiry path. List, map, and unordered-map
            elements have supported borrow paths; unsupported index owners reject. A
            reference crossing `await` is accepted only when the selected lender remains
            valid.
    - id: lowering
      title: Cost and cycle contracts
      blocks:
        - type: markdown
          markdown: |-
            A bounded native ordinary reference lowers to a Rust borrow, and a selected
            reference-return lender becomes an explicit Rust result lifetime. Reading it
            does not upgrade, lock, or clone its owner. Explicit shared ownership retains
            synchronized reference-counted storage; an ordinary observer of that same shared
            identity uses a non-owning weak handle. The native target rejects statically
            provable strong cycles in descriptor fields, including through collection
            element types, while admitting acyclic shared fields. Later unproved native
            shared cycles are not traced and must be broken explicitly; ordinary `ref`
            back-edges are not ownership edges.

            A field reference borrows its declared payload, including inherited fields. A
            required field's internal initialization slot does not make the reference
            optional: `ref owner.field` has a reference to the field's declared type, not a
            reference to an implementation `Option`. Source parameters written `ref T`
            select borrowing from the declaration: callers pass ordinary expressions,
            without a unary `ref`. Writing `ref` on a call argument or return expression is
            rejected with `T0146`; remove it because the selected function declaration
            determines borrowing. Returning an ordinary reference likewise writes the lender
            expression directly, without `ref`. Local bindings such as
            `selected = ref cameras[id]` establish a reference independently of any function
            signature. Implicit ordinary borrows require an owner-proven name, field, or
            collection element; a computed temporary has no owner path and is rejected with
            `T0064`. The declaration does not extend the owner's lifetime or permit
            returning references to local values. `ref T` preserves the referent's declared
            representation: borrowing does not perform an owned numeric conversion or wrap
            an owner in a different value carrier. It currently requires an exact referent
            type; subtype/interface assignability and owner-to-reference-base borrowing are
            not supported. This documents current expressibility only; it does not decide
            whether future assignability support should be added. Ordinary source references
            are read-only: direct field, nested field, indexed, compound, and
            increment/decrement writes through them receive `T0147`, as do mutable
            source-method calls through such a reference. Mutate an owned receiver or an
            explicit shared owner instead. Checked shared-storage mutation and inferred
            projected-native reference mutability remain separate. Returning `ref T` from a
            function declared to return an owned generic `T` receives `T0015`; declare a
            `ref T` result when borrowing is intended. Projected Rust borrowed arguments
            follow their projected signature's conversion contract; invocation-scoped native
            views retain their separate lifetime rules.

            Inferred ordinary-reference bindings retain the same owner provenance and weak
            storage as explicitly typed observers. Copying such an observer copies only its
            non-owning handle, not the referent. If a named owner is explicitly shared
            anywhere in its function, that shared storage applies throughout the function.
            Passing an observer of that storage to a plain `ref T` parameter is rejected
            with `T0141`, including direct, named, and callable-value arguments. Pass the
            owning shared reference to a `shared ref T` parameter instead. No implicit
            lock-scoped borrow or referent snapshot is inserted: the former can deadlock
            through another shared alias, and the latter would change reference identity.

            An ordinary observer binding keeps the storage kind selected by its initial
            owner. Reassigning it between a plain owner and a shared-backed owner is
            rejected with `T0142`, in either direction, for both inferred and explicitly
            typed bindings. Use a separate observer binding for the other storage kind.
            Reassignment between owners of the same storage kind remains supported, subject
            to the ordinary reference lifetime rules. The compiler does not implicitly
            promote a plain owner into shared storage to unify these carriers.

            A standalone field read from shared storage materializes its result inside a
            bounded guard scope and releases the guard before sibling effects. This applies
            to owning handles, weak observers, and the original named owner, including Copy
            scalars and inheritance-backed getters. Builtin and native borrowed observations
            may instead lend physical fields and reuse one bounded guard for simple
            borrowed-place operands from one canonical binding. Effect-free syntax alone
            does not prove guard independence: an index or map key may read guarded storage,
            and different bindings may alias the same storage. Such selectors and
            uncoalesced competing guarded operands retain bounded receiver snapshots whose
            guards end before subsequent reads or effects. Field writes, required-slot
            replacement, and nested collection mutations retain the live storage identity;
            they do not mutate a receiver snapshot.

            A guarded synchronous method call captures its receiver identity first,
            evaluates explicit arguments in written order and supplies defaults before
            acquiring the invocation guard. Assignment right-hand sides and collection
            arguments likewise finish before the write guard is acquired. This bounds read
            and argument temporaries. Shared-storage access is exclusive and checked at
            runtime: reacquisition by the same thread fails immediately with a
            borrow-conflict panic instead of waiting on itself. This includes read-only
            method reentry; a recursive mutex does not make overlapping mutable references
            safe.

            `T0143` remains a cheap compile-time error for obvious receiver/argument
            aliases, including local straight-line copies and replacements. It is not the
            runtime enforcement mechanism. Helpers, loops, stored handles and indirect calls
            need not be statically resolved for actual same-thread reentry to fail promptly.
            See [Checked shared storage](lang.types.references#shared-deadlocks) for the
            runtime contract, guard lifetimes, concurrent limitations and safe structuring
            guidance.

            A projected native reference parameter uses shared access for observation.
            Mutating native operations, including operations reached through source helper
            calls, infer a mutable native borrow and require matching caller access. This
            inference does not copy the referent, transfer ownership, or grant mutation
            through a shared native input. Authored-class receiver authority remains
            explicit.
    - id: shared-deadlocks
      title: Checked shared storage and concurrent deadlocks
      blocks:
        - type: markdown
          markdown: |-
            Explicit shared ownership preserves one storage identity; copying a handle does
            not copy its referent. Native shared storage combines mutex synchronization with
            an ownership-aware runtime borrow check. A synchronous method holds exclusive
            access for its body. Access through `this` uses that existing guard; trying to
            acquire the same storage again through another owning handle, weak observer or
            original owner on the same thread fails immediately with
            `shared reference borrow conflict: storage is already borrowed by this thread`.
            Read/read alias reentry is also rejected: this implementation is exclusive, not
            a recursive lock or a read/write borrowing system.

            A different thread waits normally and can acquire the storage after release.
            Multiple threads acquiring different objects in opposite order can still
            deadlock. Native locks outside this shared-storage carrier retain their own
            contracts. This is not a general deadlock detector or a lock timeout.
      sections:
        - id: automatic-guard-scopes
          title: What generated guard scopes prevent
          blocks:
            - type: markdown
              markdown: |-
                Standalone field reads produce the requested owned result inside a bounded guard
                scope, including inherited getters, Copy scalars, weak observers, and original
                shared owners. Builtin/native borrowed observations may coalesce simple
                borrowed-place operands from one canonical binding when their selectors require
                no guarded reads. Guarded selectors, potentially aliased competing guards, and
                effectful operands instead retain bounded snapshots; the snapshot guard ends
                before later reads or effects. Ordinary value-lowered arguments likewise must
                not reacquire a coalesced guard. Unrelated arithmetic and aggregate reads remain
                bounded per operand.

                Synchronous calls capture receiver identity first, evaluate explicit arguments
                in source order, supply defaults, then acquire the invocation guard. Writes and
                nested collection mutations similarly evaluate values before acquiring the live
                write guard; they do not mutate cloned receiver snapshots. These rules apply to
                source and projected native invocation lowering. They avoid unnecessary
                temporary-lifetime conflicts; they do not authorize recursive access.

                Guards do not survive suspension: synchronous guarded methods cannot await. An
                async source method invoked through shared storage owns its receiver handle, not
                a borrowed guard or a copied referent. Each field access or synchronous method
                call acquires a bounded guard; writes remain visible to other handles. On a
                threaded executor, another invocation may interleave between any two separately
                guarded accesses, even when the async method contains no `await`. Therefore
                `this.total = this.total + 1` is not atomic; neither an await-free statement, a
                segment between awaits, nor a whole async method is a transaction. For an atomic
                read-modify-write, put the operation in a synchronous mutable helper and call it
                through `this`: the helper body executes under one receiver guard.

                A non-consuming async method cannot borrow an inline source-object field of
                `this` as another shared or mutable async method's receiver, or create a plain
                reference into that inline child: the child has no independent shared handle,
                and the parent's bounded field guard cannot lend it outside that access. These
                currently receive `T0135` before lowering, even when the child is copyable. Use
                a synchronous helper through `this`, or explicitly bind an owned snapshot when
                independent value semantics are intended. A field containing an explicit
                `shared ref` already owns a child handle and remains supported without copying
                the referent. This is a current scoped-lender limitation, not a promise that
                scoped field lending is implemented.
            - type: example
              id: async-shared-atomic-helper
              title: Keep an async update inside a synchronous guarded helper
              language: terrane
              mode: illustrative
              source: |-
                class counter
                    total int = 0

                    mutable function increment;
                        this.total = this.total + 1

                    mutable async function advance;
                        this.increment;

                async function main;
                    value = instance counter;
                    owner = shared ref value
                    await owner.advance;
                    print; owner.total
              target: null
              return_value: null
              stdout: "1"
              diagnostic: null
              markdown: null
        - id: diagnosed-reentry
          title: What T0143 diagnoses
          blocks:
            - type: markdown
              markdown: |-
                For synchronous shared or mutable source instance methods, `T0143` rejects an
                explicit shared-reference argument when the compiler identifies it as the
                receiver's storage. The receiver may be an owning shared handle, a weak observer
                of shared storage, or the original shared-backed owner. Parentheses, typed or
                inferred bindings, and named arguments do not intentionally hide an otherwise
                known match.

                The inexpensive check recognizes the same resolved handle, handles created from
                one owner, and local straight-line copies/replacements. It forgets affected
                identities at compound control-flow writes. There are no loop-entry proofs,
                iteration-count reasoning, pass-through-return alias inference, or transitive
                helper parameter-pair summaries in this diagnostic.

                This is a conservative source-call restriction: it can reject a matching
                argument even if the method never reads it. It is reported before backend
                compilation, and remains an error rather than a new warning-severity protocol.
                Compilation success does not authorize reentry: checked runtime acquisition
                enforces the same-thread rule independently of static alias recognition.
            - type: example
              id: reentry-through-helper
              title: Hidden helper aliases still fail promptly at runtime
              language: terrane
              mode: illustrative
              source: |-
                class counter
                    count int = 5
                    function peek int; other shared ref counter
                        return other.count

                function inspect int; receiver shared ref counter, argument shared ref counter
                    return receiver.peek; argument

                function main;
                    owner = instance counter;
                    held = shared ref owner
                    print; (inspect; held, held)
              target: null
              return_value: null
              stdout: null
              response:
                kind: diagnostic
                language: text
                display: shown
                content: "Runtime panic: shared reference borrow conflict"
              diagnostic: null
              markdown: null
        - id: unchecked-reentry
          title: Runtime enforcement and remaining concurrent responsibilities
          blocks:
            - type: markdown
              markdown: |-
                Helpers and wrapper chains, indirect calls, returned handles, named collections,
                nested/counter loops and loop-carried aliases may hide an identity from `T0143`.
                If execution actually reacquires storage already held by the same thread, the
                runtime check still fails before attempting to wait. An unexecuted conflicting
                path does not itself cause a runtime error.

                A borrow conflict is a runtime panic, not a declared Terrane throwable or a
                recoverable `catch` contract. Unwinding releases guards. The underlying mutex
                retains normal poison semantics if a holder unwinds; subsequent generated access
                reports the existing lock-poison failure. The runtime never fabricates a copied
                referent, skips a mutation, or retries under a different identity.

                Cross-thread contention waits rather than spuriously reporting a borrow
                conflict. Applications remain responsible for ordering acquisitions of distinct
                shared objects, avoiding lock cycles with native synchronization, and not
                waiting for work that needs storage the current operation holds. In particular,
                waiting for a second thread which needs the first thread's guard is a
                multi-thread dependency cycle, not local recursive acquisition. There is no
                general deadlock-freedom guarantee.

                Shared-reference acquisition is a blocking synchronous operation; task
                cancellation or deadlines do not interrupt that mutex wait. There is no exposed
                try-lock, timed lock or read/write-compatible guard. See
                [shared mutable state](std.concurrency.shared-state#advanced-boundaries) for the
                existing userspace tools and explicit synchronization gaps.

                The ordinary weak-observer lifetime rules, `T0141` plain-reference parameter
                restriction and `T0142` carrier-kind restriction remain unchanged. Runtime
                checking does not grant mutation authority or extend reference lifetimes.
        - id: structuring-shared-operations
          title: Structuring operations without reentry
          blocks:
            - type: markdown
              markdown: |-
                Use the already-guarded receiver directly inside its method rather than passing
                an alias back into that storage. When an operation needs two handles that may
                alias, prefer a free helper whose separate field reads finish before the next
                read, rather than an outer guarded method that accesses the other handle while
                holding its receiver guard.

                If a method only needs scalar or other value data, obtain that data before
                entering the guarded method and pass the value explicitly. This is an
                application-level value contract, not a compiler-inserted snapshot that silently
                changes reference identity. When identity or atomic read/modify/write behavior
                is required, keep the whole operation under one receiver's authority and avoid
                reacquisition through aliases; splitting it into several reads is not an atomic
                replacement.

                Passing distinct owners is permitted, but variable names and declaration sites
                alone do not prove distinctness after aliases or replacements. For
                indirect/native operations, reason about their own locking contracts as well.
                These structuring rules prevent the described self-reentry; they do not solve
                arbitrary multi-lock ordering.
            - type: example
              id: bounded-shared-field-helper
              title: Separate bounded field reads can accept the same handle
              language: terrane
              mode: illustrative
              source: |-
                class counter
                    count int = 5

                function total int; first shared ref counter, second shared ref counter
                    return first.count + second.count

                function main;
                    owner = instance counter;
                    held = shared ref owner
                    print; (total; held, held)
              target: null
              return_value: null
              stdout: "10"
              diagnostic: null
              markdown: null
  see-also: []

