documentation:
  status: complete
  title: References, provenance, and shared ownership
  title-style: text
  summary: >-
    Defines non-owning ref paths, explicit shared ownership, lifetime ends, and reference lowering.
  tags: [types, references, ownership, provenance, lowering]
  sections:
    - id: forms
      title: Ownership forms
      blocks:
        - type: markdown
          markdown: |-
            `ref T` is a non-owning reference to an identity and does not extend the
            lender's lifetime. `shared ref T` is an explicit shared owner. `move` transfers
            an owned value. Assignment and calls do not silently convert among these
            contracts, and a `ref T` cannot be promoted to `shared ref T`.

            Copying `shared ref T` copies its owning handle, not `T`. A resource-shaped or
            non-Clone native referent therefore does not by itself make a containing class
            or enum noncopyable. Collection indexing and iteration likewise copy shared
            handles without consuming or cloning their referents. Other directly owned
            linear fields retain their normal transfer rules.
    - id: provenance
      title: Whole-path provenance
      blocks:
        - type: markdown
          markdown: |-
            Every ordinary reference records its originating owner, selected external-lender
            parameter, and an ordered path of field, element, and call-result projections.
            Parentheses, binding, calls, returned references, captures, and borrowed
            iteration preserve or narrow that path; they never widen its lifetime. A
            function returning non-owning `ref T` is accepted only when return flow selects
            exactly one reference parameter, including through another call. Parameter count
            never chooses the lender, and a by-value parameter or local value cannot lend a
            returned ordinary reference. Returning an explicit `shared ref T` transfers or
            copies shared ownership instead; it does not require an external reference
            lender.
    - id: lifetime
      title: Lifetime-ending operations
      blocks:
        - type: markdown
          markdown: |-
            Mutation that may invalidate the projected path, including ordinary-owner
            collection mutation, owner replacement, movement, release, and scope exit ends
            the relevant lifetime. A later observer use is a source error at the ending
            operation rather than a run-time expiry path. List, map, and unordered-map
            elements have supported borrow paths; unsupported index owners reject. A
            reference crossing `await` is accepted only when the selected lender remains
            valid.
    - id: lowering
      title: Cost and cycle contracts
      blocks:
        - type: markdown
          markdown: |-
            A bounded native ordinary reference lowers to a Rust borrow, and a selected
            reference-return lender becomes an explicit Rust result lifetime. Reading it
            does not upgrade, lock, or clone its owner. Explicit shared ownership retains
            synchronized reference-counted storage; an ordinary observer of that same shared
            identity uses a non-owning weak handle. The native target rejects statically
            provable strong cycles in descriptor fields, including through collection
            element types, while admitting acyclic shared fields. Later unproved native
            shared cycles are not traced and must be broken explicitly; ordinary `ref`
            back-edges are not ownership edges.

            Inferred ordinary-reference bindings retain the same owner provenance and weak
            storage as explicitly typed observers. Copying such an observer copies only its
            non-owning handle, not the referent. If a named owner is explicitly shared
            anywhere in its function, that shared storage applies throughout the function.
            Passing an observer of that storage to a plain `ref T` parameter is rejected
            with `T0141`, including direct, named, and callable-value arguments. Pass the
            owning shared reference to a `shared ref T` parameter instead. No implicit
            lock-scoped borrow or referent snapshot is inserted: the former can deadlock
            through another shared alias, and the latter would change reference identity.

            An ordinary observer binding keeps the storage kind selected by its initial
            owner. Reassigning it between a plain owner and a shared-backed owner is
            rejected with `T0142`, in either direction, for both inferred and explicitly
            typed bindings. Use a separate observer binding for the other storage kind.
            Reassignment between owners of the same storage kind remains supported, subject
            to the ordinary reference lifetime rules. The compiler does not implicitly
            promote a plain owner into shared storage to unify these carriers.

            A field read from shared storage materializes its result inside a bounded guard
            scope and releases the guard before evaluating sibling expressions. This applies
            to owning handles, weak observers, and the original named owner, including Copy
            scalars and inheritance-backed getters. Field writes, required-slot replacement,
            and nested collection mutations instead retain the live storage identity; they
            do not mutate a receiver snapshot.

            A guarded synchronous method call captures its receiver identity first,
            evaluates explicit arguments in written order and supplies defaults before
            acquiring the invocation guard. Assignment right-hand sides and collection
            arguments likewise finish before the write guard is acquired. This bounds read
            and argument temporaries; it does not make the native mutex reentrant. A guarded
            method body must not synchronously reacquire the same shared storage through
            another alias.

            `T0143` provides best-effort static detection of shared-storage reentry through
            explicit source-call arguments. It recognizes direct aliases, sequential
            replacements and copies, selected pass-through results, and transitive source
            helper parameter pairs, including owning, weak, and original-owner receivers. It
            also propagates definite exit aliases for supported literal and counter loops.
            See [Shared-storage deadlocks](lang.types.references#shared-deadlocks) for the
            precise coverage, unchecked cases, and safe structuring guidance. Compilation
            success is not a guarantee of deadlock freedom.

            A projected native reference parameter uses shared access for observation.
            Mutating native operations, including operations reached through source helper
            calls, infer a mutable native borrow and require matching caller access. This
            inference does not copy the referent, transfer ownership, or grant mutation
            through a shared native input. Authored-class receiver authority remains
            explicit.
    - id: shared-deadlocks
      title: Shared-storage deadlocks and static protection
      blocks:
        - type: markdown
          markdown: |-
            Explicit shared ownership preserves one storage identity; copying a handle does
            not copy its referent. Native shared storage uses a non-reentrant mutex. Even a
            read-only source method can hold that mutex for its synchronous body. If the
            body reaches the same storage through another owning handle, weak observer, or
            original owner, the second acquisition can wait forever on the guard held by the
            current call. There need not be competing threads, a cycle of source ownership,
            high CPU use, or recursion.

            A method's direct access through `this` operates under its existing receiver
            guard. It is the additional access through an alias that creates reentry.
            Distinct source variable names do not establish distinct storage, and calling a
            method `shared` or read-only does not make its native lock reentrant.
      sections:
        - id: automatic-guard-scopes
          title: What generated guard scopes prevent
          blocks:
            - type: markdown
              markdown: |-
                Field reads produce the requested owned result inside a bounded guard scope,
                including inherited getters, Copy scalars, weak observers, and original shared
                owners. The guard ends before sibling expressions run. Repeated field reads in
                arithmetic, aggregate elements, and explicit arguments therefore do not retain
                the first read's guard across the next.

                Synchronous calls capture receiver identity first, evaluate explicit arguments
                in source order, supply defaults, then acquire the invocation guard. Writes and
                nested collection mutations similarly evaluate values before acquiring the live
                write guard; they do not mutate cloned receiver snapshots. These rules apply to
                source and projected native invocation lowering. They remove temporary-lifetime
                deadlocks, not reentry during a method body. The runtime mutex is unchanged.
        - id: diagnosed-reentry
          title: What T0143 diagnoses
          blocks:
            - type: markdown
              markdown: |-
                For synchronous shared or mutable source instance methods, `T0143` rejects an
                explicit shared-reference argument when the compiler identifies it as the
                receiver's storage. The receiver may be an owning shared handle, a weak observer
                of shared storage, or the original shared-backed owner. Parentheses, typed or
                inferred bindings, and named arguments do not intentionally hide an otherwise
                known match.

                | Recognized shape                                                                         | Basis for the diagnostic                                                                                                                                           |
                | ---------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
                | The receiver handle is also an argument                                                  | Same resolved binding and storage identity                                                                                                                         |
                | Another handle is created from the same owner                                            | Both select the same originating storage                                                                                                                           |
                | A local handle or observer copies another                                                | The copy retains the identity held at that assignment                                                                                                              |
                | A handle is replaced and later assigned back                                             | Sequential assignment tracking restores the current identity rather than using its first initializer                                                               |
                | A synchronous helper returns one selected shared-reference parameter                     | The existing return-lender analysis identifies an identity-preserving pass-through; field/element projections and bodies with replacements are not treated as such |
                | A source helper or wrapper chain passes a guarded receiver/argument pair                 | Parameter-pair summaries grow to a finite fixed point across direct source calls, including cross-unit chains and recursive call graph components                  |
                | A definitely entered supported loop assigns a handle, possibly in nested supported loops | With no early exit, facts established independently of loop-written entry values hold at the final normal exit                                                     |

                This is a conservative source-call restriction, not a proof that a particular
                callee execution will deadlock. It can reject a matching argument even when the
                method does not read it, or when a summarized call is conditional. No
                interprocedural lock-effect proof is claimed. The diagnostic is reported before
                backend compilation or program execution; the compiler does not repair the call
                by copying the referent or making the mutex reentrant.
            - type: example
              id: reentry-through-helper
              title: A visible helper parameter pair
              language: terrane
              mode: illustrative
              source: |-
                class counter
                    count int = 5
                    function peek int; other shared ref counter
                        return other.count

                function inspect int; receiver shared ref counter, argument shared ref counter
                    return receiver.peek; argument

                function main;
                    owner = instance counter;
                    held = shared ref owner
                    print; (inspect; held, held)
              target: null
              return_value: null
              stdout: null
              diagnostic: "T0143: both helper parameters receive the same shared storage"
              markdown: null
        - id: unchecked-reentry
          title: What remains unchecked
          blocks:
            - type: markdown
              markdown: |-
                Detection is best-effort. In particular, none of the following is a promise of
                safety merely because compilation succeeds:

                - **Ambiguous control flow.** General branch, loop, exception, and completion
                  writes discard affected local alias facts. A narrow definite-entry proof
                  supports direct core `list` or `tuple` construction with at least one explicit
                  item (possibly grouped), and counter loops whose simple assignment initializes
                  the same counter used on the left of an initially true `<` or `<=` comparison.
                  The initializer and comparison bound must be compile-time integer expressions;
                  the update must be a postfix numeric update. Supported loops may nest, but
                  their bodies must otherwise be straight-line, without branches or `break`,
                  `continue`, `return`, or `throw`. The check forgets loop-written inputs and
                  retains only aliases recoverable independently at every normal iteration exit;
                  it does not prove termination or a precise iteration count. Empty/unknown
                  iterables, ranges, named collections, early exits, and loop-carried alias
                  dependencies do not receive that post-loop proof. Named collections require
                  reaching collection-value/cardinality facts, not merely their first
                  initializer; loop-carried aliases require iteration-sensitive facts to
                  distinguish one pass from later passes. These remain limitations, not promised
                  extensions. The compiler does not guess branch selection or general loop
                  entry/exit counts; identical assignments in both branches may still lose a
                  proof.
                - **Stored or projected handles.** Alias paths through object fields,
                  collections, indexing, and arbitrary native results are not tracked. A
                  returned shared handle selected from a field is not assumed to be identical to
                  the helper's receiver or parameter.
                - **Unproven return selection.** A shared-return helper with replacements,
                  multiple possible lenders, or no known lender is not a pass-through identity
                  proof. The compiler does not inspect arbitrary computed results to recover an
                  owner.
                - **Indirect calls.** Callable values, callbacks, native callees, and unresolved
                  source targets have no source parameter-pair summary here. Direct source calls
                  do propagate across wrapper chains and recursive components to a fixed point,
                  without an arbitrary wrapper-depth cutoff. A call cycle alone creates no
                  constraint; a guarded-call pair must seed the summary.
                - **Omitted arguments.** The alias check binds explicit positional/named
                  arguments. It does not analyze an omitted default expression or implicit
                  source of a handle as though it were supplied at the call site.
                - **Hidden method-body aliases.** A method can reach its own receiver storage
                  through a field, a captured handle, a global, or another service. The explicit
                  receiver/argument check does not establish an effect summary for those
                  accesses.
                - **Other invocation modes.** Async and consuming methods are outside this
                  synchronous shared/mutable guard analysis. It does not verify suspension-time
                  lock behavior, native internal locking, or interactions between several
                  different locks.

                The general rule still applies: do not synchronously reacquire storage whose
                guard is already held. Additional guards and aliases can create deadlocks
                outside these recognized shapes. There is no general deadlock-freedom guarantee,
                runtime timeout, or automatic fallback.
        - id: structuring-shared-operations
          title: Structuring operations without reentry
          blocks:
            - type: markdown
              markdown: |-
                Use the already-guarded receiver directly inside its method rather than passing
                an alias back into that storage. When an operation needs two handles that may
                alias, prefer a free helper whose separate field reads finish before the next
                read, rather than an outer guarded method that accesses the other handle while
                holding its receiver guard.

                If a method only needs scalar or other value data, obtain that data before
                entering the guarded method and pass the value explicitly. This is an
                application-level value contract, not a compiler-inserted snapshot that silently
                changes reference identity. When identity or atomic read/modify/write behavior
                is required, keep the whole operation under one receiver's authority and avoid
                reacquisition through aliases; splitting it into several reads is not an atomic
                replacement.

                Passing distinct owners is permitted, but variable names and declaration sites
                alone do not prove distinctness after aliases or replacements. For
                indirect/native operations, reason about their own locking contracts as well.
                These structuring rules prevent the described self-reentry; they do not solve
                arbitrary multi-lock ordering.
            - type: example
              id: bounded-shared-field-helper
              title: Separate bounded field reads can accept the same handle
              language: terrane
              mode: illustrative
              source: |-
                class counter
                    count int = 5

                function total int; first shared ref counter, second shared ref counter
                    return first.count + second.count

                function main;
                    owner = instance counter;
                    held = shared ref owner
                    print; (total; held, held)
              target: null
              return_value: null
              stdout: "10"
              diagnostic: null
              markdown: null
  see-also: []

