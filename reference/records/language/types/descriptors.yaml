documentation:
  status: complete
  title: Type descriptors
  title-style: text
  summary: >-
    Defines canonical type identity and the unified compiler descriptor representation.
  tags: [types, descriptors, reflection, objects]
  sections:
    - id: identity
      title: Canonical identity
      blocks:
        - type: markdown
          markdown: |-
            Type descriptors are compiler-owned semantic objects with stable canonical
            identity. Built-ins and source-declared classes, interfaces, and traits
            share one descriptor contract model. Source descriptors keep
            namespace-qualified nominal identity through imports and aliases. Named
            built-ins use their canonical `/core` identity, including instantiated
            collection-family names. Synthesized references, callables, optionals, and
            unions retain canonical source-shaped identity unless assigned a named
            namespace family.
    - id: delivery
      title: Current compiler delivery
      blocks:
        - type: markdown
          markdown: |-
            `DescriptorContract` drives member lookup, nominal compatibility,
            conformance, dispatch, reflection, and structural protocols for both
            built-in and source-declared types. Scalar and category descriptor aliases
            retain canonical contract identities. String, numeric, and collection
            member availability selects stable operation IDs from the receiver's
            descriptor before operation-specific checking and lowering.
    - id: queries
      title: Version-one query contract
      blocks:
        - type: markdown
          markdown: |-
            The model answers member lookup, nominal compatibility, interface
            conformance, dispatch metadata, reflection, and structural protocol queries.
            A statically known descriptor may erase during lowering only when doing so
            does not change observable identity or reflection. Materialized descriptors
            obtain name, kind, identity, and field metadata from the selected contract.
  see-also:
    - lang.classes.protocols

