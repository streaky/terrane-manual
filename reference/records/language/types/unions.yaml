documentation:
  status: complete
  title: "Enums and finite union types"
  title-style: text
  summary: >-
    Closed enums preserve variant identity and active payloads with exhaustive borrowed or
    consuming matches. Finite unions preserve existing type identities and prefer exact
    arms; a constant admitted by more than one arm is rejected.
  tags:
    - "types"
    - "unions"
  sections:
    - id: unions
      title: "Finite Union Types"
      blocks:
        - type: markdown
          markdown: |-
            A finite union type is written with `|`, as in `T|U`. Each arm is a distinct
            declared alternative with its own canonical semantic identity; the union does
            not erase the alternatives into a common source-level type. `none` is an
            ordinary union member, so `T|none` uses the same union mechanism. `T|none` is
            accepted anywhere a source type is accepted, including bindings, parameters, and
            return types.

            Repeated arms are normalized by canonical semantic identity. Each authored
            duplicate reports warning `W4003`, including duplicates written through
            different aliases of the same descriptor. Different source spellings therefore
            cannot create distinct alternatives when they denote one canonical type.

            When a value reaches a union destination, Terrane first looks for an arm that
            exactly matches the value’s semantic type. If there is no exact match, it
            considers arms admitted through contextual constant typing or numeric
            destination conversion. Exactly one arm must be admitted at this stage. If
            multiple arms admit the value, compilation fails with an ambiguity diagnostic
            naming the candidates; arm order never resolves the ambiguity.

            For example, the numeric constant `5` is ambiguous for `int8|int32` because both
            arms admit it. A value already typed as one of those arms selects its exact arm
            before conversion is considered. The selected arm is preserved at runtime across
            initialization and assignment and determines subsequent `is a` results.

            Optional narrowing applies only to stable named bindings and these direct
            guards:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            value != none
            none != value
            not (value is a none)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Within the guarded block, such a test narrows a named `T|none` binding to `T`.
            Combining tests with `and` or `or` does not establish the narrowing fact, and
            assigning to the binding invalidates it. Member, index, and call expressions are
            not narrowing subjects because repeated evaluation may produce a different
            result. Bind the expression once, then guard and use that stable name.

            A separate static return rule applies when a function or method declares a
            concrete return type `T`. An exact static `T|none` member may be returned after
            a preceding sibling `if member == none` or `if none == member` with no `else`,
            but only when that `if` body contains exactly one direct compatible assignment
            to the same textual member, contains no other write to it, and no write
            intervenes before the return. If any condition is not met, the returned
            expression remains `T|none`. This rule does not apply to instance members or
            other member expressions.
    - id: enums
      title: Closed named alternatives
      blocks:
        - type: markdown
          markdown: |-
            An enum declares one closed nominal family of alternatives. Each value has
            exactly one variant and only that variant's payload. Variant names belong to the
            enum, and payload fields are constructor parameters rather than mutable instance
            members. Enums may use the lexical type parameters described in
            [[lang.types.generics#authored-declarations]].
        - type: example
          id: enum-state-construction
          title: Constructing and inspecting a state
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            enum operation-state of (T)
                pending
                running; progress float
                completed; result T
                failed; error string

            function main;
                state operation-state of int = instance operation-state::completed; result = 42
                match ref state
                    case operation-state::pending
                        return
                    case operation-state::running; progress
                        return
                    case operation-state::completed; result
                        return
                    case operation-state::failed; error
                        return
          response: null
          diagnostic: null
          markdown: null
        - type: markdown
          markdown: |-
            Source variant construction names every payload field. Arguments are evaluated
            once in written order, then assembled in declaration order. Omitted, duplicate,
            unknown, or incompatible payload fields are rejected. A payload can select a
            generic application; a payloadless variant needs enough information from an
            explicit application or immediate written destination.

            A match must cover every alternative exactly once or end with `case else`.
            Unknown or duplicate variants and branches after a catch-all are rejected.
            Optional enums also require `case none`. A projected non-exhaustive native enum
            requires a catch-all even when all currently recorded variants are listed.
            Coverage comes from the semantic variant inventory, not runtime probing.

            `match ref state` borrows the active payload. `match move state` consumes the
            enum and transfers bound payloads; unmatched owned payloads clean up. A by-value
            match without move is available only for a copyable application. Resource
            classification includes every variant's closed payload types, even when the
            value currently holds a payloadless variant. A borrow cannot escape its owner
            through a branch binding.

            Enums and finite unions are different source contracts: enum variants are
            explicitly named alternatives within one nominal family, while a finite union
            combines existing types. Use an ordinary interface for open-ended
            interchangeable implementations. An enum is not a bag of optional fields, an
            integer constant namespace, or an implicitly open interface hierarchy.
    - id: native-enums
      title: Projected enum construction and inspection
      blocks:
        - type: markdown
          markdown: |-
            Admitted native enums use their recorded canonical variants and payload fields.
            Public tuple variants retain positional construction; public struct variants use
            named payload construction. Native ABI conversion and concrete generic selection
            retain the same mapping used by ordinary projected operations. Private,
            stripped, unsupported, and non-exhaustive construction boundaries remain
            authoritative; knowing a nominal type or tag does not authorize an unavailable
            construction recipe. See [[tool.packages.rust-dependencies]] for demand-driven
            admission and gap reports.
  see-also:
